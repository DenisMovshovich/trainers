<title>Проволока REST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Roboto+Mono:wght@400;500;700&family=Zilla+Slab:wght@600;700&display=swap">
<style>
:root{
  --paper:#E9EAEE; --surf:#FBFBFD; --surf2:#DDDEE6; --surf3:#F2F2F6;
  --line:#C0C3D0; --line2:#DBDCE5;
  --ink:#12141C; --ink2:#3E4250; --ink3:#6E7383;
  --acc:#22459B; --acc2:#163075; --acc-s:#DBE2F5; --acc-l:#8CA3DC;
  --s2:#1C7A4B; --s2s:#D6EBDF; --s3:#8A6212; --s3s:#F1E7CC;
  --s4:#B4531B; --s4s:#F6E2D3; --s5:#A62430; --s5s:#F5D9DC;
  --wire:#141726; --wire-ink:#DDE1EE; --wire-dim:#6C7590; --wire-line:#252A40;
  --w-m:#8FB4FF; --w-h:#9BD3B0; --w-s:#E2B071; --w-c:#6C7590;
  --r:3px;
  --fd:"Zilla Slab",Georgia,serif;
  --fs:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --fm:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D0F17; --surf:#161927; --surf2:#1F2333; --surf3:#1A1E2C;
  --line:#2E3346; --line2:#242939;
  --ink:#E4E7F2; --ink2:#AFB5C7; --ink3:#7C8397;
  --acc:#7BA0F0; --acc2:#A5BEF7; --acc-s:#172343; --acc-l:#3A4E86;
  --s2:#4FC088; --s2s:#11301F; --s3:#D9A73F; --s3s:#302511;
  --s4:#E8843F; --s4s:#331E10; --s5:#E86A72; --s5s:#331519;
  --wire:#070911; --wire-ink:#DDE1EE; --wire-dim:#69718C; --wire-line:#1B2033;
}}
:root[data-theme="dark"]{
  --paper:#0D0F17; --surf:#161927; --surf2:#1F2333; --surf3:#1A1E2C;
  --line:#2E3346; --line2:#242939;
  --ink:#E4E7F2; --ink2:#AFB5C7; --ink3:#7C8397;
  --acc:#7BA0F0; --acc2:#A5BEF7; --acc-s:#172343; --acc-l:#3A4E86;
  --s2:#4FC088; --s2s:#11301F; --s3:#D9A73F; --s3s:#302511;
  --s4:#E8843F; --s4s:#331E10; --s5:#E86A72; --s5s:#331519;
  --wire:#070911; --wire-ink:#DDE1EE; --wire-dim:#69718C; --wire-line:#1B2033;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fs);font-size:15px;line-height:1.5}
::selection{background:var(--acc-s);color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;color:inherit}
input{font:inherit}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:16px;height:54px;
  padding:0 18px;background:var(--surf);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand b{font-family:var(--fd);font-weight:700;font-size:16px;white-space:nowrap}
.brand i{font-family:var(--fm);font-style:normal;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);display:block;margin-top:-3px}
.gap{flex:1}
.prog{display:flex;align-items:center;gap:10px}
.prog span{font-family:var(--fm);font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.ptr{width:130px;height:6px;background:var(--surf2);border:1px solid var(--line2);position:relative;overflow:hidden}
.pfl{position:absolute;inset:0 auto 0 0;width:0;background:var(--acc);transition:width .4s ease}
.gb{background:none;border:1px solid var(--line);color:var(--ink2);font-size:12px;padding:6px 11px;
  border-radius:var(--r);cursor:pointer;white-space:nowrap}
.gb:hover{border-color:var(--acc);color:var(--acc)}

/* ---------- каркас ---------- */
.wrap{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:calc(100vh - 54px)}
.rail{border-right:1px solid var(--line);background:var(--surf);position:sticky;top:54px;align-self:start;
  max-height:calc(100vh - 54px);overflow-y:auto;padding:16px 0 40px}
.rail-h{font-family:var(--fm);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);padding:0 18px 10px}
.mb{display:grid;grid-template-columns:24px 1fr auto;gap:9px;width:100%;text-align:left;background:none;border:0;
  cursor:pointer;padding:8px 14px 8px 18px;border-left:2px solid transparent;color:var(--ink2);transition:.13s}
.mb:hover{background:var(--surf3);color:var(--ink)}
.mb[aria-current="true"]{background:var(--acc-s);border-left-color:var(--acc);color:var(--ink)}
.mb .n{font-family:var(--fm);font-size:10.5px;color:var(--ink3);padding-top:2px;font-variant-numeric:tabular-nums}
.mb[aria-current="true"] .n{color:var(--acc)}
.mb .t{display:block;font-weight:600;font-size:13.5px;line-height:1.28}
.mb .s{display:block;font-size:11px;color:var(--ink3);line-height:1.3;margin-top:1px}
.mb .d{display:flex;gap:3px;padding-top:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--s2)}
.rail-f{padding:14px 18px 0;margin-top:12px;border-top:1px solid var(--line2)}

.stage{padding:0 0 80px;min-width:0}
.head{padding:30px 34px 0;max-width:1180px}
.kick{font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
h1{font-family:var(--fd);font-size:clamp(26px,3.2vw,36px);font-weight:700;margin:0 0 8px;line-height:1.1;text-wrap:balance}
.lede{font-size:16px;color:var(--ink2);max-width:64ch;margin:0}

.tabs{display:flex;padding:0 34px;margin-top:24px;border-bottom:1px solid var(--line);max-width:1180px}
.tab{background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;padding:11px 2px;margin-right:26px;
  font-size:13.5px;font-weight:600;color:var(--ink3);display:flex;align-items:center;gap:7px;transition:.14s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.tab .bg{font-family:var(--fm);font-size:10px;font-weight:700;padding:1px 5px;background:var(--surf2);color:var(--ink3);border-radius:2px}
.tab[aria-selected="true"] .bg{background:var(--acc-s);color:var(--acc)}
.tab .bg.ok{background:var(--s2s);color:var(--s2)}
.pane{padding:28px 34px 0;max-width:1180px}
.pane[hidden]{display:none}

/* ---------- теория ---------- */
.prose{font-size:16px;line-height:1.66;max-width:70ch;color:var(--ink)}
.prose p{margin:0 0 1.05em}
.prose h2{font-family:var(--fd);font-size:21px;font-weight:700;margin:2.1em 0 .65em;padding-top:.6em;
  border-top:1px solid var(--line);text-wrap:balance}
.prose h2:first-child{margin-top:0;border-top:0;padding-top:0}
.prose h3{font-family:var(--fd);font-size:16.5px;font-weight:600;margin:1.7em 0 .5em}
.prose ul,.prose ol{margin:0 0 1.05em;padding-left:1.35em}
.prose li{margin-bottom:.4em}
.prose li::marker{color:var(--acc)}
.prose strong{font-weight:700}
.prose em{font-style:italic;color:var(--ink2)}
code{font-family:var(--fm);font-size:.85em;background:var(--surf2);padding:.1em .34em;border-radius:2px;
  border:1px solid var(--line2);overflow-wrap:anywhere}
td code,th code{white-space:nowrap}
pre{font-family:var(--fm);font-size:12.5px;line-height:1.6;background:var(--wire);color:var(--wire-ink);
  padding:13px 15px;overflow-x:auto;margin:0 0 1.25em;border-radius:var(--r);border:1px solid var(--wire-line)}
pre code{background:none;border:0;padding:0;color:inherit;white-space:pre;font-size:inherit}
.m{color:var(--w-m)} .h{color:var(--w-h)} .s{color:var(--w-s)} .c{color:var(--w-c)}

.note{font-size:14px;line-height:1.55;background:var(--surf);border:1px solid var(--line2);
  border-left:3px solid var(--acc);padding:13px 16px;margin:0 0 1.3em;max-width:70ch;border-radius:0 var(--r) var(--r) 0}
.note b.hd{display:block;font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--acc);margin-bottom:5px}
.note.warn{border-left-color:var(--s3)} .note.warn b.hd{color:var(--s3)}
.note.trap{border-left-color:var(--s4)} .note.trap b.hd{color:var(--s4)}
.note.ok{border-left-color:var(--s2)} .note.ok b.hd{color:var(--s2)}
.note p:last-child{margin:0}
.note ul{margin:.4em 0 0;padding-left:1.2em}

.tw{overflow-x:auto;margin:0 0 1.5em;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th{text-align:left;font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  padding:9px 13px;background:var(--surf3);border-bottom:1px solid var(--line)}
td{padding:9px 13px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.45}
tr:last-child td{border-bottom:0}

.fig{margin:0 0 1.6em}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-family:var(--fm);font-size:10.5px;color:var(--ink3);margin-top:8px;line-height:1.5}

/* статусы */
.st{font-family:var(--fm);font-size:11px;font-weight:700;padding:1.5px 6px;border-radius:2px;white-space:nowrap}
.st.c2{background:var(--s2s);color:var(--s2)} .st.c3{background:var(--s3s);color:var(--s3)}
.st.c4{background:var(--s4s);color:var(--s4)} .st.c5{background:var(--s5s);color:var(--s5)}
.st.c1{background:var(--surf2);color:var(--ink3)}
.mth{font-family:var(--fm);font-size:11px;font-weight:700;padding:1.5px 6px;border-radius:2px;
  background:var(--acc-s);color:var(--acc);white-space:nowrap}

/* ---------- тест ---------- */
.quiz{max-width:760px}
.qc{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:19px 21px;margin-bottom:13px}
.qn{font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  margin-bottom:8px;display:flex;justify-content:space-between}
.qt{font-size:15.5px;font-weight:600;line-height:1.45;margin:0 0 13px}
.qt code{font-weight:400}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--surf3);
  border:1px solid var(--line2);border-radius:var(--r);padding:10px 13px;cursor:pointer;font-size:14px;line-height:1.45;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--acc-l);background:var(--surf)}
.opt:disabled{cursor:default}
.opt .mk{font-family:var(--fm);font-size:10.5px;color:var(--ink3);border:1px solid var(--line);width:19px;height:19px;
  display:grid;place-items:center;flex:0 0 auto;margin-top:1px;border-radius:2px}
.opt.right{border-color:var(--s2);background:var(--s2s)} .opt.right .mk{border-color:var(--s2);color:var(--s2)}
.opt.wrong{border-color:var(--s5);background:var(--s5s)} .opt.wrong .mk{border-color:var(--s5);color:var(--s5)}
.why{margin-top:12px;font-size:13.5px;line-height:1.55;color:var(--ink2);border-left:2px solid var(--line);padding-left:12px}
.why b{color:var(--ink)}
.why.g{border-left-color:var(--s2)} .why.b{border-left-color:var(--s5)}
.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--line);background:var(--surf);
  border-radius:var(--r);padding:15px 18px;margin-bottom:18px}
.score .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--fd)}
.score p{margin:0;font-size:13px;color:var(--ink2)}

/* ---------- практика ---------- */
.picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;font-size:12.5px;
  font-weight:600;cursor:pointer;color:var(--ink2);display:flex;align-items:center;gap:7px;transition:.14s}
.chip:hover{border-color:var(--acc-l);color:var(--ink)}
.chip[aria-current="true"]{background:var(--acc-s);border-color:var(--acc);color:var(--ink)}
.chip .tk{width:13px;height:13px;flex:0 0 auto}
.chip .tk circle{fill:none;stroke:var(--line);stroke-width:1.6}
.chip.done .tk circle{fill:var(--s2);stroke:var(--s2)}
.chip.done .tk path{stroke:var(--surf);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.lab{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:18px;align-items:start}
.lab>*{min-width:0}
.brief{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.brief h3{font-family:var(--fd);margin:0 0 9px;font-size:17px;font-weight:700}
.brief p{margin:0 0 .8em;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.brief ul,.brief ol{margin:0 0 .8em;padding-left:1.25em;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.brief li{margin-bottom:.3em} .brief li::marker{color:var(--acc)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line2)}
.mini{background:var(--surf3);border:1px solid var(--line);color:var(--ink2);border-radius:var(--r);
  padding:6px 11px;font-size:12px;cursor:pointer}
.mini:hover{border-color:var(--acc);color:var(--acc)}
.hintbox{font-size:13.5px;line-height:1.55;color:var(--ink2);background:var(--surf3);border:1px dashed var(--line);
  border-radius:var(--r);padding:12px 14px;margin-top:12px}

.wirebox{background:var(--wire);border:1px solid var(--wire-line);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;min-height:430px}
.wirebar{display:flex;align-items:center;gap:9px;padding:8px 13px;border-bottom:1px solid var(--wire-line)}
.wirebar .ttl{font-family:var(--fm);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--wire-dim)}
.wirebar .rt{margin-left:auto;font-family:var(--fm);font-size:10px;color:var(--wire-dim)}
.tape{flex:1;overflow-y:auto;overflow-x:auto;padding:12px;max-height:56vh;min-height:320px;min-width:0}
.ex{margin-bottom:14px;border-left:2px solid var(--wire-line);padding-left:11px}
.ex:last-child{margin-bottom:0}
.ex .lbl{font-family:var(--fm);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--wire-dim);margin-bottom:3px}
.ex pre{background:none;border:0;padding:0;margin:0 0 9px;font-size:12px;line-height:1.55;color:var(--wire-ink)}
.ex .rl{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.ex .rl .code{font-family:var(--fm);font-size:12.5px;font-weight:700}
.ex.c2 .rl .code{color:var(--s2)} .ex.c3 .rl .code{color:var(--s3)}
.ex.c4 .rl .code{color:var(--s4)} .ex.c5 .rl .code{color:var(--s5)}
.ex .ph{font-family:var(--fm);font-size:11.5px;color:var(--wire-dim)}
.wirein{display:flex;align-items:center;gap:8px;border-top:1px solid var(--wire-line);padding:9px 13px}
.wirein .pfx{font-family:var(--fm);font-size:12.5px;color:var(--w-m);flex:0 0 auto}
.wirein input{flex:1;background:none;border:0;outline:none;color:var(--wire-ink);font-family:var(--fm);
  font-size:12.5px;padding:0;min-width:0}
.wirein input::placeholder{color:var(--wire-dim)}
.empty{color:var(--wire-dim);font-family:var(--fm);font-size:11.5px;line-height:1.7}

.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:70px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line2);
  font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.card-h .ct{margin-left:auto;font-variant-numeric:tabular-nums}
.card-b{padding:13px 14px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.checks li{display:grid;grid-template-columns:17px 1fr;gap:10px;font-size:13px;line-height:1.42;color:var(--ink2)}
.checks li.on{color:var(--ink)}
.checks .bx{width:15px;height:15px;border:1.5px solid var(--line);border-radius:2px;margin-top:1px;display:grid;place-items:center}
.checks li.on .bx{background:var(--s2);border-color:var(--s2)}
.checks .bx svg{opacity:0} .checks li.on .bx svg{opacity:1}
.done{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--s2s);border-top:1px solid var(--s2);
  color:var(--s2);font-size:13px;font-weight:600}
.done[hidden]{display:none}
.state{font-family:var(--fm);font-size:11.5px;line-height:1.65;max-height:280px;overflow:auto}
.state .g{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--acc);font-weight:700;margin:10px 0 3px}
.state .g:first-child{margin-top:0}
.state .row{display:flex;gap:8px;padding:2px 0;border-bottom:1px solid var(--line2)}
.state .row:last-child{border-bottom:0}
.state .row b{font-weight:500;color:var(--ink3);flex:0 0 58px}

.navf{display:flex;justify-content:space-between;gap:14px;padding:26px 34px 0;max-width:1180px;margin-top:32px;border-top:1px solid var(--line)}
.navf button{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;cursor:pointer;
  font-size:13.5px;font-weight:600;text-align:left}
.navf button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.navf button:disabled{opacity:.35;cursor:default}
.navf .sub{display:block;font-size:11px;font-weight:400;color:var(--ink3);font-family:var(--fm)}

@media (max-width:1080px){ .lab{grid-template-columns:minmax(0,1fr)} .side{position:static} }
@media (max-width:880px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:10px 12px;gap:7px}
  .rail-h,.rail-f{display:none}
  .mb{grid-template-columns:auto;width:auto;flex:0 0 auto;border-left:0;background:var(--surf3);border-radius:var(--r);padding:7px 11px}
  .mb .s,.mb .d{display:none}
  .mb .t{white-space:nowrap;font-size:12.5px}
  .head,.tabs,.pane,.navf{padding-left:16px;padding-right:16px}
  .top{gap:11px;padding:0 13px} .brand i{display:none} .ptr{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header class="top">
  <span class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 8h13l-3-3M21 16H8l3 3" fill="none" stroke="var(--acc)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20" cy="8" r="1.6" fill="var(--s2)"/><circle cx="4" cy="16" r="1.6" fill="var(--s4)"/>
    </svg>
    <span><b>Проволока REST</b><i>тренажёр по HTTP-интерфейсам</i></span>
  </span>
  <div class="gap"></div>
  <div class="prog">
    <span id="pl">0 / 0</span>
    <div class="ptr" role="progressbar" aria-label="Прогресс" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pb"><div class="pfl" id="pf"></div></div>
  </div>
  <button class="gb" id="reset">Сброс</button>
</header>

<div class="wrap">
  <nav class="rail" id="rail" aria-label="Модули">
    <div class="rail-h">Программа</div>
    <div id="modList"></div>
    <div class="rail-f"><button class="gb" id="cheat" style="width:100%">Справочник</button></div>
  </nav>

  <main class="stage">
    <div class="head">
      <div class="kick" id="kick">—</div>
      <h1 id="mtitle">—</h1>
      <p class="lede" id="mlede">—</p>
    </div>
    <div class="tabs" role="tablist">

                placeholder="GET /users?limit=2  ·  Tab — дополнить  ·  ↑↓ — история" aria-label="Запрос">

              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

<script>
"use strict";
/* ============================================================
   Эмулятор REST-сервера api.example.com
   ============================================================ */
const HOST = "https://api.example.com";
const hex = n => Array.from({length:n},()=>"0123456789abcdef"[Math.floor(Math.random()*16)]).join("");

const REASON = {
 200:"OK",201:"Created",202:"Accepted",204:"No Content",301:"Moved Permanently",302:"Found",
 304:"Not Modified",400:"Bad Request",401:"Unauthorized",403:"Forbidden",404:"Not Found",
 405:"Method Not Allowed",406:"Not Acceptable",409:"Conflict",410:"Gone",412:"Precondition Failed",
 415:"Unsupported Media Type",422:"Unprocessable Content",429:"Too Many Requests",
 500:"Internal Server Error",503:"Service Unavailable"
};

function newServer(){
  return {
    users:[
      {id:1,name:"Ada Lovelace",email:"ada@example.com",role:"admin",createdAt:"2026-01-04"},
      {id:2,name:"Grace Hopper",email:"grace@example.com",role:"admin",createdAt:"2026-02-11"},
      {id:3,name:"Alan Turing",email:"alan@example.com",role:"user",createdAt:"2026-03-02"},
      {id:4,name:"Barbara Liskov",email:"barbara@example.com",role:"user",createdAt:"2026-04-19"}
    ],
    posts:[
      {id:1,userId:1,title:"On analytical engines",published:true},
      {id:2,userId:2,title:"Compilers are possible",published:true},
      {id:3,userId:3,title:"Computable numbers",published:false}
    ],
    orders:[],
    seq:{users:4,posts:3,orders:0},
    ver:{}, tokens:{}, idem:{},
    rate:{n:0,limit:0,reset:0},
    creds:{"demo":"secret"},
    log:[]
  };
}
const verKey = (kind,id) => kind+":"+id;
function bump(s,kind,id){ const k=verKey(kind,id); s.ver[k]=(s.ver[k]||1)+1; return s.ver[k]; }
function etagOf(s,kind,id){ const k=verKey(kind,id); s.ver[k]=s.ver[k]||1; return '"'+kind.slice(0,1)+id+"-v"+s.ver[k]+'"'; }

/* ---------------- разбор строки запроса ---------------- */
function tokenizeCmd(line){
  const t=[]; let cur="", q=null;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){ if(c===q) q=null; else cur+=c; continue; }
    if(c==='"'||c==="'"){ q=c; if(cur==="") cur=""; continue; }
    if(c===" "||c==="\t"){ if(cur!==""){t.push(cur);cur="";} continue; }
    cur+=c;
  }
  if(cur!=="") t.push(cur);
  return t;
}
const METHODS = ["GET","POST","PUT","PATCH","DELETE","HEAD","OPTIONS"];

function parseRequest(line){
  const t = tokenizeCmd(line.trim());
  if(!t.length) return {error:"пустой запрос"};
  let i = 0;
  if(t[0].toLowerCase()==="curl") i = 1;
  const req = {method:null, path:null, headers:{}, body:null, showHeaders:false};
  const setH = (k,v)=>{ req.headers[k.trim()] = String(v).trim(); };

  for(; i<t.length; i++){
    const a = t[i];
    if(a==="-X"||a==="--request"){ req.method = (t[++i]||"").toUpperCase(); continue; }
    if(a==="-H"||a==="--header"){ const h=t[++i]||""; const c=h.indexOf(":"); if(c>0) setH(h.slice(0,c), h.slice(c+1)); continue; }
    if(a==="-d"||a==="--data"||a==="--data-raw"||a==="--json"){
      req.body = t[++i];
      if(a==="--json" && !req.headers["Content-Type"]) setH("Content-Type","application/json");
      if(!req.method) req.method = "POST";
      continue;
    }
    if(a==="-u"||a==="--user"){ req.headers["Authorization"] = "Basic "+btoa(t[++i]||""); continue; }
    if(a==="-i"||a==="--include"){ req.showHeaders = true; continue; }
    if(a==="-I"||a==="--head"){ req.method = "HEAD"; continue; }
    if(a==="-s"||a==="-v"||a==="-L") continue;
    if(a.startsWith("-")) return {error:"неизвестный флаг "+a};
    const up = a.toUpperCase();
    if(METHODS.includes(up) && !req.path && !req.method){ req.method = up; continue; }
    if(!req.path){ req.path = a; continue; }
    if(req.body===null){ req.body = a; continue; }
  }
  if(!req.path) return {error:"не указан путь, например /users"};
  if(!req.method) req.method = req.body!==null ? "POST" : "GET";
  req.path = req.path.replace(/^https?:\/\/[^/]+/,"");
  if(!req.path.startsWith("/")) req.path = "/"+req.path;
  const qi = req.path.indexOf("?");
  req.query = {};
  if(qi>-1){
    req.path.slice(qi+1).split("&").forEach(p=>{
      if(!p) return; const [k,v] = p.split("=");
      req.query[decodeURIComponent(k)] = decodeURIComponent((v||"").replace(/\+/g," "));
    });
    req.path = req.path.slice(0,qi);
  }
  if(req.path.length>1) req.path = req.path.replace(/\/+$/,"");
  return req;
}

/* ---------------- помощники ответа ---------------- */
function res(status, body, headers){
  const h = Object.assign({}, headers||{});
  const out = {status, headers:h, body:body===undefined?null:body};
  if(out.body!==null && !h["Content-Type"]) h["Content-Type"] = "application/json";
  return out;
}
function problem(status, title, detail, extra){
  return res(status, Object.assign({type:"https://api.example.com/probs/"+title.toLowerCase().replace(/\s+/g,"-"),
    title, status, detail}, extra||{}), {"Content-Type":"application/problem+json"});
}
function wantsJson(req){
  const a = req.headers["Accept"] || req.headers["accept"];
  if(!a) return true;
  return /application\/json|application\/\*|\*\/\*|\+json/i.test(a);
}
function jsonBody(req){
  if(req.body===null) return {ok:true, value:null};
  try{ return {ok:true, value: JSON.parse(req.body)}; }
  catch(e){ return {ok:false}; }
}
function auth(s, req){
  const a = req.headers["Authorization"] || req.headers["authorization"];
  if(!a) return {ok:false, why:"missing"};
  const m = a.match(/^Bearer\s+(\S+)$/i);
  if(!m) return {ok:false, why:"scheme"};
  const t = s.tokens[m[1]];
  if(!t) return {ok:false, why:"invalid"};
  return {ok:true, token:t};
}
const isWrite = m => ["POST","PUT","PATCH","DELETE"].includes(m);

/* ---------------- маршрутизация ---------------- */
function handle(s, req){
  const r = route(s, req);
  if(!r.headers["Date"]) r.headers["Date"] = new Date().toUTCString();
  if(r.body!==null && r.body!==undefined && r.status!==304 && req.method!=="HEAD"){
    r.headers["Content-Length"] = String(JSON.stringify(r.body,null,2).length);
  }
  s.log.push({req, res:r});
  return r;
}

function route(s, req){
  const p = req.path, m = req.method;

  /* ограничение частоты — включается заданием */
  if(s.rate.limit>0){
    const now = Date.now();
    if(now > s.rate.reset){ s.rate.n = 0; s.rate.reset = now + 60000; }
    s.rate.n++;
    if(s.rate.n > s.rate.limit){
      const wait = Math.max(1, Math.ceil((s.rate.reset-now)/1000));
      return res(429, {error:"rate_limit_exceeded", detail:"Слишком много запросов. Повторите позже."},
        {"Retry-After":String(wait),"X-RateLimit-Limit":String(s.rate.limit),
         "X-RateLimit-Remaining":"0","X-RateLimit-Reset":String(Math.ceil(s.rate.reset/1000)),
         "Content-Type":"application/json"});
    }
  }

  if(!wantsJson(req))
    return problem(406,"Not Acceptable","Сервер отдаёт только application/json, а в Accept запрошено другое.",
      {supported:["application/json"]});

  /* устаревший путь в единственном числе — учебный редирект */
  const legacy = p.match(/^\/user\/(\d+)$/);
  if(legacy) return res(301, null, {"Location":"/users/"+legacy[1]});

  if(p==="/") return res(200, {users:HOST+"/users", posts:HOST+"/posts", orders:HOST+"/orders", token:HOST+"/auth/token"});

  if(p==="/auth/token"){
    if(m==="OPTIONS") return res(204,null,{"Allow":"POST, OPTIONS"});
    if(m!=="POST") return res(405,{error:"method_not_allowed"},{"Allow":"POST, OPTIONS"});
    const b = jsonBody(req);
    if(!b.ok) return problem(400,"Malformed JSON","Тело запроса не является корректным JSON.");
    const {username,password,scope} = b.value||{};
    if(!username||!password) return problem(422,"Validation Failed","Нужны поля username и password.",
      {errors:[{field:"username",code:"required"},{field:"password",code:"required"}]});
    if(s.creds[username]!==password)
      return res(401,{error:"invalid_credentials"},{"WWW-Authenticate":'Bearer realm="api", error="invalid_credentials"',"Content-Type":"application/json"});
    const tok = "tok_"+hex(16);
    s.tokens[tok] = {sub:username, scopes:(scope||"read write").split(/[ ,]+/)};
    return res(200,{access_token:tok, token_type:"Bearer", expires_in:3600, scope:(scope||"read write")});
  }

  const mUsers = p==="/users";
  const mUser = p.match(/^\/users\/(\d+)$/);
  const mUserPosts = p.match(/^\/users\/(\d+)\/posts$/);
  const mPosts = p==="/posts";
  const mPost = p.match(/^\/posts\/(\d+)$/);
  const mOrders = p==="/orders";
  const mOrder = p.match(/^\/orders\/(\d+)$/);

  if(!(mUsers||mUser||mUserPosts||mPosts||mPost||mOrders||mOrder))
    return problem(404,"Not Found","Ресурс "+p+" не существует.");

  /* допустимость метода — свойство ресурса, а не вызывающего: 405 проверяется до 401 */
  let allow = null, whyNot = null;
  if(mUsers||mPosts||mOrders){ allow = "GET, POST, HEAD, OPTIONS"; whyNot = "Метод "+m+" неприменим к коллекции целиком."; }
  else if(mUser||mPost||mOrder){
    allow = "GET, PUT, PATCH, DELETE, HEAD, OPTIONS";
    whyNot = m==="POST"
      ? "POST создаёт ресурс в коллекции, а не поверх существующего. Используйте PUT или PATCH."
      : "Метод "+m+" здесь не поддерживается.";
  }
  else if(mUserPosts){ allow = "GET, HEAD, OPTIONS"; whyNot = "Вложенная коллекция доступна только для чтения."; }
  if(allow && !allow.split(", ").includes(m))
    return res(405, {error:"method_not_allowed", detail:whyNot}, {"Allow":allow, "Content-Type":"application/json"});

  /* авторизация нужна только для изменяющих методов */
  if(isWrite(m)){
    const a = auth(s,req);
    if(!a.ok)
      return res(401,{error:"unauthorized", detail:"Изменяющие методы требуют токен. Получите его: POST /auth/token"},
        {"WWW-Authenticate":'Bearer realm="api"',"Content-Type":"application/json"});
    if(!a.token.scopes.includes("write"))
      return problem(403,"Forbidden","Токен выдан только на чтение: в нём нет области write.",{required_scope:"write"});
  }

  /* тело обязано быть JSON и объявлено правильным типом */
  if(["POST","PUT","PATCH"].includes(m)){
    const ct = req.headers["Content-Type"] || req.headers["content-type"] || "";
    if(req.body===null) return problem(400,"Missing Body","Метод "+m+" требует тело запроса.");
    if(!/^application\/(json|merge-patch\+json)/.test(ct))
      return problem(415,"Unsupported Media Type",
        "Ожидается Content-Type: application/json, получено «"+(ct||"ничего")+"».",{supported:["application/json"]});
    const b = jsonBody(req);
    if(!b.ok) return problem(400,"Malformed JSON","Тело запроса не является корректным JSON.");
  }

  if(mUsers) return collection(s, req, "users");
  if(mUser) return item(s, req, "users", +mUser[1]);
  if(mUserPosts){
    const uid = +mUserPosts[1];
    if(!s.users.some(u=>u.id===uid)) return problem(404,"Not Found","Пользователь "+uid+" не существует.");
    if(m!=="GET"&&m!=="HEAD"&&m!=="OPTIONS") return res(405,{error:"method_not_allowed"},{"Allow":"GET, HEAD, OPTIONS"});
    if(m==="OPTIONS") return res(204,null,{"Allow":"GET, HEAD, OPTIONS"});
    return res(200, s.posts.filter(x=>x.userId===uid));
  }
  if(mPosts) return collection(s, req, "posts");
  if(mPost) return item(s, req, "posts", +mPost[1]);
  if(mOrders) return orders(s, req);
  if(mOrder) return item(s, req, "orders", +mOrder[1]);
  return problem(404,"Not Found","Ресурс "+p+" не существует.");
}

/* ---------------- коллекции ---------------- */
const ALLOW_COLL = "GET, POST, HEAD, OPTIONS";
function collection(s, req, kind){
  const m = req.method;
  if(m==="OPTIONS") return res(204,null,{"Allow":ALLOW_COLL});
  if(m==="PUT"||m==="PATCH"||m==="DELETE")
    return res(405,{error:"method_not_allowed", detail:"Метод "+m+" неприменим к коллекции целиком."},{"Allow":ALLOW_COLL,"Content-Type":"application/json"});

  if(m==="GET"||m==="HEAD"){
    let list = s[kind].slice();
    const q = req.query;
    if(q.role) list = list.filter(x=>x.role===q.role);
    if(q.published!==undefined) list = list.filter(x=>String(x.published)===q.published);
    if(q.userId) list = list.filter(x=>String(x.userId)===q.userId);
    if(q.q) list = list.filter(x=>JSON.stringify(x).toLowerCase().includes(q.q.toLowerCase()));
    if(q.sort){
      const desc = q.sort.startsWith("-"), f = q.sort.replace(/^-/,"");
      list.sort((a,b)=>{ const A=a[f], B=b[f]; if(A===B) return 0; return (A>B?1:-1)*(desc?-1:1); });
    }
    const total = list.length;
    let limit = q.limit!==undefined ? parseInt(q.limit,10) : 20;
    let page = q.page!==undefined ? parseInt(q.page,10) : 1;
    if(Number.isNaN(limit)||limit<1) return problem(400,"Invalid Parameter","Параметр limit должен быть целым числом больше нуля.",{parameter:"limit"});
    if(limit>100) return problem(400,"Invalid Parameter","Параметр limit не может превышать 100.",{parameter:"limit",max:100});
    if(Number.isNaN(page)||page<1) return problem(400,"Invalid Parameter","Параметр page должен быть целым числом больше нуля.",{parameter:"page"});
    const pages = Math.max(1, Math.ceil(total/limit));
    const slice = list.slice((page-1)*limit, page*limit);
    const h = {"X-Total-Count":String(total),"Cache-Control":"public, max-age=60"};
    const base = HOST+"/"+kind;
    const qs = n => { const c = Object.assign({}, q, {page:String(n), limit:String(limit)});
      return base+"?"+Object.keys(c).map(k=>k+"="+encodeURIComponent(c[k])).join("&"); };
    const links = [];
    if(page<pages) links.push('<'+qs(page+1)+'>; rel="next"');
    if(page>1) links.push('<'+qs(page-1)+'>; rel="prev"');
    links.push('<'+qs(1)+'>; rel="first"', '<'+qs(pages)+'>; rel="last"');
    h["Link"] = links.join(", ");
    return res(200, m==="HEAD"?null:slice, h);
  }

  /* POST — создание */
  const b = JSON.parse(req.body);
  if(kind==="users"){
    const errs = [];
    if(!b.name) errs.push({field:"name",code:"required",detail:"Имя обязательно."});
    if(!b.email) errs.push({field:"email",code:"required",detail:"Почта обязательна."});
    else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(b.email)) errs.push({field:"email",code:"invalid_format",detail:"Не похоже на адрес почты."});
    if(b.role && !["admin","user"].includes(b.role)) errs.push({field:"role",code:"invalid_value",detail:"Допустимо admin или user."});
    if(errs.length) return problem(422,"Validation Failed","Тело запроса не прошло проверку.",{errors:errs});
    if(s.users.some(u=>u.email.toLowerCase()===String(b.email).toLowerCase()))
      return problem(409,"Conflict","Пользователь с такой почтой уже существует.",{field:"email",value:b.email});
    const id = ++s.seq.users;
    const u = {id, name:b.name, email:b.email, role:b.role||"user", createdAt:new Date().toISOString().slice(0,10)};
    s.users.push(u);
    return res(201, u, {"Location":HOST+"/users/"+id, "ETag":etagOf(s,"users",id)});
  }
  if(kind==="posts"){
    const errs = [];
    if(!b.title) errs.push({field:"title",code:"required"});
    if(b.userId===undefined) errs.push({field:"userId",code:"required"});
    else if(!s.users.some(u=>u.id===b.userId)) errs.push({field:"userId",code:"not_found",detail:"Такого пользователя нет."});
    if(errs.length) return problem(422,"Validation Failed","Тело запроса не прошло проверку.",{errors:errs});
    const id = ++s.seq.posts;
    const post = {id, userId:b.userId, title:b.title, published:!!b.published};
    s.posts.push(post);
    return res(201, post, {"Location":HOST+"/posts/"+id, "ETag":etagOf(s,"posts",id)});
  }
  return problem(404,"Not Found","Неизвестная коллекция.");
}

/* ---------------- заказы: идемпотентность ---------------- */
function orders(s, req){
  const m = req.method;
  if(m==="OPTIONS") return res(204,null,{"Allow":ALLOW_COLL});
  if(m==="GET"||m==="HEAD") return res(200, m==="HEAD"?null:s.orders, {"X-Total-Count":String(s.orders.length)});
  if(m!=="POST") return res(405,{error:"method_not_allowed"},{"Allow":ALLOW_COLL,"Content-Type":"application/json"});

  const key = req.headers["Idempotency-Key"] || req.headers["idempotency-key"];
  if(key && s.idem[key]){
    const saved = s.idem[key];
    return res(saved.status, saved.body, Object.assign({}, saved.headers, {"Idempotency-Replayed":"true"}));
  }
  const b = JSON.parse(req.body);
  const errs = [];
  if(!b.item) errs.push({field:"item",code:"required"});
  if(b.amount===undefined) errs.push({field:"amount",code:"required"});
  else if(typeof b.amount!=="number"||b.amount<=0) errs.push({field:"amount",code:"invalid_value",detail:"Должно быть положительным числом."});
  if(errs.length) return problem(422,"Validation Failed","Тело запроса не прошло проверку.",{errors:errs});
  const id = ++s.seq.orders;
  const order = {id, item:b.item, amount:b.amount, status:"created"};
  s.orders.push(order);
  const out = res(201, order, {"Location":HOST+"/orders/"+id, "ETag":etagOf(s,"orders",id)});
  if(key) s.idem[key] = {status:out.status, body:out.body, headers:Object.assign({},out.headers)};
  return out;
}

/* ---------------- отдельный ресурс ---------------- */
function item(s, req, kind, id){
  const m = req.method;
  const list = s[kind];
  const idx = list.findIndex(x=>x.id===id);
  const ALLOW = "GET, PUT, PATCH, DELETE, HEAD, OPTIONS";
  if(m==="OPTIONS") return res(204,null,{"Allow":ALLOW});
  if(m==="POST") return res(405,{error:"method_not_allowed",
    detail:"POST создаёт ресурс в коллекции, а не поверх существующего. Используйте PUT или PATCH."},
    {"Allow":ALLOW,"Content-Type":"application/json"});
  if(idx<0) return problem(404,"Not Found","Ресурс /"+kind+"/"+id+" не найден.");

  const obj = list[idx];
  const etag = etagOf(s,kind,id);

  if(m==="GET"||m==="HEAD"){
    const inm = req.headers["If-None-Match"] || req.headers["if-none-match"];
    if(inm && inm.split(",").map(x=>x.trim()).includes(etag))
      return res(304, null, {"ETag":etag,"Cache-Control":"private, max-age=30"});
    return res(200, m==="HEAD"?null:obj, {"ETag":etag,"Cache-Control":"private, max-age=30"});
  }

  const im = req.headers["If-Match"] || req.headers["if-match"];
  if(im && !im.split(",").map(x=>x.trim()).includes(etag) && im.trim()!=="*")
    return problem(412,"Precondition Failed","Ресурс изменился с момента чтения: ETag теперь "+etag+".",{current_etag:etag});

  if(m==="DELETE"){
    list.splice(idx,1);
    return res(204, null, {});
  }

  const b = JSON.parse(req.body);
  if(m==="PUT"){
    if(kind==="users"){
      const errs=[];
      if(!b.name) errs.push({field:"name",code:"required",detail:"PUT заменяет ресурс целиком — обязательны все поля."});
      if(!b.email) errs.push({field:"email",code:"required",detail:"PUT заменяет ресурс целиком — обязательны все поля."});
      else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(b.email)) errs.push({field:"email",code:"invalid_format"});
      if(errs.length) return problem(422,"Validation Failed","Тело запроса не прошло проверку.",{errors:errs});
      if(s.users.some(u=>u.id!==id && u.email.toLowerCase()===String(b.email).toLowerCase()))
        return problem(409,"Conflict","Пользователь с такой почтой уже существует.",{field:"email"});
      list[idx] = {id, name:b.name, email:b.email, role:b.role||"user", createdAt:obj.createdAt};
    } else {
      list[idx] = Object.assign({}, b, {id});
    }
    bump(s,kind,id);
    return res(200, list[idx], {"ETag":etagOf(s,kind,id)});
  }
  if(m==="PATCH"){
    if(b.email!==undefined && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(b.email))
      return problem(422,"Validation Failed","Тело запроса не прошло проверку.",{errors:[{field:"email",code:"invalid_format"}]});
    if(b.email!==undefined && s.users.some(u=>u.id!==id && u.email && u.email.toLowerCase()===String(b.email).toLowerCase()))
      return problem(409,"Conflict","Пользователь с такой почтой уже существует.",{field:"email"});
    Object.keys(b).forEach(k=>{ if(k==="id") return; if(b[k]===null) delete obj[k]; else obj[k]=b[k]; });
    bump(s,kind,id);
    return res(200, obj, {"ETag":etagOf(s,kind,id)});
  }
  return res(405,{error:"method_not_allowed"},{"Allow":ALLOW,"Content-Type":"application/json"});

   Клиент: отрисовка обмена в сыром виде HTTP

const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const cls = st => st>=500?"c5":st>=400?"c4":st>=300?"c3":st>=200?"c2":"c1";

function hiJson(v){
  if(v===null||v===undefined) return "";
  const s = esc(JSON.stringify(v,null,2));
  return s.replace(/&quot;([^&]*?)&quot;(\s*:)/g,'<span class="h">&quot;$1&quot;</span>$2')
          .replace(/:\s*(&quot;[^&]*?&quot;)/g,': <span class="s">$1</span>')
          .replace(/:\s*(true|false|null|-?\d+(?:\.\d+)?)/g,': <span class="m">$1</span>');
}
const HDR_ORDER = ["Host","Accept","Content-Type","Authorization","If-None-Match","If-Match","Idempotency-Key","Content-Length"];
function hdrLines(h, order){
  const keys = Object.keys(h);
  keys.sort((a,b)=>{
    const ia = order.indexOf(a), ib = order.indexOf(b);
    if(ia>-1&&ib>-1) return ia-ib;
    if(ia>-1) return -1; if(ib>-1) return 1;
    return a.localeCompare(b);
  });
  return keys.map(k=>'<span class="h">'+esc(k)+'</span>: '+esc(h[k])).join("\n");
}
function renderExchange(req, r){
  const q = Object.keys(req.query||{}).length
    ? "?"+Object.entries(req.query).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&") : "";
  const reqH = Object.assign({Host:"api.example.com"}, req.headers);
  if(req.body!==null && req.body!==undefined && !reqH["Content-Length"]) reqH["Content-Length"] = String(req.body.length);
  let out = '<div class="ex '+cls(r.status)+'">';
  out += '<div class="lbl">запрос</div><pre><span class="m">'+esc(req.method)+'</span> '+esc(req.path+q)+' HTTP/1.1\n'+
         hdrLines(reqH, HDR_ORDER);
  if(req.body!==null && req.body!==undefined){
    let b = req.body;
    try{ b = JSON.stringify(JSON.parse(req.body),null,2); }catch(e){}
    out += '\n\n'+ (()=>{ try{ return hiJson(JSON.parse(req.body)); }catch(e){ return esc(b); } })();
  }
  out += '</pre>';
  out += '<div class="rl"><span class="lbl" style="margin:0">ответ</span>'+
         '<span class="code">HTTP/1.1 '+r.status+' '+esc(REASON[r.status]||"")+'</span></div>';
  out += '<pre>'+hdrLines(r.headers, ["Content-Type","Location","ETag","Allow","WWW-Authenticate","Retry-After","Link","X-Total-Count","Cache-Control"]);
  if(r.body!==null && r.body!==undefined && r.status!==304 && req.method!=="HEAD") out += '\n\n'+hiJson(r.body);
  else out += '\n\n<span class="c">(тело пустое)</span>';
  out += '</pre></div>';
  return out;
}

function renderState(s){
  let h = "";
  const grp = (title, rows) => {
    h += '<div class="g">'+esc(title)+' ('+rows.length+')</div>';
    if(!rows.length){ h += '<div class="row" style="color:var(--ink3)">—</div>'; return; }
    rows.forEach(([a,b])=>{ h += '<div class="row"><b>'+esc(a)+'</b><span>'+esc(b)+'</span></div>'; });
  };
  grp("Пользователи", s.users.map(u=>["#"+u.id, u.name+" · "+u.email+" · "+u.role]));
  grp("Посты", s.posts.map(p=>["#"+p.id, p.title+" · автор "+p.userId+(p.published?"":" · черновик")]));
  grp("Заказы", s.orders.map(o=>["#"+o.id, o.item+" × "+o.amount]));
  const toks = Object.entries(s.tokens);
  grp("Токены", toks.map(([t,v])=>[t.slice(0,10)+"…", v.sub+" · "+v.scopes.join(" ")]));
  if(s.rate.limit>0) grp("Лимит", [["частота", s.rate.n+" / "+s.rate.limit+" в минуту"]]);
  return h;
}

function didStatus(s, method, rx, status){
  return did(s,(q,r)=> q.method===method && rx.test(q.path) && r.status===status);
}
function hasHeader(q, name){
  const k = Object.keys(q.headers).find(x=>x.toLowerCase()===name.toLowerCase());

<tr><td><b>Код по требованию</b></td><td>Необязательное: сервер может прислать исполняемый код. На практике почти не используется</td></tr>

<div class="note warn"><b class="hd">Отсутствие состояния — не то же самое, что отсутствие данных</b><p>Сервер, конечно, хранит пользователей в базе. Ограничение о другом: он не хранит <em>состояние диалога</em>. Нельзя сказать «а теперь удали того, кого я смотрел в прошлом запросе» — каждый запрос несёт всё нужное сам. Именно это позволяет поставить десять серверов за балансировщиком и не думать, на какой попадёт следующий запрос.</p></div>

<h2>Уровни зрелости Ричардсона</h2>
<p>Удобная шкала, чтобы честно оценить, насколько API вообще REST.</p>
<figure class="fig">
<svg viewBox="0 0 620 240" role="img" aria-label="Уровни зрелости Ричардсона">
 <g font-family="var(--fm)" font-size="10">
  <rect x="0" y="6" width="620" height="50" rx="3" fill="var(--surf3)" stroke="var(--line)"/>

  <text x="12" y="42" font-size="9" fill="var(--ink2)">POST /api  {"action":"getUser","id":1} — HTTP используется как транспорт, не более</text>

  <text x="12" y="81" font-weight="700" fill="var(--ink)">Уровень 1 · появились ресурсы</text>
  <text x="12" y="98" font-size="9" fill="var(--ink2)">POST /users/1/get, POST /users/create — адреса разные, но глаголы всё ещё в пути</text>

  <rect x="0" y="118" width="620" height="50" rx="3" fill="var(--acc-s)" stroke="var(--acc)"/>
  <text x="12" y="137" font-weight="700" fill="var(--ink)">Уровень 2 · методы и коды по назначению</text>
  <text x="12" y="154" font-size="9" fill="var(--ink2)">GET /users/1 · POST /users · DELETE /users/1 — здесь живёт подавляющее большинство реальных API</text>

  <rect x="0" y="174" width="620" height="50" rx="3" fill="var(--surf3)" stroke="var(--line)" stroke-dasharray="4 3"/>
  <text x="12" y="193" font-weight="700" fill="var(--ink)">Уровень 3 · HATEOAS — ответы несут ссылки</text>
  <text x="12" y="210" font-size="9" fill="var(--ink2)">в ответе приходят _links на возможные следующие действия. Встречается редко</text>
  <text x="0" y="234" font-size="9" fill="var(--ink3)">Формально REST начинается с третьего уровня. На практике «REST API» почти всегда означает второй — и это нормально.</text>
 </g>
</svg>
<figcaption>Шкала полезна не для оценок, а для разговора: она даёт словарь, чтобы объяснить, чего именно не хватает в конкретном API.</figcaption>
</figure>

<h2>Признаки, что интерфейс не REST</h2>
<ul>
<li><b>Глаголы в пути:</b> <code>/getUser</code>, <code>/createOrder</code>, <code>/user/delete</code>. Глагол уже есть — это метод HTTP.</li>
<li><b>Всё через POST,</b> включая чтение.</li>
<li><b>Всегда 200,</b> а настоящая ошибка спрятана в теле: <code>{"success":false}</code>. Тогда ни кэш, ни балансировщик, ни клиентская библиотека не понимают, что произошло.</li>
<li><b>Диалог с состоянием:</b> «сначала вызовите /select, потом /confirm».</li>
</ul>
<div class="note trap"><b class="hd">Самое дорогое из перечисленного</b><p>Ответ <span class="st c2">200</span> на ошибку. Он ломает всё, что построено на кодах: повторные попытки, оповещения, кэширование, обработку ошибок в клиенте. Если запрос не удался — код должен быть из класса 4xx или 5xx.</p></div>
`,

{
n:3, id:"methods", title:"Методы", sub:"Безопасность и идемпотентность",
lede:"Два свойства, по которым методы делятся на классы, и почему от них зависит, можно ли безопасно повторить запрос.",
theory:`
<p>У каждого метода HTTP есть два формальных свойства. Они определяют, что имеют право делать с запросом кэши, прокси, браузеры и механизмы повторных попыток.</p>

<h2>Безопасность и идемпотентность</h2>
<div class="tw"><table>
<tr><th>Метод</th><th>Безопасный</th><th>Идемпотентный</th><th>Тело запроса</th></tr>
<tr><td><span class="mth">GET</span></td><td>да</td><td>да</td><td>нет</td></tr>
<tr><td><span class="mth">HEAD</span></td><td>да</td><td>да</td><td>нет</td></tr>
<tr><td><span class="mth">OPTIONS</span></td><td>да</td><td>да</td><td>нет</td></tr>
<tr><td><span class="mth">PUT</span></td><td>нет</td><td><b>да</b></td><td>да</td></tr>
<tr><td><span class="mth">DELETE</span></td><td>нет</td><td><b>да</b></td><td>нет</td></tr>
<tr><td><span class="mth">POST</span></td><td>нет</td><td><b>нет</b></td><td>да</td></tr>
<tr><td><span class="mth">PATCH</span></td><td>нет</td><td>не обязан</td><td>да</td></tr>
</table></div>
<ul>
<li><b>Безопасный</b> — не меняет состояние на сервере. Такой запрос можно отправить когда угодно и сколько угодно раз.</li>
<li><b>Идемпотентный</b> — повторное выполнение <em>того же</em> запроса оставляет систему в том же состоянии, что и однократное.</li>
</ul>

<div class="note"><b class="hd">Идемпотентность — про состояние, а не про ответ</b><p>Повторный <code>DELETE /users/5</code> вернёт <span class="st c4">404</span> вместо <span class="st c2">204</span> — <b>ответы разные, а состояние одинаковое</b>: пользователя нет ни там, ни там. Это по-прежнему идемпотентно. Путать эти две вещи — самая частая ошибка на собеседованиях.</p></div>

<h2>Зачем это знать на практике</h2>
<p>Сеть ненадёжна. Запрос ушёл, ответ потерялся — клиент не знает, выполнилась ли операция. Повторять можно только идемпотентный запрос. Именно поэтому:</p>
<ul>
<li>Библиотеки HTTP по умолчанию повторяют <code>GET</code> и <code>PUT</code>, но не <code>POST</code>.</li>
<li>Для неидемпотентного создания придумали <code>Idempotency-Key</code> — ему посвящён отдельный модуль.</li>
<li>Браузер спокойно предзагружает <code>GET</code>-ссылки, а перед повторной отправкой формы (<code>POST</code>) спрашивает подтверждение.</li>
</ul>

<h2>POST, PUT и PATCH — в чём разница</h2>
<div class="tw"><table>
<tr><th></th><th>POST</th><th>PUT</th><th>PATCH</th></tr>
<tr><td>Куда</td><td>в коллекцию: <code>POST /users</code></td><td>по адресу ресурса: <code>PUT /users/5</code></td><td>по адресу ресурса</td></tr>
<tr><td>Что делает</td><td>создаёт новый, адрес назначает сервер</td><td>помещает представление целиком</td><td>меняет часть полей</td></tr>
<tr><td>Тело</td><td>данные нового ресурса</td><td><b>все</b> поля — отсутствующие затираются</td><td>только изменяемые поля</td></tr>
<tr><td>Повтор</td><td>создаст ещё один</td><td>ничего не изменит</td><td>зависит от содержимого</td></tr>
<tr><td>Обычный ответ</td><td><span class="st c2">201</span> + <code>Location</code></td><td><span class="st c2">200</span> или <span class="st c2">204</span></td><td><span class="st c2">200</span></td></tr>
</table></div>
<div class="note trap"><b class="hd">PUT затирает то, чего вы не прислали</b><p>Это его смысл: «пусть по этому адресу лежит вот это». Прислали <code>{"name":"Ann"}</code> вместо полного объекта — почта и роль исчезнут либо запрос будет отклонён. Хотите поменять одно поле — это <code>PATCH</code>.</p></div>

<h2>Когда PATCH не идемпотентен</h2>
<p>Замена поля — идемпотентна: <code>{"role":"admin"}</code> сколько ни повторяй, роль останется admin. А вот операция вида «увеличить счётчик на единицу» — нет. Поэтому спецификация и говорит, что PATCH идемпотентным <em>быть не обязан</em>: всё зависит от того, что вы в него положили.</p>
`,

 {q:"Повторный <code>DELETE /users/5</code> вернул 404 вместо 204. DELETE всё ещё идемпотентен?",
  opts:["Нет, ответы разные — значит не идемпотентен","Да: идемпотентность про состояние системы, а не про код ответа","Только если сервер вернёт 204 повторно","Зависит от реализации"],
  a:1, why:"После обоих запросов ресурса нет — состояние одинаковое. Коды ответов при этом вполне могут отличаться."},

  a:1, why:"PUT помещает представление целиком. Для изменения отдельных полей существует PATCH."},
 {q:"Почему HTTP-библиотеки повторяют GET и PUT, но не POST?",
  opts:["POST медленнее","GET и PUT идемпотентны, а повтор POST создаст лишний ресурс","POST запрещает повторы спецификацией","Из-за размера тела"],
  a:1, why:"Повтор идемпотентного запроса безопасен. Повтор POST после потерянного ответа даёт второй заказ, второй платёж, второго пользователя."},
 {q:"Куда отправляют <code>POST</code> при создании ресурса?",
  opts:["На адрес будущего ресурса: <code>POST /users/5</code>","На адрес коллекции: <code>POST /users</code>","На корень API","Куда угодно, адрес не важен"],
  a:1, why:"POST адресуется коллекции, а адрес созданного ресурса назначает сервер и возвращает в заголовке <code>Location</code>."},
 {q:"В каком случае PATCH не идемпотентен?",
  opts:["Когда меняет несколько полей","Когда тело описывает операцию вида «увеличить на 1», а не «установить значение»","PATCH всегда идемпотентен","Когда возвращает 200"],
  a:1, why:"Присваивание идемпотентно, приращение — нет. Поэтому спецификация не требует идемпотентности от PATCH."}
],

{
n:4, id:"status", title:"Коды состояния", sub:"Пять классов и когда что",
lede:"Код ответа — самая важная часть: на него смотрят кэши, балансировщики, механизмы повторов и ваш клиент.",
theory:`
<p>Первая цифра задаёт класс, и по ней уже понятно, что делать дальше.</p>
<div class="tw"><table>
<tr><th>Класс</th><th>Смысл</th><th>Что делает клиент</th></tr>
<tr><td><span class="st c1">1xx</span></td><td>Информационный</td><td>Ждёт продолжения. В обычных API не встречается</td></tr>
<tr><td><span class="st c2">2xx</span></td><td>Успех</td><td>Работает с результатом</td></tr>
<tr><td><span class="st c3">3xx</span></td><td>Перенаправление</td><td>Идёт по адресу из <code>Location</code> или берёт из кэша</td></tr>
<tr><td><span class="st c4">4xx</span></td><td>Ошибка клиента</td><td><b>Не повторяет</b> — надо исправить запрос</td></tr>
<tr><td><span class="st c5">5xx</span></td><td>Ошибка сервера</td><td>Можно повторить, желательно с задержкой</td></tr>
</table></div>
<div class="note ok"><b class="hd">Граница 4xx / 5xx — главное решение</b><p>4xx означает «виноват запрос, повторять бессмысленно». 5xx — «виноват сервер, попробуйте ещё раз». Ошибка в классе стоит дорого: клиент либо будет долбить сервер повторами бессмысленного запроса, либо сдастся там, где хватило бы одной повторной попытки.</p></div>

<h2>Успех</h2>
<div class="tw"><table>
<tr><th>Код</th><th>Когда</th></tr>
<tr><td><span class="st c2">200</span> OK</td><td>Обычный успех с телом: GET, PUT, PATCH</td></tr>
<tr><td><span class="st c2">201</span> Created</td><td>Ресурс создан. <b>Обязателен</b> заголовок <code>Location</code> с его адресом</td></tr>
<tr><td><span class="st c2">202</span> Accepted</td><td>Запрос принят, но ещё не выполнен — асинхронная обработка</td></tr>
<tr><td><span class="st c2">204</span> No Content</td><td>Успех без тела. Типичный ответ на DELETE</td></tr>
</table></div>

<h2>Ошибки клиента — те, что встречаются каждый день</h2>
<div class="tw"><table>
<tr><th>Код</th><th>Когда</th><th>Чем отличается от соседнего</th></tr>
<tr><td><span class="st c4">400</span> Bad Request</td><td>Запрос синтаксически неверен: битый JSON, неразбираемый параметр</td><td>Сервер не смог даже разобрать</td></tr>
<tr><td><span class="st c4">401</span> Unauthorized</td><td>Не представились или токен недействителен</td><td>«Кто вы?» Обязателен <code>WWW-Authenticate</code></td></tr>
<tr><td><span class="st c4">403</span> Forbidden</td><td>Личность известна, прав не хватает</td><td>«Знаю вас, но нельзя». Повторять с тем же токеном бессмысленно</td></tr>
<tr><td><span class="st c4">404</span> Not Found</td><td>Ресурса нет</td><td>Иногда используют вместо 403, чтобы не раскрывать существование</td></tr>
<tr><td><span class="st c4">405</span> Method Not Allowed</td><td>Ресурс есть, метод к нему неприменим</td><td>Обязателен <code>Allow</code></td></tr>
<tr><td><span class="st c4">406</span> Not Acceptable</td><td>Сервер не умеет формат из <code>Accept</code></td><td>Про формат <em>ответа</em></td></tr>
<tr><td><span class="st c4">409</span> Conflict</td><td>Конфликт с текущим состоянием: дубликат, гонка версий</td><td>Данные корректны, но противоречат состоянию</td></tr>
<tr><td><span class="st c4">412</span> Precondition Failed</td><td>Не выполнилось условие из <code>If-Match</code></td><td>Ресурс изменился с момента чтения</td></tr>
<tr><td><span class="st c4">415</span> Unsupported Media Type</td><td>Сервер не умеет формат из <code>Content-Type</code></td><td>Про формат <em>запроса</em></td></tr>
<tr><td><span class="st c4">422</span> Unprocessable Content</td><td>Синтаксис верен, смысл — нет: почта без собаки</td><td>Разобрать смог, принять не может</td></tr>
<tr><td><span class="st c4">429</span> Too Many Requests</td><td>Превышена частота</td><td>Обычно с <code>Retry-After</code></td></tr>
</table></div>

<div class="note trap"><b class="hd">Три пары, которые путают чаще всего</b><ul>
<li><b>401 против 403.</b> «Не знаю вас» против «знаю, но нельзя». Если после повторного входа ничего не изменится — это 403.</li>
<li><b>400 против 422.</b> Битый JSON — 400. Корректный JSON с недопустимым значением — 422.</li>
<li><b>406 против 415.</b> 406 — не устраивает <code>Accept</code> (ответ). 415 — не устраивает <code>Content-Type</code> (запрос).</li>
</ul></div>

<h2>Перенаправления</h2>
<div class="tw"><table>
<tr><th>Код</th><th>Смысл</th></tr>
<tr><td><span class="st c3">301</span></td><td>Переехало навсегда. Клиентам стоит запомнить новый адрес</td></tr>
<tr><td><span class="st c3">302</span> / <span class="st c3">307</span></td><td>Временно. 307 гарантирует сохранение метода, 302 исторически мог превратить POST в GET</td></tr>
<tr><td><span class="st c3">304</span></td><td>Не изменилось — используйте кэш. Тела нет. Формально это не перенаправление</td></tr>
</table></div>
`,

{
n:5, id:"headers", title:"Заголовки и форматы", sub:"Согласование содержимого",
lede:"Как клиент и сервер договариваются о формате, и почему 406 и 415 — про разные стороны обмена.",
theory:`
<p>Один ресурс может быть отдан в разных представлениях. Механизм, которым стороны выбирают формат, называется <b>согласованием содержимого</b>.</p>

<h2>Две стороны, два заголовка</h2>
<figure class="fig">
<svg viewBox="0 0 620 192" role="img" aria-label="Accept и Content-Type в запросе и ответе">
 <g font-family="var(--fm)" font-size="10">
  <rect x="0" y="10" width="290" height="70" rx="3" fill="var(--acc-s)" stroke="var(--acc)"/>
  <text x="12" y="29" font-weight="700" fill="var(--ink)">ЗАПРОС</text>
  <text x="12" y="47" font-size="9" fill="var(--ink2)">Content-Type: что я отправляю</text>
  <text x="12" y="63" font-size="9" fill="var(--ink2)">Accept: что готов получить</text>

  <path d="M294 45h32" stroke="var(--acc)" stroke-width="1.3"/><path d="M326 45l-7-4v8z" fill="var(--acc)"/>

  <rect x="330" y="10" width="290" height="70" rx="3" fill="var(--surf3)" stroke="var(--line)"/>
  <text x="342" y="29" font-weight="700" fill="var(--ink)">ОТВЕТ</text>
  <text x="342" y="47" font-size="9" fill="var(--ink2)">Content-Type: что я вернул</text>
  <text x="342" y="63" font-size="9" fill="var(--ink3)">Accept в ответе не бывает</text>

  <rect x="0" y="94" width="290" height="60" rx="3" fill="var(--s4s)" stroke="var(--s4)"/>
  <text x="12" y="113" font-weight="700" fill="var(--s4)">415 Unsupported Media Type</text>
  <text x="12" y="130" font-size="9" fill="var(--ink2)">не устраивает Content-Type</text>
  <text x="12" y="145" font-size="9" fill="var(--ink3)">то есть формат, который прислал клиент</text>

  <rect x="330" y="94" width="290" height="60" rx="3" fill="var(--s4s)" stroke="var(--s4)"/>
  <text x="342" y="113" font-weight="700" fill="var(--s4)">406 Not Acceptable</text>
  <text x="342" y="130" font-size="9" fill="var(--ink2)">не устраивает Accept</text>
  <text x="342" y="145" font-size="9" fill="var(--ink3)">то есть формат, который просит клиент</text>
  <text x="0" y="172" font-size="9" fill="var(--ink3)">Мнемоника: Content-Type описывает то тело, в сообщении которого он стоит.</text>
  <text x="0" y="186" font-size="9" fill="var(--ink3)">В запросе это тело запроса, в ответе — тело ответа.</text>
 </g>
</svg>
<figcaption>Оба кода из класса 4xx, но причины противоположные: один про отправленное, другой про запрошенное.</figcaption>
</figure>

<h2>Как выглядит Accept</h2>
<pre><code><span class="h">Accept</span>: application/json                  <span class="c">только JSON</span>
<span class="h">Accept</span>: application/json, text/*;q=0.5   <span class="c">JSON предпочтительнее, текст сойдёт</span>
<span class="h">Accept</span>: */*                               <span class="c">что угодно — так делает curl по умолчанию</span></code></pre>
<p>Число <code>q</code> от 0 до 1 — вес предпочтения. Отсутствие <code>q</code> равносильно <code>q=1</code>. Сервер выбирает самое подходящее из того, что умеет.</p>

<h2>Типы содержимого, которые стоит узнавать</h2>
<div class="tw"><table>
<tr><th>Тип</th><th>Где встречается</th></tr>
<tr><td><code>application/json</code></td><td>Основной формат REST API</td></tr>
<tr><td><code>application/problem+json</code></td><td>Стандартизованное тело ошибки (RFC 9457)</td></tr>
<tr><td><code>application/merge-patch+json</code></td><td>Тело PATCH: «слить эти поля с текущими»</td></tr>
<tr><td><code>application/x-www-form-urlencoded</code></td><td>Обычная HTML-форма</td></tr>
<tr><td><code>multipart/form-data</code></td><td>Загрузка файлов</td></tr>
<tr><td><code>text/event-stream</code></td><td>Server-Sent Events — поток событий</td></tr>
</table></div>
<div class="note warn"><b class="hd">Суффикс +json</b><p><code>application/problem+json</code> — это JSON с оговоренной структурой. Клиент, умеющий разбирать JSON, разберёт и его: суффикс сообщает <em>синтаксис</em>, а основная часть — <em>смысл</em>. Поэтому проверять «это JSON?» надо не сравнением строк, а по суффиксу.</p></div>

<h2>Заголовки, о которых часто забывают</h2>
<div class="tw"><table>
<tr><th>Заголовок</th><th>Зачем</th></tr>
<tr><td><code>Accept-Language</code></td><td>Язык ответа. Тот же механизм согласования, что и с форматом</td></tr>
<tr><td><code>Accept-Encoding</code></td><td>Сжатие: gzip, br. Экономит трафик почти бесплатно</td></tr>
<tr><td><code>User-Agent</code></td><td>Кто клиент. Часто по нему разбирают инциденты и вводят лимиты</td></tr>
<tr><td><code>X-Request-Id</code></td><td>Сквозной идентификатор запроса. Незаменим при разборе распределённых сбоев</td></tr>
<tr><td><code>Retry-After</code></td><td>Через сколько повторить. Приходит с 429 и 503</td></tr>
</table></div>
<div class="note trap"><b class="hd">Забытый Content-Type — самая частая ошибка</b><p>Отправили тело, но не объявили формат — и получили <span class="st c4">415</span> вместо ожидаемого <span class="st c2">201</span>. В curl это лечится флагом <code>--json</code>, который заодно ставит и <code>Accept</code>. В коде тестов такой заголовок обычно ставит сам клиент HTTP — но только если вы передали данные как объект, а не как строку.</p></div>
`,

<tr><td>Без завершающего слэша</td><td><code>/users</code></td><td><code>/users/</code></td></tr>
</table></div>
<div class="note"><b class="hd">Почему множественное число</b><p><code>/users</code> — это коллекция, <code>/users/1</code> — элемент в ней. Читается последовательно и предсказуемо. Единственное число вынуждает угадывать: <code>/user/1</code> — это «пользователь номер один» или «первый ресурс типа пользователь»? На практике важнее не выбор, а единообразие: смешивать <code>/users</code> и <code>/order</code> в одном API хуже, чем последовательно выбрать любой вариант.</p></div>

<h2>Путь или строка запроса</h2>
<p>Граница проходит по вопросу: параметр определяет, <b>какой</b> ресурс, или <b>как его показать</b>?</p>
<div class="tw"><table>
<tr><th>В пути</th><th>В строке запроса</th></tr>
<tr><td>Идентификатор: <code>/users/1</code></td><td>Фильтр: <code>?role=admin</code></td></tr>
<tr><td>Связь: <code>/users/1/posts</code></td><td>Сортировка: <code>?sort=-createdAt</code></td></tr>
<tr><td>Подресурс: <code>/orders/7/items</code></td><td>Пагинация: <code>?page=2&amp;limit=20</code></td></tr>
<tr><td></td><td>Выбор полей: <code>?fields=id,name</code></td></tr>
</table></div>
<p>Практическое следствие: <code>/users/1</code> и <code>/users?id=1</code> — разные вещи. Первый адресует один ресурс и вернёт <span class="st c4">404</span>, если его нет. Второй адресует коллекцию и вернёт <span class="st c2">200</span> с пустым массивом.</p>

<div class="note ok"><b class="hd">Это ловит больше всего ошибок в тестах</b><p>Проверка «пустой список» и проверка «ресурс не найден» — разные проверки. Коллекция без совпадений — <b>успех</b>: <span class="st c2">200</span> и <code>[]</code>. Отсутствующий элемент — <b>ошибка</b>: <span class="st c4">404</span>. Тест, ожидающий 404 от фильтра без результатов, написан неверно.</p></div>

<h2>Вложенность</h2>
<pre><code>GET /users/1/posts        <span class="c">посты пользователя 1 — связь осмысленна</span>
GET /posts?userId=1       <span class="c">то же самое через фильтр — тоже нормально</span>
GET /users/1/posts/9      <span class="c">избыточно: у поста уже есть свой адрес /posts/9</span></code></pre>
<p>Разумная глубина — один уровень. Как только адрес становится длиннее <code>/коллекция/id/коллекция</code>, у вложенного ресурса почти наверняка есть собственный адрес, и лучше дать ссылку на него.</p>

<h2>Действия, которые не ложатся на CRUD</h2>
<p>«Опубликовать пост», «отменить заказ», «отправить письмо повторно» — это не создание и не изменение поля. Три рабочих подхода:</p>
<ol>
<li><b>Изменить состояние как поле:</b> <code>PATCH /posts/9 {"published": true}</code>. Самый чистый вариант, когда действие сводится к смене статуса.</li>
<li><b>Подресурс-действие:</b> <code>POST /orders/7/cancellation</code>. Действие становится ресурсом, и у него появляется история.</li>
<li><b>Глагол как крайняя мера:</b> <code>POST /orders/7/cancel</code>. Формально нарушает единообразие, зато честно и понятно. Многие крупные API так и делают.</li>
</ol>
<div class="note warn"><b class="hd">Не изобретайте новые методы</b><p>Соблазн объявить <code>CANCEL /orders/7</code> велик, но такой метод не пройдёт через прокси, кэши, брандмауэры и половину клиентских библиотек. Инфраструктура знает конечный список методов.</p></div>
`,

n:7, id:"paging", title:"Пагинация", sub:"Страницы, курсоры, Link",
lede:"Коллекция из миллиона записей не помещается в один ответ. Как её резать и как сообщить клиенту, что дальше.",
theory:`
<p>Отдавать коллекцию целиком нельзя: она растёт, а ответ должен оставаться предсказуемым. Значит, нужен способ выдавать её частями и объяснять клиенту, как получить следующую.</p>

<h2>Два подхода</h2>
<div class="tw"><table>
<tr><th></th><th>Смещение (page / offset)</th><th>Курсор</th></tr>
<tr><td>Вид</td><td><code>?page=3&amp;limit=20</code></td><td><code>?cursor=eyJpZCI6NDJ9&amp;limit=20</code></td></tr>
<tr><td>Можно прыгнуть на страницу N</td><td>да</td><td>нет, только вперёд по цепочке</td></tr>
<tr><td>Общее количество</td><td>обычно известно</td><td>обычно нет</td></tr>
<tr><td>Устойчивость к вставкам</td><td><b>нет</b>: новая запись сдвигает всё, и элемент попадёт на две страницы или пропадёт</td><td><b>да</b>: курсор указывает на позицию в данных</td></tr>
<tr><td>Стоимость на больших смещениях</td><td>растёт: базе приходится пропускать строки</td><td>постоянная</td></tr>
<tr><td>Когда выбирать</td><td>интерфейсы с номерами страниц, небольшие наборы</td><td>ленты, экспорт, большие и живые данные</td></tr>
</table></div>
<div class="note trap"><b class="hd">Почему смещение «теряет» записи</b><p>Вы прочитали страницу 1 (записи 1–20). Пока читали, кто-то добавил запись в начало. Запрашиваете страницу 2 — и запись, бывшая двадцатой, стала двадцать первой и приедет снова. А при удалении — наоборот, одна запись будет пропущена. При обходе всей коллекции этой цепочкой ошибка накапливается.</p></div>

<h2>Как сообщать о границах</h2>
<p>Три способа, и они не исключают друг друга.</p>
<pre><code><span class="c">1 — заголовок Link (RFC 8288)</span>
<span class="h">Link</span>: &lt;https://api.example.com/users?page=3&amp;limit=2&gt;; rel="next",
      &lt;https://api.example.com/users?page=1&amp;limit=2&gt;; rel="prev",
      &lt;https://api.example.com/users?page=1&amp;limit=2&gt;; rel="first",
      &lt;https://api.example.com/users?page=2&amp;limit=2&gt;; rel="last"
<span class="h">X-Total-Count</span>: 4

<span class="c">2 — обёртка в теле</span>
{ "data": [ … ], "meta": { "page": 2, "limit": 20, "total": 4213 } }

<span class="c">3 — курсор в теле</span>
{ "data": [ … ], "next_cursor": "eyJpZCI6NDJ9" }</code></pre>
<div class="note"><b class="hd">Чем хорош Link</b><p>Клиенту не нужно уметь собирать адреса — он просто идёт по готовой ссылке <code>rel="next"</code>, пока она есть. Это тот самый принцип HATEOAS в самом полезном его проявлении. Обёртка в теле удобнее, когда клиент — интерфейс, которому нужно нарисовать номера страниц.</p></div>

<h2>Границы, которые надо задать явно</h2>
<ul>
<li><b>Значение по умолчанию</b> для <code>limit</code>: клиент, забывший параметр, не должен получить всю базу.</li>
<li><b>Максимум:</b> <code>limit=1000000</code> должен приводить к <span class="st c4">400</span>, а не к падению сервиса.</li>
<li><b>Проверка типа:</b> <code>limit=abc</code> — тоже <span class="st c4">400</span>, а не молчаливая подстановка умолчания.</li>
<li><b>Устойчивый порядок:</b> без явной сортировки база вправе вернуть строки в любом порядке, и пагинация поедет. Сортировка по уникальному полю обязательна.</li>
</ul>
<div class="note warn"><b class="hd">Что стоит проверять в тестах</b><p>Не только «первая страница пришла». Проверяйте: сумма страниц равна <code>X-Total-Count</code>; между страницами нет пересечений; последняя страница не содержит <code>rel="next"</code>; выход за последнюю страницу даёт пустой список, а не ошибку; недопустимый <code>limit</code> даёт 400.</p></div>
`,

n:8, id:"errors", title:"Тела и ошибки", sub:"Валидация и problem+json",
lede:"Как выглядит хорошее тело ошибки, чем 400 отличается от 422 и почему клиенту нужен машиночитаемый ответ.",
theory:`
<p>Ошибка — часть контракта API, а не досадная случайность. Клиент должен уметь понять из ответа: что пошло не так, по чьей вине, что делать дальше и какое именно поле виновато.</p>

<h2>Стандартный формат: problem+json</h2>
<p>RFC 9457 описывает единую форму тела ошибки. Тип содержимого — <code>application/problem+json</code>.</p>
<pre><code>HTTP/1.1 <span class="m">422</span> Unprocessable Content
<span class="h">Content-Type</span>: application/problem+json

{
  <span class="h">"type"</span>:   <span class="s">"https://api.example.com/probs/validation-failed"</span>,
  <span class="h">"title"</span>:  <span class="s">"Validation Failed"</span>,
  <span class="h">"status"</span>: <span class="m">422</span>,
  <span class="h">"detail"</span>: <span class="s">"Тело запроса не прошло проверку."</span>,
  <span class="h">"errors"</span>: [
    { <span class="h">"field"</span>: <span class="s">"email"</span>, <span class="h">"code"</span>: <span class="s">"invalid_format"</span> }
  ]
}</code></pre>
<div class="tw"><table>
<tr><th>Поле</th><th>Назначение</th></tr>
<tr><td><code>type</code></td><td>Идентификатор вида проблемы. По нему клиент ветвит логику</td></tr>
<tr><td><code>title</code></td><td>Короткое название, одинаковое для всех случаев этого типа</td></tr>
<tr><td><code>status</code></td><td>Дублирует код ответа — удобно, когда тело сохранили отдельно</td></tr>
<tr><td><code>detail</code></td><td>Подробности <em>этого</em> случая. Можно показывать человеку</td></tr>
<tr><td>любые свои</td><td>Разрешено добавлять: <code>errors</code>, <code>current_etag</code>, <code>retry_after</code></td></tr>
</table></div>

<div class="note ok"><b class="hd">Ветвиться надо по коду и type, а не по тексту</b><p><code>detail</code> — для человека: его переведут, перепишут, уточнят. Программа должна опираться на код состояния и на <code>type</code> либо <code>code</code> внутри <code>errors</code>. Клиент, разбирающий сообщение регулярным выражением, сломается на первом же улучшении формулировки.</p></div>

<h2>400 или 422</h2>
<div class="tw"><table>
<tr><th>Ситуация</th><th>Код</th></tr>
<tr><td>Тело не является корректным JSON</td><td><span class="st c4">400</span></td></tr>
<tr><td>Параметр строки запроса не разбирается: <code>limit=abc</code></td><td><span class="st c4">400</span></td></tr>
<tr><td>JSON корректен, но нет обязательного поля</td><td><span class="st c4">422</span></td></tr>
<tr><td>Значение поля недопустимо: почта без собаки</td><td><span class="st c4">422</span></td></tr>
<tr><td>Значение корректно, но конфликтует с состоянием: почта уже занята</td><td><span class="st c4">409</span></td></tr>
</table></div>
<p>Грубо: 400 — «не смог разобрать», 422 — «разобрал, но не принимаю», 409 — «принял бы, но мешает то, что уже есть».</p>

<h2>Что должно быть в хорошем ответе об ошибке</h2>
<ul>
<li><b>Все</b> ошибки сразу, а не первая попавшаяся. Иначе пользователь исправляет форму по одному полю за круг.</li>
<li><b>Машиночитаемый код</b> у каждой ошибки: <code>required</code>, <code>invalid_format</code>, <code>too_long</code>.</li>
<li><b>Указание на поле</b> — чтобы интерфейс подсветил нужный ввод.</li>
<li><b>Идентификатор запроса</b> для разбора инцидентов.</li>
</ul>
<div class="note trap"><b class="hd">Чего быть не должно</b><p>Стектрейсов, имён таблиц и SQL-запросов, внутренних адресов, полного текста исключения. Всё это — подарок атакующему и шум для клиента. Внутренние подробности идут в журнал, наружу — <code>type</code>, <code>title</code>, <code>detail</code> и идентификатор запроса, по которому вы найдёте подробности сами.</p></div>

<h2>Тела успешных ответов</h2>
<ul>
<li><b>Создание</b> возвращает созданный ресурс целиком — клиенту нужны присвоенный идентификатор и значения по умолчанию.</li>
<li><b>Обновление</b> возвращает результат: так клиент видит, что именно сохранилось, включая нормализацию.</li>
<li><b>Удаление</b> обычно ничего не возвращает: <span class="st c2">204</span>.</li>
<li><b>Коллекция</b> — массив или объект с обёрткой. Обёртка удобнее: в неё помещаются метаданные пагинации, и формат не придётся ломать позже.</li>
</ul>
`,

n:9, id:"auth", title:"Аутентификация", sub:"Basic, Bearer, области доступа",
lede:"Кто спрашивает и что ему можно. Схемы авторизации, разница между 401 и 403 и что нельзя класть в URL.",
theory:`
<p>REST не хранит состояние диалога — значит, каждый запрос обязан <b>сам</b> нести доказательство личности. Сессии на сервере не годятся: они и есть состояние.</p>

<h2>Схемы, которые встречаются</h2>
<div class="tw"><table>
<tr><th>Схема</th><th>Как выглядит</th><th>Где уместна</th></tr>
<tr><td><b>Basic</b></td><td><code>Authorization: Basic ZGVtbzpzZWNyZXQ=</code></td><td>Внутренние сервисы, стенды. Base64 — это <b>не шифрование</b>, только по HTTPS</td></tr>
<tr><td><b>Bearer</b></td><td><code>Authorization: Bearer tok_9f2c…</code></td><td>Основной способ. Токен получают отдельным запросом</td></tr>
<tr><td><b>API-ключ</b></td><td><code>X-API-Key: k_live_…</code></td><td>Межсервисное взаимодействие. Обычно не истекает — тем опаснее утечка</td></tr>
<tr><td><b>OAuth 2.0</b></td><td>протокол <em>получения</em> Bearer-токена</td><td>Когда нужно действовать от имени пользователя, не зная его пароля</td></tr>
<tr><td><b>mTLS</b></td><td>клиентский сертификат</td><td>Строго внутренние, высокодоверенные каналы</td></tr>
</table></div>
<div class="note warn"><b class="hd">Basic — это кодирование, а не шифрование</b><p><code>ZGVtbzpzZWNyZXQ=</code> расшифровывается в <code>demo:secret</code> любым онлайн-декодером. Никакой защиты сам по себе он не даёт — вся защита в HTTPS. И потому пароль улетает в каждом запросе, а не один раз.</p></div>

<h2>OAuth 2.0 в двух абзацах</h2>
<p>Задача: приложение хочет читать ваши данные в другом сервисе, но не должно узнать ваш пароль. Решение: вас перенаправляют на сервер авторизации, вы входите там, приложение получает <b>токен доступа</b> с ограниченным набором прав и сроком жизни.</p>
<p>Для API это означает: сервер проверяет токен и его <b>области доступа</b> (scopes). Область — это ответ на вопрос «что этому токену разрешено»: <code>read</code>, <code>write</code>, <code>orders:read</code>. Один и тот же пользователь с разными токенами имеет разные права.</p>

<h2>401 или 403 — решающий вопрос</h2>
<figure class="fig">
<svg viewBox="0 0 620 172" role="img" aria-label="Различие между 401 и 403">
 <g font-family="var(--fm)" font-size="10">
  <rect x="150" y="8" width="320" height="34" rx="3" fill="var(--surf3)" stroke="var(--line)"/>
  <text x="310" y="30" text-anchor="middle" fill="var(--ink)">Пришёл запрос</text>
  <path d="M310 44v14" stroke="var(--ink3)"/><path d="M310 58l-4-7h8z" fill="var(--ink3)"/>
  <rect x="150" y="60" width="320" height="34" rx="3" fill="var(--surf3)" stroke="var(--line)"/>
  <text x="310" y="82" text-anchor="middle" fill="var(--ink)">Личность установлена?</text>
  <path d="M150 77H60v33" stroke="var(--s4)" fill="none"/><path d="M60 110l-4-7h8z" fill="var(--s4)"/>
  <text x="95" y="72" font-size="9" fill="var(--s4)">нет</text>
  <path d="M470 77h90v33" stroke="var(--ink3)" fill="none"/><path d="M560 110l-4-7h8z" fill="var(--ink3)"/>
  <text x="505" y="72" font-size="9" fill="var(--ink3)">да</text>

  <rect x="0" y="112" width="180" height="46" rx="3" fill="var(--s4s)" stroke="var(--s4)"/>
  <text x="90" y="131" text-anchor="middle" font-weight="700" fill="var(--s4)">401 Unauthorized</text>
  <text x="90" y="147" text-anchor="middle" font-size="9" fill="var(--ink2)">+ WWW-Authenticate</text>

  <rect x="230" y="112" width="180" height="46" rx="3" fill="var(--surf3)" stroke="var(--line)"/>
  <text x="320" y="131" text-anchor="middle" fill="var(--ink)">Прав хватает?</text>
  <text x="320" y="147" text-anchor="middle" font-size="9" fill="var(--ink3)">нет → 403 · да → выполняем</text>

  <rect x="440" y="112" width="180" height="46" rx="3" fill="var(--s4s)" stroke="var(--s4)"/>
  <text x="530" y="131" text-anchor="middle" font-weight="700" fill="var(--s4)">403 Forbidden</text>
  <text x="530" y="147" text-anchor="middle" font-size="9" fill="var(--ink2)">повторять бессмысленно</text>
 </g>
</svg>
<figcaption>Практический признак: если после повторного входа результат изменится — это 401. Если нет — 403.</figcaption>
</figure>
<p>Ответ <span class="st c4">401</span> <b>обязан</b> нести заголовок <code>WWW-Authenticate</code> с указанием схемы. Без него клиент не знает, как именно представиться.</p>

<h2>Чего нельзя делать</h2>
<ul>
<li><b>Класть токен в строку запроса.</b> <code>?token=…</code> оседает в журналах сервера, прокси и в заголовке <code>Referer</code>. Место токена — в заголовке.</li>
<li><b>Возвращать 200 при неудачной аутентификации.</b> Клиентские библиотеки не поймут, что надо обновить токен.</li>
<li><b>Раскрывать, что именно не так.</b> «Пользователь не найден» против «неверный пароль» — подарок для перебора. Ответ один: «неверные учётные данные».</li>
<li><b>Выдавать вечные токены.</b> Ограниченный срок жизни плюс токен обновления — необходимый минимум.</li>
</ul>
<div class="note ok"><b class="hd">Что проверять в тестах на авторизацию</b><p>Запрос без токена даёт 401; с истёкшим — 401; с токеном другого пользователя — 403 или 404; с недостаточной областью — 403; токен не появляется в журналах и в адресе; после выхода старый токен перестаёт работать.</p></div>
`,
