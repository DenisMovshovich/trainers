<title>Docker Yard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#E7ECEE; --surface:#F8FAFA; --surface-2:#DDE5E7; --surface-3:#EEF3F4;
  --line:#BFCCD0; --line-soft:#D5DEE0;
  --ink:#0C1618; --ink-2:#39494D; --ink-3:#6A7C81;
  --accent:#14707C; --accent-2:#0B4D56; --accent-soft:#D0E4E7; --accent-line:#7FB4BB;
  --signal:#C4501F;
  --ok:#2C7F55; --ok-soft:#D4E8DD;
  --warn:#9C6510; --warn-soft:#F0E3C8;
  --err:#A82A20; --err-soft:#F2D9D6;
  --term-bg:#0B1416; --term-ink:#C9DBDD; --term-dim:#5F7478; --term-line:#1D2E32;
  --grid:#C7D3D6;
  --shadow:0 1px 0 rgba(12,22,24,.05), 0 8px 24px -14px rgba(12,22,24,.35);
  --radius:3px;
  --font-ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-read:"Literata",Georgia,"Times New Roman",serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0B1315; --surface:#121D20; --surface-2:#19282C; --surface-3:#162226;
    --line:#28393E; --line-soft:#1F2E32;
    --ink:#DDE9EA; --ink-2:#A3B6BA; --ink-3:#76898E;
    --accent:#4FBFC9; --accent-2:#8FD9E0; --accent-soft:#10333A; --accent-line:#2C6C75;
    --signal:#EE7A46;
    --ok:#54C08A; --ok-soft:#123227;
    --warn:#DCA13C; --warn-soft:#33280F;
    --err:#E8756A; --err-soft:#361A17;
    --term-bg:#060D0F; --term-ink:#C9DBDD; --term-dim:#5A6F73; --term-line:#16262A;
    --grid:#22343A;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1315; --surface:#121D20; --surface-2:#19282C; --surface-3:#162226;
  --line:#28393E; --line-soft:#1F2E32;
  --ink:#DDE9EA; --ink-2:#A3B6BA; --ink-3:#76898E;
  --accent:#4FBFC9; --accent-2:#8FD9E0; --accent-soft:#10333A; --accent-line:#2C6C75;
  --signal:#EE7A46;
  --ok:#54C08A; --ok-soft:#123227;
  --warn:#DCA13C; --warn-soft:#33280F;
  --err:#E8756A; --err-soft:#361A17;
  --term-bg:#060D0F; --term-ink:#C9DBDD; --term-dim:#5A6F73; --term-line:#16262A;
  --grid:#22343A;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-ui); font-size:15px; line-height:1.5;
  font-synthesis-weight:none;
}
::selection{background:var(--accent-soft); color:var(--ink)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
button{font:inherit; color:inherit}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:60;
  display:flex; align-items:center; gap:18px;
  padding:0 20px; height:56px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; flex:0 0 auto}
.brand svg{display:block}
.brand b{font-weight:800; font-size:16px; letter-spacing:-.02em}
.brand span{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); display:block; margin-top:-2px;
}
.topbar .spacer{flex:1}
.progress-wrap{display:flex; align-items:center; gap:10px; min-width:0}
.progress-label{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.06em;
  color:var(--ink-3); white-space:nowrap; font-variant-numeric:tabular-nums;
}
.progress-track{
  width:160px; height:6px; background:var(--surface-2);
  border:1px solid var(--line-soft); position:relative; overflow:hidden;
}
.progress-fill{position:absolute; inset:0 auto 0 0; width:0; background:var(--accent); transition:width .4s cubic-bezier(.2,.7,.3,1)}
.ghost-btn{
  background:none; border:1px solid var(--line); color:var(--ink-2);
  font-size:12px; font-weight:500; padding:6px 11px; cursor:pointer;
  border-radius:var(--radius); transition:.15s;
}
.ghost-btn:hover{border-color:var(--accent); color:var(--accent)}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:264px minmax(0,1fr); min-height:calc(100vh - 56px)}
.rail{
  border-right:1px solid var(--line); background:var(--surface);
  padding:18px 0 40px; position:sticky; top:56px; align-self:start;
  max-height:calc(100vh - 56px); overflow-y:auto;
}
.rail-head{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3); padding:0 20px 12px;
}
.mod-btn{
  display:grid; grid-template-columns:26px 1fr auto; gap:10px; align-items:start;
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  padding:9px 16px 9px 20px; border-left:2px solid transparent; color:var(--ink-2);
  transition:background .15s,color .15s;
}
.mod-btn:hover{background:var(--surface-3); color:var(--ink)}
.mod-btn[aria-current="true"]{background:var(--accent-soft); border-left-color:var(--accent); color:var(--ink)}
.mod-n{
  font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--ink-3);
  padding-top:2px; font-variant-numeric:tabular-nums;
}
.mod-btn[aria-current="true"] .mod-n{color:var(--accent)}
.mod-t{display:block; font-size:13.5px; font-weight:600; line-height:1.3; letter-spacing:-.005em}
.mod-s{display:block; font-size:11.5px; color:var(--ink-3); font-weight:400; margin-top:1px; line-height:1.3}
.mod-dots{display:flex; gap:3px; padding-top:5px}
.dot{width:5px; height:5px; border-radius:50%; background:var(--line); }
.dot.on{background:var(--ok)}
.rail-foot{padding:16px 20px 0; margin-top:14px; border-top:1px solid var(--line-soft)}

/* ---------- stage ---------- */
.stage{padding:0 0 80px; min-width:0}
.stage-head{padding:34px 40px 0; max-width:1180px}
.eyebrow{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); margin-bottom:8px;
}
h1.mtitle{
  font-size:clamp(28px,3.4vw,40px); font-weight:800; letter-spacing:-.028em;
  margin:0 0 6px; line-height:1.08; text-wrap:balance;
}
.mlede{font-size:16px; color:var(--ink-2); max-width:62ch; margin:0}

.tabs{
  display:flex; gap:0; margin:26px 0 0; padding:0 40px;
  border-bottom:1px solid var(--line); max-width:1180px;
}
.tab{
  background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  padding:11px 2px; margin-right:26px; font-size:13.5px; font-weight:600;
  color:var(--ink-3); display:flex; align-items:center; gap:7px; transition:.15s;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tab .badge{
  font-family:var(--font-mono); font-size:10px; font-weight:700; padding:1px 5px;
  background:var(--surface-2); color:var(--ink-3); border-radius:2px;
  font-variant-numeric:tabular-nums;
}
.tab[aria-selected="true"] .badge{background:var(--accent-soft); color:var(--accent)}
.tab .badge.done{background:var(--ok-soft); color:var(--ok)}
.panel{padding:30px 40px 0; max-width:1180px}
.panel[hidden]{display:none}

/* ---------- theory ---------- */
.theory{font-family:var(--font-read); font-size:16.5px; line-height:1.68; max-width:68ch; color:var(--ink)}
.theory p{margin:0 0 1.05em}
.theory h2{
  font-family:var(--font-ui); font-size:20px; font-weight:700; letter-spacing:-.018em;
  margin:2.1em 0 .7em; padding-top:.6em; border-top:1px solid var(--line-soft); text-wrap:balance;
}
.theory h2:first-child{margin-top:0; border-top:0; padding-top:0}
.theory h3{font-family:var(--font-ui); font-size:15.5px; font-weight:700; margin:1.7em 0 .5em; letter-spacing:-.01em}
.theory ul,.theory ol{margin:0 0 1.05em; padding-left:1.35em}
.theory li{margin-bottom:.4em}
.theory li::marker{color:var(--accent)}
.theory strong{font-weight:600}
.theory em{font-style:italic; color:var(--ink-2)}
.theory a{color:var(--accent); text-underline-offset:2px}
code{
  font-family:var(--font-mono); font-size:.85em; background:var(--surface-2);
  padding:.12em .38em; border-radius:2px; color:var(--ink);
  border:1px solid var(--line-soft); white-space:nowrap;
}
.theory pre{
  font-family:var(--font-mono); font-size:12.5px; line-height:1.62;
  background:var(--term-bg); color:var(--term-ink); padding:14px 16px;
  overflow-x:auto; margin:0 0 1.2em; border-radius:var(--radius);
  border:1px solid var(--term-line);
}
.theory pre code{background:none; border:0; padding:0; font-size:inherit; color:inherit; white-space:pre}
.theory pre .c{color:var(--term-dim)}
.theory pre .k{color:#7FD6DF}
.theory pre .s{color:#E8A87C}

.callout{
  font-family:var(--font-ui); font-size:14px; line-height:1.55;
  border-left:3px solid var(--accent); background:var(--surface);
  padding:13px 16px; margin:0 0 1.3em; border-radius:0 var(--radius) var(--radius) 0;
  border-top:1px solid var(--line-soft); border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
}
.callout b{display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  font-family:var(--font-mono); color:var(--accent); margin-bottom:5px; font-weight:700}
.callout.warn{border-left-color:var(--warn)} .callout.warn b{color:var(--warn)}
.callout.trap{border-left-color:var(--signal)} .callout.trap b{color:var(--signal)}
.callout p{margin:0 0 .6em} .callout p:last-child{margin:0}
.callout ul{margin:.4em 0 0; padding-left:1.2em}

.fig{margin:0 0 1.6em; max-width:100%}
.fig svg{display:block; width:100%; height:auto}
.fig figcaption{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-3);
  margin-top:9px; letter-spacing:.02em; line-height:1.45;
}
.tbl-wrap{overflow-x:auto; margin:0 0 1.4em; border:1px solid var(--line); border-radius:var(--radius)}
table.t{border-collapse:collapse; width:100%; font-family:var(--font-ui); font-size:13.5px; min-width:480px}
table.t th{
  text-align:left; font-weight:700; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  font-family:var(--font-mono); color:var(--ink-3); padding:9px 13px;
  background:var(--surface-3); border-bottom:1px solid var(--line);
}
table.t td{padding:9px 13px; border-bottom:1px solid var(--line-soft); vertical-align:top; line-height:1.45}
table.t tr:last-child td{border-bottom:0}
table.t code{white-space:nowrap}

/* ---------- quiz ---------- */
.quiz{max-width:760px}
.q-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px 22px; margin-bottom:14px;
}
.q-num{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; color:var(--ink-3);
  text-transform:uppercase; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;
}
.q-text{font-size:15.5px; font-weight:600; line-height:1.45; margin:0 0 14px; letter-spacing:-.008em}
.q-text code{font-weight:400}
.opts{display:flex; flex-direction:column; gap:7px}
.opt{
  display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%;
  background:var(--surface-3); border:1px solid var(--line-soft); border-radius:var(--radius);
  padding:10px 13px; cursor:pointer; font-size:14px; line-height:1.45; transition:.12s;
}
.opt:hover:not(:disabled){border-color:var(--accent-line); background:var(--surface)}
.opt:disabled{cursor:default}
.opt .mk{
  font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--ink-3);
  border:1px solid var(--line); width:19px; height:19px; display:grid; place-items:center;
  flex:0 0 auto; margin-top:1px; border-radius:2px;
}
.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .mk{border-color:var(--ok); color:var(--ok)}
.opt.wrong{border-color:var(--err); background:var(--err-soft)}
.opt.wrong .mk{border-color:var(--err); color:var(--err)}
.why{
  margin-top:13px; font-size:13.5px; line-height:1.55; color:var(--ink-2);
  border-left:2px solid var(--line); padding-left:12px;
}
.why b{color:var(--ink); font-weight:600}
.why.good{border-left-color:var(--ok)} .why.bad{border-left-color:var(--err)}
.quiz-score{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  border:1px solid var(--line); background:var(--surface); border-radius:var(--radius);
  padding:15px 18px; margin-bottom:20px;
}
.quiz-score .big{font-size:26px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.quiz-score p{margin:0; font-size:13px; color:var(--ink-2)}

/* ---------- labs ---------- */
.lab-picker{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px}
.lab-chip{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-2);
  display:flex; align-items:center; gap:7px; transition:.14s;
}
.lab-chip:hover{border-color:var(--accent-line); color:var(--ink)}
.lab-chip[aria-current="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.lab-chip .tick{width:14px; height:14px; flex:0 0 auto}
.lab-chip .tick circle{fill:none; stroke:var(--line); stroke-width:1.5}
.lab-chip.done .tick circle{fill:var(--ok); stroke:var(--ok)}
.lab-chip.done .tick path{stroke:var(--surface); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round}

.lab-grid{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr); gap:18px; align-items:start}
.lab-grid > *{min-width:0}
.lab-brief{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; margin-bottom:14px;
}
.lab-brief h3{margin:0 0 9px; font-size:17px; font-weight:700; letter-spacing:-.015em}
.lab-brief p{margin:0 0 .8em; font-size:14.5px; line-height:1.55; color:var(--ink-2)}
.lab-brief p:last-child{margin-bottom:0}
.lab-brief ul{margin:0 0 .8em; padding-left:1.25em; font-size:14.5px; line-height:1.55; color:var(--ink-2)}
.lab-brief li{margin-bottom:.3em}
.lab-brief li::marker{color:var(--accent)}
.lab-brief code{white-space:normal}
.lab-tools{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; padding-top:13px; border-top:1px solid var(--line-soft)}

.term{
  background:var(--term-bg); border:1px solid var(--term-line); border-radius:var(--radius);
  overflow:hidden; display:flex; flex-direction:column; min-height:420px; min-width:0;
}
.term-bar{
  display:flex; align-items:center; gap:9px; padding:8px 12px;
  border-bottom:1px solid var(--term-line); background:rgba(255,255,255,.02);
}
.term-bar .lamp{width:8px; height:8px; border-radius:50%; background:var(--term-dim); opacity:.5}
.term-bar .ttl{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--term-dim); margin-left:4px;
}
.term-bar .right{margin-left:auto; font-family:var(--font-mono); font-size:10.5px; color:var(--term-dim)}
.term-out{
  flex:1; overflow-y:auto; padding:12px 14px; font-family:var(--font-mono);
  font-size:12.5px; line-height:1.55; color:var(--term-ink); white-space:pre;
  overflow-x:auto; max-height:52vh; min-height:300px; min-width:0;
}
.term-out .cmd{color:#7FD6DF}
.term-out .cmd .pfx{color:var(--term-dim)}
.term-out .err{color:#F08C7E}
.term-out .ok{color:#7FCF9F}
.term-out .dim{color:var(--term-dim)}
.term-out .warn{color:#E5BB63}
.term-in{display:flex; align-items:center; gap:8px; border-top:1px solid var(--term-line); padding:9px 14px}
.term-in .pfx{font-family:var(--font-mono); font-size:12.5px; color:#7FD6DF; flex:0 0 auto}
.term-in input{
  flex:1; background:none; border:0; outline:none; color:var(--term-ink);
  font-family:var(--font-mono); font-size:12.5px; padding:0; min-width:0;
}
.term-in input::placeholder{color:var(--term-dim)}

.side{display:flex; flex-direction:column; gap:14px; position:sticky; top:70px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.card-head{
  display:flex; align-items:center; gap:8px; padding:9px 14px; border-bottom:1px solid var(--line-soft);
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
}
.card-head .count{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink-3)}
.card-body{padding:13px 14px}
.checks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px}
.checks li{display:grid; grid-template-columns:17px 1fr; gap:10px; font-size:13px; line-height:1.42; color:var(--ink-2)}
.checks li.on{color:var(--ink)}
.checks .bx{
  width:15px; height:15px; border:1.5px solid var(--line); border-radius:2px; margin-top:1px;
  display:grid; place-items:center; transition:.2s;
}
.checks li.on .bx{background:var(--ok); border-color:var(--ok)}
.checks .bx svg{opacity:0; transition:.2s} .checks li.on .bx svg{opacity:1}
.checks code{font-size:12px}
.lab-done[hidden]{display:none}
.lab-done{
  display:flex; align-items:center; gap:10px; padding:11px 14px;
  background:var(--ok-soft); border-top:1px solid var(--ok); color:var(--ok);
  font-size:13px; font-weight:600;
}

.vizbar{display:flex; gap:0; border-bottom:1px solid var(--line-soft); padding:0 14px; background:var(--surface-3)}
.vizbar button{
  background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); padding:9px 0; margin-right:18px; transition:.14s;
}
.vizbar button:hover{color:var(--ink)}
.vizbar button[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent)}
.viz{padding:0; overflow-x:auto; background:var(--surface)}
.viz svg{display:block; width:100%; height:auto}
.viz-empty{
  padding:34px 16px; text-align:center; color:var(--ink-3);
  font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em; line-height:1.6;
}
.statelist{font-family:var(--font-mono); font-size:11.5px; line-height:1.7}
.statelist .row{display:flex; gap:9px; padding:3px 0; border-bottom:1px solid var(--line-soft)}
.statelist .row:last-child{border-bottom:0}
.statelist .row span:first-child{color:var(--ink-3); flex:0 0 86px}
.statelist .grp{
  font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent);
  margin:11px 0 3px; font-weight:700;
}
.statelist .grp:first-child{margin-top:0}

.hintbox{
  font-size:13.5px; line-height:1.55; color:var(--ink-2); background:var(--surface-3);
  border:1px dashed var(--line); border-radius:var(--radius); padding:12px 14px; margin-top:12px;
}
.hintbox code{background:var(--surface)}
.cheat{
  font-family:var(--font-mono); font-size:11.5px; line-height:1.85; color:var(--ink-2);
  max-height:230px; overflow-y:auto;
}
.cheat b{color:var(--accent); font-weight:700}

.done-banner{
  display:flex; gap:14px; align-items:center; padding:16px 20px; margin-bottom:20px;
  border:1px solid var(--ok); background:var(--ok-soft); border-radius:var(--radius);
}
.done-banner strong{font-size:15px; display:block; margin-bottom:2px}
.done-banner p{margin:0; font-size:13px; color:var(--ink-2)}

.navfoot{
  display:flex; justify-content:space-between; gap:14px; align-items:center;
  padding:26px 40px 0; max-width:1180px; margin-top:34px; border-top:1px solid var(--line);
}
.navfoot button{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 16px; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--ink);
  display:flex; align-items:center; gap:9px; transition:.14s; text-align:left;
}
.navfoot button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.navfoot button:disabled{opacity:.35; cursor:default}
.navfoot .sub{display:block; font-size:11px; font-weight:400; color:var(--ink-3)}

.act{
  background:var(--accent); border:1px solid var(--accent); color:var(--surface);
  border-radius:var(--radius); padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;
  transition:.14s;
}
:root[data-theme="dark"] .act, :root:not([data-theme="light"]) .act{color:var(--ground)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .act{color:#fff}}
.act:hover{background:var(--accent-2); border-color:var(--accent-2)}
.mini{
  background:var(--surface-3); border:1px solid var(--line); color:var(--ink-2);
  border-radius:var(--radius); padding:6px 11px; font-size:12px; font-weight:500; cursor:pointer; transition:.14s;
}
.mini:hover{border-color:var(--accent); color:var(--accent)}
.mini.mono{font-family:var(--font-mono); font-size:11.5px}

.fileview{font-family:var(--font-mono); font-size:11.5px; line-height:1.6; max-height:260px; overflow:auto}
.fileview .fname{color:var(--accent); font-weight:700; margin:9px 0 2px}
.fileview .fname:first-child{margin-top:0}
.fileview pre{margin:0; white-space:pre-wrap; color:var(--ink-2); word-break:break-word}

@media (max-width:1080px){
  .lab-grid{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{
    position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line);
    display:flex; overflow-x:auto; padding:10px 12px; gap:8px;
  }
  .rail-head,.rail-foot{display:none}
  .mod-btn{
    grid-template-columns:auto; width:auto; flex:0 0 auto; border-left:0; border-bottom:2px solid transparent;
    padding:7px 12px; background:var(--surface-3); border-radius:var(--radius);
  }
  .mod-btn[aria-current="true"]{border-bottom-color:transparent}
  .mod-s,.mod-dots{display:none}
  .mod-t{white-space:nowrap; font-size:12.5px}
  .stage-head,.tabs,.panel,.navfoot{padding-left:18px; padding-right:18px}
  .theory{font-size:16px}
  .topbar{padding:0 14px; gap:12px}
  .progress-track{width:80px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
