<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Разбор набора UI-автотестов на C# и Playwright: каждый файл, класс, свойство и метод.">
<title>C# + Playwright</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@600;700;800&family=Fira+Code:wght@400;500;600&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --paper:#ECEFEB; --surf:#FAFBF9; --surf2:#DFE4DD; --surf3:#F3F5F1;
  --line:#C3CCC0; --line2:#DBE1D8;
  --ink:#101613; --ink2:#3D4A44; --ink3:#6B7A72;
  --moss:#1F6F4E; --moss2:#155238; --moss-s:#D7E8DE; --moss-l:#8CBFA6;
  --brass:#8A6410; --brass-s:#F0E6CE;
  --azure:#2A5FA8; --azure-s:#DAE4F3;
  --plum:#8B3A62; --plum-s:#F0DCE7;
  --red:#A32A28; --red-s:#F3DBDA;
  --code-bg:#121915; --code-ink:#DCE5DF; --code-dim:#6B7C73; --code-line:#22302A;
  --c-kw:#8CD9AF; --c-str:#D8AC72; --c-att:#7FBBD9; --c-num:#C79BD4;
  --r:2px;
  --fd:"Chivo",system-ui,sans-serif;
  --fs:"Fira Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --fm:"Fira Code",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C110F; --surf:#151C18; --surf2:#1E2723; --surf3:#18201C;
  --line:#2C3832; --line2:#222D28;
  --ink:#E3EAE5; --ink2:#AEBCB5; --ink3:#7F8F87;
  --moss:#4FC08D; --moss2:#7FD6AF; --moss-s:#122E22; --moss-l:#2F6B51;
  --brass:#D3A24A; --brass-s:#2E2412;
  --azure:#77A6E8; --azure-s:#132338;
  --plum:#D986B0; --plum-s:#301A26;
  --red:#E5736F; --red-s:#33191A;
  --code-bg:#080C0A; --code-ink:#DCE5DF; --code-dim:#66766D; --code-line:#1B2620;
}}
:root[data-theme="dark"]{
  --paper:#0C110F; --surf:#151C18; --surf2:#1E2723; --surf3:#18201C;
  --line:#2C3832; --line2:#222D28;
  --ink:#E3EAE5; --ink2:#AEBCB5; --ink3:#7F8F87;
  --moss:#4FC08D; --moss2:#7FD6AF; --moss-s:#122E22; --moss-l:#2F6B51;
  --brass:#D3A24A; --brass-s:#2E2412;
  --azure:#77A6E8; --azure-s:#132338;
  --plum:#D986B0; --plum-s:#301A26;
  --red:#E5736F; --red-s:#33191A;
  --code-bg:#080C0A; --code-ink:#DCE5DF; --code-dim:#66766D; --code-line:#1B2620;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fs);font-size:14.5px;line-height:1.5}
::selection{background:var(--moss-s);color:var(--ink)}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
button{font:inherit;color:inherit}
input{font:inherit}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:14px;height:50px;
  padding:0 16px;background:var(--surf);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.brand b{font-family:var(--fd);font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand i{font-family:var(--fm);font-style:normal;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);display:block;margin-top:-3px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tb{background:none;border:1px solid transparent;border-radius:var(--r);padding:5px 10px;font-size:12.5px;
  font-weight:500;color:var(--ink3);cursor:pointer;white-space:nowrap;transition:.13s}
.tb:hover{color:var(--ink);background:var(--surf3)}
.tb[aria-selected="true"]{background:var(--moss-s);border-color:var(--moss-l);color:var(--ink)}
.sp{flex:1}
.find{position:relative;width:250px}
.find input{width:100%;background:var(--surf3);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 10px 6px 27px;font-size:12.5px;color:var(--ink);outline:none}
.find input:focus{border-color:var(--moss);background:var(--surf)}
.find svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);opacity:.5}

/* ---------- каркас ---------- */
.wrap{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 50px)}
.tree{border-right:1px solid var(--line);background:var(--surf);position:sticky;top:50px;align-self:start;
  max-height:calc(100vh - 50px);overflow-y:auto;padding:10px 0 40px}
.tree-h{font-family:var(--fm);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);
  padding:4px 14px 8px;display:flex;align-items:center;gap:6px}
.tree-h span{margin-left:auto;text-transform:none;letter-spacing:0}
.node{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;
  cursor:pointer;padding:3px 12px;color:var(--ink2);font-size:12.5px;transition:background .12s}
.node:hover{background:var(--surf3);color:var(--ink)}
.node[aria-current="true"]{background:var(--moss-s);color:var(--ink);font-weight:500}
.node .ic{width:13px;flex:0 0 auto;opacity:.75}
.node .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--fm);font-size:11.5px}
.node .bd{margin-left:auto;font-family:var(--fm);font-size:9.5px;color:var(--ink3);flex:0 0 auto}
.node.dir{font-weight:600;color:var(--ink)}
.node.dir .nm{font-family:var(--fs);font-size:12.5px}

/* ---------- центральная область ---------- */
.main{padding:0 0 80px;min-width:0}
.pane{padding:22px 26px 0;max-width:1120px}
.pane[hidden]{display:none}
.fh{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
.fp{font-family:var(--fm);font-size:11.5px;color:var(--ink3);margin-bottom:6px;word-break:break-all}
h1{font-family:var(--fd);font-size:26px;font-weight:800;letter-spacing:-.018em;margin:0 0 8px;line-height:1.12}
.role{display:inline-block;font-family:var(--fm);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:2px 7px;border-radius:var(--r);margin-bottom:9px}
.role.page{background:var(--moss-s);color:var(--moss)}
.role.test{background:var(--azure-s);color:var(--azure)}
.role.infra{background:var(--plum-s);color:var(--plum)}
.role.cfg{background:var(--brass-s);color:var(--brass)}
.role.doc{background:var(--surf2);color:var(--ink3)}
.why{font-size:15px;line-height:1.6;color:var(--ink2);max-width:74ch;margin:0 0 10px}
.why b{color:var(--ink);font-weight:600}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--fm);font-size:10.5px;color:var(--ink3);margin-top:12px}
.meta b{color:var(--ink2);font-weight:500}

h2{font-family:var(--fd);font-size:17px;font-weight:700;margin:26px 0 10px;letter-spacing:-.008em}
h2:first-child{margin-top:0}
h3{font-family:var(--fd);font-size:14px;font-weight:600;margin:18px 0 7px}
p{margin:0 0 .9em}
code{font-family:var(--fm);font-size:.86em;background:var(--surf2);padding:.08em .3em;border-radius:2px;
  border:1px solid var(--line2);overflow-wrap:anywhere}
.prose{max-width:76ch;font-size:14.5px;line-height:1.62;color:var(--ink2)}
.prose b,.prose strong{color:var(--ink);font-weight:600}
.prose ul,.prose ol{margin:0 0 1em;padding-left:1.3em}
.prose li{margin-bottom:.35em}
.prose li::marker{color:var(--moss)}

pre{font-family:var(--fm);font-size:12px;line-height:1.6;background:var(--code-bg);color:var(--code-ink);
  padding:12px 14px;overflow-x:auto;margin:0 0 1.2em;border-radius:var(--r);border:1px solid var(--code-line)}
pre code{background:none;border:0;padding:0;color:inherit;white-space:pre;font-size:inherit}
.kw{color:var(--c-kw)} .str{color:var(--c-str)} .att{color:var(--c-att)} .cm{color:var(--code-dim)} .num{color:var(--c-num)}

.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card-h .cn{font-family:var(--fm);font-size:13.5px;font-weight:600}
.card-h .cx{margin-left:auto;font-family:var(--fm);font-size:10px;color:var(--ink3)}
.card-b{padding:13px 14px}

.chips{display:flex;gap:5px;flex-wrap:wrap}
.mod{font-family:var(--fm);font-size:10px;padding:1.5px 6px;border-radius:2px;cursor:help;border:1px solid transparent}
.mod.public{background:var(--moss-s);color:var(--moss);border-color:var(--moss-l)}
.mod.private{background:var(--red-s);color:var(--red)}
.mod.internal{background:var(--azure-s);color:var(--azure)}
.mod.protected{background:var(--plum-s);color:var(--plum)}
.mod.other{background:var(--surf2);color:var(--ink3);border-color:var(--line2)}
.attr{font-family:var(--fm);font-size:10px;padding:1.5px 6px;border-radius:2px;background:var(--brass-s);
  color:var(--brass);cursor:help}

.grp{margin-bottom:14px}
.grp-h{display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--line2)}
.grp-h .n{margin-left:auto;letter-spacing:0}
.mem{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:baseline;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--line2);padding:6px 4px;cursor:pointer;transition:background .12s}
.mem:last-child{border-bottom:0}
.mem:hover{background:var(--surf3)}
.mem[aria-current="true"]{background:var(--moss-s)}
.mem .sig{font-family:var(--fm);font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem .sig .ty{color:var(--ink3)}
.mem .sig .nmm{font-weight:600}
.mem .hint{font-size:11.5px;color:var(--ink3);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}

/* ---------- инспектор ---------- */
.insp{position:fixed;right:0;bottom:0;width:min(560px,100%);max-height:64vh;z-index:70;
  background:var(--surf);border-left:1px solid var(--line);border-top:1px solid var(--line);
  box-shadow:0 -8px 30px -16px rgba(0,0,0,.45);display:flex;flex-direction:column}
.insp[hidden]{display:none}
.insp-h{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.insp-h .t{font-family:var(--fm);font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp-h .x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:var(--r);
  padding:3px 8px;font-size:11px;cursor:pointer;color:var(--ink3)}
.insp-h .x:hover{border-color:var(--moss);color:var(--moss)}
.insp-b{overflow-y:auto;padding:13px;font-size:13px;line-height:1.55}
.insp-b .sec{margin-bottom:13px}
.insp-b .sec:last-child{margin-bottom:0}
.insp-b .lb{font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.insp-b p{margin:0 0 .55em;color:var(--ink2)}
.insp-b pre{font-size:11.5px;margin-bottom:.6em}
.dec{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;font-size:12.5px}
.dec .k{font-family:var(--fm);font-size:11.5px;color:var(--moss);white-space:nowrap}
.dec .v{color:var(--ink2)}

/* ---------- схемы ---------- */
.fig{margin:0 0 20px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-family:var(--fm);font-size:10.5px;color:var(--ink3);margin-top:8px;line-height:1.5}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th{text-align:left;font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);padding:8px 12px;background:var(--surf3);border-bottom:1px solid var(--line)}
td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.45}
tr:last-child td{border-bottom:0}

.note{border:1px solid var(--line2);border-left:3px solid var(--moss);background:var(--surf);
  padding:11px 14px;margin:0 0 1.2em;border-radius:0 var(--r) var(--r) 0;font-size:13.5px;line-height:1.55;max-width:76ch}
.note b.h{display:block;font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--moss);margin-bottom:4px}
.note.warn{border-left-color:var(--brass)} .note.warn b.h{color:var(--brass)}
.note.trap{border-left-color:var(--red)} .note.trap b.h{color:var(--red)}
.note p:last-child{margin:0}

.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.fb{background:var(--surf3);border:1px solid var(--line);border-radius:var(--r);padding:4px 9px;
  font-family:var(--fm);font-size:11px;cursor:pointer;color:var(--ink3)}
.fb:hover{border-color:var(--moss-l);color:var(--ink)}
.fb[aria-pressed="true"]{background:var(--moss-s);border-color:var(--moss);color:var(--ink)}

.hits{display:flex;flex-direction:column;gap:6px}
.hit{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 12px;cursor:pointer}
.hit:hover{border-color:var(--moss)}
.hit .a{font-family:var(--fm);font-size:12px;font-weight:600}
.hit .b{font-family:var(--fm);font-size:10.5px;color:var(--ink3);margin-top:2px}
.hit mark{background:var(--moss-s);color:var(--ink);padding:0 2px}

@media (max-width:1000px){
  /* шапка в две строки: вкладки уезжали за экран и не кликались */
  .top{height:auto;flex-wrap:wrap;padding:8px 13px;gap:9px}
  .tabs{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{height:3px}
  .tb{flex:0 0 auto}
  .sp{display:none}
  .find{flex:1;min-width:120px}
  .tree{top:0}
  .wrap{grid-template-columns:minmax(0,1fr)}
  .tree{position:static;max-height:260px;border-right:0;border-bottom:1px solid var(--line)}
  .pane{padding:18px 15px 0}
  .insp{width:100%;max-height:70vh}
  .find{width:150px}
  .brand i{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <span class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <rect x="2" y="2" width="18" height="18" rx="2" fill="none" stroke="var(--moss)" stroke-width="1.3"/>
      <path d="M6 7h5M6 11h9M6 15h7" stroke="var(--moss-l)" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="16.5" cy="7" r="1.6" fill="var(--brass)"/>
    </svg>
    <span><b>C# + Playwright</b><i>разбор набора UI-автотестов</i></span>
  </span>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="sp"></div>
  <div class="find">
    <svg width="12" height="12" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9.4 9.4L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="q" type="text" placeholder="Найти файл, класс, член…" aria-label="Поиск" autocomplete="off">
  </div>
</header>

<div class="wrap">
  <nav class="tree" id="tree" aria-label="Файлы проекта">
    <div class="tree-h">Portal <span id="treeStat"></span></div>
    <div id="treeBody"></div>
  </nav>
  <main class="main">
    <section class="pane" id="paneFile"></section>
    <section class="pane" id="paneView" hidden></section>
    <section class="pane" id="paneFind" hidden></section>
  </main>
</div>

<aside class="insp" id="insp" hidden aria-label="Инспектор">
  <div class="insp-h"><span class="t" id="inspT"></span><button class="x" id="inspX">Закрыть</button></div>
  <div class="insp-b" id="inspB"></div>
</aside>

const NOTES = {

"Portal.csproj":{role:"cfg",t:"Файл проекта",
 why:"Описывает, чем является этот каталог с точки зрения .NET: библиотека на net8.0, которую можно собрать и запустить как набор тестов. Здесь же перечислены шесть пакетов NuGet, на которых всё держится.",
 how:`<p>Ключевые строки и что они означают:</p>
 <ul>
 <li><code>Microsoft.NET.Test.Sdk</code> — превращает проект в <b>тестовый</b>. Без него <code>dotnet test</code> для него бессмыслен.</li>
 <li><code>NUnit3TestAdapter</code> — переходник между движком VSTest и фреймворком NUnit. Без него тесты компилируются, но не находятся.</li>
 <li><code>Microsoft.Playwright.NUnit</code> — даёт базовый класс <code>PageTest</code>, от которого наследуется <code>BaseTest</code>.</li>
 <li><code>NunitXml.TestLogger</code> — второй формат отчёта. Нужен, потому что TRX не переносит <code>[Property]</code> и <code>[Category]</code>, а выгрузке в Xray они необходимы.</li>
 <li><code>ReportPortal.NUnit</code> — сам подключается к прогону и отправляет результаты, без единой строки кода в проекте.</li>
 <li><code>&lt;None Update="ReportPortal.json"&gt;</code> с <code>CopyToOutputDirectory</code> — кладёт конфигурацию рядом со сборкой, иначе библиотека её не найдёт.</li>
 </ul>`},

"ReportPortal.json":{role:"cfg",t:"Настройка отчётов",
 why:"Куда пакет ReportPortal.NUnit отправляет результаты прогона. Читается автоматически из выходного каталога — в коде на него никто не ссылается.",
 how:`<p>Задаёт адрес сервера, проект <code>WEB</code>, имя запуска <code>SPACES_AUTOMATION_TESTS</code> и ключ API.</p>
 <div class="note trap"><b class="h">Действующий секрет в репозитории</b><p>Ключ API лежит здесь открытым текстом и попал в историю git. Локальные прогоны отключаются переменной <code>RP_ENABLED=false</code> — библиотека принимает префикс <code>RP_</code> поверх любого ключа конфигурации.</p></div>`},

"azure-portal-automation-build-pipeline.yml":{role:"cfg",t:"Конвейер сборки",
 why:"Описание пайплайна Azure DevOps: две стадии на разных агентах — сборка в облаке, прогон тестов на приватном агенте, у которого есть доступ к UAT-стендам.",
 how:`<ul>
 <li><code>trigger: none</code> — автозапуска нет, только вручную.</li>
 <li>Стадия Build собирает <code>-c Release</code> и упаковывает <code>bin/</code> в артефакт.</li>
 <li>Стадия Test скачивает артефакт, восстанавливает права (<code>chmod +x</code>), ставит браузеры через <code>playwright.ps1</code> и запускает <b>по .dll</b>, а не по csproj — пересобирать нечего.</li>
 <li>Два логгера: TRX для Azure DevOps и NUnit XML для выгрузки в Xray.</li>
 </ul>
 <div class="note warn"><b class="h">Зелёный конвейер ≠ зелёные тесты</b><p><code>continueOnError: true</code> и <code>failTaskOnFailedTests: false</code> вместе означают, что падение тестов не красит сборку. Результат смотреть в отчёте.</p></div>`},

"Scripts/import-xray-results.sh":{role:"cfg",t:"Выгрузка в Xray",
 why:"Разбирает NUnit XML после прогона и заливает результаты в Xray Cloud. Вызывается последним шагом пайплайна, только если параметр xrayTestExecutionKey не равен «skip».",
 how:`<ul>
 <li>Парсит XML <b>чистым bash</b> — без xmllint и jq, чтобы не тянуть зависимости на агент. Требует bash 4+, на системном <code>/bin/bash</code> версии 3.2 в macOS не запустится.</li>
 <li>Сопоставляет тест с ключом Xray по атрибуту <code>[Property("XrayTest", "QAT-…")]</code>. Именно поэтому нужен NUnit XML: TRX эти свойства теряет.</li>
 <li>Ни один путь ошибки не возвращает ненулевой код — сбой выгрузки никогда не роняет сборку.</li>
 <li>Xray принимает только слова <code>PASSED</code>/<code>FAILED</code> целиком; <code>PASS</code>/<code>FAIL</code> молча превращаются в TODO.</li>
 </ul>`},

"CLAUDE.md":{role:"doc",t:"Контекст проекта",
 why:"Внутренняя документация: устройство, договорённости, особенности сайта Portal и накопленные наблюдения. Самый насыщенный документ репозитория — 719 строк.",
 how:`<p>Здесь описаны вещи, которых не видно из кода: поведение WAF Incapsula, хеш-параметры формы, устройство подквиза, известные ловушки в селекторах. Файл читается перед правкой любого теста.</p>
 <div class="note"><b class="h">Числа в документе устаревают</b><p>Счётчики тестов в документации сдвигаются с каждым коммитом. В корне репозитория для этого заведён навык <code>docs-audit</code>, который пересчитывает их по дереву.</p></div>`},

"README.md":{role:"doc",t:"Инструкция по запуску",
 why:"Как запустить тесты Portal локально: переменные окружения, команды, фильтры, режим с видимым браузером.",
 how:`<p>Ключевое из него: <code>BASIC_AUTH_USERNAME</code> и <code>BASIC_AUTH_PASSWORD</code> обязательны — без них <code>TestConfig</code> бросает исключение и падает весь прогон. Локальные запуски делаются с <code>RP_ENABLED=false</code>, чтобы не засорять ReportPortal.</p>`},

/* ---------------- инфраструктура ---------------- */

"Config/TestConfig.cs":{role:"infra",t:"Конфигурация прогона",
 why:"Единственный источник внешних настроек: адрес стенда и учётные данные Basic Auth. Всё приходит из переменных окружения, ничего не читается из файлов.",
 how:`<p>Класс <b>статический</b> — экземпляр создать нельзя, обращение всегда через имя типа: <code>TestConfig.BaseUrl</code>. Все члены — свойства с телом-выражением (<code>=&gt;</code>), а не поля. Разница принципиальная: <b>значение вычисляется при каждом обращении</b>, поэтому переменную окружения можно поменять и это подхватится, тогда как поле застыло бы на значении, прочитанном при первой загрузке типа.</p>`,
 mem:{
  BaseUrl:"Адрес стенда. Оператор <code>??</code> подставляет UAT, если переменная <code>SPACES_URL</code> не задана. Обратите внимание: в умолчании нет сегмента <code>/en</code> — локаль дописывают сами страницы.",
  Browser:"<b>Мёртвый код.</b> Ни один файл проекта к этому свойству не обращается. Браузер выбирает адаптер Playwright, читая переменную <code>BROWSER</code> напрямую.",
  Headless:"<b>Мёртвый код</b>, как и <code>Browser</code>. Режим окна определяет переменная <code>HEADED</code>, которую читает адаптер. Переменная <code>HEADLESS</code> из этой строки ни на что не влияет.",
  BasicAuthUsername:"Здесь вместо умолчания стоит <code>?? throw</code>. Это осознанно: отсутствие учётных данных обрушивает прогон сразу и с внятным текстом, вместо сотни непонятных падений на шагах авторизации. HQ и Vertex2025 в этом месте подставляют зашитые в код значения — Portal показывает правильный вариант.",
  BasicAuthPassword:"То же, что и логин: при отсутствии переменной бросается <code>InvalidOperationException</code>. Исключение возникает при создании контекста браузера, то есть до первого шага любого теста."
 }},

"Tests/BaseTest.cs":{role:"infra",t:"Базовый класс всех фикстур",
 why:"Общий предок для всех 32 тестовых классов. Задаёт настройки контекста браузера, одинаковые для каждого теста: адрес, размер окна и Basic Auth.",
 how:`<p>Наследуется от <code>PageTest</code> из пакета <code>Microsoft.Playwright.NUnit</code>. Именно <code>PageTest</code> даёт наследникам готовые <code>Page</code>, <code>Context</code>, <code>Browser</code> и метод <code>Expect()</code> — в тестах они появляются «из воздуха» именно отсюда.</p>
 <div class="note"><b class="h">Что важно понять про изоляцию</b><p><code>PageTest</code> создаёт <b>новый контекст браузера и новую страницу на каждый тест</b>. Поэтому куки, локальное хранилище и состояние формы не перетекают между тестами, и порядок выполнения не имеет значения.</p></div>
 <div class="note warn"><b class="h">Ни [SetUp], ни [TearDown] здесь нет</b><p>Каждая фикстура объявляет свой <code>[SetUp]</code> сама. Это значит, что общий код подготовки (создать страницу, перейти на форму, закрыть баннер кук) продублирован по фикстурам — цена отказа от общего хука.</p></div>`,
 mem:{
  ContextOptions:"Переопределяет метод <code>PageTest</code>. Playwright вызывает его перед созданием контекста для каждого теста, и возвращённые настройки применяются ко <b>всем</b> запросам этого теста. <code>BaseURL</code> позволяет писать в страницах относительные пути вроде <code>/en</code>; <code>HttpCredentials</code> закрывает Basic Auth на уровне контекста, поэтому в тестах его нигде не видно; размер окна 1920×1080 зашит числом — от него зависит, какая вёрстка отрисуется, десктопная или мобильная."
 }},

"Pages/BasePage.cs":{role:"infra",t:"Базовый класс страниц",
 why:"Общий предок для всех шести страниц. Хранит ссылку на страницу браузера и собирает три компонента общих элементов — шапку, панель навигации и подвал.",
 how:`<p><b>В этом классе нет ни одного метода</b> — и это осознанное отличие Portal от двух других проектов решения, где у <code>BasePage</code> одиннадцать вспомогательных методов. Здесь навигацию каждая страница описывает сама.</p>
 <p>Три свойства <code>Header</code>, <code>NavBar</code> и <code>Footer</code> создаются в конструкторе один раз. Это <b>композиция</b>, а не наследование: общие элементы не наследуются страницей, а «вкладываются» в неё как детали. Отсюда обращение в тестах через точку: <code>_homePage.Header.Logo</code>.</p>`,
 mem:{
  Page:"<code>protected</code> — видно самому классу и наследникам, но <b>не тестам</b>. Именно так страница получает доступ к браузеру, не открывая его наружу. <code>readonly</code> означает, что ссылку нельзя переприсвоить после конструктора.",
  BaseUrl:"Базовый адрес, переданный из <code>TestConfig</code>. Хранится, но в Portal почти не используется: навигация идёт относительными путями, которые разрешает <code>BaseURL</code> контекста браузера.",
  Header:"Свойство только для чтения (<code>{ get; }</code>), заполняется в конструкторе. Тип <code>HeaderElements</code> — класс-держатель локаторов шапки.",
  NavBar:"Компонент карусели продуктовой навигации. 29 кнопок, по одной на продукт.",
  Footer:"Компонент подвала: вкладки по типам площадей, юридические ссылки, логотип.",
  BasePage:"Конструктор принимает страницу браузера и базовый адрес, сохраняет их и создаёт три компонента. Каждая страница-наследник вызывает его строкой <code>: base(page, TestConfig.BaseUrl)</code>."
 }},

"Utils/PageQualityChecks.cs":{role:"infra",t:"Общая проверка качества страницы",
 why:"Одна проверка, вынесенная из тестов: страница отрисовалась корректно — видны шапка, подвал и заголовок первого уровня, и в консоли браузера нет необработанных ошибок JavaScript.",
 how:`<p>Класс <code>internal static</code>: экземпляр не нужен, а видимость ограничена сборкой. Используется в <code>GeneralPagesTests</code>, где одним параметризованным тестом проверяются 16 страниц решений.</p>
 <p>Строка <code>using static Microsoft.Playwright.Assertions;</code> в начале файла — то, что позволяет писать <code>Expect(...)</code> без префикса класса.</p>`,
 mem:{
  AssertLoadedCorrectlyAsync:"Принимает страницу, локаторы шапки и подвала, накопленный список ошибок JS и таймаут. Проверяет три вещи через <code>Expect()</code> и четвёртую через <code>Assert.That</code>. Обратите внимание на <code>page.Locator(\"h1\").First</code> — на странице может быть несколько <code>h1</code>, и без <code>.First</code> Playwright в строгом режиме бросил бы ошибку неоднозначности. Ошибки JS собираются в тесте подпиской <code>Page.PageError += …</code> и передаются сюда списком."
 }},

/* ---------------- общие элементы ---------------- */

"Pages/CommonElements/HeaderElements.cs":{role:"page",t:"Шапка сайта",
 why:"Держатель локаторов верхней панели: логотип, четыре пункта меню, кнопки «Contact Us», выбора языка, телефона и аккаунта.",
 how:`<p>Это <b>не страница</b>: класс ничего не наследует и не умеет навигировать. Он только знает, как найти элементы. Такие классы называют компонентами или держателями локаторов.</p>
 <div class="note warn"><b class="h">Класс public, а всё внутри internal</b><p>Сам класс объявлен <code>public</code>, но конструктор и все локаторы — <code>internal</code>. Работает это только потому, что тесты лежат в <b>той же сборке</b> <code>Portal.dll</code>. Если однажды страницы вынесут в отдельную библиотеку, тесты перестанут компилироваться. Тот же приём применён во всех трёх файлах CommonElements.</p></div>`},

"Pages/CommonElements/NavBarElements.cs":{role:"page",t:"Карусель продуктов",
 why:"29 кнопок продуктовой карусели на главной странице плюс две стрелки прокрутки. Каждая кнопка ведёт на страницу своего продукта.",
 how:`<p>Все локаторы построены по одному шаблону XPath: найти абзац с точным текстом и подняться к родительской кнопке. Это устойчиво к перевёрстке обёрток, но <b>ломается при смене текста на кнопке</b> — привязка идёт к видимой надписи.</p>
 <p>Единственное исключение — <code>MeetingRoomsButton</code>, где добавлено <code>[not(@role='tab')]</code>: надпись «Meeting rooms» встречается и в подвале, у вкладки, поэтому уточнение отсекает её.</p>`},

"Pages/CommonElements/FooterElements.cs":{role:"page",t:"Подвал сайта",
 why:"Пять вкладок по типам площадей и пять соответствующих панелей со ссылками на страны, юридические ссылки, логотип и переключатель языка.",
 how:`<p>Вкладки и панели адресуются по стабильным идентификаторам (<code>tab-0</code>…<code>tab-4</code>, <code>tabpanel-0</code>…), а юридические ссылки — по частичному имени CSS-модульного класса.</p>
 <div class="note"><b class="h">Почему <code>[class*='...']</code>, а не полное имя класса</b><p>Фронтенд использует CSS-модули: имя класса выглядит как <code>index-module_textButton__fqQ1D</code>, и хеш в конце меняется при каждой сборке фронтенда. Совпадение по устойчивой части — единственный способ пережить пересборку.</p></div>
 <p><code>FirstSpacesLocationLink</code> — пример сужения: в панели больше сотни ссылок на страны, для дымового теста навигации берётся только первая.</p>`},

"Pages/CommonElements/OnPageForm.cs":{role:"page",t:"Заготовка формы на странице",
 why:"Пустой класс-заглушка. Задумывался для формы захвата лида, встроенной прямо в страницу, но не реализован.",
 how:`<p>Внутри только поле <code>_page</code> и конструктор. <b>Нигде не создаётся</b> — ни <code>BasePage</code>, ни какая-либо страница его не инстанцируют. Держать такие заготовки в репозитории — компромисс: она документирует намерение, но при беглом чтении создаёт впечатление, что компонент существует.</p>`},

/* ---------------- страницы ---------------- */

"Pages/HomePage.cs":{role:"page",t:"Главная страница",
 why:"Самый маленький и самый показательный page object в проекте: навигация плюс четыре публичных локатора-обёртки.",
 how:`<p>Читается как эталон устройства страницы:</p>
 <ol>
 <li>Наследует <code>BasePage</code> и передаёт в конструктор базовый адрес.</li>
 <li>Метод <code>NavigateToHomeAsync</code> знает <b>свой</b> путь — <code>/en</code>.</li>
 <li>Четыре свойства просто переименовывают локаторы компонентов, чтобы тест писал <code>_homePage.HeaderLogoLocator</code>, а не лез в <code>Header.Logo</code>.</li>
 </ol>`,
 mem:{
  NavigateToHomeAsync:"Переходит на <code>/en</code> и ждёт <code>DOMContentLoaded</code>. Именно этот вариант ожидания, а не <code>NetworkIdle</code>: на живом сайте постоянно работают аналитика, реклама и виджет чата, поэтому сеть никогда не затихает и <code>NetworkIdle</code> ждал бы до таймаута.",
  HeaderLogoLocator:"Обёртка над <code>Header.Logo</code>. Нужна потому, что члены <code>HeaderElements</code> объявлены <code>internal</code>: обёртка делает конкретный элемент доступным тесту, не открывая весь компонент.",
  FooterLogoLocator:"То же для логотипа в подвале — у него отдельный файл изображения, светлая версия.",
  NavRightButtonLocator:"Стрелка прокрутки карусели вправо.",
  NavLeftButtonLocator:"Стрелка прокрутки карусели влево."
 }},

"Pages/ContactFormPage.cs":{role:"page",t:"Контактная форма",
 why:"Главный и самый большой page object проекта: 597 строк, около 240 членов. Описывает всю анкету — семь основных шагов, ветки, подквиз из шести шагов и запись на тур. На него опираются 23 из 30 тестовых файлов.",
 how:`<p>Файл разделён комментариями на три части, и понимать его нужно именно в таком порядке:</p>
 <ol>
 <li><b>Приватные локаторы</b>, сгруппированные по шагам формы: «Step 1 — contact details», «Step 2 — How can we help?» и так далее. Тест их не видит.</li>
 <li><b>Публичные методы-действия</b>: заполнить поле, выбрать страну, нажать «Далее». Тест выражает намерение, а не механику.</li>
 <li><b>Публичные локаторы-обёртки</b> с суффиксом <code>Locator</code> — их около семидесяти. Они нужны для проверок <code>Expect(...)</code> в тестах.</li>
 </ol>
 <div class="note"><b class="h">Почему локаторы приватные, а наружу торчат обёртки</b><p>Это фасад. Тест не должен знать селекторов: когда фронтенд переименует класс, правка будет ровно в одной строке этого файла, а не в двадцати тестах. Обёртка при этом отдаёт наружу только те элементы, которые действительно нужно проверять.</p></div>
 <div class="note warn"><b class="h">Где здесь спрятаны обходные пути</b><p>Несколько методов содержат жёсткие паузы и повторные попытки: <code>WaitForTimeoutAsync(3000)</code> при выборе страны, полсекунды после «Далее», повторный клик в <code>OpenCountryDropdownAsync</code>. Все они снабжены комментарием с датой и причиной — это защита от WAF Incapsula, который «сбрасывает» форму при слишком быстрых последовательных действиях. Это не небрежность, а зафиксированные наблюдения.</p></div>`,
 mem:{
  NavigateToContactFormAsync:"Две перегрузки. Важное здесь — <b>порядок</b>: подписка на ответ <code>/api/v3/form/gettoken</code> регистрируется <i>до</i> перехода, иначе ответ придёт раньше подписки и ожидание зависнет. Параметр <code>hashParameters</code> позволяет открыть форму так, как её открывают ссылки со страниц продуктов и локаций — с хешем, который преднастраивает анкету.",
  DismissCookieBannerAsync:"Закрывает баннер кук, если он виден; если нет — ничего не делает. Вызывается перед действиями, которые баннер может перехватить. Клик идёт по <b>первой</b> кнопке баннера, потому что его разметка отличается между сессиями: иногда одна кнопка «Close», иногда «Accept all» и «Reject all».",
  DismissNagPopupAsync:"Закрывает всплывающее окно «Find your perfect place to work». Появляется по таймеру стороннего скрипта, поэтому может выскочить посреди сценария даже если раньше его не было — вызывать повторно перед важными кликами нормально.",
  SelectCountryByDialCodeAsync:"Открывает список стран, ищет по коду набора и подтверждает Enter. <b>Неоднозначен по своей природе:</b> у Канады и США один код +1, и поиск «+1» подсвечивает American Samoa как первую по алфавиту. Когда важна конкретная страна, нужен <code>SelectCountryByNameAsync</code>.",
  SelectCountryByNameAsync:"Тот же механизм, но поиск по названию страны. Появился как ответ на неоднозначность кода набора.",
  OpenCountryDropdownAsync:"Приватный. Кликает по селектору страны и ждёт список, при неудаче кликает второй раз. Повтор добавлен после двух зафиксированных в CI случаев, когда первый клик не открывал список и вызывающий код ждал полный таймаут в 30 секунд.",
  TypePhoneFieldAsync:"Печатает посимвольно через <code>PressSequentiallyAsync</code>, в отличие от мгновенного <code>FillAsync</code>. Разница принципиальна для тестов фильтрации ввода: <code>FillAsync</code> подставляет значение напрямую и обходит обработчик нажатий, поэтому фильтр нецифровых символов просто не срабатывает.",
  ClickNextButtonAsync:"Нажимает «Далее» и добавляет паузу в 500 мс. Пауза — защита от WAF: переходы между шагами вплотную друг за другом периодически вызывали сброс формы, причём каждый раз на разном шаге.",
  ClearLocationSearchWithKeyboardAsync:"Очищает поле повторным Backspace, а не выделением и Delete. Причина в комментарии: выделение с удалением очищает значение в DOM, но состояние React сохраняет прежний текст, и следующий символ дорисовывается к старому значению.",
  AppendToLocationSearchAsync:"Дописывает текст в конец, не очищая поле. Очистка здесь не эквивалентна: опустевшее поле через мгновение восстанавливает значение по геолокации, и восстановление приходится ровно между нажатиями.",
  FillLocationSearchAsync:"Вводит текст, дожидается выпадающего списка и кликает первую подсказку. Типовой приём для полей с автодополнением: нельзя просто ввести текст и нажать «Далее», значение должно быть выбрано из списка.",
  OptionTileLocator:"Ключевой обобщённый локатор. Все плитки выбора во всех подквизах устроены одинаково: <code>&lt;label&gt;</code>, внутри скрытый <code>input</code> и абзац с атрибутом <code>title</code>. Один метод с параметром заменяет несколько десятков отдельных локаторов.",
  SelectRandomTeamSizeAsync:"Выбирает случайный размер команды и возвращает выбранное значение. <b>Делает тест недетерминированным:</b> два прогона идут разными путями. Возврат значения смягчает это — проверять можно то, что действительно было выбрано.",
  SelectFirstAvailableTimeSlotAsync:"Выбирает первый доступный слот времени, явно исключая отключённые. Просто <code>.First</code> недостаточно: у отключённого слота нет атрибута <code>disabled</code>, состояние выражено только классом, и Playwright 30 секунд безуспешно пытался бы кликнуть.",
  SelectEnabledTourDayAsync:"Кликает n-й выбираемый день и возвращает его число. Предпочтительнее предвыбранного ближайшего дня: ближайшим может оказаться сегодня, у которого ранние слоты уже прошли к моменту позднего прогона в CI."
 }},

"Pages/ExplorePage.cs":{role:"page",t:"Поиск локаций",
 why:"Страницы /en/explore и /en/explore/locations-search: поле поиска с автодополнением, фильтры по удобствам и карточки результатов.",
 how:`<p>Самый поучительный файл проекта с точки зрения <b>ожиданий</b>. Почти каждый метод здесь — не «сделай действие», а «сделай действие и дождись доказательства, что оно применилось».</p>
 <p>Комментарии в файле стоит прочитать целиком: в них зафиксированы конкретные воспроизведения на UAT с датами.</p>`,
 mem:{
  SuggestionsDropdown:"Локатор выпадающего списка. В комментарии объяснено, почему нельзя расширить его до <code>ul[class*='locationsList']</code>: на странице есть ещё пять блоков просмотра по регионам с похожим классом, и общий селектор совпал бы с шестью элементами, что в строгом режиме Playwright является ошибкой.",
  WaitForResultCountToStabilizeAsync:"Приватный. Опрашивает количество карточек, пока оно не станет одновременно <b>отличным от исходного</b> и <b>одинаковым в двух подряд замерах</b>. Простое «дождаться изменения» ловило промежуточную отрисовку и возвращалось к старому значению. При таймауте в сообщение подставляется состояние чекбокса — это отличает «клик не сработал» от «бэкенд просто думал долго».",
  TypeSearchQueryAndWaitForSuggestionsAsync:"Вводит запрос и повторяет ввод один раз, если список не открылся. Поле отрисовано сервером и становится рабочим только после того, как React повесит обработчик; ввод, попавший в промежуток, задаёт значение, но не отправляет запрос подсказок. Сигнала «гидратация завершена» в DOM нет, поэтому повтор — единственный надёжный способ.",
  WaitForSearchReadyAsync:"Разогрев для тестов, которые проверяют <b>отсутствие</b> подсказок. Без него такая проверка проходит вхолостую: список пуст просто потому, что поле ещё не ожило. Сначала выполняется заведомо результативный запрос, и лишь после этого «пусто» означает настоящий отказ показать подсказки.",
  SearchAndSelectLocationAsync:"Всегда очищает поле перед вводом. Если город из геолокации агента совпал с искомым, повторный ввод того же значения не вызывает новый запрос подсказок и ожидание истекает. Завершается ожиданием того, что в поле появилось выбранное значение — это единственное надёжное подтверждение, что выбор обработан.",
  AmenityCheckbox:"Чекбоксы удобств не имеют устойчивых идентификаторов — они генерируются заново при каждой загрузке. Поэтому поиск идёт от видимой подписи через XPath.",
  ToggleAmenityFilterAsync:"Перед кликом выдерживает секунду. Причина та же, что и в контактной форме: клик вплотную к предыдущему действию мог вообще не примениться, тогда как при человеческом темпе срабатывал всегда."
 }},

"Pages/LocationPage.cs":{role:"page",t:"Страница локации",
 why:"Страницы конкретных площадей вида /en/gb/london/office-space. В их шапке живёт форма запроса, которая передаёт посетителя в контактную форму вместе с выбранной локацией.",
 how:`<p>Здесь описано только то, что специфично для этой страницы — двухэтапная отправка. Поля контактов не дублируются: шапка использует ровно тот же виджет, что и первый шаг контактной формы, поэтому тесты работают с ними через <code>ContactFormPage</code>.</p>`,
 mem:{
  ExpandHeroFormAsync:"Первый клик <b>не отправляет форму</b>, а разворачивает её на месте и показывает поле телефона. Ожидание перехода после одного клика висело бы вечно — это прогрессивная форма.",
  SubmitHeroFormAsync:"Второй клик отправляет. Ожидание ответа с токеном регистрируется до клика — тот же порядок, что и в контактной форме.",
  HashParameter:"<b>Статический</b> метод-утилита: не обращается к странице, поэтому не требует экземпляра. Вытаскивает один параметр из хеша URL, разворачивает процентное кодирование и заменяет «+» на пробел. Нужен, чтобы тест проверял ту локацию, которую страница действительно передала, а не зашитый номер центра, который устареет в день его закрытия.",
  HeroSubmitButton:"Ищется по <b>доступному имени</b> через <code>GetByRole</code>, а не по тексту. Подпись состоит из текстового узла иконки Material Symbols и слова «Get started»; точное совпадение по тексту не находит ничего, а доступное имя сопоставляется без учёта регистра."
 }},

"Pages/ProductPage.cs":{role:"page",t:"Страница продукта",
 why:"Маркетинговые страницы продуктов. Их кнопки призыва к действию переносят выбранный продукт в контактную форму через хеш в адресе — поэтому форма открывается уже преднастроенной.",
 how:`<p>Всего три члена, и все три поучительны.</p>`,
 mem:{
  ContactFormCta:"Кнопки ищутся <b>по адресу ссылки, а не по подписи</b>. Одна и та же ссылка с <code>#dataProduct=…</code> подписана то «Get Started», то «Contact Us», то «Let's talk» в зависимости от места на странице. Параметр метода позволяет указать нужный фрагмент адреса.",
  ClickContactFormCtaAsync:"Регистрирует ожидание токена, кликает и дожидается ответа. Без предварительной регистрации ответ приходит раньше подписки.",
  NavigateToAsync:"Переход по произвольному пути с ожиданием <code>DOMContentLoaded</code>. Путь приходит параметром, потому что страниц продуктов много и заводить метод на каждую бессмысленно."
 }},

"Pages/SolutionsPage.cs":{role:"page",t:"Страница решений",
 why:"Страницы /en/solutions/industry/… и /en/solutions/company-size/…. Как и страницы продуктов, переносят контекст в форму через хеш: страница отрасли передаёт #industry=…",
 how:`<p>Почти дословно повторяет <code>ProductPage</code>, и в комментарии сказано, что это <b>сделано намеренно</b>: в Portal <code>BasePage</code> принципиально не содержит методов, а продукт и решение — разные понятия.</p>
 <div class="note warn"><b class="h">Почему нельзя искать просто по «contact-form»</b><p>На каждой странице отрасли есть ещё и обычная ссылка <code>/en/contact-form</code> без хеша. Селектор по одному лишь <code>contact-form</code> находит именно её, и отрасль молча теряется — тест при этом продолжает проходить, проверяя не то.</p></div>`},

/* ---------------- тесты ---------------- */

"Tests/HomePage/HomePageTests.cs":{role:"test",t:"Главная страница",
 why:"Две дымовые проверки главной: логотипы в шапке и подвале видны, стрелка карусели кликается. Самая маленькая фикстура — с неё удобно начинать чтение тестов.",
 how:`<p>Здесь виден весь скелет тестового класса: атрибуты на классе, поле страницы с <code>null!</code>, константа таймаута, <code>[SetUp]</code> и два теста. Обратите внимание на <code>Pages.HomePage</code> с префиксом — пространство имён теста <code>…Tests.HomePage</code> совпадает по имени с классом страницы, и без уточнения компилятор не понял бы, о чём речь.</p>`},

"Tests/CommonElements/HeaderTests.cs":{role:"test",t:"Шапка",
 why:"Восемь тестов на верхнюю панель: каждая ссылка видна и ведёт куда должна.",
 how:`<p>Однородная фикстура: все тесты устроены одинаково — увидеть элемент, кликнуть, проверить адрес. Хорошее место, чтобы увидеть шаблон «переход по ссылке» в чистом виде.</p>`},

"Tests/CommonElements/NavBarTests.cs":{role:"test",t:"Карусель продуктов",
 why:"29 тестов — по одному на каждую кнопку продуктовой карусели плюс проверка стрелок прокрутки.",
 how:`<p>Самая механическая фикстура проекта: 29 почти одинаковых тестов. Это осознанный размен — каждый продукт получает собственный результат в отчёте, зато файл разрастается до 378 строк. Альтернатива — один параметризованный тест, как сделано в <code>GeneralPagesTests</code>.</p>`},

"Tests/CommonElements/FooterTests.cs":{role:"test",t:"Подвал",
 why:"14 тестов на подвал: логотип, юридические ссылки, пять вкладок с площадями и переход на страницу локации.",
 how:`<p>Здесь появляются вспомогательные приёмы, которых нет в других фикстурах:</p>
 <ul>
 <li><code>OpenLocationsAccordionAsync</code> — подвал свёрнут, список стран надо сначала раскрыть.</li>
 <li><code>ClickWithOverlayRetryAsync</code> — повтор клика, если его перехватил баннер или всплывающее окно.</li>
 <li>Собственные <code>DismissCookieBannerAsync</code> и <code>DismissNagPopupAsync</code> — <b>дубликаты</b> методов из <code>ContactFormPage</code>. Один и тот же код живёт в трёх местах проекта.</li>
 </ul>`},

"Tests/GeneralPages/GeneralPagesTests.cs":{role:"test",t:"Страницы решений",
 why:"Один тест, который прогоняется на 16 страницах: десять отраслевых и шесть по размеру компании. Проверяет, что страница отрисовалась и в консоли нет ошибок JavaScript.",
 how:`<p>Единственное место в проекте, где применён <b>источник тестовых случаев</b>. Метод <code>IndustryAndCompanySizePages</code> возвращает <code>TestCaseData</code> с человекочитаемым именем через <code>SetName</code>, а атрибут <code>[TestCaseSource]</code> превращает один метод в 16 случаев в отчёте.</p>
 <div class="note"><b class="h">Отсюда и разница в счётчиках</b><p>В исходниках проекта 230 методов с <code>[Test]</code>, а обнаруживается 249 тестовых случаев. Разницу дают такие параметризованные тесты: один метод — много случаев.</p></div>
 <p>Строка <code>Page.PageError += (_, error) =&gt; _pageErrors.Add(error);</code> в <code>[SetUp]</code> — подписка на ошибки JavaScript. Список затем передаётся в <code>PageQualityChecks</code>.</p>`},

"Tests/Explore/ExploreSearchTests.cs":{role:"test",t:"Поиск на /explore",
 why:"Четыре теста на автодополнение в поиске: подсказки появляются с третьего символа, релевантны запросу и отрисовываются под полем.",
 how:`<p>Проверка «подсказок нет» опирается на разогрев <code>WaitForSearchReadyAsync</code> — без него тест прошёл бы вхолостую на неоживших полях.</p>`},

"Tests/Explore/LocationsSearchTests.cs":{role:"test",t:"Поиск локаций и фильтры",
 why:"Шесть тестов на страницу поиска локаций: фильтр по удобствам сокращает выдачу, автодополнение работает, кнопка очистки опустошает поле.",
 how:`<p>Самые хрупкие тесты проекта, и это признано в комментариях: результат зависит от того, в какой город разрешается IP агента. Отсюда <code>SearchAndSelectLocationAsync</code> с явным выбором города — иначе в большом городе фильтр не уменьшает страницу выдачи и ожидание истекает.</p>`},

"Tests/ContactForm/ContactFormValidationTests.cs":{role:"test",t:"Валидация шагов 1 и 3",
 why:"Девять тестов на отказ формы двигаться дальше при незаполненных или некорректных полях.",
 how:`<p>Негативные сценарии в чистом виде: проверяется не появление ошибки, а то, что <b>форма осталась на месте</b> — заголовок текущего шага всё ещё виден, заголовок следующего не появился.</p>`},

"Tests/ContactForm/ContactFormPositiveTests.cs":{role:"test",t:"Основной положительный сценарий",
 why:"Десять тестов: предвыбор на шаге 2, сквозной проход всей анкеты, неизменность адреса страницы, ветка «I am after something else».",
 how:`<p>Здесь стоит посмотреть на <code>ContactForm_AllSteps_StayOnTheSameUrl</code>: вся анкета живёт на одном адресе <code>/contact-form</code>, шаги переключаются на клиенте. Это объясняет, почему в тестах нет ожиданий навигации между шагами — переходить некуда.</p>
 <p>Приватный <code>GoToJourneyStepAsync</code> — типовой для проекта приём: общий путь до нужного шага выносится в приватный метод фикстуры, а не в page object.</p>`},

"Tests/ContactForm/ContactFormProfileStepTests.cs":{role:"test",t:"Шаг 3: имя и компания",
 why:"Два теста: имя и фамилия подставляются из адреса почты, введённого на первом шаге, и подставленные значения можно переписать.",
 how:`<p>Короткая и понятная фикстура. Проверяется не только подстановка, но и то, что отправляется именно исправленное значение — иначе тест доказывал бы только отрисовку.</p>`},

"Tests/ContactForm/ContactFormLocationSearchTests.cs":{role:"test",t:"Шаг 4: поиск области",
 why:"Девять тестов на поле поиска локации: предзаполнение по IP, очистка, ручной ввод и удаление, выбор другого города.",
 how:`<p>Именно ради этих тестов в page object появились <code>AppendToLocationSearchAsync</code> и <code>ClearLocationSearchWithKeyboardAsync</code> — они воспроизводят поведение живого пользователя, а не подстановку значения.</p>`},

"Tests/ContactForm/ContactFormProductsTests.cs":{role:"test",t:"Шаг 5: продукты",
 why:"Три теста: на входе ничего не выбрано и шаг нельзя пропустить, продолжение без выбора отклоняется, при выборе двух продуктов основным отправляется приоритетный.",
 how:`<p>Третий тест проверяет не интерфейс, а <b>тело отправляемого запроса</b> — тесты перехватывают POST и разбирают JSON. Это заметно надёжнее проверки экрана, потому что доказывает, что именно уходит в CRM.</p>`},

"Tests/ContactForm/ContactFormSmsConsentTests.cs":{role:"test",t:"Шаг 6: согласие на SMS",
 why:"Три теста на чекбокс согласия: по умолчанию снят и отправляется отказ, поставленный отправляет согласие, снятый после установки снова отправляет отказ.",
 how:`<p>Третий случай важнее первых двух: он проверяет, что отправляется <b>итоговое</b> состояние, а не первое нажатие.</p>`},

"Tests/ContactForm/ContactFormOfficeThankYouTests.cs":{role:"test",t:"Шаг 7: офисная страница благодарности",
 why:"Три теста на страницу завершения для офисных продуктов: кнопка «Continue» открывает дополнительные шаги и возвращает назад, ссылки на магазины приложений ведут на приложения Portal, финальная кнопка завершает заявку и возвращает на главную.",
 how:`<p>Одна из трёх разных страниц благодарности в этой форме. Их легко перепутать: у двух из них одинаковый заголовок «Thank you», и различают их по содержимому.</p>`},

"Tests/ContactForm/ContactFormNonOfficeThankYouTests.cs":{role:"test",t:"Неофисная страница благодарности",
 why:"Пять тестов на альтернативную страницу завершения, которая показывается, когда среди выбранных продуктов нет офисов и коворкинга. На ней четыре ссылки на покупку и бронирование.",
 how:`<p>Страница опознаётся <b>по этим четырём ссылкам</b>, а не по заголовку: заголовок у неё такой же, как на странице отказа от тура. Отдельные тесты проверяют, что ни одна из ссылок не открывается в новой вкладке.</p>`},

"Tests/ContactForm/ContactFormNonOfficeCompletionTests.cs":{role:"test",t:"Завершение по неофисной ветке",
 why:"Три теста: шаг SMS проходится и без согласия, согласие доезжает до финальной отправки, на неофисной странице благодарности присутствуют все ожидаемые ссылки.",
 how:`<p>Дополняет предыдущую фикстуру со стороны данных: там проверялась страница, здесь — что уходит в отправке.</p>`},

"Tests/ContactForm/ContactFormAbandonThankYouTests.cs":{role:"test",t:"Отказ от тура",
 why:"Три теста на страницу «Abandon Thank You»: отказ от тура пропускает шаги даты и времени, страница предлагает ссылки на приложения и завершение, а заявка записывается как обычный лид без брони тура.",
 how:`<p>Третий тест проверяет тело отправки — это единственный способ отличить «тур не забронирован» от «страница выглядит так же».</p>`},

"Tests/ContactForm/ContactFormOptionalStepsTests.cs":{role:"test",t:"Необязательные шаги подквиза",
 why:"Три теста на шаги 8–13: размер команды, дата старта, размер компании и отрасль. Проверяется, что шаги пропускаются кнопкой Skip, выбор одиночный и подсвечивается, а пропуск не отправляет значение.",
 how:`<p>Подквиз — отдельная последовательность внутри формы с собственным индикатором прогресса <code>&lt;progress max="6"&gt;</code>. Два его шага (кастомизация офиса и дополнения) сейчас скрыты за фича-флагом и недостижимы — локаторы для них в page object оставлены с пометкой.</p>`},

"Tests/ContactForm/ContactFormStepPersistenceTests.cs":{role:"test",t:"Сохранность ответов при возврате",
 why:"Два теста: возврат назад через несколько шагов не теряет ранее введённое, и повторный проход вперёд ничего не портит.",
 how:`<p>Проверяется тремя вспомогательными методами <code>Assert…IntactAsync</code> — по одному на шаг. Такие тесты ловят классическую регрессию, когда форма сбрасывает состояние при навигации назад.</p>`},

const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const MODS = {
 "public":["Виден отовсюду","Доступен из любого кода, включая другие сборки. В page object так помечают то, чем пользуются тесты."],
 "private":["Только внутри своего класса","Ни тест, ни наследник его не увидят. В page object так закрывают селекторы — тест не должен их знать."],
 "internal":["Только внутри сборки Portal.dll","Работает лишь потому, что тесты лежат в той же сборке. Вынесите страницы в отдельную библиотеку — тесты перестанут компилироваться."],

 "readonly":["Присваивается только в конструкторе","После создания объекта ссылку заменить нельзя. Содержимое объекта при этом меняться может."],
 "const":["Константа времени компиляции","Значение подставляется в место использования при сборке. Обязательно инициализируется сразу и не может быть вычисляемым."],
 "async":["Асинхронный метод","Внутри разрешён await. Возвращает Task; результат обязательно нужно дождаться, иначе действие может не завершиться к моменту проверки."],
 "override":["Переопределяет метод базового класса","Здесь это ContextOptions из PageTest: Playwright вызывает его сам перед созданием контекста."],
 "virtual":["Может быть переопределён наследником",""],
 "abstract":["Без реализации, обязателен к переопределению",""],

 "partial":["Класс разнесён по нескольким файлам",""],
 "new":["Скрывает одноимённый член базового класса",""]
};

const ATTRS = [
 [/^\[TestFixture\]/,"TestFixture","Помечает класс как набор тестов. NUnit создаёт экземпляр класса и ищет в нём методы с [Test]."],
 [/^\[Test\]/,"Test","Один тестовый случай. Метод должен быть public и, если асинхронный, возвращать Task."],
 [/^\[SetUp\]/,"SetUp","Выполняется перед каждым тестом фикстуры. Здесь обычно создаётся page object и открывается страница."],
 [/^\[TearDown\]/,"TearDown","Выполняется после каждого теста, даже если тест упал."],
 [/^\[OneTimeSetUp\]/,"OneTimeSetUp","Один раз на всю фикстуру, до первого теста."],
 [/^\[OneTimeTearDown\]/,"OneTimeTearDown","Один раз на всю фикстуру, после последнего теста."],
 [/^\[Category\("([^"]*)"\)\]/,"Category","Метка для фильтрации: dotnet test --filter \"Category=$1\". В Portal размечены 32 фикстуры из 33."],
 [/^\[Description\("([\s\S]*)"\)\]/,"Description","Человекочитаемое описание. Попадает в отчёт NUnit XML и оттуда в ReportPortal и Xray."],
 [/^\[Property\("XrayTest",\s*"([^"]*)"\)\]/,"XrayTest","Связь с тест-кейсом Xray $1. Скрипт выгрузки читает эти свойства из NUnit XML — в TRX они не попадают."],
 [/^\[Retry\((\d+)\)\]/,"Retry","Повторить упавший тест до $1 раз. Прячет нестабильность, но для UI-тестов на живом стенде это осознанный компромисс — в проекте 120 таких пометок."],
 [/^\[TestCase\(/,"TestCase","Один набор параметров. Один метод превращается в столько тестовых случаев, сколько таких атрибутов."],
 [/^\[TestCaseSource\(nameof\((\w+)\)\)\]/,"TestCaseSource","Случаи берутся из метода $1. Так один метод даёт 16 случаев в GeneralPagesTests."],
 [/^\[Parallelizable/,"Parallelizable","Разрешает параллельный запуск. Без него NUnit выполняет фикстуры последовательно, сколько бы воркеров ни было задано."]
];
function explainAttr(a){
  for(const [rx,name,tpl] of ATTRS){
    const m = a.match(rx);
    if(m) return {name, text: tpl.replace(/\$1/g, m[1]!==undefined ? m[1] : "")};
  }
  return {name:a.replace(/^\[|\]$/g,"").split("(")[0], text:"Атрибут NUnit или .NET."};
}

/* ---------------- разбор селектора ---------------- */
const CSSR = [
 [/#([\w-]+)/g, m=>["#"+m[1], "элемент с идентификатором "+m[1]+" — самая устойчивая привязка, если id не генерируется заново"]],
 [/\[([\w-]+)\*=/g, m=>["["+m[1]+"*=…]", "атрибут <b>"+m[1]+"</b> содержит подстроку. " + (
     m[1]==="class" ? "Так обходят хеши CSS-модулей: имя класса вида index-module_x__A1b2 меняется при каждой сборке фронтенда, устойчива только середина."
   : m[1]==="href"  ? "Привязка к адресу ссылки, а не к подписи: одна и та же ссылка на разных местах страницы подписана по-разному, а хвостовые query-параметры отличаются между стендами."
   : m[1]==="src"   ? "Привязка к пути файла — устойчивее, чем к обёрткам вокруг изображения."
   : "Частичное совпадение устойчивее точного, когда значение содержит изменчивую часть.")]],
 [/\[([\w-]+)\^=/g, m=>["["+m[1]+"^=…]", "атрибут "+m[1]+" <b>начинается</b> с подстроки"]],
 [/\[([\w-]+)\$=/g, m=>["["+m[1]+"$=…]", "атрибут "+m[1]+" <b>заканчивается</b> подстрокой"]],
 [/\[(role)="?([\w-]+)"?\]/g, m=>["[role="+m[2]+"]", "ARIA-роль "+m[2]+" — привязка к семантике, а не к вёрстке"]],
 [/:not\(/g, ()=>[":not(…)", "исключение: отсекает элементы, подходящие под вложенный селектор"]],
 [/\[([\w-]+)="/g, m=>["["+m[1]+"=…]", "атрибут "+m[1]+" совпадает <b>точно</b> — сломается при малейшем изменении значения"]]
];
const XPR = [
 [/normalize-space\(\)/, ["normalize-space()", "сравнение текста без лишних пробелов по краям и внутри. Привязка к <b>видимой надписи</b>: перевод или правка текста ломает такой локатор"]],
 [/parent::/, ["parent::", "подъём к родительскому элементу. Приём «найти по тексту внутри, а кликать по обёртке»"]],
 [/following-sibling::/, ["following-sibling::", "следующий соседний элемент того же уровня. Так читают значение рядом с подписью"]],
 [/contains\(@class/, ["contains(@class,…)", "частичное совпадение класса — тот же обход хешей CSS-модулей, что и [class*=…] в CSS"]],
 [/contains\(\./, ["contains(., …)", "текст элемента вместе с потомками содержит подстроку"]],
 [/@title=/, ["@title=…", "точное значение атрибута title. В этой форме на title завязаны все плитки выбора"]],
 [/not\(/, ["not(…)", "отрицание: исключает подходящие под условие элементы"]],
 [/text\(\)/, ["text()", "собственный текстовый узел элемента, без текста потомков"]],
 [/^\.\/\//, [".//", "поиск только внутри уже найденного элемента, а не по всей странице"]]
];

function decodeSelector(body){
  const out = {kind:null, sel:null, notes:[], chain:[]};
  if(!body) return out;

  const role = body.match(/GetByRole\(AriaRole\.(\w+)[\s\S]*?Name\s*=\s*"([^"]*)"/);
  if(role){
    out.kind = "role";
    out.sel = 'GetByRole(' + role[1] + ', Name = "' + role[2] + '")';
    out.notes.push(["по роли и имени", "Ищет элемент с ролью <b>"+role[1].toLowerCase()+"</b> и доступным именем «"+role[2]+"». Доступное имя сопоставляется <b>без учёта регистра</b> и собирается из текста, aria-label и подписи — поэтому работает там, где точное совпадение текста не находит ничего."]);
    return out;
  }
  const roleBare = body.match(/GetByRole\(AriaRole\.(\w+)\s*\)/);
  if(roleBare){
    out.kind = "role";
    out.sel = "GetByRole(" + roleBare[1] + ")";
    out.notes.push(["по роли", "Ищет элемент с ролью <b>"+roleBare[1].toLowerCase()+"</b> без уточнения имени. Уместно там, где разметка меняется между сессиями и важно лишь то, что это кнопка."]);
    if(/\.First\b/.test(body)) out.chain.push([".First", "Берётся первая подходящая. Здесь это осознанно: у баннера кук бывает то одна кнопка «Close», то пара «Accept all» / «Reject all», а закрыть достаточно любую."]);
    const sc = body.match(/^(\w+)\.GetByRole/);
    if(sc && !/^(Page|_page)$/.test(sc[1])) out.notes.push(["вложенный поиск", "Ищет внутри <code>"+esc(sc[1])+"</code>."]);
    return out;
  }
  const loc = body.match(/Locator\(\s*(\$?)"((?:[^"\\]|\\.)*)"/);
  if(!loc) return out;
  let s = loc[2].replace(/\\"/g, '"');
  out.sel = s;
  const interpolated = loc[1] === "$";

  const scoped = body.match(/^(\w+)\.Locator\(/);
  if(scoped && !/^(Page|_page)$/.test(scoped[1]))
    out.notes.push(["вложенный поиск", "Ищет внутри <code>"+esc(scoped[1])+"</code>, а не по всей странице. Сужение области — главный способ не поймать одноимённый элемент в другом месте."]);

  if(interpolated)
    out.notes.push(["строка с подстановкой", "Селектор собирается из параметра метода. Один такой локатор заменяет десятки почти одинаковых."]);

  if(/^xpath=/.test(s) || /^\/\//.test(s) || /^\.\/\//.test(s)){
    out.kind = "xpath";
    XPR.forEach(([rx, pair])=>{ if(rx.test(s)) out.notes.push(pair); });
    if(!out.notes.length) out.notes.push(["XPath", "Путь по дереву документа. Гибче CSS, но обычно сильнее привязан к структуре страницы."]);
  } else {
    out.kind = "css";
    CSSR.forEach(([rx, fn])=>{
      rx.lastIndex = 0; let m, seen = new Set();
      while((m = rx.exec(s))){ const [k,v] = fn(m); if(!seen.has(k)){ seen.add(k); out.notes.push([k,v]); } if(!rx.global) break; }
    });
    if(/\s/.test(s.trim()) && !out.notes.some(n=>n[0]==="вложенный поиск"))
      out.notes.push(["потомок", "Пробел означает «внутри»: правая часть ищется среди потомков левой."]);
    if(!out.notes.length) out.notes.push(["CSS-селектор", "Обычный CSS-селектор по тегу или классу."]);
  }

  if(/\.First\b/.test(body)) out.chain.push([".First", "Берётся первый из найденных. Нужен там, где элементов заведомо несколько: без него Playwright в строгом режиме падает с ошибкой неоднозначности."]);
  if(/\.Nth\(/.test(body)) out.chain.push([".Nth(n)", "Элемент по порядковому номеру. Хрупко, если порядок задаёт бэкенд."]);
  if(/HasTextRegex/.test(body)) out.chain.push(["HasTextRegex", "Дополнительный фильтр по тексту регулярным выражением. Якоря ^ и $ дают точное совпадение — так «1» не совпадает с «11»."]);
  if(/HasText\s*=/.test(body)) out.chain.push(["HasText", "Фильтр по вхождению текста."]);
  return out;
}

function memberKindText(m, cls, file){
  const isLoc = m.t === "ILocator";
  if(m.k === "ctor") return "Конструктор. Вызывается при создании объекта; в page object обычно передаёт страницу и базовый адрес в базовый класс.";
  if(isLoc && m.k === "prop") return "Локатор — <b>рецепт поиска</b>, а не найденный элемент. Тело со стрелкой означает, что поиск выполняется заново при каждом обращении, поэтому устаревших ссылок не возникает даже после перерисовки страницы.";
  if(isLoc && m.k === "method") return "Локатор с параметром: тот же рецепт поиска, но часть селектора приходит извне.";
  if(m.k === "field" && m.m.includes("const")) return "Константа. Значение подставляется при компиляции.";
  if(m.k === "field" && /null!$/.test(m.b)) return "Поле фикстуры. <code>null!</code> — обещание компилятору, что значение появится: оно присваивается в [SetUp], о чём компилятор знать не может.";
  if(m.k === "field") return "Поле класса — хранит состояние объекта.";
  if(m.a.some(a=>a.startsWith("[Test]"))) return "Тестовый случай.";
  if(m.a.some(a=>a.startsWith("[SetUp]"))) return "Подготовка перед каждым тестом фикстуры.";
  if(m.k === "method" && m.m.includes("private")) return "Вспомогательный метод фикстуры: общий путь до нужного шага или общая проверка. Вынесен сюда, а не в page object, потому что описывает сценарий, а не страницу.";
  if(m.k === "method" && /^Task/.test(m.t)) return "Асинхронное действие над страницей.";
  if(m.k === "prop") return "Свойство.";
  return "Метод.";
}

/* ---------------- подсветка кода ---------------- */
function hiCs(s){
  s = esc(s);
  s = s.replace(/(\/\/[^\n]*)/g,'<span class="cm">$1</span>');
  s = s.replace(/("(?:[^"\\]|\\.)*")/g,'<span class="str">$1</span>');
  s = s.replace(/\b(public|private|internal|protected|static|readonly|const|async|await|override|class|record|new|return|var|string|int|bool|void|Task|ILocator|IPage|true|false|null)\b/g,'<span class="kw">$1</span>');
  s = s.replace(/\b(\d+)\b/g,'<span class="num">$1</span>');
  return s;
}

/* Обёртка над другим членом: public ILocator EmailFieldLocator => EmailField; */
function aliasTarget(body){
  if(!body) return null;
  const c = String(body).trim().match(/^(Header|NavBar|Footer)\.([A-Za-z_]\w*)\s*$/);
  if(c) return {comp:c[1], name:c[2], tail:""};
  const m = String(body).trim().match(/^([A-Za-z_]\w*)((?:\.(?:First|Last)|\.Nth\([^)]*\))*)\s*$/);
  if(!m) return null;
  if(/^(Page|_page|true|false|null|string)$/.test(m[1])) return null;
  return {name:m[1], tail:m[2]||""};
}

<div class="note trap"><b class="h">Хрупкое место проекта</b><p>Классы компонентов объявлены <code>public</code>, а их конструкторы и все локаторы — <code>internal</code>. Это компилируется <b>только</b> пока тесты лежат в одной сборке со страницами. Попытка вынести <code>Pages/</code> в отдельную библиотеку — а это первое, что делают при появлении второго тестового проекта, — сломает сборку в десятках мест. Проверить легко: класс <code>public</code>, а создать его снаружи нельзя, потому что конструктор <code>internal</code>.</p></div>

<div class="note"><b class="h">Почему у фикстуры поля private, а тесты public</b><p>NUnit находит тесты через отражение и требует, чтобы метод был <code>public</code>. Поля же нужны только самой фикстуре, поэтому они закрыты. Отсюда и характерный вид класса: <code>private</code> поле страницы, <code>private const</code> таймаут, <code>public</code> методы с <code>[Test]</code>.</p></div>`};

<h2>Путь одного действия</h2>

<h2>Локатор — это не элемент</h2>
<p class="prose">Самое важное для понимания Playwright. Свойство объявлено так:</p>

<div class="note"><b class="h">Следствие, ради которого всё и сделано</b><p>Страница может перерисоваться сколько угодно раз — «устаревшей ссылки на элемент» не возникает, потому что ссылки и нет. Если бы вместо свойства было поле, инициализированное один раз, оно бы хранило результат поиска и ломалось при каждой перерисовке.</p></div>

<h2>Три вида членов в page object этого проекта</h2>
<div class="tw"><table>
<tr><th>Вид</th><th>Видимость</th><th>Зачем</th><th>Пример</th></tr>
<tr><td>Локатор</td><td><span class="mod private">private</span></td><td>знает селектор, наружу не выходит</td><td><code>EmailField</code></td></tr>
<tr><td>Действие</td><td><span class="mod public">public</span></td><td>выражает намерение теста</td><td><code>FillEmailFieldAsync</code></td></tr>
<tr><td>Локатор-обёртка</td><td><span class="mod public">public</span></td><td>отдаёт элемент для <code>Expect()</code>, не раскрывая селектор</td><td><code>EmailFieldLocator</code></td></tr>
</table></div>
<p class="prose">В <code>ContactFormPage</code> обёрток около семидесяти — это цена того, что проверки пишутся в тестах, а не в странице. Альтернатива — методы вида <code>AssertEmailVisibleAsync</code> внутри страницы, но тогда страница начала бы знать, что считается успехом, и слои бы смешались.</p>

<h2>Где проходит граница в этом проекте</h2>
<div class="note warn"><b class="h">Общий путь до шага живёт в фикстуре, а не в странице</b><p>Методы вроде <code>GoToStep3Async</code> или <code>GoToTourStepAsync</code> объявлены <code>private</code> внутри тестовых классов. Это осознанно: они описывают <b>сценарий</b>, а не устройство страницы. Обратная сторона — такие методы дублируются между фикстурами, потому что делиться ими негде.</p></div>`};

    Object.keys(node.dirs).sort().forEach(d=>{
      const full = prefix ? prefix+"/"+d : d;
      const isOpen = open.has(full);
      h += '<button class="node dir" data-dir="'+esc(full)+'" style="padding-left:'+(12+depth*12)+'px">'+
           '<span class="ic">'+(isOpen?ICON.dirOpen:ICON.dirShut)+'</span><span class="nm">'+esc(d)+'</span></button>';
      if(isOpen) walk(node.dirs[d], full, depth+1);
    });
    node.files.sort().forEach(f=>{
      const v = MODEL[f];
      const name = f.split("/").pop();
      const badge = v.t ? v.t+" т." : (v.cl ? (v.cl[0]? v.cl[0].mem.length+" чл." : "") : v.l+" ст.");
      h += '<button class="node" data-file="'+esc(f)+'" aria-current="'+(f===curFile && !curView)+'" style="padding-left:'+(12+depth*12)+'px">'+
           '<span class="ic">'+fileIcon(f)+'</span><span class="nm">'+esc(name)+'</span><span class="bd">'+esc(badge)+'</span></button>';
    });
  };
  walk(t, "", 0);
  $("#treeBody").innerHTML = h;
  $("#treeStat").textContent = PATHS.length + " файлов";
  $("#treeBody").querySelectorAll("[data-file]").forEach(b=>b.onclick=()=>openFile(b.dataset.file));
  $("#treeBody").querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{
    const d = b.dataset.dir;
    open.has(d) ? open.delete(d) : open.add(d);
    renderTree();
  });
}

/* ---------------- вкладки ---------------- */
function renderTabs(){
  let h = '<button class="tb" data-view="" aria-selected="'+(!curView)+'">Файл</button>';
  Object.entries(VIEWS).forEach(([k,v])=>{
    h += '<button class="tb" data-view="'+k+'" aria-selected="'+(curView===k)+'">'+esc(v.t)+'</button>';
  });
  $("#tabs").innerHTML = h;
  $("#tabs").querySelectorAll(".tb").forEach(b=>b.onclick=()=>{
    curView = b.dataset.view || null;
    if(curView){ $("#paneView").innerHTML = VIEWS[curView].html(); }
    show();
  });
}
function show(){
  $("#paneFile").hidden = !!curView;
  $("#paneView").hidden = !curView;
  $("#paneFind").hidden = true;
  renderTabs(); renderTree();
  window.scrollTo({top:0, behavior:"instant"});
}

/* ---------------- группировка членов ---------------- */
function memberGroup(m, cls){
  const isLoc = m.t === "ILocator";
  const alias = isLoc ? aliasTarget(m.b) : null;
  const isWrap = isLoc && m.m.includes("public") && alias;
  if(m.a.some(a=>a.startsWith("[Test]"))) return ["tests","Тесты"];
  if(m.a.some(a=>/^\[(SetUp|TearDown|OneTime)/.test(a))) return ["hooks","Подготовка и уборка"];
  if(m.k === "ctor") return ["ctor","Конструктор"];
  if(m.k === "field") return ["fields","Поля и константы"];
  if(isWrap) return ["wrap","Публичные обёртки для Expect()"];
  if(isLoc) return ["loc","Локаторы"];
  if(m.k === "prop") return ["props","Свойства"];
  return ["methods", cls.base === "BaseTest" ? "Вспомогательные методы" : "Действия"];
}
const GROUP_ORDER = ["fields","ctor","props","loc","wrap","methods","hooks","tests"];

function sigHtml(m){
  const mods = m.m.map(x=>'<span class="mod '+(MODS[x]&&/^(public|private|internal|protected)$/.test(x)?x:"other")+'">'+x+'</span>').join(" ");
  const params = m.k==="method"||m.k==="ctor" ? "("+esc(m.p||"")+")" : "";
  return '<span class="sig">'+(m.t?'<span class="ty">'+esc(m.t)+'</span> ':'')+
         '<span class="nmm">'+esc(m.n)+'</span>'+esc(params)+'</span>';
}
function shortHint(m, file){
  const n = NOTES[file];
  if(n && n.mem && n.mem[m.n]) return n.mem[m.n].replace(/<[^>]+>/g,"").slice(0,70);
  if(m.d) return m.d.slice(0,70);
  const desc = m.a.map(a=>a.match(/^\[Description\("([\s\S]*)"\)\]$/)).find(Boolean);
  if(desc) return desc[1].slice(0,70);
  return "";
}

/* ---------------- отрисовка файла ---------------- */
function openFile(p){
  curFile = p; curView = null;
  const v = MODEL[p], n = NOTES[p] || {};
  let h = '<div class="fh"><div class="fp">Portal/'+esc(p)+'</div>'+
    '<span class="role '+(n.role||"doc")+'">'+({page:"page object",test:"тесты",infra:"инфраструктура",cfg:"конфигурация",doc:"документация"}[n.role]||"файл")+'</span>'+
    '<h1>'+esc(n.t||p.split("/").pop())+'</h1>'+
    '<p class="why">'+(n.why||"")+'</p>'+
    '<div class="meta"><span><b>'+v.l+'</b> строк</span>'+
    (v.cl?'<span><b>'+v.cl.length+'</b> класс(ов)</span><span><b>'+v.cl.reduce((a,c)=>a+c.mem.length,0)+'</b> членов</span>':'')+
    (v.t?'<span><b>'+v.t+'</b> тестов</span>':'')+
    (v.r?'<span><b>'+v.r+'</b> × [Retry]</span>':'')+
    (v.x&&v.x.length?'<span>Xray: <b>'+v.x.length+'</b></span>':'')+
    (v.ns?'<span>namespace <b>'+esc(v.ns)+'</b></span>':'')+
    '</div></div>';

  if(n.how) h += '<div class="prose">'+n.how+'</div>';

  if(v.us && v.us.length){
    h += '<h2>Что подключено</h2><div class="prose"><p>'+v.us.map(u=>'<code>'+esc(u)+'</code>').join(" · ")+'</p></div>';
  }

  (v.cl||[]).forEach((c,ci)=>{
    h += '<div class="card"><div class="card-h">'+
      '<span class="chips">'+c.m.map(x=>'<span class="mod '+(/^(public|private|internal|protected)$/.test(x)?x:"other")+'">'+x+'</span>').join(" ")+'</span>'+
      '<span class="cn">'+esc(c.k)+' '+esc(c.n)+'</span>'+
      (c.base?'<span class="cx">наследует '+esc(c.base)+'</span>':'<span class="cx">ничего не наследует</span>')+
      '</div><div class="card-b">';
    if(c.a.length) h += '<div class="chips" style="margin-bottom:9px">'+c.a.map(a=>'<span class="attr" data-attr="'+esc(a)+'">'+esc(a)+'</span>').join("")+'</div>';
    if(c.d) h += '<p style="font-size:13.5px;color:var(--ink2);margin:0 0 10px">'+esc(c.d)+'</p>';

    const groups = {};
    c.mem.forEach(m=>{ const [k,label] = memberGroup(m,c); (groups[k]=groups[k]||{label,items:[]}).items.push(m); });
    GROUP_ORDER.forEach(g=>{
      if(!groups[g]) return;
      h += '<div class="grp"><div class="grp-h">'+esc(groups[g].label)+'<span class="n">'+groups[g].items.length+'</span></div>';
      groups[g].items.forEach(m=>{
        h += '<button class="mem" data-ci="'+ci+'" data-mn="'+esc(m.n)+'" data-ln="'+m.ln+'">'+
             '<span class="chips">'+m.m.slice(0,2).map(x=>'<span class="mod '+(/^(public|private|internal|protected)$/.test(x)?x:"other")+'">'+x+'</span>').join("")+'</span>'+
             sigHtml(m)+'<span class="hint">'+esc(shortHint(m,p))+'</span></button>';
      });
      h += '</div>';
    });
    h += '</div></div>';
  });

  if(!v.cl) h += '<div class="note"><b class="h">Это не C#</b><p>Файл не содержит классов — разбор его роли выше.</p></div>';

  $("#paneFile").innerHTML = h;
  $("#paneFile").querySelectorAll(".mem").forEach(b=>b.onclick=()=>{
    const c = MODEL[p].cl[+b.dataset.ci];
    inspect(p, c, c.mem.find(x=>x.n===b.dataset.mn && x.ln==b.dataset.ln) || c.mem.find(x=>x.n===b.dataset.mn));
    $("#paneFile").querySelectorAll(".mem").forEach(x=>x.removeAttribute("aria-current"));
    b.setAttribute("aria-current","true");
  });
  $("#paneFile").querySelectorAll("[data-attr]").forEach(b=>b.onclick=()=>inspectAttr(b.dataset.attr));
  show();
}

/* ---------------- инспектор ---------------- */
function inspectAttr(a){
  const e = explainAttr(a);
  $("#inspT").textContent = e.name;
  $("#inspB").innerHTML = '<div class="sec"><div class="lb">Атрибут</div><pre><code>'+esc(a)+'</code></pre><p>'+e.text+'</p></div>';
  $("#insp").hidden = false;
}
function inspect(file, cls, m){
  if(!m) return;
  curMem = m;
  $("#inspT").textContent = m.n;
  const n = NOTES[file];
  let h = "";

  h += '<div class="sec"><div class="lb">Объявление · строка '+m.ln+'</div><pre><code>'+
       hiCs(m.m.join(" ")+" "+(m.t?m.t+" ":"")+m.n+(m.k==="method"||m.k==="ctor"?"("+(m.p||"")+")":"")+
       (m.b && m.b!=="{ … }" ? (m.k==="prop"||/=>/.test(m.b)?" => ":" = ")+m.b : ""))+'</code></pre></div>';

  const hand = n && n.mem && n.mem[m.n];
  const desc = (m.a.map(a=>a.match(/^\[Description\("([\s\S]*)"\)\]$/)).find(Boolean)||[])[1];
  h += '<div class="sec"><div class="lb">Что это</div><p>'+(hand || memberKindText(m, cls, file))+'</p>';
  if(desc) h += '<p><b>Из атрибута [Description]:</b> '+esc(desc)+'</p>';
  if(m.d) h += '<p style="border-left:2px solid var(--line);padding-left:9px"><b>Комментарий в коде:</b> '+esc(m.d)+'</p>';
  h += '</div>';

  if(m.m.length){
    h += '<div class="sec"><div class="lb">Модификаторы</div><div class="dec">';
    m.m.forEach(x=>{ const d = MODS[x]; if(d) h += '<div class="k">'+esc(x)+'</div><div class="v"><b>'+esc(d[0])+'.</b> '+d[1]+'</div>'; });
    h += '</div></div>';
  }

  if(m.a.length){
    h += '<div class="sec"><div class="lb">Атрибуты</div><div class="dec">';
    m.a.forEach(a=>{ const e = explainAttr(a); h += '<div class="k">'+esc(e.name)+'</div><div class="v">'+e.text+'</div>'; });
    h += '</div></div>';
  }

  if(m.t === "ILocator"){
    const d = decodeSelector(m.b);
    const al = aliasTarget(m.b);
    if(d.sel){
      h += '<div class="sec"><div class="lb">Разбор селектора · '+(d.kind==="xpath"?"XPath":d.kind==="role"?"по роли":"CSS")+'</div>'+
           '<pre><code>'+esc(d.sel)+'</code></pre><div class="dec">';
      d.notes.concat(d.chain).forEach(([k,v])=>{ h += '<div class="k">'+esc(k)+'</div><div class="v">'+v+'</div>'; });
      h += '</div></div>';
    } else if(al){
      const tgt = al.comp ? null : cls.mem.find(x=>x.n===al.name);
      h += '<div class="sec"><div class="lb">Обёртка</div><p>Собственного селектора нет: свойство отдаёт наружу '+
           (al.comp ? 'локатор <code>'+esc(al.name)+'</code> из компонента <code>'+esc(al.comp)+'</code>. Компонент объявляет свои члены <code>internal</code>, поэтому без такой обёртки тест до него не дотянулся бы.'
                    : 'приватный локатор <code>'+esc(al.name)+'</code> этого же класса. Так тест получает элемент для <code>Expect()</code>, не узнавая селектора.')+'</p>';
      if(tgt){
        const dd = decodeSelector(tgt.b);
        if(dd.sel){
          h += '<div class="lb" style="margin-top:8px">Селектор цели</div><pre><code>'+esc(dd.sel)+'</code></pre><div class="dec">';
          dd.notes.concat(dd.chain).forEach(([k,v])=>{ h += '<div class="k">'+esc(k)+'</div><div class="v">'+v+'</div>'; });
          h += '</div>';
        }
      }
      h += '</div>';
    }
  }

  $("#inspB").innerHTML = h;
  $("#insp").hidden = false;
}
$("#inspX").onclick = ()=>{ $("#insp").hidden = true; };

/* ---------------- поиск ---------------- */
function find(term){
  const t = term.trim().toLowerCase();
  if(t.length < 2){ $("#paneFind").hidden = true; $("#paneFile").hidden = !!curView; $("#paneView").hidden = !curView; return; }
  const hits = [];
  PATHS.forEach(p=>{
    if(p.toLowerCase().includes(t)) hits.push({p, kind:"файл", label:p, sub:(NOTES[p]&&NOTES[p].t)||""});
    (MODEL[p].cl||[]).forEach(c=>{
      if(c.n.toLowerCase().includes(t)) hits.push({p, kind:"класс", label:c.n, sub:p});
      c.mem.forEach(m=>{ if(m.n.toLowerCase().includes(t)) hits.push({p, kind:m.k==="method"?"метод":m.k==="prop"?"свойство":m.k==="field"?"поле":"конструктор", label:m.n, sub:p+" · "+c.n, mem:m.n}); });
    });
  });
  const rx = new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  $("#paneFind").innerHTML = '<h1>Найдено: '+hits.length+'</h1><div class="hits">'+
    hits.slice(0,120).map((x,i)=>'<button class="hit" data-i="'+i+'"><div class="a">'+
      esc(x.label).replace(rx,"<mark>$1</mark>")+' <span style="color:var(--ink3);font-weight:400">— '+x.kind+'</span></div>'+
      '<div class="b">'+esc(x.sub)+'</div></button>').join("")+'</div>'+
      (hits.length>120?'<p class="prose" style="margin-top:10px">Показаны первые 120.</p>':'');
  $("#paneFind").querySelectorAll(".hit").forEach(b=>b.onclick=()=>{
    const x = hits[+b.dataset.i];
    $("#q").value = "";
    openFile(x.p);
    if(x.mem){
      const btn = [...document.querySelectorAll(".mem")].find(e=>e.dataset.mn===x.mem);
      if(btn){ btn.click(); btn.scrollIntoView({block:"center"}); }
    }
  });
  $("#paneFile").hidden = true; $("#paneView").hidden = true; $("#paneFind").hidden = false;
}
$("#q").addEventListener("input", e=>find(e.target.value));
document.addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
  if(e.key==="Escape"){ $("#insp").hidden = true; $("#q").value=""; find(""); }
});

openFile(curFile);
</script>

const D = detect();

/* ── стили слоя: опираются на токены материала ───────── */

/* ── 1. ссылка «к содержанию» ─────────────────────────── */
(function skip(){
  if(!D.main) return;
  if(!D.main.id) D.main.id = "ui-main";
