<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Интерактивный тренажёр Docker: теория, тесты и практика в эмуляторе движка.">
<title>Docker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#E7ECEE; --surface:#F8FAFA; --surface-2:#DDE5E7; --surface-3:#EEF3F4;
  --line:#BFCCD0; --line-soft:#D5DEE0;
  --ink:#0C1618; --ink-2:#39494D; --ink-3:#6A7C81;
  --accent:#14707C; --accent-2:#0B4D56; --accent-soft:#D0E4E7; --accent-line:#7FB4BB;
  --signal:#C4501F;
  --ok:#2C7F55; --ok-soft:#D4E8DD;
  --warn:#9C6510; --warn-soft:#F0E3C8;
  --err:#A82A20; --err-soft:#F2D9D6;
  --term-bg:#0B1416; --term-ink:#C9DBDD; --term-dim:#5F7478; --term-line:#1D2E32;
  --grid:#C7D3D6;
  --shadow:0 1px 0 rgba(12,22,24,.05), 0 8px 24px -14px rgba(12,22,24,.35);
  --radius:3px;
  --font-ui:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-read:"Literata",Georgia,"Times New Roman",serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0B1315; --surface:#121D20; --surface-2:#19282C; --surface-3:#162226;
    --line:#28393E; --line-soft:#1F2E32;
    --ink:#DDE9EA; --ink-2:#A3B6BA; --ink-3:#76898E;
    --accent:#4FBFC9; --accent-2:#8FD9E0; --accent-soft:#10333A; --accent-line:#2C6C75;
    --signal:#EE7A46;
    --ok:#54C08A; --ok-soft:#123227;
    --warn:#DCA13C; --warn-soft:#33280F;
    --err:#E8756A; --err-soft:#361A17;
    --term-bg:#060D0F; --term-ink:#C9DBDD; --term-dim:#5A6F73; --term-line:#16262A;
    --grid:#22343A;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1315; --surface:#121D20; --surface-2:#19282C; --surface-3:#162226;
  --line:#28393E; --line-soft:#1F2E32;
  --ink:#DDE9EA; --ink-2:#A3B6BA; --ink-3:#76898E;
  --accent:#4FBFC9; --accent-2:#8FD9E0; --accent-soft:#10333A; --accent-line:#2C6C75;
  --signal:#EE7A46;
  --ok:#54C08A; --ok-soft:#123227;
  --warn:#DCA13C; --warn-soft:#33280F;
  --err:#E8756A; --err-soft:#361A17;
  --term-bg:#060D0F; --term-ink:#C9DBDD; --term-dim:#5A6F73; --term-line:#16262A;
  --grid:#22343A;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-ui); font-size:15px; line-height:1.5;
  font-synthesis-weight:none;
}
::selection{background:var(--accent-soft); color:var(--ink)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
button{font:inherit; color:inherit}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:60;
  display:flex; align-items:center; gap:18px;
  padding:0 20px; height:56px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; flex:0 0 auto}
.brand svg{display:block}
.brand b{font-weight:800; font-size:16px; letter-spacing:-.02em}
.brand span{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); display:block; margin-top:-2px;
}
.topbar .spacer{flex:1}
.progress-wrap{display:flex; align-items:center; gap:10px; min-width:0}
.progress-label{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.06em;
  color:var(--ink-3); white-space:nowrap; font-variant-numeric:tabular-nums;
}
.progress-track{
  width:160px; height:6px; background:var(--surface-2);
  border:1px solid var(--line-soft); position:relative; overflow:hidden;
}
.progress-fill{position:absolute; inset:0 auto 0 0; width:0; background:var(--accent); transition:width .4s cubic-bezier(.2,.7,.3,1)}
.ghost-btn{
  background:none; border:1px solid var(--line); color:var(--ink-2);
  font-size:12px; font-weight:500; padding:6px 11px; cursor:pointer;
  border-radius:var(--radius); transition:.15s;
}
.ghost-btn:hover{border-color:var(--accent); color:var(--accent)}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:264px minmax(0,1fr); min-height:calc(100vh - 56px)}
.rail{
  border-right:1px solid var(--line); background:var(--surface);
  padding:18px 0 40px; position:sticky; top:56px; align-self:start;
  max-height:calc(100vh - 56px); overflow-y:auto;
}
.rail-head{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3); padding:0 20px 12px;
}
.mod-btn{
  display:grid; grid-template-columns:26px 1fr auto; gap:10px; align-items:start;
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  padding:9px 16px 9px 20px; border-left:2px solid transparent; color:var(--ink-2);
  transition:background .15s,color .15s;
}
.mod-btn:hover{background:var(--surface-3); color:var(--ink)}
.mod-btn[aria-current="true"]{background:var(--accent-soft); border-left-color:var(--accent); color:var(--ink)}
.mod-n{
  font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--ink-3);
  padding-top:2px; font-variant-numeric:tabular-nums;
}
.mod-btn[aria-current="true"] .mod-n{color:var(--accent)}
.mod-t{display:block; font-size:13.5px; font-weight:600; line-height:1.3; letter-spacing:-.005em}
.mod-s{display:block; font-size:11.5px; color:var(--ink-3); font-weight:400; margin-top:1px; line-height:1.3}
.mod-dots{display:flex; gap:3px; padding-top:5px}
.dot{width:5px; height:5px; border-radius:50%; background:var(--line); }
.dot.on{background:var(--ok)}
.rail-foot{padding:16px 20px 0; margin-top:14px; border-top:1px solid var(--line-soft)}

/* ---------- stage ---------- */
.stage{padding:0 0 80px; min-width:0}
.stage-head{padding:34px 40px 0; max-width:1180px}
.eyebrow{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); margin-bottom:8px;
}
h1.mtitle{
  font-size:clamp(28px,3.4vw,40px); font-weight:800; letter-spacing:-.028em;
  margin:0 0 6px; line-height:1.08; text-wrap:balance;
}
.mlede{font-size:16px; color:var(--ink-2); max-width:62ch; margin:0}

.tabs{
  display:flex; gap:0; margin:26px 0 0; padding:0 40px;
  border-bottom:1px solid var(--line); max-width:1180px;
}
.tab{
  background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  padding:11px 2px; margin-right:26px; font-size:13.5px; font-weight:600;
  color:var(--ink-3); display:flex; align-items:center; gap:7px; transition:.15s;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tab .badge{
  font-family:var(--font-mono); font-size:10px; font-weight:700; padding:1px 5px;
  background:var(--surface-2); color:var(--ink-3); border-radius:2px;
  font-variant-numeric:tabular-nums;
}
.tab[aria-selected="true"] .badge{background:var(--accent-soft); color:var(--accent)}
.tab .badge.done{background:var(--ok-soft); color:var(--ok)}
.panel{padding:30px 40px 0; max-width:1180px}
.panel[hidden]{display:none}

/* ---------- theory ---------- */
.theory{font-family:var(--font-read); font-size:16.5px; line-height:1.68; max-width:68ch; color:var(--ink)}
.theory p{margin:0 0 1.05em}
.theory h2{
  font-family:var(--font-ui); font-size:20px; font-weight:700; letter-spacing:-.018em;
  margin:2.1em 0 .7em; padding-top:.6em; border-top:1px solid var(--line-soft); text-wrap:balance;
}
.theory h2:first-child{margin-top:0; border-top:0; padding-top:0}
.theory h3{font-family:var(--font-ui); font-size:15.5px; font-weight:700; margin:1.7em 0 .5em; letter-spacing:-.01em}
.theory ul,.theory ol{margin:0 0 1.05em; padding-left:1.35em}
.theory li{margin-bottom:.4em}
.theory li::marker{color:var(--accent)}
.theory strong{font-weight:600}
.theory em{font-style:italic; color:var(--ink-2)}
.theory a{color:var(--accent); text-underline-offset:2px}
code{
  font-family:var(--font-mono); font-size:.85em; background:var(--surface-2);
  padding:.12em .38em; border-radius:2px; color:var(--ink);
  border:1px solid var(--line-soft); white-space:nowrap;
}
.theory pre{
  font-family:var(--font-mono); font-size:12.5px; line-height:1.62;
  background:var(--term-bg); color:var(--term-ink); padding:14px 16px;
  overflow-x:auto; margin:0 0 1.2em; border-radius:var(--radius);
  border:1px solid var(--term-line);
}
.theory pre code{background:none; border:0; padding:0; font-size:inherit; color:inherit; white-space:pre}
.theory pre .c{color:var(--term-dim)}
.theory pre .k{color:#7FD6DF}
.theory pre .s{color:#E8A87C}

.callout{
  font-family:var(--font-ui); font-size:14px; line-height:1.55;
  border-left:3px solid var(--accent); background:var(--surface);
  padding:13px 16px; margin:0 0 1.3em; border-radius:0 var(--radius) var(--radius) 0;
  border-top:1px solid var(--line-soft); border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
}
.callout b{display:block; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  font-family:var(--font-mono); color:var(--accent); margin-bottom:5px; font-weight:700}
.callout.warn{border-left-color:var(--warn)} .callout.warn b{color:var(--warn)}
.callout.trap{border-left-color:var(--signal)} .callout.trap b{color:var(--signal)}
.callout p{margin:0 0 .6em} .callout p:last-child{margin:0}
.callout ul{margin:.4em 0 0; padding-left:1.2em}

.fig{margin:0 0 1.6em; max-width:100%}
.fig svg{display:block; width:100%; height:auto}
.fig figcaption{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-3);
  margin-top:9px; letter-spacing:.02em; line-height:1.45;
}
.tbl-wrap{overflow-x:auto; margin:0 0 1.4em; border:1px solid var(--line); border-radius:var(--radius)}
table.t{border-collapse:collapse; width:100%; font-family:var(--font-ui); font-size:13.5px; min-width:480px}
table.t th{
  text-align:left; font-weight:700; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  font-family:var(--font-mono); color:var(--ink-3); padding:9px 13px;
  background:var(--surface-3); border-bottom:1px solid var(--line);
}
table.t td{padding:9px 13px; border-bottom:1px solid var(--line-soft); vertical-align:top; line-height:1.45}
table.t tr:last-child td{border-bottom:0}
table.t code{white-space:nowrap}

/* ---------- quiz ---------- */
.quiz{max-width:760px}
.q-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px 22px; margin-bottom:14px;
}
.q-num{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.12em; color:var(--ink-3);
  text-transform:uppercase; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;
}
.q-text{font-size:15.5px; font-weight:600; line-height:1.45; margin:0 0 14px; letter-spacing:-.008em}
.q-text code{font-weight:400}
.opts{display:flex; flex-direction:column; gap:7px}
.opt{
  display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%;
  background:var(--surface-3); border:1px solid var(--line-soft); border-radius:var(--radius);
  padding:10px 13px; cursor:pointer; font-size:14px; line-height:1.45; transition:.12s;
}
.opt:hover:not(:disabled){border-color:var(--accent-line); background:var(--surface)}
.opt:disabled{cursor:default}
.opt .mk{
  font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--ink-3);
  border:1px solid var(--line); width:19px; height:19px; display:grid; place-items:center;
  flex:0 0 auto; margin-top:1px; border-radius:2px;
}
.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .mk{border-color:var(--ok); color:var(--ok)}
.opt.wrong{border-color:var(--err); background:var(--err-soft)}
.opt.wrong .mk{border-color:var(--err); color:var(--err)}
.why{
  margin-top:13px; font-size:13.5px; line-height:1.55; color:var(--ink-2);
  border-left:2px solid var(--line); padding-left:12px;
}
.why b{color:var(--ink); font-weight:600}
.why.good{border-left-color:var(--ok)} .why.bad{border-left-color:var(--err)}
.quiz-score{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  border:1px solid var(--line); background:var(--surface); border-radius:var(--radius);
  padding:15px 18px; margin-bottom:20px;
}
.quiz-score .big{font-size:26px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.quiz-score p{margin:0; font-size:13px; color:var(--ink-2)}

/* ---------- labs ---------- */
.lab-picker{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px}
.lab-chip{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-2);
  display:flex; align-items:center; gap:7px; transition:.14s;
}
.lab-chip:hover{border-color:var(--accent-line); color:var(--ink)}
.lab-chip[aria-current="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.lab-chip .tick{width:14px; height:14px; flex:0 0 auto}
.lab-chip .tick circle{fill:none; stroke:var(--line); stroke-width:1.5}
.lab-chip.done .tick circle{fill:var(--ok); stroke:var(--ok)}
.lab-chip.done .tick path{stroke:var(--surface); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round}

.lab-grid{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr); gap:18px; align-items:start}
.lab-grid > *{min-width:0}
.lab-brief{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; margin-bottom:14px;
}
.lab-brief h3{margin:0 0 9px; font-size:17px; font-weight:700; letter-spacing:-.015em}
.lab-brief p{margin:0 0 .8em; font-size:14.5px; line-height:1.55; color:var(--ink-2)}
.lab-brief p:last-child{margin-bottom:0}
.lab-brief ul{margin:0 0 .8em; padding-left:1.25em; font-size:14.5px; line-height:1.55; color:var(--ink-2)}
.lab-brief li{margin-bottom:.3em}
.lab-brief li::marker{color:var(--accent)}
.lab-brief code{white-space:normal}
.lab-tools{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; padding-top:13px; border-top:1px solid var(--line-soft)}

.term{
  background:var(--term-bg); border:1px solid var(--term-line); border-radius:var(--radius);
  overflow:hidden; display:flex; flex-direction:column; min-height:420px; min-width:0;
}
.term-bar{
  display:flex; align-items:center; gap:9px; padding:8px 12px;
  border-bottom:1px solid var(--term-line); background:rgba(255,255,255,.02);
}
.term-bar .lamp{width:8px; height:8px; border-radius:50%; background:var(--term-dim); opacity:.5}
.term-bar .ttl{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--term-dim); margin-left:4px;
}
.term-bar .right{margin-left:auto; font-family:var(--font-mono); font-size:10.5px; color:var(--term-dim)}
.term-out{
  flex:1; overflow-y:auto; padding:12px 14px; font-family:var(--font-mono);
  font-size:12.5px; line-height:1.55; color:var(--term-ink); white-space:pre;
  overflow-x:auto; max-height:52vh; min-height:300px; min-width:0;
}
.term-out .cmd{color:#7FD6DF}
.term-out .cmd .pfx{color:var(--term-dim)}
.term-out .err{color:#F08C7E}
.term-out .ok{color:#7FCF9F}
.term-out .dim{color:var(--term-dim)}
.term-out .warn{color:#E5BB63}
.term-in{display:flex; align-items:center; gap:8px; border-top:1px solid var(--term-line); padding:9px 14px}
.term-in .pfx{font-family:var(--font-mono); font-size:12.5px; color:#7FD6DF; flex:0 0 auto}
.term-in input{
  flex:1; background:none; border:0; outline:none; color:var(--term-ink);
  font-family:var(--font-mono); font-size:12.5px; padding:0; min-width:0;
}
.term-in input::placeholder{color:var(--term-dim)}

.side{display:flex; flex-direction:column; gap:14px; position:sticky; top:70px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.card-head{
  display:flex; align-items:center; gap:8px; padding:9px 14px; border-bottom:1px solid var(--line-soft);
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
}
.card-head .count{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink-3)}
.card-body{padding:13px 14px}
.checks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px}
.checks li{display:grid; grid-template-columns:17px 1fr; gap:10px; font-size:13px; line-height:1.42; color:var(--ink-2)}
.checks li.on{color:var(--ink)}
.checks .bx{
  width:15px; height:15px; border:1.5px solid var(--line); border-radius:2px; margin-top:1px;
  display:grid; place-items:center; transition:.2s;
}
.checks li.on .bx{background:var(--ok); border-color:var(--ok)}
.checks .bx svg{opacity:0; transition:.2s} .checks li.on .bx svg{opacity:1}
.checks code{font-size:12px}
.lab-done[hidden]{display:none}
.lab-done{
  display:flex; align-items:center; gap:10px; padding:11px 14px;
  background:var(--ok-soft); border-top:1px solid var(--ok); color:var(--ok);
  font-size:13px; font-weight:600;
}

.vizbar{display:flex; gap:0; border-bottom:1px solid var(--line-soft); padding:0 14px; background:var(--surface-3)}
.vizbar button{
  background:none; border:0; border-bottom:2px solid transparent; cursor:pointer;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); padding:9px 0; margin-right:18px; transition:.14s;
}
.vizbar button:hover{color:var(--ink)}
.vizbar button[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent)}
.viz{padding:0; overflow-x:auto; background:var(--surface)}
.viz svg{display:block; width:100%; height:auto}
.viz-empty{
  padding:34px 16px; text-align:center; color:var(--ink-3);
  font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em; line-height:1.6;
}
.statelist{font-family:var(--font-mono); font-size:11.5px; line-height:1.7}
.statelist .row{display:flex; gap:9px; padding:3px 0; border-bottom:1px solid var(--line-soft)}
.statelist .row:last-child{border-bottom:0}
.statelist .row span:first-child{color:var(--ink-3); flex:0 0 86px}
.statelist .grp{
  font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent);
  margin:11px 0 3px; font-weight:700;
}
.statelist .grp:first-child{margin-top:0}

.hintbox{
  font-size:13.5px; line-height:1.55; color:var(--ink-2); background:var(--surface-3);
  border:1px dashed var(--line); border-radius:var(--radius); padding:12px 14px; margin-top:12px;
}
.hintbox code{background:var(--surface)}
.cheat{
  font-family:var(--font-mono); font-size:11.5px; line-height:1.85; color:var(--ink-2);
  max-height:230px; overflow-y:auto;
}
.cheat b{color:var(--accent); font-weight:700}

.done-banner{
  display:flex; gap:14px; align-items:center; padding:16px 20px; margin-bottom:20px;
  border:1px solid var(--ok); background:var(--ok-soft); border-radius:var(--radius);
}
.done-banner strong{font-size:15px; display:block; margin-bottom:2px}
.done-banner p{margin:0; font-size:13px; color:var(--ink-2)}

.navfoot{
  display:flex; justify-content:space-between; gap:14px; align-items:center;
  padding:26px 40px 0; max-width:1180px; margin-top:34px; border-top:1px solid var(--line);
}
.navfoot button{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 16px; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--ink);
  display:flex; align-items:center; gap:9px; transition:.14s; text-align:left;
}
.navfoot button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.navfoot button:disabled{opacity:.35; cursor:default}
.navfoot .sub{display:block; font-size:11px; font-weight:400; color:var(--ink-3)}

.act{
  background:var(--accent); border:1px solid var(--accent); color:var(--surface);
  border-radius:var(--radius); padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;
  transition:.14s;
}
:root[data-theme="dark"] .act, :root:not([data-theme="light"]) .act{color:var(--ground)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .act{color:#fff}}
.act:hover{background:var(--accent-2); border-color:var(--accent-2)}
.mini{
  background:var(--surface-3); border:1px solid var(--line); color:var(--ink-2);
  border-radius:var(--radius); padding:6px 11px; font-size:12px; font-weight:500; cursor:pointer; transition:.14s;
}
.mini:hover{border-color:var(--accent); color:var(--accent)}
.mini.mono{font-family:var(--font-mono); font-size:11.5px}

.fileview{font-family:var(--font-mono); font-size:11.5px; line-height:1.6; max-height:260px; overflow:auto}
.fileview .fname{color:var(--accent); font-weight:700; margin:9px 0 2px}
.fileview .fname:first-child{margin-top:0}
.fileview pre{margin:0; white-space:pre-wrap; color:var(--ink-2); word-break:break-word}

@media (max-width:1080px){
  .lab-grid{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{
    position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line);
    display:flex; overflow-x:auto; padding:10px 12px; gap:8px;
  }
  .rail-head,.rail-foot{display:none}
  .mod-btn{
    grid-template-columns:auto; width:auto; flex:0 0 auto; border-left:0; border-bottom:2px solid transparent;
    padding:7px 12px; background:var(--surface-3); border-radius:var(--radius);
  }
  .mod-btn[aria-current="true"]{border-bottom-color:transparent}
  .mod-s,.mod-dots{display:none}
  .mod-t{white-space:nowrap; font-size:12.5px}
  .stage-head,.tabs,.panel,.navfoot{padding-left:18px; padding-right:18px}
  .theory{font-size:16px}
  .topbar{padding:0 14px; gap:12px}
  .progress-track{width:80px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

<script>
"use strict";
/* ============================================================
   Эмулятор движка Docker
   ============================================================ */

const KB=1024, MB=1024*KB, GB=1024*MB;
const hex = n => Array.from({length:n},()=>"0123456789abcdef"[Math.floor(Math.random()*16)]).join("");
const ADJ=["brave","calm","clever","eager","gentle","jolly","keen","lucid","mystic","nifty","quirky","serene","stoic","vivid","zealous","amber","bold"];
const SCI=["turing","hopper","lovelace","curie","tesla","ritchie","thompson","knuth","dijkstra","noether","shannon","hamilton","kare","goldberg"];
const petName = () => ADJ[Math.floor(Math.random()*ADJ.length)]+"_"+SCI[Math.floor(Math.random()*SCI.length)];

function fmtSize(b){
  if(b<=0) return "0B";
  if(b<KB) return b+"B";
  if(b<MB) return (b/KB).toFixed(b/KB<10?2:1)+"kB";
  if(b<GB) return (b/MB).toFixed(b/MB<10?1:0)+"MB";
  return (b/GB).toFixed(2)+"GB";
}
function fmtAgo(ts){
  const s=Math.max(1,Math.floor((Date.now()-ts)/1000));
  if(s<60) return s+" second"+(s===1?"":"s")+" ago";
  const m=Math.floor(s/60); if(m<60) return m+" minute"+(m>1?"s":"")+" ago";
  const h=Math.floor(m/60); if(h<24) return h+" hour"+(h>1?"s":"")+" ago";
  return Math.floor(h/24)+" days ago";
}
function fmtUp(ts){
  const s=Math.max(1,Math.floor((Date.now()-ts)/1000));
  if(s<60) return "Up "+s+" second"+(s===1?"":"s");
  const m=Math.floor(s/60); if(m<60) return "Up "+m+" minute"+(m>1?"s":"");
  return "Up "+Math.floor(m/60)+" hours";
}
function hash32(str){
  let h=2166136261>>>0;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  return h.toString(16).padStart(8,"0");
}

/* ---------------- реестр базовых образов ---------------- */
const OSREL = name => "NAME=\""+name+"\"\nID="+name.toLowerCase().split(" ")[0]+"\nPRETTY_NAME=\""+name+"\"\n";
const baseFS = os => ({
  "/etc/os-release":OSREL(os),
  "/etc/passwd":"root:x:0:0:root:/root:/bin/sh\nnobody:x:65534:65534:nobody:/:/sbin/nologin\n",
  "/etc/hosts":"127.0.0.1\tlocalhost\n",
  "/bin/sh":"<binary>", "/usr/bin/env":"<binary>"
});

const REGISTRY = {};
function reg(ref, o){
  const [repo,tag] = ref.split(":");
  REGISTRY[ref] = Object.assign({
    repo, tag, size:10*MB, cmd:["/bin/sh"], entrypoint:null, env:{PATH:"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"},
    workdir:"/", user:"root", exposed:[], volumes:[], fs:baseFS("Alpine Linux v3.19"),
    kind:"shell", serve:null, logs:[], health:null, digest:"sha256:"+hex(12)
  }, o);
}

reg("alpine:3.19",{size:7.8*MB, cmd:["/bin/sh"], kind:"shell", fs:baseFS("Alpine Linux v3.19")});
reg("alpine:latest",{size:7.8*MB, cmd:["/bin/sh"], kind:"shell", fs:baseFS("Alpine Linux v3.19")});
reg("busybox:latest",{size:4.3*MB, cmd:["sh"], kind:"shell", fs:baseFS("BusyBox")});
reg("ubuntu:22.04",{size:77*MB, cmd:["/bin/bash"], kind:"shell", fs:baseFS("Ubuntu 22.04.4 LTS")});
reg("debian:12-slim",{size:74*MB, cmd:["bash"], kind:"shell", fs:baseFS("Debian GNU/Linux 12 (bookworm)")});

reg("nginx:alpine",{size:43*MB, cmd:["nginx","-g","daemon off;"], kind:"server", exposed:["80/tcp"],
  serve:{type:"static", root:"/usr/share/nginx/html"},
  fs:Object.assign(baseFS("Alpine Linux v3.19"),{
    "/usr/share/nginx/html/index.html":"<html><head><title>Welcome to nginx!</title></head>\n<body><h1>Welcome to nginx!</h1>\n<p>If you see this page, the nginx web server is successfully installed.</p></body></html>",
    "/etc/nginx/nginx.conf":"user nginx;\nworker_processes auto;\nhttp { include /etc/nginx/conf.d/*.conf; }\n",
    "/etc/nginx/conf.d/default.conf":"server {\n    listen       80;\n    server_name  localhost;\n    location / {\n        root   /usr/share/nginx/html;\n        index  index.html;\n    }\n}\n"}),
  logs:["/docker-entrypoint.sh: Configuration complete; ready for start up",
        "nginx: using the \"epoll\" event method",
        "nginx: start worker processes"]});
REGISTRY["nginx:1.25-alpine"] = Object.assign({},REGISTRY["nginx:alpine"],{tag:"1.25-alpine"});
REGISTRY["nginx:latest"] = Object.assign({},REGISTRY["nginx:alpine"],{tag:"latest", size:187*MB, fs:Object.assign({},REGISTRY["nginx:alpine"].fs,{"/etc/os-release":OSREL("Debian GNU/Linux 12 (bookworm)")})});

reg("httpd:2.4-alpine",{size:57*MB, cmd:["httpd-foreground"], kind:"server", exposed:["80/tcp"],
  serve:{type:"static", root:"/usr/local/apache2/htdocs"},
  fs:Object.assign(baseFS("Alpine Linux v3.19"),{"/usr/local/apache2/htdocs/index.html":"<html><body><h1>It works!</h1></body></html>"}),
  logs:["AH00558: httpd: Could not reliably determine the server's fully qualified domain name",
        "[mpm_event:notice] AH00489: Apache/2.4.58 configured -- resuming normal operations"]});

reg("node:20-alpine",{size:135*MB, cmd:["node"], kind:"shell",
  env:{PATH:"/usr/local/bin:/usr/bin:/bin", NODE_VERSION:"20.11.1"},
  fs:Object.assign(baseFS("Alpine Linux v3.19"),{"/usr/local/bin/node":"<binary>","/usr/local/bin/npm":"<binary>"})});
reg("node:20-slim",{size:220*MB, cmd:["node"], kind:"shell",
  env:{PATH:"/usr/local/bin:/usr/bin:/bin", NODE_VERSION:"20.11.1"},
  fs:Object.assign(baseFS("Debian GNU/Linux 12 (bookworm)"),{"/usr/local/bin/node":"<binary>","/usr/local/bin/npm":"<binary>"})});
reg("node:20",{size:1.09*GB, cmd:["node"], kind:"shell",
  env:{PATH:"/usr/local/bin:/usr/bin:/bin", NODE_VERSION:"20.11.1"},
  fs:Object.assign(baseFS("Debian GNU/Linux 12 (bookworm)"),{"/usr/local/bin/node":"<binary>","/usr/local/bin/npm":"<binary>"})});

reg("python:3.12-alpine",{size:52*MB, cmd:["python3"], kind:"shell",
  fs:Object.assign(baseFS("Alpine Linux v3.19"),{"/usr/local/bin/python":"<binary>","/usr/local/bin/pip":"<binary>"})});
reg("python:3.12-slim",{size:130*MB, cmd:["python3"], kind:"shell",
  fs:Object.assign(baseFS("Debian GNU/Linux 12 (bookworm)"),{"/usr/local/bin/python":"<binary>","/usr/local/bin/pip":"<binary>"})});
reg("python:3.12",{size:1.02*GB, cmd:["python3"], kind:"shell",
  fs:Object.assign(baseFS("Debian GNU/Linux 12 (bookworm)"),{"/usr/local/bin/python":"<binary>","/usr/local/bin/pip":"<binary>"})});

reg("golang:1.22-alpine",{size:251*MB, cmd:["/bin/sh"], kind:"shell",
  fs:Object.assign(baseFS("Alpine Linux v3.19"),{"/usr/local/go/bin/go":"<binary>"})});

reg("postgres:16-alpine",{size:246*MB, cmd:["postgres"], kind:"server", exposed:["5432/tcp"],
  env:{PGDATA:"/var/lib/postgresql/data", PATH:"/usr/local/bin:/usr/bin:/bin"},
  volumes:["/var/lib/postgresql/data"], needsEnv:["POSTGRES_PASSWORD"],
  fs:Object.assign(baseFS("Alpine Linux v3.19"),{"/usr/local/bin/psql":"<binary>"}),
  logs:["The files belonging to this database system will be owned by user \"postgres\".",
        "database system is ready to accept connections"]});
reg("redis:7-alpine",{size:41*MB, cmd:["redis-server"], kind:"server", exposed:["6379/tcp"],
  volumes:["/data"],
  fs:Object.assign(baseFS("Alpine Linux v3.19"),{"/usr/local/bin/redis-cli":"<binary>"}),
  logs:["Redis version=7.2.4, bits=64, commit=00000000, modified=0, pid=1, just started",
        "Ready to accept connections tcp"]});
reg("mysql:8",{size:586*MB, cmd:["mysqld"], kind:"server", exposed:["3306/tcp"],
  volumes:["/var/lib/mysql"], needsEnv:["MYSQL_ROOT_PASSWORD"],
  fs:baseFS("Oracle Linux Server 8.9"),
  logs:["[Server] /usr/sbin/mysqld: ready for connections. Version: '8.3.0'"]});

reg("gcr.io/distroless/static:nonroot",{size:2.4*MB, cmd:[], kind:"shell", user:"nonroot",
  fs:{"/etc/passwd":"nonroot:x:65532:65532::/home/nonroot:/sbin/nologin\n"}});
reg("scratch:latest",{size:0, cmd:[], kind:"shell", fs:{}});

const REG_LIST = Object.keys(REGISTRY);

/* ---------------- состояние движка ---------------- */
function newState(){
  return {
    images:[], containers:[], volumes:[],
    networks:[
      {id:hex(12), name:"bridge", driver:"bridge", subnet:"172.17.0.0/16", builtin:true, next:2},
      {id:hex(12), name:"host", driver:"host", builtin:true, next:2},
      {id:hex(12), name:"none", driver:"null", builtin:true, next:2}
    ],
    files:{}, volStore:{}, buildCache:{}, netSeq:18,
    cwd:"/work", shellIn:null, history:[], pushed:[]
  };
}

/* ---------------- работа с образами ---------------- */
function refParse(ref){
  if(!ref) return null;
  let repo=ref, tag="latest";
  const slash = ref.lastIndexOf("/"), colon = ref.lastIndexOf(":");
  if(colon>slash && colon>-1){ repo=ref.slice(0,colon); tag=ref.slice(colon+1); }
  return {repo, tag, full:repo+":"+tag};
}
function findImage(st, ref){
  if(!ref) return null;
  const r = refParse(ref);
  let img = st.images.find(i=>i.repo===r.repo && i.tag===r.tag);
  if(img) return img;
  return st.images.find(i=>i.id.startsWith(ref) && ref.length>=3) || null;
}
function imgSize(img){ return img.layers.reduce((a,l)=>a+l.size,0); }

function pullImage(st, ref, out){
  const r = refParse(ref);
  const key = REGISTRY[r.full] ? r.full : null;
  if(!key){
    out.err("Error response from daemon: pull access denied for "+r.repo+", repository does not exist or may require 'docker login'");
    out.dim("Доступные в этом эмуляторе образы: "+REG_LIST.filter(k=>k!=="scratch:latest").join(", "));
    return null;
  }
  const exist = st.images.find(i=>i.repo===r.repo && i.tag===r.tag);
  if(exist){ out.line(r.tag+": Pulling from library/"+r.repo); out.line("Digest: "+exist.digest); out.line("Status: Image is up to date for "+r.full); return exist; }
  const b = REGISTRY[key];
  out.line(r.tag+": Pulling from library/"+r.repo);
  const nl = b.size>200*MB?4:2;
  for(let i=0;i<nl;i++){ out.dim(hex(12)+": Pull complete"); }
  const img = {
    id:hex(12), repo:r.repo, tag:r.tag, digest:b.digest, created:Date.now(),
    layers: splitLayers(b),
    config:{cmd:b.cmd.slice(), entrypoint:b.entrypoint?b.entrypoint.slice():null, env:Object.assign({},b.env),
            workdir:b.workdir, user:b.user, exposed:b.exposed.slice(), volumes:b.volumes.slice(),
            health:b.health, labels:{}},
    fs:Object.assign({},b.fs), kind:b.kind, serve:b.serve?Object.assign({},b.serve):null,
    baseLogs:b.logs.slice(), needsEnv:b.needsEnv||[], users:["root","nobody"]
  };
  st.images.push(img);
  out.line("Digest: "+b.digest);
  out.line("Status: Downloaded newer image for "+r.full);
  return img;
}
function splitLayers(b){
  const L=[];
  L.push({id:hex(12), cmd:"/bin/sh -c #(nop) ADD file:"+hex(8)+" in / ", size:b.size, base:true});
  if(b.env && Object.keys(b.env).length) L.push({id:hex(12), cmd:"/bin/sh -c #(nop)  ENV "+Object.entries(b.env).map(([k,v])=>k+"="+v).join(" "), size:0});
  if(b.exposed && b.exposed.length) L.push({id:hex(12), cmd:"/bin/sh -c #(nop)  EXPOSE "+b.exposed.join(" "), size:0});
  L.push({id:hex(12), cmd:"/bin/sh -c #(nop)  CMD [\""+(b.cmd||[]).join("\",\"")+"\"]", size:0});
  return L;
}

/* ---------------- разбор командной строки ---------------- */
function tokenize(line){
  const t=[]; let cur="", q=null;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){ if(c===q){q=null;} else cur+=c; continue; }
    if(c==='"'||c==="'"){ q=c; continue; }
    if(c===" "||c==="\t"){ if(cur){t.push(cur);cur="";} continue; }
    cur+=c;
  }
  if(cur) t.push(cur);
  return t;
}
const ALIAS={"-p":"--publish","-v":"--volume","-e":"--env","-w":"--workdir","-u":"--user","-m":"--memory",
  "-f":"--file","-l":"--label","-h":"--hostname","-n":"--tail","-a":"--all","-q":"--quiet","-d":"--detach",
  "-i":"--interactive","-t":"--tty","-P":"--publish-all","-s":"--size","-c":"--command","-o":"--output"};
function parseArgs(tokens, valueFlags, stopAtFirstArg){
  const flags={}, rest=[];
  const push=(k,v)=>{ (flags[k]=flags[k]||[]).push(v); };
  let i=0, stopped=false;
  for(;i<tokens.length;i++){
    let t=tokens[i];
    if(stopped){ rest.push(t); continue; }
    if(t==="--"){ stopped=true; continue; }
    if(t.startsWith("--")){
      let name=t, val=null;
      const eq=t.indexOf("=");
      if(eq>-1){ name=t.slice(0,eq); val=t.slice(eq+1); }
      if(val===null && valueFlags.has(name)){ val=tokens[++i]; }
      push(name, val===undefined?null:val);
    } else if(t.startsWith("-") && t.length>1){
      const eq=t.indexOf("=");
      if(eq>-1){ const n=ALIAS[t.slice(0,eq)]||t.slice(0,eq); push(n,t.slice(eq+1)); continue; }
      const letters=t.slice(1).split("");
      let consumed=false;
      for(let j=0;j<letters.length;j++){
        const sh="-"+letters[j];
        const n=ALIAS[sh]||sh;
        if(valueFlags.has(n)||valueFlags.has(sh)){
          const inline=t.slice(j+2);
          if(inline){ push(n,inline); consumed=true; break; }
          push(n, tokens[++i]); consumed=true; break;
        }
        push(n,true);
      }
      if(consumed) continue;
    } else {
      rest.push(t);
      if(stopAtFirstArg){ stopped=true; }
    }
  }
  return {flags, rest,
    has:k=>Object.prototype.hasOwnProperty.call(flags,k),
    one:k=>flags[k]?flags[k][flags[k].length-1]:undefined,
    all:k=>flags[k]||[]};
}

/* ---------------- файловая система контейнера ---------------- */
function normPath(p, cwd){
  if(!p.startsWith("/")) p = (cwd==="/"?"":cwd)+"/"+p;
  const parts=[];
  p.split("/").forEach(s=>{ if(!s||s===".") return; if(s===".."){parts.pop(); return;} parts.push(s); });
  return "/"+parts.join("/");
}
function mountFor(c, path){
  let best=null;
  (c.mounts||[]).forEach(m=>{ if(path===m.target || path.startsWith(m.target.replace(/\/$/,"")+"/")){ if(!best||m.target.length>best.target.length) best=m; } });
  return best;
}
function mountStore(st, m){
  if(m.type==="volume") return (st.volStore[m.source] = st.volStore[m.source]||{});
  if(m.type==="tmpfs") return (m.mem = m.mem||{});
  return st.files;
}
function mountKey(m, path, st){
  const relRaw = path.slice(m.target.length).replace(/^\//,"");
  if(m.type==="bind"){ return normPath(m.source.replace(/\/$/,"")+(relRaw?"/"+relRaw:""), "/"); }
  return "/"+relRaw;
}
function cRead(st, c, path){
  path = normPath(path, c.workdir||"/");
  const m = mountFor(c, path);
  if(m){
    const store = mountStore(st,m), key = mountKey(m,path,st);
    if(Object.prototype.hasOwnProperty.call(store,key)) return store[key];
    if(m.type==="volume" || m.type==="tmpfs") return undefined;
    return undefined;
  }
  if(Object.prototype.hasOwnProperty.call(c.layer,path)) return c.layer[path];
  const img = c.imageObj;
  return img && img.fs ? img.fs[path] : undefined;
}
function cWrite(st, c, path, val){
  path = normPath(path, c.workdir||"/");
  if(c.readOnly){ const m0=mountFor(c,path); if(!m0 || m0.type==="bind"&&m0.ro) return {err:"Read-only file system"}; if(!m0) return {err:"Read-only file system"}; }
  const m = mountFor(c, path);
  if(m){
    if(m.ro) return {err:"Read-only file system"};
    const store = mountStore(st,m); store[mountKey(m,path,st)]=val; return {ok:true};
  }
  c.layer[path]=val; return {ok:true};
}
function cList(st, c, dir){
  dir = normPath(dir, c.workdir||"/");
  const pre = dir==="/"?"/":dir+"/";
  const names=new Set();
  const add = p => { if(!p.startsWith(pre)) return; const rest=p.slice(pre.length); if(!rest) return; const seg=rest.split("/")[0]; names.add(seg + (rest.includes("/")?"/":"")); };
  if(c.imageObj && c.imageObj.fs) Object.keys(c.imageObj.fs).forEach(add);
  Object.keys(c.layer).forEach(add);
  (c.mounts||[]).forEach(m=>{
    const store=mountStore(st,m);
    if(m.target===dir || m.target.startsWith(pre)){ if(m.target!==dir){ const rest=m.target.slice(pre.length); names.add(rest.split("/")[0]+"/"); } }
    if(m.target===dir || dir.startsWith(m.target.replace(/\/$/,"")+"/")){
      Object.keys(store).forEach(k=>{
        let virt;
        if(m.type==="bind"){ const src=m.source.replace(/\/$/,""); if(k!==src && !k.startsWith(src+"/")) return; virt = m.target + k.slice(src.length); }
        else virt = normPath(m.target+"/"+k,"/");
        add(virt);
      });
    }
  });
  return [...names].sort();
}

/* ---------------- сети ---------------- */
function netByName(st,n){ return st.networks.find(x=>x.name===n) || st.networks.find(x=>x.id.startsWith(n)&&n.length>=3); }
function allocIP(net){
  if(net.name==="bridge") return "172.17.0."+(net.next++);
  if(net.driver==="host"||net.driver==="null") return "";
  const base = net.subnet.split(".").slice(0,3).join(".");
  return base+"."+(net.next++);
}
function attach(st,c,net,aliases){
  c.networks[net.name]={ip:allocIP(net), aliases:aliases||[]};
}
function resolveName(st, fromC, name){
  const nets = Object.keys(fromC.networks);
  for(const n of nets){
    const net = netByName(st,n);
    if(!net || net.builtin && net.name==="bridge") continue;
    const hit = st.containers.find(c=>c.status==="running" && c.networks[n] &&
      (c.name===name || (c.networks[n].aliases||[]).includes(name) || c.hostname===name || c.composeService===name));
    if(hit) return hit;
  }
  return null;
}

/* ---------------- контейнеры ---------------- */
function findContainer(st, ref){
  return st.containers.find(c=>c.name===ref) ||
         st.containers.find(c=>c.id.startsWith(ref)&&ref.length>=2) || null;
}
function parsePublish(spec){
  const parts=spec.split(":");
  let proto="tcp", last=parts[parts.length-1];
  if(last.includes("/")){ const [p,pr]=last.split("/"); parts[parts.length-1]=p; proto=pr; }
  if(parts.length===1) return {host:null, cont:+parts[0], proto};
  if(parts.length===2) return {host:+parts[0], cont:+parts[1], proto};
  return {hostIp:parts[0], host:+parts[1], cont:+parts[2], proto};
}
function parseMount(st, spec){
  const p=spec.split(":");
  if(p.length===1) return {type:"volume", source:"anon_"+hex(6), target:p[0], anon:true};
  const ro = p[2]==="ro";
  const src=p[0], tgt=p[1];
  if(src.startsWith("/")||src.startsWith(".")||src.startsWith("~")){
    let s=src.replace(/^~/,"/root").replace(/^\.\//,"/work/").replace(/^\.$/,"/work");
    return {type:"bind", source:normPath(s,"/work"), target:tgt, ro};
  }
  return {type:"volume", source:src, target:tgt, ro};
}
function ensureVolume(st,name){
  let v=st.volumes.find(v=>v.name===name);
  if(!v){ v={name, driver:"local", mountpoint:"/var/lib/docker/volumes/"+name+"/_data", created:Date.now()}; st.volumes.push(v); st.volStore[name]=st.volStore[name]||{}; }
  return v;
}
const LONG_RUNNING = ["nginx","httpd","httpd-foreground","postgres","mysqld","redis-server","sleep","tail","node","python3","python","serve","gunicorn","java","top","yes","docker-entrypoint.sh"];
function isLongRunning(cmd, img){
  if(!cmd || !cmd.length) return false;
  const c0 = cmd[0].split("/").pop();
  if(LONG_RUNNING.includes(c0)){
    if((c0==="node"||c0==="python3"||c0==="python") && cmd.length===1) return false;
    if(c0==="tail" && !cmd.includes("-f")) return false;
    return true;
  }
  return false;
}
const unesc = s => String(s).replace(/\\n/g,"\n").replace(/\\t/g,"\t");
/* ---------------- вывод ---------------- */
function mkOut(){
  const L=[];
  const push=(t,cls)=>L.push({t:t===undefined?"":String(t),cls:cls||""});
  return {L, line:t=>push(t), err:t=>push(t,"err"), dim:t=>push(t,"dim"),
          ok:t=>push(t,"ok"), warn:t=>push(t,"warn"), raw:(t,c)=>push(t,c)};
}
function table(out, headers, rows){
  const w = headers.map((h,i)=>Math.max(h.length, ...rows.map(r=>String(r[i]==null?"":r[i]).length)));
  out.dim(headers.map((h,i)=>h.padEnd(w[i])).join("   ").trimEnd());
  rows.forEach(r=>out.line(r.map((c,i)=>String(c==null?"":c).padEnd(w[i])).join("   ").trimEnd()));
}

/* ---------------- HTTP внутри «сети» ---------------- */
function serveFrom(st, c, path){
  const img=c.imageObj;
  const s = img && img.serve;
  if(!s){
    if(img && (img.kind==="server")) return {err:"curl: (52) Empty reply from server"};
    return {err:"curl: (7) Failed to connect: Connection refused"};
  }
  if(s.type==="static"){
    const p = (path==="/"||!path) ? s.root+"/index.html" : s.root+path;
    const v = cRead(st,c,p);
    if(v===undefined) return {status:404, body:"<html><head><title>404 Not Found</title></head><body><center><h1>404 Not Found</h1></center><hr><center>nginx</center></body></html>"};
    c.logs.push("172.17.0.1 - - \""+"GET "+(path||"/")+" HTTP/1.1\" 200 "+String(v).length+" \"-\" \"curl/8.4.0\"");
    return {status:200, body:String(v)};
  }
  if(s.type==="app"){
    const idx = cRead(st,c,"/app/index.html");
    if(idx!==undefined) return {status:200, body:String(idx)};
    const g = c.env.GREETING || c.env.MESSAGE;
    c.logs.push("GET "+(path||"/")+" 200");
    return {status:200, body:(g?g:"Hello from "+c.hostname)+"\n"};
  }
  return {err:"curl: (52) Empty reply from server"};
}
function httpFetch(st, url, fromC){
  let u = url.replace(/^https?:\/\//,"");
  const slash = u.indexOf("/");
  let path = slash>-1 ? u.slice(slash) : "/";
  let hostport = slash>-1 ? u.slice(0,slash) : u;
  let [host,portS] = hostport.split(":");
  let port = portS?+portS:80;
  if(!fromC){
    if(!["localhost","127.0.0.1","0.0.0.0","host.docker.internal"].includes(host))
      return {err:"curl: (6) Could not resolve host: "+host};
    const hit = st.containers.find(c=>c.status==="running" && c.ports.some(p=>p.host===port));
    if(hit){ const pm = hit.ports.find(p=>p.host===port); return serveFrom(st,hit,path); }
    const hostNet = st.containers.find(c=>c.status==="running" && c.netMode==="host" &&
       (c.imageObj.config.exposed||[]).some(e=>+e.split("/")[0]===port));
    if(hostNet) return serveFrom(st,hostNet,path);
    return {err:"curl: (7) Failed to connect to "+host+" port "+port+": Connection refused"};
  }
  if(["localhost","127.0.0.1"].includes(host)){
    const exp=(fromC.imageObj.config.exposed||[]).map(e=>+e.split("/")[0]);
    if(exp.includes(port)||port===80) return serveFrom(st,fromC,path);
    return {err:"curl: (7) Failed to connect to localhost port "+port+": Connection refused"};
  }
  const target = resolveName(st, fromC, host);
  if(!target) return {err:"curl: (6) Could not resolve host: "+host};
  const shared = Object.keys(fromC.networks).some(n=>target.networks[n]);
  if(!shared) return {err:"curl: (7) Failed to connect to "+host+": No route to host"};
  const exp=(target.imageObj.config.exposed||[]).map(e=>+e.split("/")[0]);
  if(exp.length && !exp.includes(port) && port!==80) return {err:"curl: (7) Failed to connect to "+host+" port "+port+": Connection refused"};
  return serveFrom(st,target,path);
}

/* ---------------- шелл внутри контейнера ---------------- */
function shellExec(st, c, line){
  const out=mkOut(); let code=0;
  const chunks = line.split("&&").map(s=>s.trim()).filter(Boolean);
  for(const chunk of chunks){
    const r = shellOne(st,c,chunk,out);
    code = r;
    if(code!==0) break;
  }
  return {out, code};
}
function splitRedir(tokens){
  let redir=null; const t=[];
  for(let i=0;i<tokens.length;i++){
    const x=tokens[i];
    if(x===">"||x===">>"){ redir={path:tokens[i+1], append:x===">>"}; i++; continue; }
    const m=x.match(/^(>>?)(.+)$/);
    if(m){ redir={path:m[2], append:m[1]===">>"}; continue; }
    t.push(x);
  }
  return {t, redir};
}
function shellOne(st, c, line, out){
  const sr = splitRedir(tokenize(line));
  const t = sr.t, redir = sr.redir;
  if(!t.length) return 0;
  const cmd=t[0], a=t.slice(1);
  const emit = txt => {
    if(redir){
      const abs=normPath(redir.path, c.workdir||"/");
      const prev = redir.append ? (cRead(st,c,abs)||"") : "";
      const res = cWrite(st,c,abs, prev+txt+(txt.endsWith("\n")?"":"\n"));
      if(res.err){ out.err(cmd+": can't create "+redir.path+": "+res.err); return 1; }
      return 0;
    }
    String(txt).split("\n").forEach(l=>out.line(l));
    return 0;
  };
  switch(cmd){
    case "echo": return emit(unesc(a.join(" ")));
    case "pwd": return emit(c.workdir||"/");
    case "hostname": return emit(c.hostname);
    case "whoami": return emit((c.user||"root").split(":")[0]);
    case "id": {
      const u=(c.user||"root").split(":")[0];
      const uid = u==="root"?0 : (u==="nobody"?65534 : (u==="nonroot"?65532 : 1000));
      return emit("uid="+uid+"("+u+") gid="+uid+"("+u+") groups="+uid+"("+u+")");
    }
    case "uname": return emit(a.includes("-a")?"Linux "+c.hostname+" 6.6.16-linuxkit #1 SMP x86_64 Linux":"Linux");
    case "env": case "printenv": { Object.entries(c.env).forEach(([k,v])=>out.line(k+"="+v)); return 0; }
    case "cd": { const d=normPath(a[0]||"/", c.workdir||"/"); c.workdir=d; return 0; }
    case "ls": {
      const dir = a.filter(x=>!x.startsWith("-"))[0] || c.workdir || "/";
      const items = cList(st,c,dir);
      if(!items.length){
        const asFile = cRead(st,c,dir);
        if(asFile!==undefined) return emit(dir);
        out.err("ls: "+dir+": No such file or directory"); return 1;
      }
      if(a.includes("-l")||a.includes("-la")||a.includes("-al")){
        items.forEach(n=>{
          const isDir=n.endsWith("/");
          const v = isDir?null:cRead(st,c,normPath(dir+"/"+n,"/"));
          out.line((isDir?"drwxr-xr-x":"-rw-r--r--")+"    1 "+(c.user||"root").padEnd(8)+String(isDir?4096:String(v||"").length).padStart(8)+"  "+n.replace(/\/$/,""));
        });
        return 0;
      }
      return emit(items.join("  "));
    }
    case "cat": {
      let code=0;
      a.filter(x=>!x.startsWith("-")).forEach(f=>{
        const v=cRead(st,c,f);
        if(v===undefined){ out.err("cat: can't open '"+f+"': No such file or directory"); code=1; }
        else emit(String(v));
      });
      return code;
    }
    case "touch": { a.forEach(f=>{ const r=cWrite(st,c,f, cRead(st,c,f)||""); if(r.err) out.err("touch: "+f+": "+r.err); }); return 0; }
    case "mkdir": return 0;
    case "rm": { a.filter(x=>!x.startsWith("-")).forEach(f=>{ const p=normPath(f,c.workdir||"/"); const m=mountFor(c,p); if(m){ delete mountStore(st,m)[mountKey(m,p,st)]; } else delete c.layer[p]; }); return 0; }
    case "df": { out.dim("Filesystem           1K-blocks      Used Available Use% Mounted on"); out.line("overlay               61202244   8123456  49876543  14% /"); (c.mounts||[]).forEach(m=>out.line(("/dev/vda1").padEnd(21)+"  61202244   8123456  49876543  14% "+m.target)); return 0; }
    case "ps": { out.dim("PID   USER     COMMAND"); out.line("    1 "+(c.user||"root").padEnd(8)+" "+c.cmd.join(" ")); out.line("   42 "+(c.user||"root").padEnd(8)+" sh"); return 0; }
    case "sleep": return 0;
    case "true": return 0;
    case "false": return 1;
    case "exit": return a[0]?+a[0]:0;
    case "sh": case "bash": case "ash": {
      const i=a.indexOf("-c");
      if(i>-1) { const r=shellExec(st,c,a.slice(i+1).join(" ")); r.out.L.forEach(l=>out.raw(l.t,l.cls)); return r.code; }
      return 0;
    }
    case "wget": case "curl": {
      const url = a.filter(x=>!x.startsWith("-")).pop();
      if(!url){ out.err(cmd+": missing URL"); return 1; }
      const r = httpFetch(st, url, c);
      if(r.err){ out.err(r.err.replace(/^curl:/, cmd+":")); return 1; }
      if(a.includes("-I")||a.includes("--head")){ out.line("HTTP/1.1 "+r.status+" "+(r.status===200?"OK":"Not Found")); return 0; }
      return emit(r.body);
    }
    case "nslookup": case "ping": {
      const host=a.filter(x=>!x.startsWith("-"))[0];
      const t=resolveName(st,c,host);
      if(!t){ out.err(cmd+": bad address '"+host+"'"); return 1; }
      const net=Object.keys(c.networks).find(n=>t.networks[n]);
      const ip=t.networks[net].ip;
      if(cmd==="ping"){ out.line("PING "+host+" ("+ip+"): 56 data bytes"); out.line("64 bytes from "+ip+": seq=0 ttl=64 time=0.081 ms"); }
      else { out.line("Server:\t\t127.0.0.11"); out.line("Name:\t"+host); out.line("Address: "+ip); }
      return 0;
    }
    case "redis-cli": { if(a.includes("ping")||a.includes("PING")) return emit("PONG"); return emit("OK"); }
    case "psql": { if(a.join(" ").includes("SELECT 1")) return emit(" ?column?\n----------\n        1\n(1 row)"); return emit("psql (16.2)\nType \"help\" for help."); }
    case "node": { const i=a.indexOf("-e"); if(i>-1) return emit("(node) "+a[i+1]); return 0; }
    case "python": case "python3": { const i=a.indexOf("-c"); if(i>-1) return emit("(python) "+a[i+1]); return 0; }
    case "apk": case "apt-get": case "apt": case "yum": { out.dim(cmd+": в эмуляторе установка пакетов работает только в RUN при сборке образа"); return 0; }
    case "clear": return 0;
    default:
      out.err(cmd+": not found");
      return 127;
  }
}

/* ---------------- запуск/создание контейнера ---------------- */
const RUN_VF = new Set(["--name","--publish","--volume","--env","--network","--net","--workdir","--user","--memory",
  "--cpus","--restart","--entrypoint","--hostname","--label","--mount","--env-file","--health-cmd","--health-interval",
  "--cap-add","--cap-drop","--tmpfs","--device","--pull","--platform","--log-driver","--stop-signal","--pid","--ipc",
  "--shm-size","--add-host","--dns","--ulimit","--security-opt","--link","--expose","--memory-swap","--pids-limit","--network-alias"]);

function createContainer(st, args, out, startIt){
  const p = parseArgs(args, RUN_VF, true);
  const ref = p.rest[0];
  if(!ref){ out.err("docker: 'docker run' requires at least 1 argument."); out.dim("Usage:  docker run [OPTIONS] IMAGE [COMMAND] [ARG...]"); return null; }
  let img = findImage(st, ref);
  if(!img){
    const r=refParse(ref);
    if(!REGISTRY[r.full]){ out.err("Unable to find image '"+r.full+"' locally"); out.err("docker: Error response from daemon: pull access denied for "+r.repo+"."); return null; }
    out.line("Unable to find image '"+r.full+"' locally");
    img = pullImage(st, ref, out);
    if(!img) return null;
  }
  const name = p.one("--name") || petName();
  if(st.containers.some(c=>c.name===name)){
    out.err("docker: Error response from daemon: Conflict. The container name \"/"+name+"\" is already in use by container.");
    out.dim("Удалите старый контейнер (docker rm "+name+") или выберите другое имя.");
    return null;
  }
  const id=hex(32);
  const env = Object.assign({}, img.config.env);
  p.all("--env").forEach(e=>{ if(typeof e!=="string") return; const i=e.indexOf("="); if(i>-1) env[e.slice(0,i)]=e.slice(i+1); else env[e]=""; });
  const cmd = p.rest.length>1 ? p.rest.slice(1) : (img.config.cmd||[]).slice();
  const entry = p.has("--entrypoint") ? [p.one("--entrypoint")] : (img.config.entrypoint||null);
  const netMode = p.one("--network")||p.one("--net")||"bridge";
  const c = {
    id, name, image:img.repo+":"+img.tag, imageId:img.id, imageObj:img,
    cmd: entry ? entry.concat(cmd) : cmd,
    entrypoint: entry, rawCmd: cmd,
    status:"created", created:Date.now(), started:null, exitCode:null,
    env, workdir: p.one("--workdir")||img.config.workdir||"/",
    user: p.one("--user")||img.config.user||"root",
    hostname: p.one("--hostname")||id.slice(0,12),
    ports:[], mounts:[], networks:{}, netMode,
    logs:[], layer:{}, autoRemove:p.has("--rm"),
    restart:p.one("--restart")||"no", memory:p.one("--memory")||null, cpus:p.one("--cpus")||null,
    readOnly:p.has("--read-only"), capDrop:p.all("--cap-drop").filter(x=>typeof x==="string"),
    capAdd:p.all("--cap-add").filter(x=>typeof x==="string"),
    tty:p.has("--tty"), interactive:p.has("--interactive"), detach:p.has("--detach"),
    labels:{}, health: img.config.health?{status:"starting", cfg:img.config.health}:null,
    composeService:null, restarts:0
  };
  p.all("--label").forEach(l=>{ if(typeof l!=="string")return; const i=l.indexOf("="); c.labels[i>-1?l.slice(0,i):l]= i>-1?l.slice(i+1):""; });
  if(p.has("--health-cmd")) c.health={status:"starting", cfg:{test:["CMD-SHELL",p.one("--health-cmd")]}};

  p.all("--publish").forEach(spec=>{
    if(typeof spec!=="string") return;
    const pm=parsePublish(spec);
    if(pm.host===null) pm.host = 32768+Math.floor(Math.random()*2000);
    const busy = st.containers.find(x=>x.status==="running" && x.ports.some(q=>q.host===pm.host));
    if(busy){ out.err("docker: Error response from daemon: driver failed programming external connectivity: Bind for 0.0.0.0:"+pm.host+" failed: port is already allocated."); c.portConflict=true; }
    c.ports.push(pm);
  });
  if(c.portConflict) return null;
  if(p.has("--publish-all")) (img.config.exposed||[]).forEach(e=>c.ports.push({host:32768+Math.floor(Math.random()*2000), cont:+e.split("/")[0], proto:"tcp"}));

  p.all("--volume").forEach(spec=>{
    if(typeof spec!=="string") return;
    const m=parseMount(st,spec);

  });

    if(typeof spec!=="string") return;
    const kv={}; spec.split(",").forEach(x=>{ const [k,v]=x.split("="); kv[k]=v===undefined?true:v; });
    const m={type:kv.type||"volume", source:kv.source||kv.src||("anon_"+hex(6)), target:kv.target||kv.dst||kv.destination, ro:!!kv.readonly};
    if(m.type==="volume") ensureVolume(st,m.source);

function startContainer(st, c, out, attached){
  if(c.status==="running"){ return true; }
  const img=c.imageObj;
  c.status="running"; c.started=Date.now(); c.exitCode=null;
  const missing=(img.needsEnv||[]).filter(k=>!c.env[k]);
  if(missing.length){
    c.logs.push("Error: Database is uninitialized and superuser password is not specified.");
    c.logs.push("       You must specify "+missing[0]+" to a non-empty value for the superuser password.");
    c.status="exited"; c.exitCode=1;
    if(attached){ c.logs.forEach(l=>out.err(l)); }
    else { out.line(c.id); out.warn("Контейнер сразу упал: не задана переменная "+missing[0]+". Смотрите docker logs "+c.name); }
    return false;
  }
  (img.baseLogs||[]).forEach(l=>c.logs.push(l));
  if(c.health) c.health.status="healthy";
  const long = isLongRunning(c.cmd, img);
  if(long){
    if(attached){
      c.logs.forEach(l=>out.line(l));
      out.dim("(процесс продолжает работать; в реальном терминале он держал бы консоль — используйте -d, чтобы запустить в фоне)");
    } else out.line(c.id);
    return true;
  }
  if(!c.cmd.length){ c.status="exited"; c.exitCode=0; if(!attached) out.line(c.id); return true; }

    if(c.tty && c.interactive){ return "shell"; }
    c.status="exited"; c.exitCode=0;
    if(!attached) out.line(c.id);
    else out.dim("(процесс /bin/sh завершился сразу: нет TTY и нечего исполнять — добавьте -it, чтобы получить оболочку)");
    return true;
  }
  const r = shellExec(st, c, c.cmd.map(x=>/\s/.test(x)?'"'+x+'"':x).join(" "));

}
function stopContainer(st,c){

function removeContainer(st,c,rmVols){

}
/* ---------------- сборка образа ---------------- */
function runSize(cmd){
  const c=cmd.toLowerCase();
  if(/apt-get\s+install|apt\s+install/.test(c)) return 180*MB;
  if(/apk\s+add/.test(c)) return /--no-cache/.test(c)?9*MB:14*MB;
  if(/npm\s+(ci|install|i)\b/.test(c)) return /--production|--omit=dev/.test(c)?42*MB:96*MB;
  if(/yarn\s+install/.test(c)) return 90*MB;
  if(/pip\s+install/.test(c)) return 38*MB;
  if(/go\s+mod\s+download/.test(c)) return 22*MB;
  if(/go\s+build/.test(c)) return 6*MB;
  if(/adduser|useradd|addgroup|groupadd/.test(c)) return 4*KB;
  if(/^\s*rm\s+-rf/.test(c)) return 0;
  if(/mkdir|chown|chmod|^ln\s|touch/.test(c)) return 8*KB;
  if(/curl|wget/.test(c)) return 12*MB;
  return 1*MB;
}
function ignoreMatch(pattern, path){
  const p=pattern.replace(/^\.\//,"").replace(/\/$/,"");
  if(!p) return false;
  if(p.includes("*")){
    const rx=new RegExp("^"+p.split("*").map(s=>s.replace(/[.+?^${}()|[\]\\]/g,"\\$&")).join("[^/]*")+"$");
    return rx.test(path) || rx.test(path.split("/").pop());
  }
  return path===p || path.startsWith(p+"/");
}
function ctxFiles(st, base){
  base = base.replace(/\/$/,"");
  const ign = String(st.files[base+"/.dockerignore"]||"").split("\n").map(s=>s.trim()).filter(s=>s&&!s.startsWith("#"));
  const map={};
  Object.keys(st.files).forEach(k=>{
    if(k!==base && !k.startsWith(base+"/")) return;
    const rel = k.slice(base.length+1);
    if(!rel) return;
    if(ign.some(p=>ignoreMatch(p,rel))) return;
    map[rel]=st.files[k];
  });
  return map;
}
function newStage(base, name){
  const cfgOf = b => ({cmd:(b.config.cmd||[]).slice(), entrypoint:b.config.entrypoint?b.config.entrypoint.slice():null,
    env:Object.assign({},b.config.env), workdir:b.config.workdir||"/", user:b.config.user||"root",
    exposed:(b.config.exposed||[]).slice(), volumes:(b.config.volumes||[]).slice(),
    health:b.config.health?Object.assign({},b.config.health):null, labels:Object.assign({},b.config.labels||{})});
  return {
    name, fs: base?Object.assign({},base.fs):{},
    config: base?cfgOf(base):{cmd:[],entrypoint:null,env:{},workdir:"/",user:"root",exposed:[],volumes:[],health:null,labels:{}},
    layers: base?base.layers.slice():[],
    kind: base?base.kind:"shell",
    serve: base&&base.serve?Object.assign({},base.serve):null,
    users: base?(base.users||["root"]).slice():["root"],
    baseLogs: base?(base.baseLogs||[]).slice():[],

function dockerBuild(st, argv, out){

    const sp=raw.indexOf(" ");

    let rest=(sp>-1?raw.slice(sp+1):"").trim();
    out.line("Step "+(n+1)+"/"+total+" : "+verb+" "+rest);

    if(verb==="FROM"){

    st.images.push(img);
  }
  out.ok("Successfully built "+id.slice(0,12));
  const tags=p.all("--tag").filter(x=>typeof x==="string");
  if(!tags.length) out.dim("(образ без тега — он появится в docker images как <none>:<none>)");

}
function pickSources(map, srcs, fromStage){
  const picked={};
  srcs.forEach(s=>{
    let sp = s.replace(/^\.\//,"");
    if(fromStage) sp = sp.replace(/^\//,"");
    if(sp==="."||sp===""){ Object.keys(map).forEach(k=>picked[k]=map[k]); return; }
    if(sp.includes("*")){
      const rx=new RegExp("^"+sp.split("*").map(x=>x.replace(/[.+?^${}()|[\]\\]/g,"\\$&")).join("[^/]*")+"$");
      Object.keys(map).forEach(k=>{ const kk=fromStage?k.replace(/^\//,""):k; if(rx.test(kk)||rx.test(kk.split("/").pop())) picked[kk]=map[k]; });
      return;
    }
    let hit=false;
    Object.keys(map).forEach(k=>{
      const kk=fromStage?k.replace(/^\//,""):k;
      if(kk===sp){ picked[kk]=map[k]; hit=true; }
      else if(kk.startsWith(sp.replace(/\/$/,"")+"/")){ picked[kk]=map[k]; hit=true; }
    });
    if(!hit) picked["__missing__"+sp]=undefined;
  });
  return picked;
}
function applyInstr(st, stg, verb, rest, ctx, stages, out, expand, buildArgs, cacheHit){
  const wd = stg.config.workdir||"/";
  switch(verb){
    case "WORKDIR": stg.config.workdir = normPath(expand(rest), wd); return {size:0};
    case "ENV": {
      const m=rest.match(/^(\w+)\s+(.+)$/);
      if(m && !rest.includes("=")) stg.config.env[m[1]]=expand(m[2]).replace(/^["']|["']$/g,"");
      else tokenize(rest).forEach(kv=>{ const i=kv.indexOf("="); if(i>-1) stg.config.env[kv.slice(0,i)]=expand(kv.slice(i+1)); });
      return {size:0};
    }
    case "ARG": { const i=rest.indexOf("="); const k=i>-1?rest.slice(0,i):rest.trim(); if(buildArgs[k]===undefined && i>-1) buildArgs[k]=rest.slice(i+1); return {size:0}; }
    case "LABEL": { tokenize(rest).forEach(kv=>{ const i=kv.indexOf("="); if(i>-1) stg.config.labels[kv.slice(0,i)]=kv.slice(i+1); }); return {size:0}; }
    case "EXPOSE": { tokenize(expand(rest)).forEach(pp=>{ const v=pp.includes("/")?pp:pp+"/tcp"; if(!stg.config.exposed.includes(v)) stg.config.exposed.push(v); }); return {size:0}; }
    case "USER": { stg.config.user=expand(rest).trim(); return {size:0}; }
    case "VOLUME": { const v=rest.startsWith("[")?JSON.parse(rest.replace(/'/g,'"')):[rest]; v.forEach(x=>stg.config.volumes.push(x)); return {size:0}; }

    case "ENTRYPOINT": { stg.config.entrypoint = rest.startsWith("[")?safeJson(rest):["/bin/sh","-c",rest]; return {size:0}; }

    }
    case "STOPSIGNAL": case "SHELL": case "ONBUILD": case "MAINTAINER": return {size:0};

        const gob=cmd.match(/go\s+build[^&|]*-o\s+(\S+)/);

      if(missing.length) return {error:"ERROR: failed to solve: failed to compute cache key: \""+missing[0].slice(11)+"\": not found"};
      let size=0;
      const dst = normPath(dstRaw, wd);
      const multi = Object.keys(picked).length>1 || srcs[0]==="." || srcs[0].includes("*") || dstRaw.endsWith("/");
      Object.keys(picked).forEach(k=>{

        const full = multi ? normPath(dst+"/"+k,"/") : dst;

function safeJson(s){ try{ return JSON.parse(s.replace(/'/g,'"')); }catch(e){ return s.replace(/[[\]"']/g,"").split(",").map(x=>x.trim()); } }

/* ---------------- YAML (упрощённый) ---------------- */
function parseYaml(text){
  const lines=[];
  String(text).replace(/\t/g,"  ").split("\n").forEach(l=>{
    if(/^\s*#/.test(l)) return;
    const s=l.replace(/\s+#\s.*$/,"");
    if(!s.trim()) return;
    lines.push({indent:s.match(/^ */)[0].length, text:s.trim()});
  });
  let idx=0;
  function val(s){
    if(s==="") return null;
    if(/^".*"$/.test(s)||/^'.*'$/.test(s)) return s.slice(1,-1);
    if(s==="true") return true; if(s==="false") return false;
    if(/^-?\d+$/.test(s)) return +s;
    if(/^\[.*\]$/.test(s)) return s.slice(1,-1).split(",").map(x=>val(x.trim())).filter(x=>x!==null&&x!=="");
    return s;
  }
  function block(indent){
    if(idx>=lines.length) return null;
    if(lines[idx].text.startsWith("- ")){
      const arr=[];
      while(idx<lines.length && lines[idx].indent===indent && lines[idx].text.startsWith("- ")){
        arr.push(val(lines[idx].text.slice(2).trim())); idx++;
      }
      return arr;
    }
    const obj={};
    while(idx<lines.length && lines[idx].indent===indent){
      const m=lines[idx].text.match(/^([^:]+):\s*(.*)$/);
      if(!m){ idx++; continue; }
      const k=m[1].trim().replace(/^["']|["']$/g,""), v=m[2].trim();
      if(v===""){ idx++;
        if(idx<lines.length && lines[idx].indent>indent) obj[k]=block(lines[idx].indent);
        else obj[k]={};
      } else { obj[k]=val(v); idx++; }
    }
    return obj;
  }
  return block(lines.length?lines[0].indent:0)||{};
}
