<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Интерактивный конспект по работе с .NET-проектами на примере Acme.WebAutomation.">
<title>Сборочный лист .NET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{
  --paper:#EFEDF2; --surface:#FBFAFC; --surface-2:#E4E1EB; --surface-3:#F5F3F8;
  --line:#C7C1D6; --line-soft:#DEDAE8;
  --ink:#15111E; --ink-2:#453D58; --ink-3:#71698A;
  --accent:#4B2FB5; --accent-2:#33208A; --accent-soft:#E3DDF7; --accent-line:#A493E2;
  --signal:#9A5A00; --signal-soft:#F5E9D5;
  --ok:#26714A; --ok-soft:#D8EBE0;
  --err:#A82733; --err-soft:#F4DCDE;
  --code-bg:#1A1626; --code-ink:#DCD7EA; --code-dim:#6F6689; --code-line:#2C2540;
  --code-kw:#B7A2F5; --code-str:#D9A46A; --code-att:#7FC7D9; --code-cm:#6F6689;
  --rule:#C7C1D6;
  --radius:2px;
  --fd:"IBM Plex Sans Condensed","IBM Plex Sans",-apple-system,sans-serif;
  --fu:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --fr:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --fm:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F0C17; --surface:#181324; --surface-2:#221B33; --surface-3:#1C1629;
    --line:#332B48; --line-soft:#271F39;
    --ink:#E7E2F3; --ink-2:#B2A9C9; --ink-3:#877DA3;
    --accent:#A78BFA; --accent-2:#C7B6FD; --accent-soft:#241B41; --accent-line:#584892;
    --signal:#E09A4A; --signal-soft:#33240F;
    --ok:#5DC08A; --ok-soft:#10301F;
    --err:#E97A85; --err-soft:#361419;
    --code-bg:#0A0711; --code-ink:#DCD7EA; --code-dim:#6A6183; --code-line:#231C36;
    --rule:#332B48;
  }
}
:root[data-theme="dark"]{
  --paper:#0F0C17; --surface:#181324; --surface-2:#221B33; --surface-3:#1C1629;
  --line:#332B48; --line-soft:#271F39;
  --ink:#E7E2F3; --ink-2:#B2A9C9; --ink-3:#877DA3;
  --accent:#A78BFA; --accent-2:#C7B6FD; --accent-soft:#241B41; --accent-line:#584892;
  --signal:#E09A4A; --signal-soft:#33240F;
  --ok:#5DC08A; --ok-soft:#10301F;
  --err:#E97A85; --err-soft:#361419;
  --code-bg:#0A0711; --code-ink:#DCD7EA; --code-dim:#6A6183; --code-line:#231C36;
  --rule:#332B48;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--fu); font-size:15px; line-height:1.5}
::selection{background:var(--accent-soft); color:var(--ink)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button{font:inherit; color:inherit}
input{font:inherit}

/* ---------- шапка ---------- */
.bar{
  position:sticky; top:0; z-index:70; display:flex; align-items:center; gap:16px;
  height:54px; padding:0 18px; background:var(--surface); border-bottom:1px solid var(--line);
}
.mark{display:flex; align-items:center; gap:9px; flex:0 0 auto}
.mark b{font-family:var(--fd); font-weight:700; font-size:15.5px; letter-spacing:.005em; white-space:nowrap}
.mark i{
  font-family:var(--fm); font-style:normal; font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); display:block; margin-top:-3px;
}
.srch{position:relative; flex:1; max-width:430px}
.srch input{
  width:100%; background:var(--surface-3); border:1px solid var(--line); border-radius:var(--radius);
  padding:7px 11px 7px 30px; font-size:13px; color:var(--ink); outline:none;
}
.srch input:focus{border-color:var(--accent); background:var(--surface)}
.srch svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.5}
.srch kbd{
  position:absolute; right:8px; top:50%; transform:translateY(-50%); font-family:var(--fm);
  font-size:10px; color:var(--ink-3); border:1px solid var(--line); border-radius:2px; padding:1px 4px;
}
.bar .gap{flex:1}
.pmeter{display:flex; align-items:center; gap:9px}
.pmeter span{font-family:var(--fm); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}
.ptrack{width:112px; height:5px; background:var(--surface-2); border:1px solid var(--line-soft); position:relative; overflow:hidden}
.pfill{position:absolute; inset:0 auto 0 0; width:0; background:var(--accent); transition:width .4s ease}
.gbtn{
  background:none; border:1px solid var(--line); color:var(--ink-2); font-size:12px;
  padding:6px 10px; border-radius:var(--radius); cursor:pointer; white-space:nowrap;
}
.gbtn:hover{border-color:var(--accent); color:var(--accent)}

/* ---------- каркас ---------- */
.shell{display:grid; grid-template-columns:246px minmax(0,1fr); min-height:calc(100vh - 54px)}
.toc{
  border-right:1px solid var(--line); background:var(--surface); padding:16px 0 40px;
  position:sticky; top:54px; align-self:start; max-height:calc(100vh - 54px); overflow-y:auto;
}
.toc-h{
  font-family:var(--fm); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3); padding:0 18px 10px;
}
.sbtn{
  display:grid; grid-template-columns:22px 1fr; gap:9px; width:100%; text-align:left;
  background:none; border:0; cursor:pointer; padding:8px 14px 8px 18px;
  border-left:2px solid transparent; color:var(--ink-2); transition:background .13s,color .13s;
}
.sbtn:hover{background:var(--surface-3); color:var(--ink)}
.sbtn[aria-current="true"]{background:var(--accent-soft); border-left-color:var(--accent); color:var(--ink)}
.sbtn .n{font-family:var(--fm); font-size:10.5px; font-weight:500; color:var(--ink-3); padding-top:2px; font-variant-numeric:tabular-nums}
.sbtn[aria-current="true"] .n{color:var(--accent)}
.sbtn .t{display:block; font-family:var(--fd); font-weight:600; font-size:13.5px; line-height:1.25}
.sbtn .s{display:block; font-size:11px; color:var(--ink-3); line-height:1.3; margin-top:1px}
.sbtn .ok{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--ok); margin-left:5px; vertical-align:middle}
.toc-f{padding:14px 18px 0; margin-top:12px; border-top:1px solid var(--line-soft)}

/* ---------- документ ---------- */
.doc{padding:0 0 90px; min-width:0}
.sec-head{padding:32px 40px 0; max-width:1160px}
.kicker{font-family:var(--fm); font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); margin-bottom:9px}
h1{font-family:var(--fd); font-size:clamp(27px,3.2vw,38px); font-weight:700; letter-spacing:-.01em; margin:0 0 8px; line-height:1.06; text-wrap:balance}
.lede{font-family:var(--fr); font-size:16.5px; line-height:1.55; color:var(--ink-2); max-width:60ch; margin:0}
.body{padding:26px 40px 0; max-width:1160px}

.prose{font-family:var(--fr); font-size:16.5px; line-height:1.66; max-width:70ch}
.prose p{margin:0 0 1.05em}
.prose ul,.prose ol{margin:0 0 1.05em; padding-left:1.35em}
.prose li{margin-bottom:.42em}
.prose li::marker{color:var(--accent)}
.prose strong{font-weight:600}
.prose em{font-style:italic; color:var(--ink-2)}
h2{
  font-family:var(--fd); font-size:21px; font-weight:700; letter-spacing:-.005em;
  margin:2.2em 0 .7em; padding-top:.65em; border-top:1px solid var(--rule); text-wrap:balance; max-width:70ch;
}
.body > h2:first-child, .prose > h2:first-child{margin-top:0; border-top:0; padding-top:0}
h3{font-family:var(--fd); font-size:16px; font-weight:600; margin:1.75em 0 .5em}
code{
  font-family:var(--fm); font-size:.855em; background:var(--surface-2); padding:.1em .34em;
  border-radius:2px; border:1px solid var(--line-soft); overflow-wrap:anywhere;
}
.prose a{color:var(--accent)}

.note{
  font-family:var(--fu); font-size:14px; line-height:1.55; background:var(--surface);
  border:1px solid var(--line-soft); border-left:3px solid var(--accent);
  padding:13px 16px; margin:0 0 1.3em; max-width:70ch; border-radius:0 var(--radius) var(--radius) 0;
}
.note b.h{
  display:block; font-family:var(--fm); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--accent); margin-bottom:5px; font-weight:600;
}
.note.warn{border-left-color:var(--signal)} .note.warn b.h{color:var(--signal)}
.note.trap{border-left-color:var(--err)} .note.trap b.h{color:var(--err)}
.note.fact{border-left-color:var(--ok)} .note.fact b.h{color:var(--ok)}
.note p{margin:0 0 .6em} .note p:last-child{margin:0}
.note ul{margin:.4em 0 0; padding-left:1.2em} .note li{margin-bottom:.3em}

pre{
  font-family:var(--fm); font-size:12.5px; line-height:1.6; background:var(--code-bg); color:var(--code-ink);
  padding:13px 15px; overflow-x:auto; margin:0 0 1.3em; border-radius:var(--radius); border:1px solid var(--code-line);
}
pre code{background:none; border:0; padding:0; font-size:inherit; color:inherit; white-space:pre}
.k{color:var(--code-kw)} .s{color:var(--code-str)} .a{color:var(--code-att)} .c{color:var(--code-dim)}

.tw{overflow-x:auto; margin:0 0 1.5em; border:1px solid var(--line); border-radius:var(--radius)}
table{border-collapse:collapse; width:100%; font-family:var(--fu); font-size:13.5px; min-width:520px}
th{
  text-align:left; font-family:var(--fm); font-weight:600; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); padding:9px 13px; background:var(--surface-3);
  border-bottom:1px solid var(--line);
}
td{padding:9px 13px; border-bottom:1px solid var(--line-soft); vertical-align:top; line-height:1.45}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}

/* ---------- разбор файла ---------- */
.file{border:1px solid var(--line); border-radius:var(--radius); margin:0 0 1.6em; overflow:hidden; background:var(--code-bg)}
.file-h{
  display:flex; align-items:center; gap:9px; padding:8px 13px; background:var(--surface-3);
  border-bottom:1px solid var(--line);
}
.file-h .p{font-family:var(--fm); font-size:11.5px; color:var(--ink); font-weight:500}
.file-h .r{margin-left:auto; font-family:var(--fm); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.code-rows{font-family:var(--fm); font-size:12.5px; line-height:1.72; overflow-x:auto; padding:9px 0}
.row{display:grid; grid-template-columns:34px 1fr; gap:0; min-width:max-content}
.row .ln{
  color:var(--code-dim); text-align:right; padding-right:11px; user-select:none;
  font-size:10.5px; font-variant-numeric:tabular-nums;
}
.row .cd{color:var(--code-ink); white-space:pre; padding-right:16px}
.row.hot{cursor:pointer}
.row.hot .tx{border-bottom:1px dotted var(--accent-line)}
.row.hot:hover .cd{background:rgba(167,139,250,.10)}
.row.hot.on .cd{background:rgba(167,139,250,.18)}
.row.hot .tx::after{content:"?"; font-size:9px; color:var(--accent-line); margin-left:7px; vertical-align:super}
.row.hot.on .tx::after{content:"×"; vertical-align:baseline; color:var(--accent)}
.row.hot.on .tx{border-bottom-color:var(--accent)}
.ann{border-top:1px solid var(--code-line); background:var(--surface); padding:14px 16px}
.ann[hidden]{display:none}
.ann h4{font-family:var(--fd); font-size:14.5px; font-weight:600; margin:0 0 6px; color:var(--accent)}
.ann p{margin:0 0 .55em; font-size:14px; line-height:1.55; color:var(--ink-2); max-width:74ch}
.ann p:last-child{margin:0}
.ann code{font-size:12.5px}
.file-hint{
  font-family:var(--fm); font-size:10.5px; color:var(--code-dim); padding:0 13px 9px;
}

/* ---------- конструкторы ---------- */
.tool{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin:0 0 1.6em; overflow:hidden}
.tool-h{
  display:flex; align-items:center; gap:9px; padding:9px 14px; border-bottom:1px solid var(--line-soft);
  font-family:var(--fm); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
}
.tool-b{padding:14px}
.grp{margin-bottom:13px}
.grp:last-child{margin-bottom:0}
.grp-l{font-family:var(--fm); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-bottom:6px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  background:var(--surface-3); border:1px solid var(--line); border-radius:var(--radius);
  padding:5px 10px; font-family:var(--fm); font-size:11.5px; cursor:pointer; color:var(--ink-2); transition:.12s;
}
.chip:hover{border-color:var(--accent-line); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
.out{
  background:var(--code-bg); color:var(--code-ink); font-family:var(--fm); font-size:12.5px;
  padding:12px 14px; border-radius:var(--radius); margin-top:13px; overflow-x:auto; white-space:pre-wrap;
  word-break:break-word; border:1px solid var(--code-line);
}
.out .fl{color:var(--code-kw)} .out .vl{color:var(--code-str)}
.expl{margin-top:11px; display:flex; flex-direction:column; gap:7px}
.expl div{display:grid; grid-template-columns:auto 1fr; gap:10px; font-size:13px; line-height:1.45; color:var(--ink-2)}
.expl code{font-size:12px; white-space:nowrap}
.selrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.selrow select,.selrow input[type=text]{
  background:var(--surface-3); border:1px solid var(--line); border-radius:var(--radius);
  padding:6px 9px; font-family:var(--fm); font-size:12px; color:var(--ink);
}
.selrow input[type=text]{min-width:180px}

/* ---------- самопроверка ---------- */
.check{max-width:760px; margin-top:2.2em; padding-top:1.4em; border-top:1px solid var(--rule)}
.qc{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:17px 19px; margin-bottom:12px}
.qn{font-family:var(--fm); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:7px; display:flex; justify-content:space-between}
.qt{font-size:15px; font-weight:600; line-height:1.45; margin:0 0 13px}
.qt code{font-weight:400}
.opts{display:flex; flex-direction:column; gap:6px}
.opt{
  display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
  background:var(--surface-3); border:1px solid var(--line-soft); border-radius:var(--radius);
  padding:9px 12px; cursor:pointer; font-size:13.5px; line-height:1.45; transition:.12s;
}
.opt:hover:not(:disabled){border-color:var(--accent-line); background:var(--surface)}
.opt:disabled{cursor:default}
.opt .mk{
  font-family:var(--fm); font-size:10.5px; color:var(--ink-3); border:1px solid var(--line);
  width:18px; height:18px; display:grid; place-items:center; flex:0 0 auto; margin-top:1px; border-radius:2px;
}
.opt.right{border-color:var(--ok); background:var(--ok-soft)} .opt.right .mk{border-color:var(--ok); color:var(--ok)}
.opt.wrong{border-color:var(--err); background:var(--err-soft)} .opt.wrong .mk{border-color:var(--err); color:var(--err)}
.why{margin-top:12px; font-size:13.5px; line-height:1.55; color:var(--ink-2); border-left:2px solid var(--line); padding-left:12px}
.why b{color:var(--ink); font-weight:600}
.why.g{border-left-color:var(--ok)} .why.b{border-left-color:var(--err)}
.chead{display:flex; align-items:baseline; gap:12px; margin-bottom:15px}
.chead h2{margin:0; padding:0; border:0}
.chead span{font-family:var(--fm); font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}

/* ---------- поиск ---------- */
.results{position:fixed; inset:54px 0 0; z-index:60; background:var(--paper); overflow-y:auto; padding:26px 40px 60px}
.results[hidden]{display:none}
.results h2{margin:0 0 18px; padding:0; border:0}
.hit{
  display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:13px 16px; margin-bottom:9px; cursor:pointer;
}
.hit:hover{border-color:var(--accent)}
.hit .hs{font-family:var(--fm); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--accent); margin-bottom:4px}
.hit .ht{font-family:var(--fd); font-weight:600; font-size:15px; margin-bottom:3px}
.hit .hx{font-size:13px; color:var(--ink-2); line-height:1.45}
.hit mark{background:var(--accent-soft); color:var(--ink); padding:0 2px}

/* ---------- подвал ---------- */
.foot{display:flex; justify-content:space-between; gap:14px; padding:26px 40px 0; max-width:1160px; margin-top:34px; border-top:1px solid var(--rule)}
.foot button{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 15px; cursor:pointer; font-size:13.5px; font-weight:500; text-align:left;
}
.foot button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.foot button:disabled{opacity:.35; cursor:default}
.foot .sub{display:block; font-size:11px; font-weight:400; color:var(--ink-3); font-family:var(--fm)}

.fig{margin:0 0 1.6em; max-width:100%}
.fig svg{display:block; width:100%; height:auto}
.fig figcaption{font-family:var(--fm); font-size:10.5px; color:var(--ink-3); margin-top:8px; line-height:1.5}

@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .toc{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line); display:flex; overflow-x:auto; padding:10px 12px; gap:7px}
  .toc-h,.toc-f{display:none}
  .sbtn{grid-template-columns:auto; width:auto; flex:0 0 auto; border-left:0; background:var(--surface-3); border-radius:var(--radius); padding:7px 11px}
  .sbtn .s{display:none}
  .sbtn .t{white-space:nowrap; font-size:12.5px}
  .sec-head,.body,.foot,.results{padding-left:17px; padding-right:17px}
  .bar{gap:10px; padding:0 13px}
  .mark i{display:none}
  .srch{max-width:none}
  .pmeter .ptrack{display:none}
}
@media (max-width:620px){ .srch kbd{display:none} .pmeter{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* ---- карточки «На собеседовании» ---- */
.iv{margin-top:26px}
.ivc{border:1px solid var(--line);border-radius:3px;background:var(--surface-2);margin:0 0 10px;overflow:hidden}
.ivq{display:flex;gap:11px;align-items:baseline;width:100%;text-align:left;padding:12px 14px;
  background:none;border:none;cursor:pointer;font:inherit;color:inherit}
.ivq:hover{background:var(--surface-3)}
.ivn{font-family:var(--fm);font-size:11px;color:var(--accent);flex:0 0 auto}
.ivt{flex:1 1 auto;font-size:16px;font-weight:600;line-height:1.3;color:var(--ink)}
.ivx{flex:0 0 auto;font-family:var(--fm);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ivb{border-top:1px solid var(--line);padding:12px 14px 14px}
.ivb[hidden]{display:none}
.ivp{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 11px;margin:0 0 11px;
  font-size:13.4px;color:var(--ink-2);border-radius:2px}
.ivp b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.iva{font-size:14.6px;line-height:1.62;color:var(--ink-2);margin:0 0 11px}
.ivm{border-top:1px solid var(--line);padding-top:9px;font-size:13px;color:var(--ink-3)}
.ivm b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.ivm ul{margin:0;padding-left:18px}
.ivm li{margin:0 0 3px}

/* ---- конструктор устойчивости локатора ---- */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;margin:0 0 10px}
.lbtn{text-align:left;padding:8px 10px;background:var(--surface-3);border:1px solid var(--line);
  border-radius:2px;cursor:pointer;font:inherit;color:var(--ink-2)}
.lbtn:hover{border-color:var(--accent)}

 notes:{

    p:['Одна эта строка подключает <b>Microsoft.NET.Sdk</b>: сотни готовых свойств, элементов и таргетов. Именно она делает файл коротким — компиляция, сборка, упаковка, очистка уже описаны внутри SDK.',

  nullable:{h:'Nullable — контекст ссылочных типов, допускающих null',

n:3, id:"msbuild", title:"MSBuild", sub:"Кто на самом деле собирает",
lede:"dotnet build — тонкая обёртка. Работу делает MSBuild, и понимание его модели снимает почти все вопросы «почему собралось не то».",
body:`
<p>MSBuild выполняет файл проекта как программу. У неё три вида сущностей: <b>свойства</b> (скаляры), <b>элементы</b> (списки) и <b>таргеты</b> (шаги с зависимостями). SDK приносит готовый набор таргетов — <code>Restore</code>, <code>Build</code>, <code>Clean</code>, <code>Publish</code>, <code>Pack</code>, <code>VSTest</code>, — а csproj их настраивает.</p>

<h2>Порядок вычисления и приоритет</h2>
<p>Один и тот же параметр можно задать в четырёх местах. Приоритет фиксированный, и знать его нужно наизусть:</p>
<figure class="fig">
<svg viewBox="0 0 620 196" role="img" aria-label="Приоритет источников значения свойства MSBuild">
 <g font-family="var(--fm)" font-size="10.5">
  <text x="0" y="12" font-size="9.5" letter-spacing="1" fill="var(--ink-3)">СИЛЬНЕЕ ВСЕГО</text>
  <rect x="0" y="20" width="620" height="34" rx="2" fill="var(--accent-soft)" stroke="var(--accent)"/>
  <text x="14" y="41" font-weight="600" fill="var(--ink)">1 · Командная строка</text>
  <text x="230" y="41" fill="var(--ink-2)">-p:Configuration=Release</text>
  <text x="606" y="41" text-anchor="end" fill="var(--accent)">перебивает всё</text>

  <rect x="0" y="60" width="620" height="34" rx="2" fill="var(--surface-3)" stroke="var(--line)"/>
  <text x="14" y="81" font-weight="600" fill="var(--ink)">2 · Сам .csproj</text>
  <text x="230" y="81" fill="var(--ink-2)">&lt;Configuration&gt;Debug&lt;/Configuration&gt;</text>
  <text x="606" y="81" text-anchor="end" fill="var(--ink-3)">перебивает окружение</text>

  <rect x="0" y="100" width="620" height="34" rx="2" fill="var(--surface-3)" stroke="var(--line)"/>
  <text x="14" y="121" font-weight="600" fill="var(--ink)">3 · Directory.Build.props</text>
  <text x="230" y="121" fill="var(--ink-2)">импортируется до тела проекта</text>
  <text x="606" y="121" text-anchor="end" fill="var(--ink-3)">общее для дерева</text>

  <rect x="0" y="140" width="620" height="34" rx="2" fill="var(--surface-3)" stroke="var(--line)" stroke-dasharray="3 3"/>
  <text x="14" y="161" font-weight="600" fill="var(--ink)">4 · Переменные окружения</text>
  <text x="230" y="161" fill="var(--ink-2)">export Configuration=Release</text>
  <text x="606" y="161" text-anchor="end" fill="var(--ink-3)">начальные значения</text>
  <text x="0" y="190" font-size="9.5" letter-spacing="1" fill="var(--ink-3)">СЛАБЕЕ ВСЕГО</text>
 </g>
</svg>
<figcaption>Переменная окружения задаёт лишь стартовое значение: любая явная строка в проекте её перекроет. Флаг -p: в командной строке не перекрывается ничем.</figcaption>
</figure>
<div class="note warn"><b class="h">Практическое следствие</b><p>Если экспортировать <code>Configuration=Release</code> в окружение, а в csproj стоит явное присваивание — вы получите Debug и будете долго искать причину. Надёжный способ задать конфигурацию снаружи только один: <code>-c Release</code> или <code>-p:Configuration=Release</code> в командной строке.</p></div>

<h2>Как посмотреть, что получилось на самом деле</h2>
<p>Не нужно гадать — MSBuild умеет отвечать напрямую. Ниже реальный вывод на проекте Portal:</p>
<pre><code><span class="c">$ dotnet msbuild Portal/Portal.csproj -getProperty:TargetFramework \\
      -getProperty:OutputPath -getProperty:AssemblyName -getProperty:RootNamespace</span>
{
  <span class="a">"Properties"</span>: {
    <span class="a">"TargetFramework"</span>: <span class="s">"net8.0"</span>,
    <span class="a">"OutputPath"</span>: <span class="s">"bin\\Debug/net8.0/"</span>,
    <span class="a">"AssemblyName"</span>: <span class="s">"Portal"</span>,
    <span class="a">"RootNamespace"</span>: <span class="s">"Acme.WebAutomation.Portal"</span>
  }
}

<span class="c">$ dotnet msbuild Portal/Portal.csproj -getProperty:Configuration -p:Configuration=Release</span>
Release</code></pre>
<div class="note fact"><b class="h">Заметьте две детали</b><p>Во-первых, <code>AssemblyName</code> = <code>Portal</code>, хотя <code>RootNamespace</code> совсем другой — это и есть подтверждение, что они независимы. Во-вторых, в <code>OutputPath</code> смешаны разделители <code>\\</code> и <code>/</code>: MSBuild исторически оперирует Windows-разделителями и нормализует их лишь при обращении к файловой системе. Пугаться не нужно.</p></div>

<h2>Полезные ключи диагностики</h2>
<div class="tw"><table>
<tr><th>Команда</th><th>Что показывает</th></tr>
<tr><td><code>-getProperty:Имя</code></td><td>Вычисленное значение свойства, без сборки</td></tr>
<tr><td><code>-getItem:Compile</code></td><td>Какие файлы реально попали в компиляцию</td></tr>
<tr><td><code>-v n</code> / <code>-v d</code></td><td>Подробность лога: normal / detailed. На detailed видна полная командная строка компилятора</td></tr>
<tr><td><code>-bl</code></td><td>Двоичный лог <code>msbuild.binlog</code> — исчерпывающая запись сборки, открывается MSBuild Structured Log Viewer</td></tr>
<tr><td><code>-t:Rebuild</code></td><td>Явно вызвать таргет. <code>Rebuild</code> = <code>Clean</code> + <code>Build</code></td></tr>
<tr><td><code>--no-incremental</code></td><td>Игнорировать кэш инкрементальной сборки</td></tr>
</table></div>

<h2>Directory.Build.props — общие настройки на всё дерево</h2>
<p>Файл с таким именем в корне репозитория MSBuild импортирует <b>в начало</b> каждого проекта ниже по дереву. Это штатный способ не дублировать настройки по трём csproj:</p>
<pre><code><span class="c">&lt;!-- Directory.Build.props в корне — сейчас в репозитории его нет --&gt;</span>
&lt;<span class="k">Project</span>&gt;
  &lt;<span class="k">PropertyGroup</span>&gt;
    &lt;TargetFramework&gt;net8.0&lt;/TargetFramework&gt;
    &lt;Nullable&gt;enable&lt;/Nullable&gt;
    &lt;ImplicitUsings&gt;enable&lt;/ImplicitUsings&gt;
    &lt;IsPackable&gt;false&lt;/IsPackable&gt;
  &lt;/<span class="k">PropertyGroup</span>&gt;
&lt;/<span class="k">Project</span>&gt;</code></pre>
<p>Парный <code>Directory.Build.targets</code> импортируется, наоборот, <b>в конец</b> — туда кладут то, что должно переопределить уже вычисленное проектом.</p>
<div class="note"><b class="h">Стоит ли заводить его здесь</b><p>Три csproj повторяют одни и те же четыре строки. Вынести их в <code>Directory.Build.props</code> — очевидное упрощение, но у него есть цена: настройки перестают быть видны в самом файле проекта. Для репозитория, где принципиально заявлено «три проекта независимы и не должны заимствовать друг у друга», это осознанный компромисс, а не забытая оптимизация.</p></div>

<h2>Условия</h2>
<p>Атрибут <code>Condition</code> вешается почти на что угодно. Кавычки вокруг обеих частей сравнения обязательны — иначе пустое значение сломает выражение:</p>
<pre><code>&lt;PropertyGroup Condition=<span class="s">"'$(Configuration)' == 'Release'"</span>&gt;
  &lt;TreatWarningsAsErrors&gt;true&lt;/TreatWarningsAsErrors&gt;
&lt;/PropertyGroup&gt;

&lt;ItemGroup Condition=<span class="s">"'$(OS)' == 'Windows_NT'"</span>&gt;
  &lt;PackageReference Include=<span class="s">"SomeWindowsOnlyThing"</span> Version=<span class="s">"1.0.0"</span> /&gt;
&lt;/ItemGroup&gt;</code></pre>
`,

n:4, id:"sln", title:"Solution", sub:"Зачем нужен .sln и когда не нужен",
lede:"Файл решения — это список проектов и таблица соответствия конфигураций. На то, как собирается отдельный проект, он не влияет.",
body:`
<p>Решение группирует проекты. Оно нужно IDE (дерево, «собрать всё», «запустить все тесты») и удобно в CLI, когда одной командой надо обойти все проекты сразу. Собственной логики сборки в нём нет.</p>

<h2>Что внутри</h2>
<pre><code><span class="c">// WebAutomation.sln — реальный фрагмент</span>
Project(<span class="s">"{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}"</span>) = <span class="s">"Portal"</span>, <span class="s">"Portal\\Portal.csproj"</span>, <span class="s">"{B19B0122-…}"</span>
EndProject</code></pre>
<p>Здесь три идентификатора, и они разного назначения:</p>
<div class="tw"><table>
<tr><th>Что</th><th>Смысл</th></tr>
<tr><td><code>{FAE04EC0-…}</code></td><td>Тип проекта. Один и тот же для всех C#-проектов — это не уникальный идентификатор</td></tr>
<tr><td><code>"Portal\\Portal.csproj"</code></td><td>Путь. Разделитель <b>всегда</b> обратный слэш, даже на macOS и Linux</td></tr>
<tr><td><code>{B19B0122-…}</code></td><td>Идентификатор конкретного проекта внутри решения. На него ссылается таблица конфигураций</td></tr>
</table></div>

<h2>Таблица конфигураций и её сюрприз</h2>
<p>Дальше идёт сопоставление конфигураций решения конфигурациям проектов. В этом решении оно любопытное:</p>
<pre><code>{B19B0122-…}.Debug|x64.ActiveCfg = Debug|<span class="k">Any CPU</span>
{B19B0122-…}.Debug|x86.ActiveCfg = Debug|<span class="k">Any CPU</span>
{B19B0122-…}.Release|x64.ActiveCfg = Release|<span class="k">Any CPU</span></code></pre>
<p>Решение объявляет шесть конфигураций (Debug и Release × Any CPU, x64, x86), но <b>все платформы ведут в одну и ту же</b> <code>Any CPU</code>. Выбор x64 или x86 в IDE ничего не меняет — проекты платформо-независимы. Такие строки обычно порождает мастер создания решения, и они остаются навсегда.</p>

<h2>Команды</h2>
<pre><code>dotnet sln list                              <span class="c"># что входит в решение</span>
dotnet sln add Nuevo/Nuevo.csproj            <span class="c"># добавить</span>
dotnet sln remove HQ/HQ.csproj               <span class="c"># убрать (файлы не удаляются)</span>

dotnet build                                 <span class="c"># найдёт .sln в текущем каталоге</span>
dotnet build Portal/Portal.csproj            <span class="c"># только один проект</span>
dotnet test                                  <span class="c"># прогонит тесты всех проектов решения</span></code></pre>
<div class="note"><b class="h">Как dotnet выбирает, что собирать</b><p>Без аргумента команда ищет в текущем каталоге единственный <code>.sln</code> или единственный <code>.csproj</code>. Если их несколько — останавливается с ошибкой и просит указать явно. Отсюда привычка всегда писать путь к проекту: это снимает неоднозначность и экономит время, потому что не собирается лишнее.</p></div>

<h2>Формат .slnx</h2>
<p>Старый формат <code>.sln</code> — не XML и не JSON, он читается тяжело и конфликтует при слиянии веток. Начиная с .NET 9 SDK поддерживает <code>.slnx</code>: тот же смысл, но нормальный XML без GUID-ов.</p>
<pre><code>&lt;<span class="k">Solution</span>&gt;
  &lt;<span class="k">Project</span> Path=<span class="s">"Portal/Portal.csproj"</span> /&gt;
  &lt;<span class="k">Project</span> Path=<span class="s">"Vertex2025/Vertex2025.csproj"</span> /&gt;
  &lt;<span class="k">Project</span> Path=<span class="s">"HQ/HQ.csproj"</span> /&gt;
&lt;/<span class="k">Solution</span>&gt;</code></pre>
<p>Конвертация — одной командой <code>dotnet sln migrate</code>. Переходить стоит, только когда все участники и все агенты сборки перешли на SDK, который его понимает.</p>

<div class="note trap"><b class="h">Три проекта в решении, но общего кода нет</b><p>В этом репозитории между проектами нет ни одного <code>ProjectReference</code> — это заявленное архитектурное решение. Решение здесь выполняет ровно одну функцию: собрать и прогнать всё одной командой. Из этого следует и практическое правило: правку, сделанную в одном проекте, нельзя «перенести» в другой ссылкой — только копированием, осознанно.</p></div>
`,

<h2>Прямые и транзитивные</h2>
<p>В csproj перечислены только прямые зависимости. Всё остальное подтягивается само. Вот реальный результат для Portal:</p>
<pre><code><span class="c">$ dotnet list Portal/Portal.csproj package --include-transitive</span>

   Top-level Package                 Requested   Resolved
   &gt; Microsoft.NET.Test.Sdk          17.8.0      17.8.0
   &gt; Microsoft.Playwright.NUnit      1.58.0      1.58.0
   &gt; NUnit                           3.14.0      3.14.0
   &gt; NUnit3TestAdapter               4.5.0       4.5.0
   &gt; NunitXml.TestLogger             8.0.0       8.0.0
   &gt; ReportPortal.NUnit              4.9.0       4.9.0

   Transitive Package                            Resolved
   &gt; Microsoft.Playwright                        1.58.0
   &gt; Microsoft.Playwright.TestAdapter            1.58.0
   &gt; Newtonsoft.Json                             13.0.1
   &gt; System.Text.Json                            6.0.10
   <span class="c">… всего 17 транзитивных</span></code></pre>
<div class="note fact"><b class="h">Измерено на этом проекте</b><p>6 прямых → 23 разрешённых пакета в <code>project.assets.json</code> → 15 записей в <code>Portal.deps.json</code>. Разница между 23 и 15 в том, что часть пакетов участвует только в сборке и не нужна в рантайме.</p></div>
<div class="note"><b class="h">Отсюда следует практическое правило</b><p><code>Microsoft.Playwright.TestAdapter</code> есть во всех трёх проектах — он приходит транзитивно через <code>Microsoft.Playwright.NUnit</code>. Полагаться на транзитивную зависимость рискованно: если авторы <code>…NUnit</code> завтра перестанут её тянуть, проект сломается без единой правки с вашей стороны. Явное объявление в Vertex2025 как раз от этого и страхует.</p></div>

<h2>Как записывается версия</h2>
<div class="tw"><table>
<tr><th>Запись</th><th>Что означает</th></tr>
<tr><td><code>1.58.0</code></td><td>Не ниже 1.58.0. Берётся минимальная подходящая, но поднимается при конфликте</td></tr>
<tr><td><code>[1.58.0]</code></td><td>Ровно эта версия. Жёстко</td></tr>
<tr><td><code>[1.58.0,2.0.0)</code></td><td>Диапазон: от 1.58.0 включительно до 2.0.0 не включая</td></tr>
<tr><td><code>1.58.*</code></td><td>Плавающая версия — при каждом restore может подтянуться новее. Удобно, но убивает воспроизводимость</td></tr>
</table></div>
<div class="note warn"><b class="h">Правило разрешения конфликтов</b><p>Если два пакета требуют разные версии третьего, NuGet выбирает <b>наибольшую</b> из требуемых — это стратегия «nearest wins» с подъёмом версии. Молча. Именно поэтому <code>Resolved</code> в выводе выше иногда выше, чем <code>Requested</code>, и именно поэтому колонку <code>Resolved</code> стоит просматривать.</p></div>

<h2>Полезные команды</h2>
<pre><code>dotnet restore Portal/Portal.csproj          <span class="c"># явно, обычно не нужно</span>
dotnet add Portal/Portal.csproj package NUnit --version 3.14.0
dotnet remove Portal/Portal.csproj package NUnit
dotnet list Portal/Portal.csproj package --outdated      <span class="c"># есть ли новее</span>
dotnet list Portal/Portal.csproj package --vulnerable    <span class="c"># известные уязвимости</span>
dotnet list Portal/Portal.csproj package --deprecated
dotnet nuget locals all --list                <span class="c"># где лежит кэш</span>
dotnet nuget locals all --clear               <span class="c"># снести кэш целиком</span></code></pre>
<div class="note"><b class="h">Кэш общий на пользователя</b><p>Все проекты на машине берут пакеты из <code>~/.nuget/packages</code>. Поэтому первый <code>restore</code> нового проекта может занять минуты, а последующие — секунды: на этом репозитории повторный restore отрабатывает за <b>1,6 секунды</b>. И поэтому же <code>dotnet nuget locals all --clear</code> — тяжёлая операция, она затрагивает все проекты, а не один.</p></div>

<h2>Централизованное управление версиями</h2>
<p>Когда проектов много, версии расползаются. Лечится файлом <code>Directory.Packages.props</code> в корне:</p>
<pre><code>&lt;<span class="k">Project</span>&gt;
  &lt;<span class="k">PropertyGroup</span>&gt;
    &lt;ManagePackageVersionsCentrally&gt;true&lt;/ManagePackageVersionsCentrally&gt;
  &lt;/<span class="k">PropertyGroup</span>&gt;
  &lt;<span class="k">ItemGroup</span>&gt;
    &lt;PackageVersion Include=<span class="s">"NUnit"</span> Version=<span class="s">"3.14.0"</span> /&gt;
    &lt;PackageVersion Include=<span class="s">"Microsoft.Playwright.NUnit"</span> Version=<span class="s">"1.58.0"</span> /&gt;
  &lt;/<span class="k">ItemGroup</span>&gt;
&lt;/<span class="k">Project</span>&gt;</code></pre>
<p>После этого в csproj остаётся <code>&lt;PackageReference Include="NUnit" /&gt;</code> — без версии. Для трёх проектов, где версии сейчас совпадают вручную, это устранило бы риск незаметного расхождения.</p>

<h2>Приватные источники</h2>
<p>Файл <code>nuget.config</code> рядом с решением задаёт, откуда брать пакеты. Для корпоративных фидов Azure Artifacts он обязателен:</p>
<pre><code>&lt;<span class="k">configuration</span>&gt;
  &lt;<span class="k">packageSources</span>&gt;
    &lt;clear /&gt;                                  <span class="c">&lt;!-- отбросить унаследованные --&gt;</span>
    &lt;add key=<span class="s">"nuget.org"</span> value=<span class="s">"https://api.nuget.org/v3/index.json"</span> /&gt;
    &lt;add key=<span class="s">"internal"</span> value=<span class="s">"https://pkgs.dev.azure.com/acme/_packaging/internal/nuget/v3/index.json"</span> /&gt;
  &lt;/<span class="k">packageSources</span>&gt;
&lt;/<span class="k">configuration</span>&gt;</code></pre>
<div class="note trap"><b class="h">Ошибка NU1101</b><p>«Unable to find package X. No packages exist with this id in source(s): …» почти всегда означает не опечатку в имени, а <b>отсутствие нужного источника</b> в списке. Первым делом смотрите, какие источники перечислены в конце сообщения, — там же виден и результат <code>&lt;clear /&gt;</code>, если он отсёк корпоративный фид.</p></div>

<h2>Локальные инструменты</h2>

<h2>Обнаружение и запуск — разные фазы</h2>
<p>Сначала VSTest сканирует сборку и составляет список тестов, потом запускает отобранные. На этом проекте видно, что список не совпадает с числом методов в коде:</p>

<p>Разница в Portal объясняется параметризацией: один метод с <code>[TestCase]</code> раскрывается в несколько случаев. Считать нагрузку надо по обнаруженным случаям, а не по методам.</p>
<div class="note fact"><b class="h">Проверено и стоит запомнить</b><p>Числа выше измерены на текущем состоянии репозитория. В <code>README.md</code> и <code>CLAUDE.md</code> для Vertex2025 указано 294 теста — фактически их 285. Такие счётчики устаревают на каждом коммите; в репозитории для этого даже заведён навык <code>docs-audit</code>. Не доверяйте числу в документе, если можете его измерить.</p></div>

<h2>Фильтры</h2>
<p>Синтаксис <code>--filter</code> принадлежит VSTest, а доступные свойства зависят от адаптера. Для NUnit это <code>FullyQualifiedName</code>, <code>Name</code>, <code>TestCategory</code> (он же <code>Category</code>), <code>Priority</code>.</p>
<div class="tw"><table>
<tr><th>Оператор</th><th>Смысл</th><th>Пример</th></tr>
<tr><td><code>=</code></td><td>Точное совпадение</td><td><code>Name=HomePageShouldLoad</code></td></tr>
<tr><td><code>!=</code></td><td>Не равно</td><td><code>TestCategory!=Slow</code></td></tr>
<tr><td><code>~</code></td><td>Содержит</td><td><code>FullyQualifiedName~FooterTests</code></td></tr>
<tr><td><code>!~</code></td><td>Не содержит</td><td><code>FullyQualifiedName!~ContactForm</code></td></tr>
<tr><td><code>&amp;</code> / <code>|</code></td><td>И / ИЛИ</td><td><code>Cat=A&amp;Name~Login</code></td></tr>
</table></div>

<div data-widget="filter"></div>

<div class="note trap"><b class="h">Проверено: --list-tests игнорирует --filter</b><p>Соблазнительно посмотреть, что попадёт под фильтр, командой <code>dotnet test --list-tests --filter "…"</code>. Так делать нельзя: измерено на этом репозитории — с фильтром и без него список одинаковый, 249 строк. Фильтр применяется только при реальном прогоне. Чтобы прикинуть охват, не запуская тесты, приходится считать по исходникам.</p></div>

<div class="note warn"><b class="h">Ловушка категорий в этом репозитории</b><p><code>--filter "Category=Vertex2025"</code> отберёт далеко не все тесты проекта: атрибут <code>[Category]</code> стоит лишь у 3 фикстур из 12. В Portal наоборот — размечены 32 из 33. Вывод практический: для Vertex2025 фильтруйте по пути проекта или по <code>FullyQualifiedName</code>, а категориям там верить нельзя.</p></div>

<h2>Логгеры и результаты</h2>
<pre><code>--logger "trx;LogFileName=test-results.trx"     <span class="c"># формат VSTest, его понимает Azure DevOps</span>
--logger "nunit;LogFilePath=results.xml"        <span class="c"># нужен пакет NunitXml.TestLogger</span>

body:`
<p><code>.runsettings</code> — XML с настройками тестового прогона. Подключается флагом <code>--settings</code>; без него действуют умолчания. Особенность, из-за которой возникает большинство недоразумений: <b>секции адресованы разным потребителям</b>, и каждый читает только свою.</p>

<div data-file="runsettings"></div>

<h2>Что ещё туда кладут</h2>
<pre><code>&lt;<span class="k">RunConfiguration</span>&gt;
  &lt;MaxCpuCount&gt;<span class="s">4</span>&lt;/MaxCpuCount&gt;                  <span class="c">&lt;!-- параллельно по сборкам --&gt;</span>
  &lt;TestSessionTimeout&gt;<span class="s">3600000</span>&lt;/TestSessionTimeout&gt;  <span class="c">&lt;!-- мс на весь прогон --&gt;</span>
  &lt;ResultsDirectory&gt;./TestResults&lt;/ResultsDirectory&gt;
  &lt;TargetFrameworkVersion&gt;net8.0&lt;/TargetFrameworkVersion&gt;
&lt;/<span class="k">RunConfiguration</span>&gt;</code></pre>
<div class="note warn"><b class="h">Здесь этого нет — и это заметно</b><p>В <code>playwright.runsettings</code> не задано ни одного таймаута. Для набора UI-тестов, который ходит на внешние стенды, зависший прогон будет висеть до таймаута самого агента. <code>TestSessionTimeout</code> — дешёвая страховка.</p></div>

<h2>Два разных параллелизма</h2>
<div class="tw"><table>
<tr><th></th><th>MaxCpuCount (VSTest)</th><th>NumberOfTestWorkers (NUnit)</th></tr>
<tr><td>Что распараллеливает</td><td>Тестовые <b>сборки</b></td><td>Тесты <b>внутри</b> одной сборки</td></tr>
<tr><td>Секция</td><td><code>&lt;RunConfiguration&gt;</code></td><td><code>&lt;NUnit&gt;</code></td></tr>
<tr><td>Здесь задано</td><td>нет</td><td><b>4</b></td></tr>
</table></div>
<div class="note trap"><b class="h">NUnit не распараллеливает без разрешения</b><p>Сколько бы воркеров вы ни выставили, NUnit выполняет фикстуры последовательно, пока не появится атрибут <code>[Parallelizable]</code> — на сборке, классе или методе. Поиск по исходникам этого репозитория такого атрибута не находит. То есть <code>NumberOfTestWorkers=4</code> сейчас, скорее всего, ни на что не влияет, и прогон идёт в один поток. Это стоит проверить замером времени, прежде чем считать четыре воркера работающими.</p></div>

<h2>Приоритет источников</h2>

body:`
<p>У .NET есть богатая система конфигурации: <code>IConfiguration</code>, <code>appsettings.json</code>, иерархия провайдеров, привязка к типам. В этом репозитории не используется ничего из этого — и решение вполне обоснованное. Посмотрим на оба подхода.</p>

<h2>Что сделано здесь</h2>
<pre><code><span class="c">// Portal/Config/TestConfig.cs — реальный код</span>
public static class TestConfig
{
    public static string BaseUrl =&gt;
        Environment.GetEnvironmentVariable(<span class="s">"SPACES_URL"</span>) ?? <span class="s">"https://uat.example.com/"</span>;

    public static string BasicAuthUsername =&gt;
        Environment.GetEnvironmentVariable(<span class="s">"BASIC_AUTH_USERNAME"</span>)
        ?? throw new InvalidOperationException(<span class="s">"BASIC_AUTH_USERNAME is not set"</span>);
}</code></pre>
<p>Три приёма, каждый со смыслом:</p>
<ul>
<li><b>Свойства, а не поля.</b> Стрелка <code>=&gt;</code> означает вычисление при каждом обращении, а не однократно при загрузке типа. Переменную можно поменять между тестами, и это подхватится.</li>
<li><b>Оператор <code>??</code></b> даёт значение по умолчанию — стенд UAT.</li>
<li><b><code>?? throw</code></b> вместо умолчания для учётных данных: отсутствие переменной обрушивает прогон сразу и с внятным текстом, а не превращается в непонятный отказ авторизации на сотне тестов.</li>

<h2>Штатный механизм .NET — для сравнения</h2>
<pre><code>var config = new ConfigurationBuilder()
    .AddJsonFile(<span class="s">"appsettings.json"</span>, optional: true)
    .AddJsonFile($<span class="s">"appsettings.{env}.json"</span>, optional: true)   <span class="c">// перекрывает предыдущий</span>

    .AddCommandLine(args)                                     <span class="c">// перекрывает всё</span>
    .Build();

string url = config[<span class="s">"Site:BaseUrl"</span>];</code></pre>
<p>Порядок регистрации задаёт приоритет: последний зарегистрированный источник побеждает. Двоеточие в ключе — разделитель уровней вложенности; в переменных окружения на Linux вместо него пишут двойное подчёркивание: <code>Site__BaseUrl</code>.</p>
<div class="tw"><table>
<tr><th></th><th>Environment.GetEnvironmentVariable</th><th>IConfiguration</th></tr>
<tr><td>Зависимости</td><td>Никаких</td><td>Пакеты <code>Microsoft.Extensions.Configuration.*</code></td></tr>
<tr><td>Иерархия и типизация</td><td>Нет, только строки</td><td>Есть, с привязкой к классам</td></tr>
<tr><td>Профили окружений</td><td>Вручную</td><td>Встроенные</td></tr>
<tr><td>Когда уместно</td><td>Пять-шесть параметров, всё приходит из CI</td><td>Приложение с настройками, профилями и вложенной структурой</td></tr>
</table></div>
<div class="note"><b class="h">Вывод для этого репозитория</b><p>Параметров действительно мало, все приходят из пайплайна переменными, вложенность не нужна. Тащить ради этого систему конфигурации не стоит — простое статическое свойство честнее. Единственное, что стоит поправить, — убрать зашитые учётные данные из HQ и Vertex2025.</p></div>

<h2>Как переменные попадают в тест</h2>
<pre><code><span class="c">// Portal/Tests/BaseTest.cs — реальный код</span>
public class BaseTest : PageTest
{
    public override BrowserNewContextOptions ContextOptions() =&gt; new()
    {

        ViewportSize = new ViewportSize { Width = <span class="s">1920</span>, Height = <span class="s">1080</span> },
        HttpCredentials = new HttpCredentials

            Username = TestConfig.BasicAuthUsername,
            Password = TestConfig.BasicAuthPassword,
        },

}</code></pre>
<p>Базовая авторизация задаётся на уровне <em>контекста браузера</em>, поэтому уходит в каждый запрос автоматически — отдельной обработки в тестах не нужно. Это же объясняет, почему при незаданной переменной падает сразу всё: исключение возникает при создании контекста, то есть до первого шага любого теста.</p>

<h2>Секреты</h2>

<tr><td>Значения в коде или в json репозитория</td><td>Не годится никогда</td></tr>

<div class="note trap"><b class="h">Действующие секреты в репозитории</b><p>Сейчас в git лежат: ключ API ReportPortal во всех трёх файлах <code>ReportPortal.json</code> и учётные данные Basic Auth в <code>TestConfig.cs</code> у HQ и Vertex2025. Удаление из рабочей копии не помогает — значение остаётся в истории и должно считаться скомпрометированным. Правильная последовательность: перевыпустить ключ, перевести чтение на переменные окружения, добавить проверку секретов в конвейер.</p></div>

<h2>Локально и в CI — одно и то же разными словами</h2>
<div class="tw"><table>

<h2>Почему тесты запускаются по .dll</h2>
<p>Это главное отличие, и оно вытекает из архитектуры конвейера: сборка идёт на одном агенте, тесты — на другом, у которого есть сетевой доступ к внутренним стендам. Между ними результат передаётся артефактом.</p>

<h2>Три предохранителя, о которых надо помнить</h2>
<div class="tw"><table>
<tr><th>Настройка</th><th>Следствие</th></tr>
<tr><td><code>trigger: none</code></td><td>Конвейер не запускается сам. Только вручную — коммит в main тесты не прогонит</td></tr>
<tr><td><code>continueOnError: true</code></td><td>Падение тестов не останавливает конвейер</td></tr>
<tr><td><code>failTaskOnFailedTests: false</code></td><td>Красные тесты не делают сборку красной</td></tr>

<div class="note trap"><b class="h">Зелёный конвейер здесь не означает зелёные тесты</b><p>Все три настройки вместе дают систему, которая почти никогда не показывает красный. Для нестабильного UI-набора это осознанный выбор — иначе конвейер краснел бы постоянно и на него перестали бы смотреть. Но следствие надо держать в голове: <b>результат нужно смотреть в отчёте</b> — на вкладке тестов, в ReportPortal или в Xray, а не по цвету сборки.</p></div>

<h2>Кэширование и скорость</h2>
<p>Каждый прогон заново скачивает пакеты и браузеры. Обычные меры:</p>

<li><b>Кэш NuGet</b> — задача <code>Cache@2</code> по ключу от <code>*.csproj</code>. Даёт больше всего при малом риске.</li>
<li><b>Кэш браузеров Playwright</b> — сложнее: они зависят от версии пакета, ключ должен включать её.</li>
<li><b>Готовый образ агента</b> с предустановленными SDK и браузерами — самый радикальный и самый эффективный вариант.</li>
</ul>
<div class="note"><b class="h">Чего в этом конвейере ещё нет</b><ul>
<li>Кэша пакетов и браузеров — каждый прогон начинается с нуля.</li>

<li>Сбора артефактов при падении — трассировок, скриншотов и видео Playwright. Для UI-набора это самая полезная из недостающих вещей: сейчас по красному тесту доступен только текст ошибки.</li>

n:12, id:"errors", title:"Диагностика", sub:"Разбор типовых сообщений",
lede:"Каталог ошибок, которые встречаются чаще всего, с настоящими текстами и порядком действий.",
body:`
<p>Сообщения .NET обычно точны, но не всегда очевидны. Ниже — те, что встречаются чаще прочих; тексты приведены как они выглядят на самом деле.</p>

<h2>NETSDK1004 — не выполнен restore</h2>
<pre><code>error <span class="k">NETSDK1004</span>: Assets file '…/obj/project.assets.json' not found.
Run a NuGet package restore to generate this file.</code></pre>
<p>Возникает, когда сборка запущена с <code>--no-restore</code> на чистом дереве или после ручного удаления <code>obj/</code>. Лечение — <code>dotnet restore</code> либо просто убрать флаг.</p>

<h2>NETSDK1045 — TFM новее SDK</h2>
<pre><code>error <span class="k">NETSDK1045</span>: The current .NET SDK does not support targeting .NET 12.0.
Either target .NET 10.0 or lower, or use a version of the .NET SDK that supports .NET 12.0.</code></pre>
<p>Проект целится в платформу новее установленного SDK. Либо понизить <code>TargetFramework</code>, либо обновить SDK. Обратная ситуация ошибкой не является: свежий SDK спокойно собирает старый TFM.</p>

<h2>«A compatible .NET SDK was not found»</h2>
<pre><code>The command could not be loaded, possibly because:
  * You intended to execute a .NET application:
      The application 'build' does not exist or is not a managed .dll or .exe.
  * You intended to execute a .NET SDK command:
      <span class="k">A compatible .NET SDK was not found.</span></code></pre>
<div class="note warn"><b class="h">Сообщение обманывает</b><p>Первая половина уводит в сторону разговором про «команду build». Настоящая причина в последней строке: <code>global.json</code> требует версию SDK, которой на машине нет. Проверьте файл и <code>dotnet --list-sdks</code>; часто достаточно сменить <code>rollForward</code> на <code>latestMajor</code>.</p></div>

<h2>NU1101 — пакет не найден</h2>
<pre><code>error <span class="k">NU1101</span>: Unable to find package X. No packages exist with this id
in source(s): nuget.org</code></pre>
<p>Смотрите на список источников в конце сообщения. Чаще всего дело не в опечатке, а в том, что корпоративный фид не подключён или отсечён элементом <code>&lt;clear /&gt;</code> в <code>nuget.config</code>.</p>

<h2>MSB3277 — конфликт версий сборок</h2>
<p>«Found conflicts between different versions of the same assembly». Два пакета тянут разные версии одной библиотеки. Диагностируется командой <code>dotnet list package --include-transitive</code>: ищите пакет, у которого <code>Resolved</code> выше <code>Requested</code>. Лечится явным <code>PackageReference</code> на согласованную версию.</p>

<h2>Тесты не найдены</h2>
<pre><code>No test is available in …/Portal.dll.
Make sure that test discoverer &amp; executors are registered.</code></pre>
<div class="tw"><table>
<tr><th>Проверьте</th><th>Как</th></tr>
<tr><td>Есть ли <code>Microsoft.NET.Test.Sdk</code></td><td>Без него проект не считается тестовым</td></tr>
<tr><td>Есть ли <code>NUnit3TestAdapter</code></td><td>Без адаптера тесты не обнаруживаются</td></tr>
<tr><td>Класс <code>public</code> и с <code>[TestFixture]</code></td><td>Внутренний класс не найдётся</td></tr>
<tr><td>Не указан ли <code>--no-build</code></td><td>Может прогоняться устаревшая сборка</td></tr>
<tr><td>Верна ли конфигурация в пути</td><td><code>bin/Debug</code> против <code>bin/Release</code></td></tr>
</table></div>

<h2>Собирается не то, что ожидалось</h2>
<div class="tw"><table>
<tr><th>Приём</th><th>Что показывает</th></tr>
<tr><td><code>dotnet msbuild -getProperty:Имя</code></td><td>Реальное значение свойства</td></tr>
<tr><td><code>dotnet msbuild -getItem:Compile</code></td><td>Какие файлы попали в компиляцию</td></tr>
<tr><td><code>dotnet build -v n</code></td><td>Полную командную строку компилятора</td></tr>
<tr><td><code>dotnet build -bl</code></td><td>Двоичный лог всей сборки для детального разбора</td></tr>
<tr><td><code>rm -rf bin obj</code></td><td>Снимает вопросы о залежавшихся файлах надёжнее, чем <code>dotnet clean</code></td></tr>
</table></div>

<h2>Порядок действий, когда непонятно совсем</h2>
<ol>
<li><code>dotnet --info</code> — тот ли SDK, есть ли нужный рантайм.</li>
<li>Есть ли <code>global.json</code> выше по дереву каталогов.</li>
<li><code>rm -rf bin obj</code>, затем <code>dotnet restore</code> и <code>dotnet build</code> по отдельности — станет видно, какой именно этап падает.</li>
<li><code>dotnet build -v n</code> — прочитать, чем на самом деле вызывается компилятор.</li>
<li>Для тестов — <code>--list-tests</code>: обнаруживаются ли они вообще, до всяких фильтров.</li>
<li>Если и это не помогло — <code>-bl</code> и разбор двоичного лога.</li>
</ol>
<div class="note fact"><b class="h">Правило, экономящее больше всего времени</b><p>Разделяйте этапы. <code>dotnet test</code> выполняет restore, build и прогон разом, и по одному сообщению не всегда ясно, что именно сломалось. Три отдельные команды дают три отдельных ответа.</p></div>
`,

{
n:13, id:"csharp", title:"C# для автотестов", sub:"Что спрашивают на входе",
lede:"Языковой минимум, без которого не проходят техническую часть: ссылки и значения, строки, коллекции, async и то, как это ломается именно в тестах.",
body:`
<p>Automation QA не обязан знать язык на уровне разработчика бэкенда, но обязан отвечать за код, который пишет. Ниже — темы, которые спрашивают почти всегда, с уклоном в то, как они проявляются в тестовом коде.</p>

<h2>Значения и ссылки</h2>
<div class="tw"><table>
<tr><th></th><th>Типы значений</th><th>Ссылочные типы</th></tr>
<tr><td>Что это</td><td><code>int</code>, <code>bool</code>, <code>double</code>, <code>struct</code>, <code>enum</code>, <code>DateTime</code></td><td><code>class</code>, <code>string</code>, массивы, делегаты, <code>record</code> (по умолчанию)</td></tr>
<tr><td>При присваивании</td><td>копируется значение</td><td>копируется ссылка — оба имени указывают на один объект</td></tr>
<tr><td>Где живёт</td><td>обычно стек либо внутри объекта</td><td>управляемая куча</td></tr>
<tr><td>Значение по умолчанию</td><td>ноль соответствующего вида</td><td><code>null</code></td></tr>
</table></div>
<div class="note trap"><b class="hd">Как это ломает тест</b><p>Передали объект с тестовыми данными в метод-помощник, тот поменял поле — изменился и оригинал, потому что передавалась ссылка. Следующий тест в фикстуре получает уже испорченные данные и падает «без причины». Лечится либо неизменяемыми моделями (<code>record</code> с <code>init</code>-свойствами), либо созданием свежего объекта на каждый тест.</p></div>

<h2>Строки</h2>
<p><code>string</code> — ссылочный тип, но <b>неизменяемый</b>: любая операция создаёт новую строку. Отсюда два вопроса-спутника.</p>
<div class="tw"><table>
<tr><th>Вопрос</th><th>Ответ</th></tr>
<tr><td>Чем <code>==</code> отличается от <code>Equals</code> для строк?</td><td>Для <code>string</code> оператор <code>==</code> перегружен и сравнивает содержимое — то же, что <code>Equals</code>. Для произвольного ссылочного типа <code>==</code> по умолчанию сравнивает ссылки.</td></tr>
<tr><td>Когда нужен <code>StringBuilder</code>?</td><td>Когда строка собирается в цикле. Склейка через <code>+</code> в цикле на тысячу итераций создаёт тысячу временных строк.</td></tr>
<tr><td>Чем плох <code>string.Empty</code> против <code>""</code>?</td><td>Ничем, это одно и то же. А вот <code>null</code> и <code>""</code> — разные вещи: <code>string.IsNullOrEmpty</code> покрывает оба, <code>IsNullOrWhiteSpace</code> — ещё и строку из пробелов.</td></tr>
</table></div>

<h2>Коллекции</h2>
<div class="tw"><table>
<tr><th>Тип</th><th>Когда брать</th><th>Поиск</th></tr>
<tr><td><code>List&lt;T&gt;</code></td><td>упорядоченный набор, доступ по индексу</td><td>линейный, O(n)</td></tr>
<tr><td><code>Dictionary&lt;K,V&gt;</code></td><td>поиск по ключу — тестовые данные по имени случая</td><td>O(1) в среднем</td></tr>
<tr><td><code>HashSet&lt;T&gt;</code></td><td>уникальность, быстрая проверка вхождения</td><td>O(1) в среднем</td></tr>
<tr><td><code>IEnumerable&lt;T&gt;</code></td><td>тип параметра и возврата: не привязывает к реализации</td><td>—</td></tr>
</table></div>
<div class="note"><b class="hd">Отложенное выполнение LINQ</b><p><code>Where</code> и <code>Select</code> ничего не вычисляют в момент вызова — только описывают запрос. Вычисление происходит при переборе или при <code>ToList()</code>, <code>Count()</code>, <code>First()</code>. Поэтому запрос, построенный по коллекции, а затем перебранный после её изменения, выдаст новый результат. В тестах это ловят так: собрали запрос к списку локаторов, страница обновилась — и перебор пошёл по устаревшим элементам.</p></div>

<h2>async и await</h2>
<p>Весь Playwright асинхронен, поэтому тестовые методы возвращают <code>Task</code>. Три вещи, которые спрашивают:</p>
<div class="tw"><table>
<tr><th>Вопрос</th><th>Ответ</th></tr>
<tr><td>Что делает <code>await</code>?</td><td>Освобождает поток до завершения операции и продолжает выполнение с того же места. Это не создание потока.</td></tr>
<tr><td>Чем плох <code>.Result</code> или <code>.Wait()</code>?</td><td>Блокирует поток и в ряде контекстов приводит к взаимной блокировке. В тестах это ещё и съедает воркеров NUnit.</td></tr>
<tr><td>Что такое <code>async void</code>?</td><td>Метод, исключение из которого нельзя поймать вызывающей стороной. В тестах — гарантированно проглоченная ошибка. Допустим только для обработчиков событий.</td></tr>
</table></div>
<div class="note trap"><b class="hd">Забытый await</b><p><code>Page.ClickAsync(...)</code> без <code>await</code> компилируется — и тест идёт дальше, не дождавшись нажатия. Дефект плавающий: иногда успевает, иногда нет. Компилятор предупреждает (CS4014), но предупреждение легко не заметить. Проверьте, включено ли у вас <code>&lt;TreatWarningsAsErrors&gt;</code> — на собеседовании это сильный ответ на вопрос «как вы предотвращаете такие ошибки».</p></div>

<h2>Ещё три темы, которые всплывают</h2>
<div class="tw"><table>
<tr><th>Тема</th><th>Короткий ответ</th></tr>
<tr><td><code>IDisposable</code> и <code>using</code></td><td>Освобождение неуправляемых ресурсов детерминированно, не дожидаясь сборщика мусора. В тестах — соединения, файлы, свой драйвер.</td></tr>
<tr><td>Исключения</td><td>Ловить конкретный тип, а не <code>catch (Exception)</code>. Пустой <code>catch</code> в тесте превращает падение в зелёный прогон — это худшее, что можно сделать.</td></tr>
<tr><td>Nullable-ссылки</td><td><code>string?</code> против <code>string</code>. Включается <code>&lt;Nullable&gt;enable&lt;/Nullable&gt;</code> и убирает целый класс ошибок ещё до запуска.</td></tr>
</table></div>

<h2>Модель ограничений</h2>
<pre><code><span class="c">// классический стиль — в NUnit 4 вынесен в отдельный пакет</span>
<span class="k">Assert</span>.AreEqual(expected, actual);

<span class="c">// модель ограничений — рекомендуемая</span>
<span class="k">Assert</span>.That(actual, <span class="k">Is</span>.EqualTo(expected));
<span class="k">Assert</span>.That(list, <span class="k">Has</span>.Count.EqualTo(3).And.All.Not.Null);
<span class="k">Assert</span>.That(text, <span class="k">Does</span>.Contain(<span class="s">"Спасибо"</span>).IgnoreCase);
<span class="k">Assert</span>.That(<span class="k">async</span> () =&gt; <span class="k">await</span> Act(), <span class="k">Throws</span>.TypeOf&lt;TimeoutException&gt;());</code></pre>
<div class="note"><b class="hd">NUnit 3 против NUnit 4 — что будет при обновлении</b><p>Все три проекта решения стоят на NUnit <b>3.14.0</b>. В четвёртой версии классические утверждения (<code>Assert.AreEqual</code>, <code>Assert.IsTrue</code>) убраны из основного пакета в <code>NUnit.Framework.Legacy</code> под именем <code>ClassicAssert</code>. Это самая частая причина, по которой обновление NUnit «ломает всё».</p><p>Хорошая новость про этот репозиторий: он к обновлению готов. Модель ограничений используется повсеместно — <b>442</b> вызова <code>Assert.That</code> и <b>ни одного</b> классического утверждения. Знать это про свой проект — сильный ход: на вопрос «что будет при переходе на NUnit 4» вы отвечаете не догадкой, а фактом.</p></div>

<h2>Assert.Multiple</h2>
<p>Обычные утверждения прерывают тест на первом несовпадении. Когда нужно увидеть все расхождения сразу:</p>
<pre><code><span class="k">Assert</span>.Multiple(() =&gt;
{
    <span class="k">Assert</span>.That(order.Status, <span class="k">Is</span>.EqualTo(<span class="s">"Оплачен"</span>));
    <span class="k">Assert</span>.That(order.Total,  <span class="k">Is</span>.EqualTo(1000));
    <span class="k">Assert</span>.That(order.Items, <span class="k">Has</span>.Count.EqualTo(3));
});</code></pre>
<p>Отчёт покажет все три несовпадения, а не только первое. Для UI-проверок Playwright есть парная конструкция — <code>Expect()</code> с собственным ожиданием.</p>

<h2>Автоматические ожидания</h2>
<p>Ключевое отличие Playwright от Selenium: перед каждым действием он сам дожидается, что элемент существует, видим, стабилен (перестал двигаться), доступен для взаимодействия и не перекрыт. Отдельные ожидания в коде почти всегда не нужны.</p>
<div class="tw"><table>
<tr><th>Ждёт автоматически</th><th>Не ждёт</th></tr>
<tr><td><code>ClickAsync</code>, <code>FillAsync</code>, <code>CheckAsync</code>, <code>SelectOptionAsync</code></td><td><code>IsVisibleAsync</code>, <code>IsEnabledAsync</code>, <code>TextContentAsync</code></td></tr>
<tr><td><code>Expect(locator).ToBeVisibleAsync()</code> и прочие <code>Expect</code></td><td><code>CountAsync</code>, <code>AllTextContentsAsync</code></td></tr>
</table></div>
<div class="note trap"><b class="hd">Правило, снимающее большинство флака</b><p>Предикаты (<code>IsVisibleAsync</code>) возвращают состояние <em>сейчас</em>. Проверки (<code>Expect(...).ToBeVisibleAsync()</code>) <em>ждут</em> нужного состояния до таймаута. Поэтому <code>Assert.That(await page.IsVisibleAsync(s), Is.True)</code> — источник плавающих падений, а <code>await Expect(page.Locator(s)).ToBeVisibleAsync()</code> — нет.</p></div>

<h2>Жёсткие ожидания</h2>
<div class="note trap"><b class="hd">284 вызова <code>WaitForTimeoutAsync</code></b><p>278 в <code>Vertex2025</code> и 6 в <code>Portal</code> — проблема почти целиком сосредоточена в одном проекте. Каждый вызов — фиксированная пауза: слишком длинная в лучшем случае и слишком короткая в худшем. Документация Playwright прямо помечает этот метод как «не использовать в продакшен-коде».</p><p>Чем заменять по ситуации:</p>
<div class="tw" style="margin-top:.5em"><table>
<tr><th>Ждали чего</th><th>Чем заменить</th></tr>
<tr><td>появления элемента</td><td><code>await Expect(loc).ToBeVisibleAsync()</code></td></tr>
<tr><td>исчезновения загрузчика</td><td><code>await Expect(spinner).ToBeHiddenAsync()</code></td></tr>
<tr><td>смены адреса</td><td><code>await Page.WaitForURLAsync("**/thanks")</code></td></tr>
<tr><td>ответа сервера</td><td><code>await Page.WaitForResponseAsync(r =&gt; r.Url.Contains("/api"))</code></td></tr>
<tr><td>обновления текста</td><td><code>await Expect(loc).ToHaveTextAsync("Готово")</code></td></tr>
</table></div></div>

<h2>Строгий режим</h2>
<p>Если локатор находит больше одного элемента, Playwright не берёт первый молча, а падает с ошибкой <code>strict mode violation</code> и перечисляет найденное. Это <b>полезное</b> поведение: оно ловит неоднозначность на этапе разработки теста.</p>
<pre><code><span class="c">// упадёт, если кнопок «Далее» на странице две</span>
<span class="k">await</span> Page.GetByRole(<span class="s">"button"</span>, <span class="k">new</span>(){ Name = <span class="s">"Далее"</span> }).ClickAsync();

<span class="c">// осознанное сужение</span>
<span class="k">await</span> Page.GetByTestId(<span class="s">"contact-form"</span>)
          .GetByRole(<span class="s">"button"</span>, <span class="k">new</span>(){ Name = <span class="s">"Далее"</span> }).ClickAsync();</code></pre>
<p>В репозитории 60 обращений к <code>.Nth()</code>, <code>.First</code> и <code>.Last</code>. Каждое — место, где неоднозначность решена выбором по порядку. Иногда это оправданно, но чаще означает, что локатор стоит уточнить контекстом.</p>

<tr><td>Экосистема</td><td>шире, стандарт W3C</td><td>моложе, свой протокол</td></tr>
</table></div>

  a:"Флакающий — это тест, дающий разный результат на неизменном коде. Опасен он не сам по себе, а тем, что обучает команду не смотреть на красный прогон: через месяц настоящая поломка теряется в шуме. Работаю так. Сначала измеряю: беру историю CI и выписываю тесты, у которых за последние сто прогонов есть и зелёное, и красное без изменений в репозитории. Получается конкретный список вместо ощущения. Дальше по каждому — диагностика: трейс упавшего прогона, затем двадцать одиночных запусков, затем запуск всей фикстуры. Это разделяет три случая: проблема в самом тесте, в соседях и данных, в окружении. Причины почти всегда из короткого списка: ожидание времени вместо условия, предикат без ожидания, неоднозначный локатор, общие данные. И отдельно всегда проверяю гипотезу, что это настоящая гонка в продукте, — потому что именно её ретрай спрячет навсегда.",

body:`
<h2>Изоляция — условие всего остального</h2>
<div class="note ok"><b class="hd">Правило</b><p>Тест должен проходить в одиночку, в любом порядке, дважды подряд и одновременно с другими. Каждое нарушение отнимает возможность: связанность по порядку убивает выборочный запуск, общие данные — параллельность, неповторяемость — перезапуск после починки.</p></div>

<h2>Откуда берутся данные</h2>
<div class="tw"><table>
<tr><th>Способ</th><th>Плюс</th><th>Минус</th></tr>
<tr><td>Заранее заведённые в базе стенда</td><td>быстро, ничего не готовим</td><td>их портят; тест зависит от чужого состояния</td></tr>
<tr><td>Создание через интерфейс</td><td>попутно проверяется сценарий</td><td>долго и хрупко: падение подготовки выглядит как падение теста</td></tr>
<tr><td>Создание через API</td><td>быстро, надёжно, легко чистить</td><td>нужен доступ и знание контракта</td></tr>
<tr><td>Генерация на лету</td><td>уникальность, повторяемость прогонов</td><td>не годится, когда нужны связанные сущности</td></tr>
</table></div>
<div class="note"><b class="hd">Правило разделения</b><p>Через интерфейс проверяем <b>то, что тестируем</b>. Всё остальное готовим через API. Тест на оформление заказа не должен пять минут регистрировать пользователя кликами: пользователь создаётся запросом, а кликами проверяется именно оформление. Это и ускоряет прогон, и убирает ложные падения на подготовке.</p></div>

<h2>Подготовка через API рядом с Playwright</h2>
<pre><code><span class="c">// Playwright умеет ходить по HTTP сам — отдельный HttpClient не нужен</span>
<span class="k">var</span> api = <span class="k">await</span> Playwright.APIRequest.NewContextAsync(<span class="k">new</span>()
{
    BaseURL = TestConfig.ApiUrl,
    ExtraHTTPHeaders = <span class="k">new</span> Dictionary&lt;<span class="k">string</span>, <span class="k">string</span>&gt; { [<span class="s">"Authorization"</span>] = token }
});

<span class="k">var</span> resp = <span class="k">await</span> api.PostAsync(<span class="s">"/users"</span>, <span class="k">new</span>(){ DataObject = <span class="k">new</span> { email = UniqueEmail() } });
<span class="k">Assert</span>.That(resp.Status, <span class="k">Is</span>.EqualTo(201));</code></pre>
<p>Дополнительная возможность — переиспользовать состояние сессии: войти один раз через API, сохранить <code>storageState</code> и подставлять его в контекст каждого теста. Вход перестаёт занимать время в каждом сценарии.</p>

<h2>Почему параллельность здесь не включена</h2>
<div class="tw"><table>
<tr><th>Препятствие</th><th>Что с этим делать</th></tr>
<tr><td>Нет атрибута <code>[Parallelizable]</code> — ноль использований</td><td>это следствие, а не причина: сначала изоляция</td></tr>
<tr><td>Общие учётные записи и данные стенда</td><td>уникальные данные на тест либо пул учёток с захватом</td></tr>
<tr><td>Тесты меняют общее состояние приложения</td><td>откат в TearDown или создание своей сущности</td></tr>
<tr><td>Внешний стенд с ограничением по нагрузке</td><td>умеренная степень параллельности, согласованная с владельцем</td></tr>
<tr><td>Порядок внутри фикстуры имеет значение</td><td>разорвать связанность: каждый тест готовит себе состояние сам</td></tr>
</table></div>
<div class="note warn"><b class="hd">Формулировка для интервью</b><p>«У нас в runsettings заявлено четыре тестовых воркера, но атрибута <code>[Parallelizable]</code> нет ни одного, поэтому прогон последовательный, а настройка ни на что не влияет. Это не недосмотр в одну строку: включить параллельность мешает то, что часть тестов делит данные на стенде. Порядок работ обратный привычному — сначала уникальные данные и подготовка через API, потом атрибут.» Такой ответ показывает, что вы понимаете причинно-следственную связь, а не ищете волшебный флаг.</p></div>

<h2>Уровни параллельности</h2>
<div class="tw"><table>
<tr><th>Уровень</th><th>Механизм</th><th>Замечание</th></tr>
<tr><td>Внутри сборки</td><td><code>[Parallelizable(ParallelScope.Fixtures)]</code> плюс <code>NumberOfTestWorkers</code></td><td>для UI это столько же браузеров одновременно</td></tr>
<tr><td>Между сборками</td><td><code>MaxCpuCount</code> в <code>RunConfiguration</code></td><td>распараллеливает проекты, а не тесты внутри</td></tr>
<tr><td>Между агентами CI</td><td>разбиение прогона на части в пайплайне</td><td>самый простой выигрыш, если агентов несколько</td></tr>
</table></div>

  a:"Основное правило — через интерфейс проверяем только то, что тестируем, остальное готовим через API. Если тест про оформление заказа, пользователь и корзина создаются запросами, а кликами проходится именно оформление: это быстрее, надёжнее и, главное, падение подготовки не маскируется под падение проверки. Данные делаю уникальными на каждый прогон — адрес с <code>Guid</code>, а не фиксированный, — чтобы тест можно было запустить дважды подряд. То, что создал, стараюсь удалять в <code>TearDown</code>, но не полагаюсь на это: стенд всё равно надо уметь чистить фоново, потому что упавший тест до <code>TearDown</code> может не дойти. Заранее заведённые в базе «вечные» учётки использую только для чтения — как только их начинают менять, тесты начинают мешать друг другу.",

 {q:"Почему у вас тесты не идут параллельно и что нужно, чтобы включить?",
  probe:"Проверяют, знаете ли вы своё окружение и умеете ли отличать причину от следствия.",
  a:"Формально — потому что нет атрибута <code>[Parallelizable]</code>: в runsettings заявлено четыре воркера, но без атрибута NUnit выполняет фикстуры последовательно, и настройка ни на что не влияет. Но это следствие, а не причина. Включить одной строкой нельзя, потому что часть тестов делит состояние: общие учётные записи, данные на стенде, которые тест меняет и не откатывает. Запусти их одновременно — получишь не ускорение, а волну плавающих падений, и первым же выводом команды будет «параллельность у нас не работает». Правильный порядок обратный: сначала уникальные данные на тест, подготовка через API и очистка, затем включаем параллельность на одной фикстуре, смотрим, потом расширяем. И отдельно надо согласовать нагрузку с владельцем стенда: четыре браузера одновременно на общий UAT — это заметно.",
  more:["С какой фикстуры начнёте?","Как поймёте, что можно расширять?"]}
]

body:`
<h2>Из чего обычно состоит</h2>
<div class="tw"><table>

<tr><td>Ваши вопросы</td><td>интерес и зрелость</td><td>5–10%</td></tr>
</table></div>

<h2>Разбор чужого теста</h2>
<p>Задача «найдите здесь проблемы» встречается очень часто. Ниже — типичный образец; в нём восемь мест, каждое из которых стоит назвать.</p>
<div data-file="badtest"></div>

<h2>Что отвечать на «расскажите о себе»</h2>
<div class="note ok"><b class="hd">Схема на девяносто секунд</b><p>Роль и стек одной фразой → продукт, который тестируете, и его масштаб → что делали руками, с конкретикой → одно улучшение, которое провели сами, с результатом → чем хотите заниматься дальше и почему пришли сюда. Ошибка, которую совершают чаще всего, — пересказ резюме по годам. Интервьюер его читал; ему нужен акцент.</p></div>

<h2>Как говорить о слабых местах своего проекта</h2>
<p>Это самый недооценённый ход. Кандидат, который говорит «у нас всё хорошо», выглядит либо неопытным, либо неискренним. Кандидат, который называет конкретную проблему с цифрой и планом, выглядит инженером.</p>
<div class="tw"><table>
<tr><th>Слабо</th><th>Сильно</th></tr>
<tr><td>«Бывают нестабильные тесты»</td><td>«38 атрибутов <code>[Retry]</code> в одном проекте и 284 жёстких ожидания в другом; начал бы с пересечения этих мест со списком флакающих»</td></tr>
<tr><td>«Локаторы иногда ломаются»</td><td>«178 XPath против 114 <code>GetByRole</code> и ни одного тестового идентификатора — нужна договорённость с разработкой»</td></tr>
<tr><td>«Тесты идут долго»</td><td>«Прогон последовательный: воркеров четыре, но <code>[Parallelizable]</code> нет ни одного; включать до наведения порядка в данных бессмысленно»</td></tr>
<tr><td>«Много дублирования»</td><td>«<code>[TestCase]</code> не используется ни разу на 432 теста — отсюда файл на 1919 строк»</td></tr>
</table></div>

<h2>Ответы, которые снижают оценку</h2>
<div class="tw"><table>
<tr><th>Ответ</th><th>Что слышит интервьюер</th></tr>
<tr><td>«Ставлю Retry, если тест нестабилен»</td><td>не отличает симптом от причины</td></tr>
<tr><td>«Автоматизирую всё»</td><td>не считает стоимость поддержки</td></tr>
<tr><td>«Локаторы беру по XPath, так надёжнее»</td><td>не знает иерархии устойчивости</td></tr>
<tr><td>«За качество отвечает тестировщик»</td><td>не понимает распределения ответственности</td></tr>
<tr><td>«У нас всё хорошо в проекте»</td><td>не читает собственный код критически</td></tr>
<tr><td>Молчание на «есть ли вопросы»</td><td>нет интереса к позиции</td></tr>
</table></div>

<h2>О чём спросить самому</h2>
<div class="tw"><table>
<tr><th>Вопрос</th><th>Что покажет ответ</th></tr>
<tr><td>Сколько идёт прогон и что происходит при падении?</td><td>зрелость процесса и отношение к красному билду</td></tr>
<tr><td>Кто поддерживает автотесты и сколько среди них нестабильных?</td><td>реальное состояние против декларируемого</td></tr>
<tr><td>Есть ли договорённость с разработкой о тестовых идентификаторах?</td><td>насколько автоматизация встроена в разработку</td></tr>
<tr><td>Как готовятся тестовые данные и стенды?</td><td>сколько времени уйдёт на борьбу с окружением</td></tr>

<tr><td>Чем я буду заниматься первые три месяца?</td><td>ясность ожиданий</td></tr>
<tr><td>Почему открыта вакансия?</td><td>рост, замена или текучка</td></tr>
</table></div>

   Подсветка и разбор файлов
   ============================================================ */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function hi(text, lang){
  let s = esc(text);
  if(lang==="xml"){
    s = s.replace(/(&lt;!--[\s\S]*?--&gt;)/g,'<span class="c">$1</span>');
    s = s.replace(/(&lt;\/?)([A-Za-z_][\w.-]*)/g,'$1<span class="k">$2</span>');
    s = s.replace(/([A-Za-z_][\w.-]*)=(&quot;[^&]*?&quot;)/g,'<span class="a">$1</span>=<span class="s">$2</span>');
  } else if(lang==="cs"){
    /* Подстановка спанов и подсветка ключевых слов конфликтуют: слово class
       встречается и в коде, и в атрибуте class= вставляемой разметки.
       Поэтому строки и комментарии сначала прячем в плейсхолдеры. */
    const KW = "using|namespace|public|private|protected|internal|static|readonly|const|class|record|struct|"+
               "interface|async|await|return|new|var|void|string|bool|int|double|override|virtual|abstract|"+
               "sealed|partial|if|else|for|foreach|while|try|catch|finally|throw|null|true|false|this|base";
    const box = [];
    const hide = (re, cls) => { s = s.replace(re, m => { box.push('<span class="'+cls+'">'+m+'</span>'); return "\u0000"+(box.length-1)+"\u0000"; }); };
    hide(/&quot;(?:[^&]|&(?!quot;))*?&quot;/g, "s");  /* строки прячем первыми: // внутри них не комментарий */
    hide(/\/\/[^\n]*/g, "c");                       /* комментарии */
    hide(/\[[A-Z][\w.]*(?:\([^\)]*\))?\]/g, "a");   /* атрибуты */
    s = s.replace(new RegExp("\\b("+KW+")\\b","g"), '<span class="k">$1</span>');
    s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => box[+i]);
  } else if(lang==="yaml"){
    s = s.replace(/(#.*)$/g,'<span class="c">$1</span>');
    s = s.replace(/^(\s*-?\s*)([A-Za-z_][\w.-]*)(:)/,'$1<span class="k">$2</span>$3');
    s = s.replace(/(&quot;[^&]*?&quot;)/g,'<span class="s">$1</span>');
    s = s.replace(/(\$\([A-Za-z_.]+\))/g,'<span class="a">$1</span>');
  }
  return s;
}

function renderFile(id){
  const f = FILES[id];
  if(!f) return '<div class="note trap">Файл '+esc(id)+' не найден</div>';
  const rows = f.lines.map((l,i)=>{
    const hot = l.k ? ' hot' : '';
    const attr = l.k ? ' data-k="'+esc(l.k)+'" role="button" tabindex="0"' : '';
    return '<div class="row'+hot+'"'+attr+'><span class="ln">'+(i+1)+'</span><span class="cd">'+
           (l.c ? '<span class="tx">'+hi(l.c, f.lang)+'</span>' : "&nbsp;")+'</span></div>';
  }).join("");
  const hotCount = f.lines.filter(l=>l.k).length;
  return '<div class="file" data-file-id="'+esc(id)+'">'+
    '<div class="file-h"><span class="p">'+esc(f.path)+'</span><span class="r">'+esc(f.tag)+'</span></div>'+
    '<div class="code-rows">'+rows+'</div>'+
    '<div class="file-hint">'+hotCount+' строк(и) с пояснением — нажмите на подчёркнутую строку</div>'+
    '<div class="ann" hidden></div></div>';
}

function wireFiles(root){
  root.querySelectorAll(".file").forEach(box=>{
    const f = FILES[box.dataset.fileId];
    const ann = box.querySelector(".ann");
    const open = row=>{
      const k = row.dataset.k;
      const was = row.classList.contains("on");
      box.querySelectorAll(".row.on").forEach(r=>r.classList.remove("on"));
      if(was){ ann.hidden = true; return; }
      row.classList.add("on");
      const n = f.notes[k];
      ann.innerHTML = '<h4>'+esc(n.h)+'</h4>'+n.p.map(p=>'<p>'+p+'</p>').join("");
      ann.hidden = false;
    };
    box.querySelectorAll(".row.hot").forEach(row=>{
      row.onclick = ()=>open(row);
      row.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(row); } };
    });
  });
}
