{
n:7, id:"vars", title:"Переменные и кавычки", sub:"Главная ловушка bash",
lede:"Кавычки в bash — не оформление, а управление разбором. Отсутствие кавычек вокруг переменной ломает больше скриптов, чем всё остальное вместе взятое.",
theory:`
<h2>Присваивание</h2>
<pre><code>ИМЯ=значение          <span class="c"># пробелов вокруг = быть не должно</span>
ИМЯ="значение с пробелами"
echo $ИМЯ
echo \${ИМЯ}_суффикс   <span class="c"># фигурные скобки отделяют имя от текста</span></code></pre>
<div class="note trap"><b class="hd">Пробел вокруг = ломает всё</b><p><code>X = 5</code> оболочка читает как команду <code>X</code> с аргументами <code>=</code> и <code>5</code>. Присваивание — это одно слово без пробелов, в этом его отличие от большинства языков.</p></div>
<div class="note warn"><b class="hd">Имя переменной — только латиница</b><p>Допустимы латинские буквы, цифры и подчёркивание, причём первым символом не может быть цифра. Кириллическое имя <code>ИМЯ=5</code> оболочка не считает присваиванием и попытается выполнить это как команду. Имена функций при этом заметно свободнее — там кириллица проходит.</p></div>

<h2>Три вида кавычек</h2>
<div class="tw"><table>
<tr><th>Запись</th><th>Что происходит внутри</th><th>Когда применять</th></tr>
<tr><td><code>'одинарные'</code></td><td><b>ничего</b>: всё дословно, даже <code>$</code> и <code>*</code></td><td>когда нужен текст как есть</td></tr>
<tr><td><code>"двойные"</code></td><td>раскрываются <code>$переменные</code> и <code>$(команды)</code>, но не шаблоны; разбиения на слова нет</td><td><b>умолчание для переменных</b></td></tr>
<tr><td>без кавычек</td><td>раскрывается всё, затем результат режется на слова и раскрывается как шаблон</td><td>когда разбиение действительно нужно</td></tr>
</table></div>
<pre><code>X="a b"
echo $X      <span class="c"># два слова: a и b</span>
echo "$X"    <span class="c"># одно слово: a b</span>
echo '$X'    <span class="c"># буквально: $X</span></code></pre>

<h2>Почему это ломает скрипты</h2>
<figure class="fig">
<svg viewBox="0 0 620 176" role="img" aria-label="Что происходит без кавычек и с кавычками">
 <g font-family="var(--fm)" font-size="10">
  <text x="0" y="14" font-size="9.5" fill="var(--ink3)">ПЕРЕМЕННАЯ:  F="мой файл.txt"</text>
  <rect x="0" y="24" width="300" height="66" rx="3" fill="var(--s4s)" stroke="var(--s4)"/>
  <text x="12" y="43" font-weight="700" fill="var(--s4)">rm $F</text>
  <text x="12" y="60" font-size="9" fill="var(--ink2)">разбивается на два слова</text>
  <text x="12" y="76" font-size="9" fill="var(--ink)">rm «мой» «файл.txt»</text>

  <rect x="320" y="24" width="300" height="66" rx="3" fill="var(--s2s)" stroke="var(--s2)"/>
  <text x="332" y="43" font-weight="700" fill="var(--s2)">rm "$F"</text>
  <text x="332" y="60" font-size="9" fill="var(--ink2)">остаётся одним словом</text>
  <text x="332" y="76" font-size="9" fill="var(--ink)">rm «мой файл.txt»</text>

  <text x="0" y="112" font-size="9.5" fill="var(--ink3)">ПЕРЕМЕННАЯ ПУСТА:  E=""</text>
  <rect x="0" y="120" width="300" height="46" rx="3" fill="var(--s4s)" stroke="var(--s4)"/>
  <text x="12" y="139" font-weight="700" fill="var(--s4)">[ $E = x ]</text>
  <text x="12" y="156" font-size="9" fill="var(--ink)">→ [ = x ] — синтаксическая ошибка</text>

  <rect x="320" y="120" width="300" height="46" rx="3" fill="var(--s2s)" stroke="var(--s2)"/>
  <text x="332" y="139" font-weight="700" fill="var(--s2)">[ "$E" = x ]</text>
  <text x="332" y="156" font-size="9" fill="var(--ink)">→ [ "" = x ] — честное сравнение</text>
 </g>
</svg>
<figcaption>Пустое значение без кавычек исчезает бесследно, значение с пробелом распадается. Кавычки сохраняют слово целым.</figcaption>
</figure>

<div class="note ok"><b class="hd">Правило, которое стоит принять раз и навсегда</b><p><b>Всегда берите переменные в двойные кавычки</b>, кроме случаев, когда разбиение на слова нужно вам осознанно. Это не перестраховка: без кавычек любое имя файла с пробелом, любая пустая переменная и любое значение со звёздочкой ведут себя не так, как вы читаете глазами.</p></div>

<h2>Полезные формы подстановки</h2>
<div class="tw"><table>
<tr><th>Запись</th><th>Значение</th></tr>
<tr><td><code>\${X:-по умолчанию}</code></td><td>значение X, а если пусто или не задано — «по умолчанию»</td></tr>
<tr><td><code>\${X:?сообщение}</code></td><td>значение X, а если пусто — прервать с сообщением</td></tr>
<tr><td><code>\${#X}</code></td><td>длина значения</td></tr>
<tr><td><code>\${X#шаблон}</code> / <code>\${X##шаблон}</code></td><td>убрать совпадение с начала: коротко / жадно</td></tr>
<tr><td><code>\${X%шаблон}</code> / <code>\${X%%шаблон}</code></td><td>убрать совпадение с конца</td></tr>
<tr><td><code>\${X/что/на}</code> / <code>\${X//что/на}</code></td><td>заменить первое / все вхождения</td></tr>
</table></div>
<pre><code>F="архив.tar.gz"
echo \${F%.gz}      <span class="c"># архив.tar   — убрать короткий хвост</span>
echo \${F%%.*}      <span class="c"># архив       — убрать длинный хвост</span>
P="/home/user/doc.txt"
echo \${P##*/}      <span class="c"># doc.txt     — то же, что basename</span>
echo \${P%/*}       <span class="c"># /home/user  — то же, что dirname</span></code></pre>

<h2>Переменные окружения</h2>
<p>Обычная переменная видна только текущей оболочке. Команда <code>export</code> помечает её как <b>переменную окружения</b> — такие наследуются запускаемыми программами.</p>
<pre><code>X=5            <span class="c"># видна только здесь</span>
export Y=7     <span class="c"># унаследуют дочерние процессы</span>
env            <span class="c"># посмотреть окружение</span></code></pre>
<p>Наследование идёт только вниз: дочерний процесс не может изменить переменную родителя. Именно поэтому скрипт, который «устанавливает переменную», нужно не запускать, а подключать через <code>source</code>.</p>
<div class="note warn"><b class="hd">Важные переменные</b><ul>
<li><code>PATH</code> — где искать программы. Пустая или неверная <code>PATH</code> ломает вообще всё.</li>
<li><code>HOME</code> — домашний каталог, в него ведёт <code>~</code>.</li>
<li><code>IFS</code> — какие символы считаются разделителями при разбиении на слова.</li>
<li><code>?</code> — код возврата последней команды (только чтение).</li>
</ul></div>
`,

{
n:8, id:"subst", title:"Подстановка и арифметика", sub:"Результат команды как значение",
lede:"Как взять вывод одной команды и использовать его как текст, и как посчитать без внешних программ.",
theory:`
<h2>Подстановка команды</h2>
<pre><code>N=$(ls | wc -l)
echo "файлов: $N"

echo "сегодня $(date)"
FILES=$(ls *.txt)</code></pre>
<p>Запись <code>$( … )</code> запускает команду, забирает её stdout и подставляет на место записи. Завершающие переводы строк отбрасываются.</p>
<div class="note"><b class="hd">Устаревшая форма с обратными кавычками</b><p><code>&#96;команда&#96;</code> делает то же самое, но не вкладывается без мучений с экранированием и хуже читается — легко спутать с одинарной кавычкой. В новом коде используйте <code>$( )</code>.</p></div>

<div class="note trap"><b class="hd">Подстановку тоже надо брать в кавычки</b><p><code>echo $(cat файл)</code> склеит все переводы строк в пробелы и разобьёт результат на слова. <code>echo "$(cat файл)"</code> сохранит текст как есть. Правило то же, что и для переменных.</p></div>

<h2>Арифметика</h2>
<pre><code>echo $((2 + 3 * 4))      <span class="c"># 14</span>
N=5; echo $((N * 2))     <span class="c"># 10 — знак доллара внутри не нужен</span>
echo $((10 / 3))         <span class="c"># 3 — только целые числа</span>
echo $((10 % 3))         <span class="c"># 1 — остаток</span>
i=$((i + 1))             <span class="c"># увеличить счётчик</span></code></pre>
<div class="tw"><table>
<tr><th>Операция</th><th>Записывается</th></tr>
<tr><td>Сложение, вычитание</td><td><code>+</code> <code>-</code></td></tr>
<tr><td>Умножение, целое деление, остаток</td><td><code>*</code> <code>/</code> <code>%</code></td></tr>
<tr><td>Сравнение</td><td><code>&lt;</code> <code>&lt;=</code> <code>&gt;</code> <code>&gt;=</code> <code>==</code> <code>!=</code></td></tr>
<tr><td>Логика</td><td><code>&amp;&amp;</code> <code>||</code> <code>!</code></td></tr>
</table></div>
<div class="note warn"><b class="hd">Только целые числа</b><p>Bash не умеет дробей: <code>$((10/4))</code> даст 2, а не 2.5. Для вещественной арифметики нужны внешние программы — <code>bc</code>, <code>awk</code>, <code>python3</code>. Если в скрипте появляются проценты и деньги, это сигнал, что задача переросла bash.</p></div>

<h2>Код возврата как значение</h2>
<pre><code>grep -q ERROR app.log
echo $?              <span class="c"># 0 если нашлось, 1 если нет</span></code></pre>
<p>Переменная <code>$?</code> хранит код <b>последней</b> команды и перезаписывается следующей. Если код нужен дальше — сохраните его сразу: <code>rc=$?</code>.</p>
<div class="note trap"><b class="hd">Классическая ошибка</b><pre style="margin:.5em 0 0"><code>команда
echo "код: $?"       <span class="c"># код команды — верно</span>
if [ $? -ne 0 ]; then   <span class="c"># код команды echo, а не команды! — неверно</span></code></pre><p>Каждая команда, включая <code>echo</code>, перезаписывает <code>$?</code>.</p></div>

<h2>Вложенность</h2>
<pre><code>echo "строк: $(wc -l < "$(ls *.log | head -n 1)")"</code></pre>
<p>Подстановки вкладываются свободно — в отличие от обратных кавычек, где для этого нужны экранирования. Но если вложенность стала больше двух уровней, обычно понятнее разбить на несколько строк с промежуточными переменными.</p>
`,

{
n:9, id:"cond", title:"Условия", sub:"Коды возврата и ветвления",
lede:"В bash условие — это не выражение «истина/ложь», а запущенная команда и её код возврата.",
theory:`
<div class="note ok"><b class="hd">Ключ ко всему модулю</b><p><b>Ноль — это истина.</b> Не наоборот. Команда, отработавшая успешно, возвращает 0, и <code>if</code> считает это «да». Логика обратна большинству языков и объясняется просто: успех один, а способов провалиться много, и каждому можно дать свой номер.</p></div>

<h2>Проверки: test и [ ]</h2>
<p><code>[</code> — это <b>команда</b>, а не синтаксис. Отсюда все её странности: аргументы надо разделять пробелами, а закрывающая <code>]</code> — обязательный последний аргумент.</p>
<pre><code>if [ -f notes.txt ]; then echo "файл есть"; fi
test -f notes.txt && echo "то же самое"</code></pre>
<div class="tw"><table>
<tr><th>Проверка</th><th>Истинна, если</th></tr>
<tr><td><code>-e путь</code></td><td>существует</td></tr>
<tr><td><code>-f путь</code></td><td>обычный файл</td></tr>
<tr><td><code>-d путь</code></td><td>каталог</td></tr>
<tr><td><code>-s путь</code></td><td>существует и непуст</td></tr>
<tr><td><code>-x путь</code></td><td>исполняемый</td></tr>
<tr><td><code>-z "$S"</code></td><td>строка пуста</td></tr>
<tr><td><code>-n "$S"</code></td><td>строка непуста</td></tr>
<tr><td><code>"$A" = "$B"</code></td><td>строки равны</td></tr>
<tr><td><code>$A -eq $B</code></td><td>числа равны</td></tr>
<tr><td><code>-lt -le -gt -ge -ne</code></td><td>числовые сравнения</td></tr>
</table></div>
<div class="note trap"><b class="hd">Числа и строки сравниваются по-разному</b><p><code>[ 10 -gt 9 ]</code> истинно. <code>[ "10" &gt; "9" ]</code> — ложно, потому что это сравнение <b>строк</b>, а «1» идёт раньше «9». Для чисел всегда <code>-eq</code>, <code>-lt</code>, <code>-gt</code>; для строк — <code>=</code> и <code>!=</code>.</p></div>

<h2>Ветвления</h2>
<pre><code>if [ -f "$F" ]; then
    echo "файл"
elif [ -d "$F" ]; then
    echo "каталог"
else
    echo "не существует"
fi</code></pre>
<p>Точка с запятой перед <code>then</code> нужна потому, что <code>if</code> ждёт <b>команду</b>, а команда должна быть завершена. Если писать <code>then</code> с новой строки, точка с запятой не нужна.</p>

<h2>Короткие формы</h2>
<pre><code>[ -f "$F" ] &amp;&amp; echo "есть"           <span class="c"># если успех — выполнить</span>
[ -f "$F" ] || echo "нет"            <span class="c"># если неудача — выполнить</span>
mkdir -p logs &amp;&amp; cd logs             <span class="c"># цепочка: следующее только при успехе</span>
команда || exit 1                     <span class="c"># прервать при ошибке</span></code></pre>
<p>Операторы <code>&amp;&amp;</code> и <code>||</code> ленивы: правая часть выполняется, только если это нужно для результата. Это ровно то, что даёт привычную идиому «сделай или упади».</p>
<div class="note warn"><b class="hd">Ловушка цепочки <code>A && B || C</code></b><p>Это <em>не</em> тернарный оператор. Если <code>A</code> успешна, но <code>B</code> провалится, выполнится и <code>C</code>. Для настоящего выбора нужен полноценный <code>if</code>.</p></div>

<h2>case для нескольких вариантов</h2>
<pre><code>case "$1" in
    start)   echo "запуск" ;;
    stop)    echo "остановка" ;;
    *.log)   echo "это журнал" ;;
    *)       echo "неизвестно"; exit 1 ;;
esac</code></pre>
<p>Образцы — это <b>шаблоны имён файлов</b>, а не регулярные выражения: работают <code>*</code>, <code>?</code>, <code>[…]</code>. Ветку закрывают двумя точками с запятой. Ветка <code>*)</code> — «всё остальное», её ставят последней.</p>

<h2>Почему кавычки здесь особенно важны</h2>
<pre><code>F=""
[ $F = "x" ]     <span class="c"># → [ = x ] — ошибка синтаксиса</span>
[ "$F" = "x" ]   <span class="c"># → [ "" = x ] — честное сравнение</span></code></pre>
<p>Поскольку <code>[</code> — обычная команда, она видит уже разобранные слова. Исчезнувшее пустое значение оставляет её с неполным набором аргументов.</p>
`,

{
n:10, id:"loops", title:"Циклы", sub:"for, while и чтение строк",
lede:"Как повторить действие для каждого файла и как правильно читать файл построчно — включая ловушку, на которую попадаются почти все.",
theory:`
<h2>for — по списку</h2>
<pre><code>for f in *.txt; do
    echo "обрабатываю $f"
done

for i in 1 2 3; do echo "шаг $i"; done
for i in {1..5}; do echo $i; done
for f in docs/*; do wc -l "$f"; done</code></pre>
<p>Цикл <code>for</code> идёт по <b>списку слов</b>. Список получается после всех раскрытий — то есть звёздочка превращается в имена файлов ещё до начала цикла.</p>
<div class="note trap"><b class="hd">Не перебирайте вывод <code>ls</code></b><p><code>for f in $(ls)</code> — распространённая, но сломанная идиома: результат разбивается по пробелам, и файл «мой отчёт.txt» превратится в два элемента. Правильно — перебирать шаблон напрямую: <code>for f in *</code>. Шаблон отдаёт имена как отдельные слова, не проходя через разбиение.</p></div>

<h2>while — пока условие истинно</h2>
<pre><code>i=0
while [ $i -lt 3 ]; do
    echo "i = $i"
    i=$((i + 1))
done</code></pre>
<p>Есть и зеркальный <code>until</code> — «пока условие ложно». Используется реже, но иногда читается лучше: <code>until [ -f готово.флаг ]; do sleep 1; done</code>.</p>

<h2>Чтение файла построчно</h2>
<pre><code>while read -r line; do
    echo "строка: $line"
done &lt; файл.txt</code></pre>
<div class="note ok"><b class="hd">Три детали, и все обязательны</b><ul>
<li><b><code>-r</code></b> — не обрабатывать обратный слэш как экранирование. Без него <code>C:\новое</code> потеряет символы. Пишите <code>read -r</code> всегда.</li>
<li><b>Перенаправление у <code>done</code></b>, а не внутри цикла: файл открывается один раз, и <code>read</code> читает из него по строке за итерацию.</li>
<li><b>Кавычки вокруг <code>"$line"</code></b> при использовании — иначе пробелы внутри строки снова разъедут.</li>
</ul></div>
<div class="note trap"><b class="hd">Почему <code>for line in $(cat файл)</code> — не то же самое</b><p>Такой цикл идёт не по строкам, а по <b>словам</b>: строка «купить хлеб» станет двумя элементами. Плюс раскроются шаблоны: строка со звёздочкой превратится в список файлов. Для построчного чтения существует только <code>while read</code>.</p></div>

<h2>Прерывание и пропуск</h2>
<pre><code>for f in *; do
    [ -d "$f" ] &amp;&amp; continue      <span class="c"># каталоги пропустить</span>
    [ "$f" = "стоп.txt" ] &amp;&amp; break  <span class="c"># и прекратить вовсе</span>
    echo "$f"
done</code></pre>

<h2>Цикл и конвейер</h2>
<pre><code>ls *.log | while read -r f; do echo "$f"; done</code></pre>
<div class="note warn"><b class="hd">Правая часть конвейера — отдельная оболочка</b><p>Переменные, изменённые внутри такого цикла, <b>не сохранятся</b> после него: правая часть конвейера выполняется в подоболочке. Классическая ловушка со счётчиком:</p>
<pre style="margin:.5em 0 0"><code>n=0
ls | while read -r f; do n=$((n+1)); done
echo $n        <span class="c"># 0, а не количество файлов</span></code></pre>
<p>Лечится перенаправлением вместо конвейера: <code>while read -r f; do …; done &lt; файл</code>, либо подстановкой процесса.</p></div>

<h2>Когда цикл не нужен</h2>
<p>Многие задачи, для которых новички пишут цикл, решаются одной командой: <code>grep</code> уже проходит по всем строкам, <code>find … -exec</code> — по всем файлам, <code>xargs</code> раздаёт аргументы пачками. Цикл оправдан там, где на каждой итерации нужна <b>логика</b>, а не одинаковое действие.</p>
`,

{
n:11, id:"scripts", title:"Скрипты", sub:"Из команд в программу",
lede:"Как превратить последовательность команд в надёжный инструмент: shebang, права, аргументы, функции и защитные настройки.",
theory:`
<h2>Минимальный скрипт</h2>
<pre><code>#!/usr/bin/env bash
set -euo pipefail

echo "привет, $1"</code></pre>
<ol>
<li><b>Первая строка</b> — <em>shebang</em>: чем запускать файл. Форма <code>#!/usr/bin/env bash</code> надёжнее, чем <code>#!/bin/bash</code>: она ищет bash по <code>PATH</code>, а не по фиксированному пути, который на разных системах разный.</li>
<li><b>Права на выполнение:</b> <code>chmod +x скрипт.sh</code>. Без них запуск даст «Отказано в доступе».</li>
<li><b>Запуск:</b> <code>./скрипт.sh</code>. Точка со слэшем обязательна, потому что текущего каталога нет в <code>PATH</code> — и это правильно: иначе вредоносный <code>ls</code> в скачанном каталоге запускался бы вместо настоящего.</li>
</ol>

<h2>set -euo pipefail</h2>
<div class="tw"><table>
<tr><th>Настройка</th><th>Что делает</th><th>Что предотвращает</th></tr>
<tr><td><code>-e</code></td><td>прервать при первой неудачной команде</td><td>скрипт продолжает работу после ошибки и портит данные</td></tr>
<tr><td><code>-u</code></td><td>ошибка при обращении к незаданной переменной</td><td><code>rm -rf "$DIR"/</code> при пустой DIR</td></tr>
<tr><td><code>-o pipefail</code></td><td>конвейер возвращает код упавшего звена</td><td>ошибка в середине конвейера остаётся незамеченной</td></tr>
</table></div>
<div class="note ok"><b class="hd">Строка, с которой стоит начинать каждый скрипт</b><p><code>set -euo pipefail</code> превращает три класса тихих ошибок в громкие. Это дёшево и почти всегда правильно.</p></div>
<div class="note warn"><b class="hd">У <code>-e</code> есть особенности</b><p>Он не срабатывает для команд внутри <code>if</code>, слева от <code>&amp;&amp;</code> и <code>||</code>, и для команд с <code>!</code>. Это не баг: там неуспех — часть логики. А вот если неуспех ожидаем и в обычном месте, пишите явно: <code>команда || true</code>.</p></div>

<h2>Аргументы</h2>
<div class="tw"><table>
<tr><th>Запись</th><th>Значение</th></tr>
<tr><td><code>$0</code></td><td>имя скрипта</td></tr>
<tr><td><code>$1</code>, <code>$2</code>, …</td><td>аргументы по порядку</td></tr>
<tr><td><code>$#</code></td><td>сколько аргументов</td></tr>
<tr><td><code>"$@"</code></td><td>все аргументы, каждый — <b>отдельное слово</b></td></tr>
<tr><td><code>"$*"</code></td><td>все аргументы, склеенные в <b>одну</b> строку</td></tr>
</table></div>
<div class="note trap"><b class="hd">Всегда <code>"$@"</code>, никогда <code>$*</code></b><p>Без кавычек оба одинаково ломают аргументы с пробелами. В кавычках <code>"$@"</code> сохраняет границы аргументов, а <code>"$*"</code> склеивает всё в одну строку. Передавая аргументы дальше, пишите <code>"$@"</code>.</p></div>
<pre><code>if [ $# -lt 1 ]; then
    echo "нужен аргумент" &gt;&amp;2
    exit 1
fi</code></pre>
<p>Сообщения об ошибках идут в stderr (<code>&gt;&amp;2</code>), а ненулевой код возврата сообщает вызывающему, что что-то не так. Скрипт, который при ошибке печатает в stdout и возвращает 0, невозможно использовать в конвейере.</p>

<h2>Функции</h2>
<pre><code>лог() {
    echo "[$(date +%H:%M)] $*" &gt;&amp;2
}

обработать() {
    local файл="$1"
    [ -f "$файл" ] || { лог "нет файла: $файл"; return 1; }
    wc -l &lt; "$файл"
}

обработать notes.txt</code></pre>
<ul>
<li>Аргументы функции — те же <code>$1</code>, <code>$2</code>, <code>"$@"</code>.</li>
<li><code>local</code> ограничивает переменную функцией. Без него она глобальная — источник трудноуловимых ошибок.</li>
<li><code>return</code> задаёт код возврата, а не значение. «Вернуть» текст можно только напечатав его в stdout и поймав подстановкой.</li>
</ul>

<h2>Отладка</h2>
<pre><code>bash -x скрипт.sh      <span class="c"># печатать каждую команду перед выполнением</span>
set -x                 <span class="c"># включить трассировку с этого места</span>
set +x                 <span class="c"># выключить</span>
bash -n скрипт.sh      <span class="c"># только проверить синтаксис, не выполняя</span></code></pre>
<p><code>set -x</code> показывает команды <b>после всех раскрытий</b> — то есть ровно то, что реально выполняется. Обычно этого достаточно, чтобы увидеть, где потерялись кавычки.</p>
`,

{
n:12, id:"tools", title:"Поиск и обработка", sub:"find, xargs, sed, awk",
lede:"Четыре инструмента, которыми решается большинство задач автоматизации, и правила безопасной работы с именами файлов.",
theory:`
<h2>find — поиск по дереву</h2>
<pre><code>find . -name '*.log'                 <span class="c"># по имени (шаблон в кавычках!)</span>
find . -type f                       <span class="c"># только файлы</span>
find . -type d -name 'test*'         <span class="c"># условия складываются</span>
find . -maxdepth 1 -name '*.txt'     <span class="c"># не углубляться</span>
find . -name '*.tmp' -exec rm {} \;   <span class="c"># действие над каждым</span></code></pre>
<div class="note trap"><b class="hd">Шаблон в <code>-name</code> обязан быть в кавычках</b><p>Без кавычек <code>*.log</code> раскроет <b>оболочка</b> — по файлам текущего каталога, ещё до запуска <code>find</code>. Команда получит уже готовое имя и будет искать именно его. Кавычки передают звёздочку самой <code>find</code>, которая применит её на каждом уровне дерева.</p></div>

<h2>xargs — превратить список в аргументы</h2>
<pre><code>find . -name '*.log' | xargs wc -l          <span class="c"># посчитать во всех сразу</span>
find . -name '*.tmp' | xargs rm             <span class="c"># удалить все</span>
ls *.txt | xargs -I{} cp {} копии/           <span class="c"># подставить в середину</span>
find . -name '*.log' | xargs -n 1 gzip      <span class="c"># по одному аргументу за вызов</span></code></pre>
<p><code>xargs</code> читает stdin и добавляет прочитанное как аргументы команды. Это принципиально: <code>rm</code> не умеет читать список с stdin, а через <code>xargs</code> — умеет.</p>
<div class="note warn"><b class="hd">Имена с пробелами ломают связку</b><p><code>find | xargs</code> режет ввод по пробелам. Файл «мой отчёт.log» превратится в два несуществующих имени. Правильно — передавать имена, разделённые нулевым байтом:</p>
<pre style="margin:.5em 0 0"><code>find . -name '*.log' -print0 | xargs -0 rm</code></pre>
<p>Либо обойтись без <code>xargs</code>: <code>find . -name '*.log' -exec rm {} +</code>.</p></div>

<h2>sed — потоковая замена</h2>
<pre><code>sed 's/старое/новое/' файл          <span class="c"># первое вхождение в каждой строке</span>
sed 's/старое/новое/g' файл         <span class="c"># все вхождения</span>
sed -n '2p' файл                    <span class="c"># напечатать только 2-ю строку</span>
sed '/^#/d' файл                    <span class="c"># удалить строки-комментарии</span>
sed -i 's/a/b/g' файл               <span class="c"># изменить файл на месте</span></code></pre>
<div class="note warn"><b class="hd"><code>-i</code> меняет файл без резервной копии</b><p>Сначала проверьте вывод без <code>-i</code>. Ошибка в регулярном выражении с <code>-i</code> портит файл необратимо.</p></div>

<h2>awk — обработка по полям</h2>
<pre><code>awk '{print $1}' файл                    <span class="c"># первое поле каждой строки</span>
awk -F, '{print $2}' data.csv            <span class="c"># разделитель — запятая</span>
awk 'NR > 1 {print $1}' data.csv         <span class="c"># пропустить заголовок</span>
awk -F, '$3 > 120 {print $1}' data.csv   <span class="c"># условие по полю</span></code></pre>
<p><code>awk</code> сам разбивает строку на поля: <code>$1</code>, <code>$2</code>, …, <code>$0</code> — вся строка, <code>NR</code> — номер строки, <code>NF</code> — число полей. Для табличных данных он часто заменяет связку <code>cut</code> + <code>grep</code> + цикл.</p>

<h2>Что выбрать</h2>
<div class="tw"><table>
<tr><th>Задача</th><th>Инструмент</th></tr>
<tr><td>Найти строки по образцу</td><td><code>grep</code></td></tr>
<tr><td>Заменить текст</td><td><code>sed</code></td></tr>
<tr><td>Работать со столбцами, считать по условию</td><td><code>awk</code></td></tr>
<tr><td>Найти файлы по свойствам</td><td><code>find</code></td></tr>

const LS = "bashpalm.v1";
const $ = s => document.querySelector(s);

function hash32(str){ let h=2166136261>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
(function shuffle(){
  MODULES.forEach(m=>m.quiz.forEach(q=>{
    let seed = hash32(q.q);
    const rnd = ()=>{ seed=(Math.imul(seed,1664525)+1013904223)>>>0; return seed/4294967296; };
    const idx = q.opts.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
    q.opts = idx.map(i=>q.opts[i]); q.a = idx.indexOf(q.a);
  }));
})();

let PROG = {q:{}, l:{}};
try{ const raw = localStorage.getItem(LS); if(raw) PROG = Object.assign({q:{},l:{}}, JSON.parse(raw)); }catch(e){}
const save = ()=>{ try{ localStorage.setItem(LS, JSON.stringify(PROG)); }catch(e){} };

let cur = 0, tab = "th", curLab = 0;
const labs = {};
const key = (m,l) => m.id+"/"+l.id;
function labState(m,l){
  const k = key(m,l);
  if(!labs[k]){ const sh = newShell(); try{ l.setup && l.setup(sh); }catch(e){} labs[k] = {sh, lines:[], hist:[], hi:-1}; }
  return labs[k];
}
function resetLab(m,l){ const sh = newShell(); try{ l.setup && l.setup(sh); }catch(e){} labs[key(m,l)] = {sh, lines:[], hist:[], hi:-1}; }
function refs(){ const m = MODULES[cur]; const l = m.labs[curLab]; return {m, l, S: labState(m,l)}; }

const qs = m => (PROG.q[m.id] = PROG.q[m.id] || {});
const qDone = m => m.quiz.filter((_,i)=> qs(m)[i] && qs(m)[i].ok).length;
const lDone = m => m.labs.filter(l=>PROG.l[key(m,l)]).length;
function paintProg(){
  let d = 0, a = 0;
  MODULES.forEach(m=>{ a += m.quiz.length + m.labs.length; d += qDone(m) + lDone(m); });
  const pct = a ? Math.round(d/a*100) : 0;
  $("#pl").textContent = d + " / " + a;
  $("#pf").style.width = pct + "%";
  $("#pb").setAttribute("aria-valuenow", String(pct));
}
function paintRail(){
  $("#modList").innerHTML = MODULES.map((m,i)=>{
    const qd = qDone(m)===m.quiz.length, ld = lDone(m)===m.labs.length;
    return '<button class="mb" data-i="'+i+'" aria-current="'+(i===cur)+'">'+
      '<span class="n">'+String(m.n).padStart(2,"0")+'</span>'+
      '<span><span class="t">'+esc(m.title)+'</span><span class="s">'+esc(m.sub)+'</span></span>'+
      '<span class="d"><i class="dot'+(qd?" on":"")+'"></i><i class="dot'+(ld?" on":"")+'"></i></span></button>';
  }).join("");
  $("#modList").querySelectorAll(".mb").forEach(b=>b.onclick=()=>{ cur=+b.dataset.i; tab="th"; curLab=0; paintAll(); window.scrollTo({top:0}); });
}
function paintHead(){
  const m = MODULES[cur];
  $("#kick").textContent = "Модуль " + String(m.n).padStart(2,"0") + " · " + m.sub;
  $("#mtitle").textContent = m.title;
  $("#mlede").textContent = m.lede;
  const bq = $("#bqz"), bl = $("#blb");
  bq.textContent = qDone(m)+"/"+m.quiz.length; bq.classList.toggle("ok", qDone(m)===m.quiz.length);
  bl.textContent = lDone(m)+"/"+m.labs.length; bl.classList.toggle("ok", lDone(m)===m.labs.length);
  ["th","qz","lb"].forEach(t=>{ $("#t-"+t).setAttribute("aria-selected", String(tab===t)); $("#p-"+t).hidden = tab!==t; });
  const p = $("#prev"), n = $("#next");
  p.disabled = cur===0; n.disabled = cur===MODULES.length-1;
  p.innerHTML = '<span>◀ Назад<span class="sub">'+(cur>0?esc(MODULES[cur-1].title):"—")+'</span></span>';
  n.innerHTML = '<span>Далее ▶<span class="sub">'+(cur<MODULES.length-1?esc(MODULES[cur+1].title):"—")+'</span></span>';
}
function paintTheory(){ $("#theory").innerHTML = MODULES[cur].theory; }
function paintQuiz(){
  const m = MODULES[cur], st = qs(m), d = qDone(m);
  let h = d===m.quiz.length
    ? '<div class="score"><span class="big" style="color:var(--ok)">'+d+'/'+m.quiz.length+'</span><p>Тест пройден. Переходите к практике.</p></div>'
    : '<div class="score"><span class="big">'+d+'<span style="color:var(--ink3);font-size:16px">/'+m.quiz.length+'</span></span><p>Ошибка не блокирует: объяснение появляется сразу, вопрос остаётся открытым до верного ответа.</p></div>';
  m.quiz.forEach((q,i)=>{
    const a = st[i] || {picks:[], ok:false};
    h += '<div class="qc"><div class="qn"><span>Вопрос '+(i+1)+' из '+m.quiz.length+'</span>'+(a.ok?'<span style="color:var(--ok)">верно</span>':'')+'</div>'+
         '<p class="qt">'+q.q+'</p><div class="opts">';
    q.opts.forEach((o,j)=>{
      let c = "opt";
      if(a.ok && j===q.a) c += " right"; else if(a.picks.includes(j) && j!==q.a) c += " wrong";
      h += '<button class="'+c+'" data-q="'+i+'" data-o="'+j+'"'+(a.ok?" disabled":"")+'><span class="mk">'+String.fromCharCode(65+j)+'</span><span>'+o+'</span></button>';
    });
    h += '</div>';
    if(a.picks.length) h += '<div class="why '+(a.ok?"g":"b")+'"><b>'+(a.ok?"Верно. ":"Не то. ")+'</b>'+q.why+'</div>';
    h += '</div>';
  });
  $("#quiz").innerHTML = h;
  $("#quiz").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i = +b.dataset.q, j = +b.dataset.o;
    const a = st[i] = st[i] || {picks:[], ok:false};
    if(a.ok) return;
    if(!a.picks.includes(j)) a.picks.push(j);
    if(j===m.quiz[i].a) a.ok = true;
    save(); paintQuiz(); paintHead(); paintRail(); paintProg();
  });
}
function paintPicker(){
  const m = MODULES[cur];
  $("#picker").innerHTML = m.labs.map((l,i)=>{
    const done = !!PROG.l[key(m,l)];
    return '<button class="chip'+(done?" done":"")+'" data-i="'+i+'" aria-current="'+(i===curLab)+'">'+
      '<svg class="tk" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6"/><path d="M4 7.2l2.1 2.1L10 5.4"/></svg>'+esc(l.title)+'</button>';
  }).join("");
  $("#picker").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ curLab=+b.dataset.i; paintLab(); });
}
function paintLab(){
  const {m,l,S} = refs();
  paintPicker();
  $("#brief").innerHTML = l.brief +
    '<div class="tools"><button class="mini" id="bh">Подсказка</button>'+
    '<button class="mini" id="br">Начать заново</button></div><div id="hs"></div>';
  $("#bh").onclick = ()=>{ const s = $("#hs"); s.innerHTML = s.innerHTML ? "" : '<div class="hintbox"><b>Подсказка.</b> '+l.hint+'</div>'; };
  $("#br").onclick = ()=>{ resetLab(m,l); paintLab(); };
  $("#dockLab").textContent = "модуль " + m.n + " · " + l.title;
  renderTape(S); refreshChecks(); paintFs();
}
function renderTape(S){
  const t = $("#tape");
  t.innerHTML = S.lines.length ? S.lines.join("")
    : '<span class="dim">Настоящая оболочка с виртуальной файловой системой: кавычки, раскрытия, конвейеры, циклы и скрипты разбираются по-честному.\n\nПопробуйте: <b>ls</b> · <b>cat notes.txt</b> · <b>for f in *.txt; do echo "$f"; done</b>\n\nТерминал доступен на любой вкладке — пробуйте прямо во время чтения.</span>';
  t.scrollTop = t.scrollHeight;
  $("#ps1").textContent = (S.sh.cwd === HOME ? "~" : S.sh.cwd.replace(HOME, "~")) + " $";
}
function paintFs(){
  const {S} = refs();
  const sh = S.sh;
  let h = '<div class="h">файловая система</div>';
  const walk = (dir, depth, prefix)=>{
    if(depth > 3) return;
    children(sh, dir).forEach(n=>{
      const full = normPath(dir + "/" + n, sh.cwd);
      const isD = isDir(sh, full);
      const x = !isD && "1357".includes(sh.fs[full].m[0]);
      h += '<div class="'+(isD?"d":(x?"x":"f"))+'">'+prefix+esc(n)+(isD?"/":(x?"*":""))+'</div>';
      if(isD) walk(full, depth+1, prefix + "  ");
    });
  };
  h += '<div class="d">~/</div>';
  walk(HOME, 0, "  ");
  $("#fsp").innerHTML = h;
}
function refreshChecks(){
  const {m,l,S} = refs();
  let n = 0;
  const items = l.checks.map(c=>{
    let ok = false; try{ ok = !!c.test(S.sh); }catch(e){ ok = false; }
    if(ok) n++;
    return '<li class="'+(ok?"on":"")+'"><span class="bx"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5.2l2.4 2.4L8.6 2.7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>'+c.label+'</span></li>';
  });
  $("#clist").innerHTML = items.join("");
  $("#cct").textContent = n + "/" + l.checks.length;
  const done = n === l.checks.length;
  $("#cdone").hidden = !done;
  if(done && !PROG.l[key(m,l)]){ PROG.l[key(m,l)] = true; save(); paintHead(); paintRail(); paintProg(); paintPicker(); }
}

function run(src){
  const {m,l,S} = refs();
  const sh = S.sh;
  const prompt = (sh.cwd === HOME ? "~" : sh.cwd.replace(HOME, "~")) + " $ ";
  S.lines.push('<span class="cmd"><span class="p">'+esc(prompt)+'</span>'+esc(src)+'</span>\n');
  if(src.trim() === "clear"){ S.lines = []; renderTape(S); return; }
  if(src.trim() === "reset"){ resetLab(m,l); paintLab(); return; }
  let r;
  sh.steps = 0; sh.exited = false;
  try{ r = runProgram(sh, src); }
  catch(e){ r = {out:"", err:"bash: сбой эмулятора: " + e.message + "\n", code:2}; }
  sh.log.push({cmd:src, out:r.out, err:r.err, code:r.code});
  if(r.out) S.lines.push(esc(r.out));
  if(r.err) S.lines.push('<span class="err">'+esc(r.err)+'</span>');
  if(S.lines.length > 400) S.lines = S.lines.slice(-260);
  if(src.trim() && S.hist[S.hist.length-1] !== src) S.hist.push(src);
  S.hi = -1;
  renderTape(S); refreshChecks(); paintFs();
}

function paintAll(){ paintRail(); paintHead(); paintTheory(); paintQuiz(); paintLab(); paintProg(); }

$("#t-th").onclick = ()=>{ tab="th"; paintHead(); };

$("#cheat").onclick = ()=>{
  let ov = document.getElementById("ov");
  if(ov){ ov.remove(); return; }
  ov = document.createElement("div"); ov.id = "ov";
  ov.setAttribute("style","position:fixed;inset:0;z-index:200;background:rgba(15,10,17,.6);display:flex;align-items:center;justify-content:center;padding:22px");
  ov.innerHTML = '<div style="background:var(--surf);border:1px solid var(--line);border-radius:4px;max-width:760px;width:100%;max-height:80vh;overflow:auto">'+
   '<div style="display:flex;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surf)">'+
   '<b style="font-family:var(--fd);font-size:15px">Шпаргалка</b><button class="gb" id="ovc" style="margin-left:auto">Закрыть</button></div>'+
   '<div style="padding:16px 18px">'+CHEAT.map(([a,b])=>'<div style="margin-bottom:13px"><div style="font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:600;margin-bottom:3px">'+esc(a)+'</div><div style="font-family:var(--fm);font-size:11.5px;line-height:1.8;color:var(--ink2)">'+esc(b)+'</div></div>').join("")+'</div></div>';
  document.body.appendChild(ov);
  ov.onclick = e=>{ if(e.target===ov || e.target.id==="ovc") ov.remove(); };
};
$("#form").onsubmit = e=>{ e.preventDefault(); };
const inp = $("#inp");
function autosize(){ inp.style.height = "20px"; inp.style.height = Math.min(110, inp.scrollHeight) + "px"; }
inp.addEventListener("input", autosize);
inp.addEventListener("keydown", e=>{
  const {S} = refs();
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    const v = inp.value;
    if(!v.trim()) return;
    inp.value = ""; autosize();
    run(v);
    return;
  }
  if(e.key === "ArrowUp" && !inp.value.includes("\n")){
    e.preventDefault(); if(!S.hist.length) return;
    S.hi = S.hi < 0 ? S.hist.length-1 : Math.max(0, S.hi-1);
    inp.value = S.hist[S.hi]; autosize(); return;
  }
  if(e.key === "ArrowDown" && !inp.value.includes("\n")){
    e.preventDefault(); if(S.hi < 0) return;
    S.hi++;
    if(S.hi >= S.hist.length){ S.hi = -1; inp.value = ""; } else inp.value = S.hist[S.hi];
    autosize();
  }
});
$("#tape").addEventListener("click", ()=>inp.focus());
document.addEventListener("keydown", e=>{ if(e.key === "Escape"){ const ov = document.getElementById("ov"); if(ov) ov.remove(); } });

paintAll();
</script>
