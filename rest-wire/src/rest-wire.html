{
n:10, id:"cache", title:"Кэширование", sub:"ETag и условные запросы",
lede:"Как не пересылать то, что не изменилось, и как не затереть чужие правки. Оба механизма стоят на одном заголовке.",
theory:`
<p><code>ETag</code> — метка версии представления. Сервер выдаёт её вместе с ресурсом, клиент возвращает обратно, и на этом строятся сразу две разные вещи: экономия трафика и защита от гонок.</p>

<h2>Механизм первый: не присылай, если не менялось</h2>
<pre><code><span class="c">1. обычное чтение</span>
GET /users/1
→ 200 OK, <span class="h">ETag</span>: <span class="s">"u1-v1"</span>, тело 240 байт

<span class="c">2. повторное чтение с условием</span>
GET /users/1
<span class="h">If-None-Match</span>: <span class="s">"u1-v1"</span>
→ <span class="m">304</span> Not Modified, тела нет</code></pre>
<p>Клиент оставляет в кэше то, что уже скачал, сервер экономит трафик. Ответ <span class="st c3">304</span> не несёт тела — в этом и смысл.</p>

<h2>Механизм второй: не перезаписывай, если изменилось</h2>
<pre><code><span class="c">1. читаем и запоминаем версию</span>
GET /users/1 → 200, <span class="h">ETag</span>: <span class="s">"u1-v1"</span>

<span class="c">2. кто-то другой успел изменить ресурс: теперь "u1-v2"</span>

<span class="c">3. пробуем записать поверх прочитанного</span>
PATCH /users/1
<span class="h">If-Match</span>: <span class="s">"u1-v1"</span>
→ <span class="m">412</span> Precondition Failed</code></pre>
<div class="note ok"><b class="hd">Это называется оптимистичной блокировкой</b><p>Ресурс не запирается. Вместо этого запись выполняется только при условии «версия всё ещё та, которую я читал». Если условие нарушено, клиент получает <span class="st c4">412</span>, перечитывает ресурс и решает, что делать: слить изменения или спросить пользователя. Без этого механизма два одновременных редактирования молча затирают друг друга — выигрывает тот, кто записал последним.</p></div>

<h2>Управление кэшем</h2>
<div class="tw"><table>
<tr><th>Директива <code>Cache-Control</code></th><th>Смысл</th></tr>
<tr><td><code>no-store</code></td><td>Не сохранять вообще. Для персональных и платёжных данных</td></tr>
<tr><td><code>no-cache</code></td><td>Сохранять можно, но перед выдачей обязательно переспросить. <b>Не</b> «не кэшировать»</td></tr>
<tr><td><code>private</code></td><td>Только браузер пользователя. Промежуточные кэши — мимо</td></tr>
<tr><td><code>public</code></td><td>Можно кэшировать и общим прокси</td></tr>
<tr><td><code>max-age=60</code></td><td>Свежо 60 секунд, всё это время можно отдавать без запроса</td></tr>
<tr><td><code>must-revalidate</code></td><td>После истечения срока — обязательно проверить, а не отдавать протухшее</td></tr>
</table></div>
<div class="note trap"><b class="hd">no-cache не означает «не кэшировать»</b><p>Он означает «кэшируй, но каждый раз спрашивай, не устарело ли». Запрет на хранение — это <code>no-store</code>. Ошибка стоит дорого в обе стороны: либо персональные данные оседают в общем кэше, либо трафик не экономится там, где мог бы.</p></div>

<h2>Сильные и слабые метки</h2>
<p><code>ETag: "abc"</code> — сильная: представления совпадают байт в байт. <code>ETag: W/"abc"</code> — слабая: содержимое эквивалентно по смыслу, но байты могут отличаться (например, изменился порядок полей). Слабую нельзя использовать в <code>If-Match</code> для условной записи — только для проверки свежести.</p>

<h2>Как это выглядит в тестах</h2>
<ul>
<li>Прочитать ресурс, взять <code>ETag</code>, повторить с <code>If-None-Match</code> — ожидать <span class="st c3">304</span> и отсутствие тела.</li>
<li>Изменить ресурс, снова прочитать — ожидать <b>другой</b> <code>ETag</code>.</li>
<li>Записать со <b>старым</b> <code>If-Match</code> — ожидать <span class="st c4">412</span>.</li>
<li>Проверить, что персональные ответы приходят с <code>Cache-Control: private</code> или <code>no-store</code>.</li>
</ul>
`,
quiz:[
 {q:"Клиент прислал <code>If-None-Match</code> с актуальной меткой. Что вернёт сервер?",
  opts:["200 с телом","304 без тела","412","204"],
  a:1, why:"304 Not Modified — представление не изменилось, тело пересылать незачем. Именно ради экономии всё и затевалось."},
 {q:"Для чего служит <code>If-Match</code>?",

  a:1, why:"Это оптимистичная блокировка. При несовпадении версии сервер отвечает 412 и запись не выполняется."},

 {q:"Два клиента одновременно правят один ресурс, условных заголовков нет. Что произойдёт?",

 {q:"Какой ответ на персональные данные пользователя правильнее?",

  a:1, why:"Директива <code>public</code> разрешает общим прокси хранить чужие персональные данные и отдавать их другим."}
],

n:11, id:"idem", title:"Повторы и лимиты", sub:"Idempotency-Key, 429",
lede:"Сеть теряет ответы. Как сделать так, чтобы повторный запрос не создал второй заказ, и что делать при 429.",
theory:`
<p>Классическая ситуация: клиент отправил <code>POST /orders</code>, соединение оборвалось. Заказ создан или нет — неизвестно. Повторить? Можно получить два заказа. Не повторять? Можно остаться без заказа вовсе.</p>

<h2>Ключ идемпотентности</h2>
<p>Решение: клиент сам генерирует уникальный ключ и присылает его с запросом. Сервер запоминает пару «ключ — результат». Повторный запрос с тем же ключом получает <b>сохранённый ответ</b>, а не создаёт новый ресурс.</p>
<pre><code>POST /orders
<span class="h">Idempotency-Key</span>: 9f2c8a1e-4b7d-4c11-9f0e-2a6b3c5d7e81
<span class="h">Content-Type</span>: application/json

{ <span class="h">"item"</span>: <span class="s">"desk"</span>, <span class="h">"amount"</span>: <span class="m">2</span> }

→ 201 Created, Location: /orders/1

<span class="c">повтор того же запроса с тем же ключом:</span>
→ 201 Created, Location: /orders/1, <span class="h">Idempotency-Replayed</span>: true
<span class="c">второй заказ НЕ создан</span></code></pre>
<div class="note"><b class="hd">Ключ генерирует клиент, и это принципиально</b><p>Ключ должен пережить перезапуск клиента и оставаться тем же при повторе. Обычно это UUID, созданный <em>до</em> первой попытки и сохранённый вместе с намерением. Если генерировать ключ на каждую попытку заново, весь механизм бессмыслен.</p></div>
<ul>
<li>Ключ хранится ограниченное время — обычно от суток.</li>
<li>Тот же ключ с <b>другим</b> телом — обычно <span class="st c4">409</span>: это ошибка клиента, а не повтор.</li>
<li>Для <code>GET</code>, <code>PUT</code> и <code>DELETE</code> ключ не нужен — они идемпотентны сами по себе.</li>
</ul>

<h2>Ограничение частоты</h2>
<p>Сервер вправе отказать, если запросов слишком много. Ответ — <span class="st c4">429</span>, и он должен объяснять, когда возвращаться.</p>
<pre><code>HTTP/1.1 <span class="m">429</span> Too Many Requests
<span class="h">Retry-After</span>: 37
<span class="h">X-RateLimit-Limit</span>: 100
<span class="h">X-RateLimit-Remaining</span>: 0
<span class="h">X-RateLimit-Reset</span>: 1786412400</code></pre>
<div class="tw"><table>
<tr><th>Заголовок</th><th>Что сообщает</th></tr>
<tr><td><code>Retry-After</code></td><td>Через сколько секунд можно повторить. Иногда — дата</td></tr>
<tr><td><code>X-RateLimit-Limit</code></td><td>Квота на окно</td></tr>
<tr><td><code>X-RateLimit-Remaining</code></td><td>Сколько осталось</td></tr>
<tr><td><code>X-RateLimit-Reset</code></td><td>Когда квота обновится</td></tr>
</table></div>

<h2>Как правильно повторять</h2>
<ul>
<li><b>Уважайте <code>Retry-After</code>.</b> Он не совет, а условие возвращения.</li>
<li><b>Экспоненциальная задержка:</b> 1 с, 2 с, 4 с, 8 с — и предел числа попыток.</li>
<li><b>Случайный разброс.</b> Иначе тысяча клиентов, получивших 429 одновременно, вернётся тоже одновременно и добьёт сервер.</li>
<li><b>Повторяйте только осмысленное:</b> 429, 503, сетевые сбои и таймауты. Класс 4xx (кроме 429) повторять бесполезно — запрос не станет правильнее.</li>
</ul>
<div class="note trap"><b class="hd">Ошибка, которая рушит сервисы</b><p>Повтор без задержки в цикле. Сервер, попросивший подождать, получает вместо паузы удвоенную нагрузку. Так локальная перегрузка превращается в отказ всей системы: клиенты не дают ей восстановиться.</p></div>

<h2>Что проверять в тестах</h2>
<ul>
<li>Повтор с тем же ключом не создаёт второй ресурс и возвращает тот же идентификатор.</li>
<li>Тот же ключ с другим телом отвергается.</li>
<li>Ответ <span class="st c4">429</span> содержит <code>Retry-After</code>.</li>
<li>После указанного времени запрос снова проходит.</li>
</ul>
`,

  a:1, why:"Ключ должен быть одинаковым у первой попытки и у повтора. Если генерировать заново на каждую попытку, механизм не работает."},

  a:1, why:"Синхронный возврат тысячи клиентов создаёт ту же пиковую нагрузку, из-за которой сработало ограничение."},

  opts:["Да, обязательно","Нет: PUT идемпотентен сам по себе","Только при обновлении части полей","Только для новых ресурсов"],
  a:1, why:"Повторный PUT приводит систему в то же состояние. Ключ нужен там, где повтор создаёт новую сущность, — то есть для POST."}
],

 {id:"11b", title:"Упереться в лимит",

{
n:12, id:"prod", title:"Версии и тестирование", sub:"Совместимость и проверки",
lede:"Как менять API, не ломая клиентов, и что именно проверять тестами — с оглядкой на то, что API живёт годами.",
theory:`
<h2>Способы версионирования</h2>
<div class="tw"><table>
<tr><th>Способ</th><th>Вид</th><th>Плюсы и минусы</th></tr>
<tr><td>В пути</td><td><code>/v3/users</code></td><td>Виден сразу, легко маршрутизировать. Формально нарушает идею постоянного идентификатора ресурса. Самый распространённый</td></tr>
<tr><td>В заголовке</td><td><code>Accept: application/vnd.api.v3+json</code></td><td>Чище с точки зрения REST, но неудобно отлаживать и легко забыть</td></tr>
<tr><td>В параметре</td><td><code>?version=3</code></td><td>Просто, но версия смешивается с фильтрами и теряется при копировании ссылок</td></tr>
<tr><td>По дате</td><td><code>API-Version: 2026-08-19</code></td><td>Клиент фиксирует дату и получает поведение того дня. Требует дисциплины на сервере</td></tr>
</table></div>
<div class="note"><b class="hd">Лучшая версия — та, которую не пришлось выпускать</b><p>Новая мажорная версия означает поддержку двух реализаций годами. Прежде чем её выпускать, проверьте, нельзя ли обойтись совместимым изменением.</p></div>

<h2>Что ломает клиентов, а что нет</h2>
<div class="tw"><table>
<tr><th>Совместимо</th><th>Ломает</th></tr>
<tr><td>Добавить <b>необязательное</b> поле в ответ</td><td>Удалить или переименовать поле</td></tr>
<tr><td>Добавить новый ресурс или метод</td><td>Изменить тип поля: строка → число</td></tr>
<tr><td>Добавить необязательный параметр</td><td>Сделать необязательный параметр обязательным</td></tr>
<tr><td>Добавить значение в перечисление <em>ответа</em></td><td>Ужесточить проверку: то, что раньше принималось, теперь 422</td></tr>
<tr><td>Ослабить проверку</td><td>Изменить код ответа для той же ситуации</td></tr>
</table></div>
<div class="note warn"><b class="hd">Добавление значения в перечисление — коварный случай</b><p>Формально это расширение. Но клиент, у которого <code>switch</code> по статусам без ветки «иначе», сломается на новом значении. Поэтому либо в контракте сразу заявляют «список может пополняться», либо считают такое изменение ломающим.</p></div>

<h2>Что проверять тестами</h2>
<p>Тесты API отличаются от тестов интерфейса тем, что проверяют <b>контракт</b>, а не картинку. Полезно разделять уровни:</p>
<div class="tw"><table>
<tr><th>Уровень</th><th>Что проверяет</th><th>Пример</th></tr>
<tr><td>Схема</td><td>Форма ответа: поля, типы, обязательность</td><td>У пользователя есть <code>id</code> типа number</td></tr>
<tr><td>Семантика</td><td>Правильность кодов и заголовков</td><td>Создание даёт 201 и <code>Location</code></td></tr>

<ul>
<li><b>Проверяйте код и заголовки, а не только тело.</b> Тест, смотрящий лишь в тело, пропустит смену 201 на 200 и потерю <code>Location</code>.</li>
<li><b>Не проверяйте лишнее.</b> Жёсткое сравнение всего ответа целиком ломается от каждого нового необязательного поля — то есть от совместимого изменения.</li>
<li><b>Проверяйте последствия.</b> Создали — прочитайте. Удалили — убедитесь, что стало 404. Ответ 201 сам по себе не доказывает, что ресурс существует.</li>

<div class="note ok"><b class="hd">Связь с UI-автоматизацией</b><p>Тот же приём применяется и в браузерных тестах: перехватить сетевой запрос и проверить <b>тело отправки</b>, а не только то, что нарисовалось на экране. Проверка «в CRM ушёл правильный продукт» надёжнее проверки «на экране появилась галочка» — она доказывает результат, а не отображение.</p></div>

const LS = "restwire.v1";
const $ = s => document.querySelector(s);

function hash32(str){ let h=2166136261>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
(function shuffle(){
  MODULES.forEach(m=>m.quiz.forEach(q=>{
    let seed = hash32(q.q);
    const rnd = ()=>{ seed=(Math.imul(seed,1664525)+1013904223)>>>0; return seed/4294967296; };
    const idx = q.opts.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
    q.opts = idx.map(i=>q.opts[i]); q.a = idx.indexOf(q.a);
  }));
})();

let P = {q:{}, l:{}};
try{ const raw = localStorage.getItem(LS); if(raw) P = Object.assign({q:{},l:{}}, JSON.parse(raw)); }catch(e){}
const save = ()=>{ try{ localStorage.setItem(LS, JSON.stringify(P)); }catch(e){} };

let cur = 0, tab = "th", curLab = 0;
const labs = {};
const key = (m,l) => m.id+"/"+l.id;
function labState(m,l){
  const k = key(m,l);
  if(!labs[k]){ const s = newServer(); try{ l.setup && l.setup(s); }catch(e){} labs[k] = {s, lines:[], hist:[], hi:-1}; }
  return labs[k];
}
function resetLab(m,l){ const s=newServer(); try{ l.setup&&l.setup(s); }catch(e){} labs[key(m,l)] = {s, lines:[], hist:[], hi:-1}; }

const qs = m => (P.q[m.id] = P.q[m.id] || {});
const qDone = m => m.quiz.filter((_,i)=> qs(m)[i] && qs(m)[i].ok).length;
const lDone = m => m.labs.filter(l=>P.l[key(m,l)]).length;
function totals(){ let d=0,a=0; MODULES.forEach(m=>{ a+=m.quiz.length+m.labs.length; d+=qDone(m)+lDone(m); }); return {d,a}; }
function paintProg(){
  const t=totals(), pct = t.a?Math.round(t.d/t.a*100):0;
  $("#pl").textContent = t.d+" / "+t.a;
  $("#pf").style.width = pct+"%";
  $("#pb").setAttribute("aria-valuenow", String(pct));
}

  }).join("");

function paintHead(){

}
function paintTheory(){ $("#theory").innerHTML = MODULES[cur].theory; }

function paintQuiz(){
  const m = MODULES[cur], st = qs(m), d = qDone(m);
  let h = d===m.quiz.length
    ? '<div class="score"><span class="big" style="color:var(--s2)">'+d+'/'+m.quiz.length+'</span><p>Тест пройден полностью. Переходите к практике.</p></div>'
    : '<div class="score"><span class="big">'+d+'<span style="color:var(--ink3);font-size:16px">/'+m.quiz.length+'</span></span><p>Ошибка не блокирует: объяснение появляется сразу, вопрос остаётся открытым до верного ответа.</p></div>';
  m.quiz.forEach((q,i)=>{
    const a = st[i] || {picks:[], ok:false};
    h += '<div class="qc"><div class="qn"><span>Вопрос '+(i+1)+' из '+m.quiz.length+'</span>'+(a.ok?'<span style="color:var(--s2)">верно</span>':'')+'</div>'+
         '<p class="qt">'+q.q+'</p><div class="opts">';
    q.opts.forEach((o,j)=>{
      let c="opt";
      if(a.ok && j===q.a) c+=" right"; else if(a.picks.includes(j)&&j!==q.a) c+=" wrong";
      h += '<button class="'+c+'" data-q="'+i+'" data-o="'+j+'"'+(a.ok?" disabled":"")+'><span class="mk">'+String.fromCharCode(65+j)+'</span><span>'+o+'</span></button>';
    });
    h += '</div>';
    if(a.picks.length) h += '<div class="why '+(a.ok?"g":"b")+'"><b>'+(a.ok?"Верно. ":"Не то. ")+'</b>'+q.why+'</div>';
    h += '</div>';
  });
  $("#quiz").innerHTML = h;
  $("#quiz").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.q, j=+b.dataset.o;
    const a = st[i] = st[i] || {picks:[], ok:false};
    if(a.ok) return;
    if(!a.picks.includes(j)) a.picks.push(j);
    if(j===m.quiz[i].a) a.ok = true;
    save(); paintQuiz(); paintHead(); paintRail(); paintProg();
  });
}

function paintPicker(){
  const m = MODULES[cur];
  $("#picker").innerHTML = m.labs.map((l,i)=>{
    const done = !!P.l[key(m,l)];
    return '<button class="chip'+(done?" done":"")+'" data-i="'+i+'" aria-current="'+(i===curLab)+'">'+

  }).join("");

function refs(){ const m=MODULES[cur]; const l=m.labs[curLab]; return {m,l,S:labState(m,l)}; }

function paintLab(){
  const {m,l,S} = refs();
  paintPicker();
  $("#brief").innerHTML = l.brief +
    '<div class="tools"><button class="mini" id="bh">Подсказка</button>'+

  $("#bh").onclick = ()=>{ const s=$("#hs"); s.innerHTML = s.innerHTML ? "" : '<div class="hintbox"><b>Подсказка.</b> '+l.hint+'</div>'; };
  $("#br").onclick = ()=>{ resetLab(m,l); paintLab(); };
  $("#bhelp").onclick = ()=>run("help");

function renderTape(S){
  const t = $("#tape");
  t.innerHTML = S.lines.length ? S.lines.join("")
    : '<div class="empty">Эмулятор REST-сервера <b>api.example.com</b>. Запросы выполняются по-настоящему: состояние меняется, панель справа обновляется.\n\nПримеры:\n  GET /users\n  GET /users/1\n  POST /auth/token -H \'Content-Type: application/json\' -d \'{"username":"demo","password":"secret"}\'\n\nНаберите help для списка возможностей.</div>';
  t.scrollTop = t.scrollHeight;
}
function paintSrv(){ $("#srv").innerHTML = renderState(refs().S.s); }

const HELP = [
 ["Формат","МЕТОД /путь [-H 'Имя: значение'] [-d 'тело']. Метод можно опустить — тогда GET. Поддерживается и запись в стиле curl."],
 ["Ресурсы","/ · /users · /users/{id} · /users/{id}/posts · /posts · /posts/{id} · /orders · /orders/{id} · /auth/token"],
 ["Параметры","?limit= ?page= ?sort=поле или -поле ?role= ?q= ?userId= ?published="],
 ["Заголовки","Content-Type · Accept · Authorization · If-None-Match · If-Match · Idempotency-Key"],
 ["Учётные данные","demo / secret. Область доступа задаётся полем scope в теле запроса токена."],
 ["Команды","help — эта справка · clear — очистить ленту · reset — начать задание заново"]
];
function run(line){
  const {m,l,S} = refs();
  const cmd = line.trim();
  if(cmd==="clear"){ S.lines=[]; renderTape(S); return; }
  if(cmd==="reset"){ resetLab(m,l); paintLab(); return; }
  if(cmd==="help"){
    S.lines.push('<div class="ex"><div class="lbl">справка</div><pre>'+
      HELP.map(([a,b])=>'<span class="h">'+esc(a)+'</span>\n  '+esc(b)).join("\n\n")+'</pre></div>');
    renderTape(S); return;
  }
  const req = parseRequest(cmd);
  if(req.error){
    S.lines.push('<div class="ex c4"><div class="lbl">клиент</div><pre><span class="c">'+esc(cmd)+'</span>\n\nне удалось разобрать: '+esc(req.error)+'</pre></div>');
    renderTape(S); return;
  }
  let r;
  try{ r = handle(S.s, req); }
  catch(e){ r = {status:500, headers:{"Content-Type":"application/json"}, body:{error:"emulator_failure", detail:e.message}}; }
  S.lines.push(renderExchange(req, r));
  if(S.lines.length>60) S.lines = S.lines.slice(-40);
  if(cmd && S.hist[S.hist.length-1]!==cmd) S.hist.push(cmd);
  S.hi = -1;
  renderTape(S); refreshChecks(); paintSrv();
}

function refreshChecks(){
  const {m,l,S} = refs();
  let n = 0;
  const items = l.checks.map(c=>{
    let ok=false; try{ ok = !!c.test(S.s); }catch(e){ ok=false; }
    if(ok) n++;
    return '<li class="'+(ok?"on":"")+'"><span class="bx"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5.2l2.4 2.4L8.6 2.7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>'+c.label+'</span></li>';
  });
  $("#clist").innerHTML = items.join("");
  $("#cct").textContent = n+"/"+l.checks.length;
  const done = n===l.checks.length;
  $("#cdone").hidden = !done;
  if(done && !P.l[key(m,l)]){ P.l[key(m,l)] = true; save(); paintHead(); paintRail(); paintProg(); paintPicker(); }
}

    e.preventDefault();

    if(!c.length) return;
    if(c.length===1){ e.target.value = c[0]; return; }
    let pre = c[0];
    c.forEach(x=>{ let i=0; while(i<pre.length&&i<x.length&&pre[i].toLowerCase()===x[i].toLowerCase()) i++; pre = pre.slice(0,i); });
    if(pre.length>v.length){ e.target.value = pre; return; }
    S.lines.push('<div class="ex"><div class="lbl">варианты</div><pre>'+c.slice(0,8).map(x=>esc(x)).join("\n")+'</pre></div>');
    renderTape(S); return;
  }
  if(e.key==="ArrowUp"){ e.preventDefault(); if(!S.hist.length) return;
    S.hi = S.hi<0 ? S.hist.length-1 : Math.max(0,S.hi-1); e.target.value = S.hist[S.hi]; return; }
  if(e.key==="ArrowDown"){ e.preventDefault(); if(S.hi<0) return;
    S.hi++; if(S.hi>=S.hist.length){ S.hi=-1; e.target.value=""; } else e.target.value = S.hist[S.hi]; }
});
$("#tape").addEventListener("click", ()=>$("#inp").focus());

paintAll();
</script>
