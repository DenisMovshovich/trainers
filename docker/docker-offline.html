  if(doc.volumes) Object.keys(doc.volumes).forEach(v=>{ const vn=project+"_"+v; if(!st.volumes.find(x=>x.name===vn)){ ensureVolume(st,vn); out.line("Volume \""+vn+"\"  Created"); } });

  const names=Object.keys(services);
  const done=new Set(); const order=[];
  const visit=(n,seen)=>{
    if(done.has(n)||seen.has(n)) return; seen.add(n);
    const dep=services[n]&&services[n].depends_on;
    const deps = Array.isArray(dep)?dep:(dep?Object.keys(dep):[]);
    deps.forEach(d=>{ if(services[d]) visit(d,seen); });
    done.add(n); order.push(n);
  };
  names.forEach(n=>visit(n,new Set()));

  const detach = p.has("--detach");
  order.forEach(svc=>{
    const s=services[svc]||{};
    const cname=project+"-"+svc+"-1";
    const exist=st.containers.find(c=>c.name===cname);
    if(exist && exist.status==="running"){ out.line("Container "+cname+"  Running"); return; }
    if(exist) removeContainer(st,exist);
    let ref=s.image;
    if(s.build){
      const bctx = typeof s.build==="string"? s.build : (s.build.context||".");
      const bdf  = typeof s.build==="object" && s.build.dockerfile ? s.build.dockerfile : null;
      const tag = s.image || (project+"-"+svc);
      out.line("Building "+svc);
      const bargs=[bctx,"--tag",tag]; if(bdf) bargs.push("--file", normPath(bctx+"/"+bdf,st.cwd));
      if(typeof s.build==="object" && s.build.target) bargs.push("--target", s.build.target);
      const bo=mkOut(); const img=dockerBuild(st,bargs,bo);
      bo.L.forEach(l=>out.raw("  "+l.t, l.cls==="err"?"err":"dim"));
      if(!img) { out.err("failed to build "+svc); return; }
      ref=tag;
    }
    if(!ref){ out.err("service \""+svc+"\" has neither an image nor a build context specified"); return; }
    const args=[];
    args.push("--name", cname, "--network", netName, "--network-alias", svc, "--detach");
    (toArr(s.ports)).forEach(x=>args.push("--publish", String(x)));
    (toArr(s.volumes)).forEach(x=>{
      let v=String(x); const parts=v.split(":");
      if(parts[0] && !parts[0].startsWith("/") && !parts[0].startsWith(".") && doc.volumes && Object.prototype.hasOwnProperty.call(doc.volumes,parts[0])) parts[0]=project+"_"+parts[0];
      args.push("--volume", parts.join(":"));
    });
    if(Array.isArray(s.environment)) s.environment.forEach(e=>args.push("--env", String(e)));
    else if(s.environment && typeof s.environment==="object") Object.entries(s.environment).forEach(([k,v])=>args.push("--env", k+"="+v));
    if(s.user) args.push("--user", String(s.user));
    if(s.restart) args.push("--restart", String(s.restart));
    if(s.working_dir) args.push("--workdir", String(s.working_dir));
    if(s.read_only) args.push("--read-only");
    if(s.mem_limit) args.push("--memory", String(s.mem_limit));
    if(s.healthcheck && s.healthcheck.test){
      const t=Array.isArray(s.healthcheck.test)?s.healthcheck.test.filter(x=>x!=="CMD"&&x!=="CMD-SHELL").join(" "):String(s.healthcheck.test);
      args.push("--health-cmd", t);
    }
    args.push(ref);
    if(s.command) tokenize(String(s.command)).forEach(x=>args.push(x));
    const o2=mkOut();
    const c=createContainer(st,args,o2,true);
    if(!c){ o2.L.forEach(l=>out.raw(l.t,l.cls)); return; }
    c.composeService=svc; c.composeProject=project;
    c.labels["com.docker.compose.project"]=project;
    c.labels["com.docker.compose.service"]=svc;
    st.composeUpCount=(st.composeUpCount||0)+1;
    out.line("Container "+cname+"  Started");
  });
  if(!detach) out.dim("(запущено; используйте docker compose up -d, чтобы не занимать терминал)");
}
function toArr(x){ if(x==null) return []; return Array.isArray(x)?x:[x]; }
function composeDown(st, argv, out){
  const p=parseArgs(argv, new Set(["--file","--project-name","--timeout"]), false);
  const project=(p.one("--project-name")||st.cwd.split("/").pop()||"work").toLowerCase();
  const cs=st.containers.filter(c=>c.composeProject===project);
  if(!cs.length){ out.dim("Нет запущенных сервисов проекта "+project); }
  cs.forEach(c=>{ out.line("Container "+c.name+"  Removed"); removeContainer(st,c); });
  const net=st.networks.find(n=>n.name===project+"_default");
  if(net){ st.networks=st.networks.filter(n=>n!==net); out.line("Network "+net.name+"  Removed"); }
  if(p.has("--volumes")||p.has("-v")){
    st.volumes.filter(v=>v.name.startsWith(project+"_")).forEach(v=>{ out.line("Volume "+v.name+"  Removed"); delete st.volStore[v.name]; });
    st.volumes=st.volumes.filter(v=>!v.name.startsWith(project+"_"));
  }
}
/* ---------------- вспомогательные представления ---------------- */
function statusText(c){
  if(c.status==="running"){
    let s=fmtUp(c.started);
    if(c.health) s+=" ("+c.health.status+")";
    return s;
  }
  if(c.status==="created") return "Created";
  if(c.status==="paused") return "Up (paused)";
  return "Exited ("+(c.exitCode==null?0:c.exitCode)+") "+fmtAgo(c.stopped||c.started||c.created);
}
function portsText(c){
  if(c.netMode==="host") return "";
  return c.ports.map(p=>p.host?("0.0.0.0:"+p.host+"->"+p.cont+"/"+p.proto):(p.cont+"/"+p.proto)).join(", ");
}
function cmdText(c){
  const s=c.cmd.join(" ");
  return "\""+(s.length>20?s.slice(0,19)+"…":s)+"\"";
}
function inspectJson(st,obj,kind){
  if(kind==="container"){
    return {
      Id:obj.id, Created:new Date(obj.created).toISOString(), Name:"/"+obj.name,
      State:{Status:obj.status, Running:obj.status==="running", ExitCode:obj.exitCode||0,
             Health:obj.health?{Status:obj.health.status}:undefined},
      Config:{Hostname:obj.hostname, User:obj.user, Image:obj.image, WorkingDir:obj.workdir,
              Env:Object.entries(obj.env).map(([k,v])=>k+"="+v), Cmd:obj.rawCmd, Entrypoint:obj.entrypoint,
              Labels:obj.labels},
      HostConfig:{NetworkMode:obj.netMode, RestartPolicy:{Name:obj.restart}, Memory:obj.memory||0,
                  NanoCpus:obj.cpus?Math.round(parseFloat(obj.cpus)*1e9):0, ReadonlyRootfs:!!obj.readOnly,
                  CapDrop:obj.capDrop, CapAdd:obj.capAdd,
                  PortBindings:Object.fromEntries(obj.ports.map(p=>[p.cont+"/"+p.proto,[{HostIp:"0.0.0.0",HostPort:String(p.host)}]]))},
      Mounts:obj.mounts.map(m=>({Type:m.type, Name:m.type==="volume"?m.source:undefined, Source:m.type==="bind"?m.source:undefined, Destination:m.target, RW:!m.ro})),
      NetworkSettings:{Networks:Object.fromEntries(Object.entries(obj.networks).map(([n,v])=>[n,{IPAddress:v.ip, Aliases:v.aliases}]))}
    };
  }
  if(kind==="image"){
    return {Id:"sha256:"+obj.id, RepoTags:[obj.repo+":"+obj.tag], Created:new Date(obj.created).toISOString(),
      Size:imgSize(obj), Config:obj.config,
      RootFS:{Type:"layers", Layers:obj.layers.map(l=>"sha256:"+l.id)}};
  }
  if(kind==="network"){
    const members=st.containers.filter(c=>c.networks[obj.name]);
    return {Name:obj.name, Id:obj.id, Driver:obj.driver, Internal:!!obj.internal,
      IPAM:{Config:[{Subnet:obj.subnet}]},
      Containers:Object.fromEntries(members.map(c=>[c.id,{Name:c.name, IPv4Address:c.networks[obj.name].ip+"/16"}]))};
  }
  return {Name:obj.name, Driver:obj.driver, Mountpoint:obj.mountpoint, CreatedAt:new Date(obj.created).toISOString()};
}
function findAny(st,ref){
  const c=findContainer(st,ref); if(c) return {obj:c, kind:"container"};
  const i=findImage(st,ref); if(i) return {obj:i, kind:"image"};
  const n=netByName(st,ref); if(n) return {obj:n, kind:"network"};
  const v=st.volumes.find(v=>v.name===ref); if(v) return {obj:v, kind:"volume"};
  return null;
}

/* ---------------- шелл хоста ---------------- */
function hostShell(st, line, out){
  const sr=splitRedir(tokenize(line));
  const t=sr.t, redir=sr.redir;
  if(!t.length) return true;
  const cmd=t[0], a=t.slice(1);
  const emit=txt=>{
    if(redir){ const p=normPath(redir.path,st.cwd); st.files[p]=(redir.append?(st.files[p]||""):"")+txt+"\n"; return; }
    String(txt).split("\n").forEach(l=>out.line(l));
  };
  switch(cmd){
    case "pwd": emit(st.cwd); return true;
    case "echo": emit(unesc(a.join(" "))); return true;
    case "cd": { st.cwd=normPath(a[0]||"/work","/work"); return true; }
    case "ls": {
      const dir=normPath(a.filter(x=>!x.startsWith("-"))[0]||st.cwd, st.cwd);
      const pre=dir==="/"?"/":dir+"/"; const names=new Set();
      Object.keys(st.files).forEach(k=>{ if(!k.startsWith(pre))return; const r=k.slice(pre.length); if(!r)return; names.add(r.split("/")[0]+(r.includes("/")?"/":"")); });
      if(!names.size){ if(st.files[dir]!==undefined) emit(dir.split("/").pop()); else out.err("ls: "+dir+": No such file or directory"); return true; }
      emit([...names].sort().join("  ")); return true;
    }
    case "cat": {
      a.filter(x=>!x.startsWith("-")).forEach(f=>{
        const v=st.files[normPath(f,st.cwd)];
        if(v===undefined) out.err("cat: "+f+": No such file or directory"); else emit(String(v));
      }); return true;
    }
    case "rm": { a.filter(x=>!x.startsWith("-")).forEach(f=>{ const p=normPath(f,st.cwd); delete st.files[p]; Object.keys(st.files).forEach(k=>{ if(k.startsWith(p+"/")) delete st.files[k]; }); }); return true; }
    case "mkdir": { a.filter(x=>!x.startsWith("-")).forEach(d=>{ st.files[normPath(d,st.cwd)+"/.keep"]=""; }); return true; }
    case "touch": { a.forEach(f=>{ const p=normPath(f,st.cwd); if(st.files[p]===undefined) st.files[p]=""; }); return true; }
    case "curl": case "wget": {
      const url=a.filter(x=>!x.startsWith("-")).pop();
      if(!url){ out.err(cmd+": no URL specified"); return true; }
      const r=httpFetch(st,url,null);
      if(r.err){ out.err(r.err.replace(/^curl:/,cmd+":")); return true; }
      if(a.includes("-I")||a.includes("--head")){ out.line("HTTP/1.1 "+r.status+" "+(r.status===200?"OK":"Not Found")); out.line("Server: nginx"); return true; }
      emit(r.body); return true;
    }
    case "uname": emit("Darwin docker 6.6.16 x86_64"); return true;
    case "whoami": emit("you"); return true;
    case "history": { st.history.slice(-25).forEach((h,i)=>out.line(String(i+1).padStart(4)+"  "+h)); return true; }
    default: return false;
  }
}

/* ---------------- главный диспетчер ---------------- */
function engineExec(st, line){
  const out=mkOut();
  line=String(line).trim();
  if(!line) return out;
  st.history.push(line);

  if(st.shellIn){
    const c=st.containers.find(x=>x.id===st.shellIn);
    if(!c){ st.shellIn=null; out.err("container gone"); return out; }
    if(/^exit\b/.test(line)){ st.shellIn=null; out.dim("exit"); return out; }
    const r=shellExec(st,c,line);
    r.out.L.forEach(l=>out.raw(l.t,l.cls));
    return out;
  }

  const t=tokenize(line);
  if(t[0]!=="docker"){
    if(hostShell(st,line,out)) return out;
    out.err(t[0]+": command not found");
    out.dim("Подсказка: наберите help, чтобы увидеть список доступных команд.");
    return out;
  }
  let a=t.slice(1);
  if(!a.length){ usage(out); return out; }

  // docker image / container / network / volume / system — приводим к плоскому виду
  if(a[0]==="image"&&["ls","list"].includes(a[1])) a=["images"].concat(a.slice(2));
  else if(a[0]==="image"&&["rm","remove"].includes(a[1])) a=["rmi"].concat(a.slice(2));
  else if(a[0]==="image"&&a[1]) a=[a[1]].concat(a.slice(2));
  else if(a[0]==="container"&&["ls","list"].includes(a[1])) a=["ps"].concat(a.slice(2));
  else if(a[0]==="container"&&a[1]) a=[a[1]].concat(a.slice(2));

  const cmd=a[0], rest=a.slice(1);
  switch(cmd){
    case "version": out.line("Client: Docker Engine - Community"); out.line(" Version:    26.1.4"); out.line(" API version: 1.45"); out.line("Server: Docker Desktop"); out.line(" Engine Version: 26.1.4"); out.line(" containerd: 1.6.33"); return out;
    case "info": {
      out.line("Server:"); out.line(" Containers: "+st.containers.length);
      out.line("  Running: "+st.containers.filter(c=>c.status==="running").length);
      out.line("  Stopped: "+st.containers.filter(c=>c.status!=="running").length);
      out.line(" Images: "+st.images.length);
      out.line(" Storage Driver: overlay2"); out.line(" Cgroup Driver: cgroupfs  Cgroup Version: 2");
      out.line(" Kernel Version: 6.6.16-linuxkit"); out.line(" Total Memory: 7.654GiB");
      return out;
    }
    case "help": case "--help": usage(out); return out;
    case "login": out.ok("Login Succeeded"); return out;
    case "logout": out.line("Removing login credentials"); return out;

    case "pull": { const p=parseArgs(rest,new Set(["--platform"]),false); if(!p.rest[0]){out.err("\"docker pull\" requires exactly 1 argument.");return out;} pullImage(st,p.rest[0],out); return out; }
    case "push": {
      const ref=rest.filter(x=>!x.startsWith("-"))[0];
      const img=findImage(st,ref);
      if(!img){ out.err("An image does not exist locally with the tag: "+ref); return out; }
      if(!/\//.test(img.repo)){ out.err("denied: requested access to the resource is denied"); out.dim("Для отправки в Docker Hub образ должен быть помечен как <пользователь>/<имя>:<тег>."); return out; }
      out.line("The push refers to repository ["+(img.repo.includes(".")?"":"docker.io/")+img.repo+"]");
      img.layers.slice(0,3).forEach(l=>out.dim(l.id.slice(0,12)+": Pushed"));
      out.line(img.tag+": digest: "+img.digest+" size: "+(1000+img.layers.length*400));
      st.pushed.push(img.repo+":"+img.tag);
      return out;
    }
    case "tag": {
      const [src,dst]=rest.filter(x=>!x.startsWith("-"));
      const img=findImage(st,src);
      if(!img){ out.err("Error response from daemon: No such image: "+src); return out; }
      const r=refParse(dst);
      const dup=st.images.find(x=>x.repo===r.repo&&x.tag===r.tag);
      if(dup){ dup.repo="<none>"; dup.tag="<none>"; }
      if(img.repo==="<none>"){ img.repo=r.repo; img.tag=r.tag; }
      else st.images.push(Object.assign({},img,{repo:r.repo,tag:r.tag}));
      return out;
    }
    case "images": {
      const p=parseArgs(rest,new Set(["--filter","--format"]),false);
      let list=st.images.slice().reverse();
      if(!p.has("--all")) list=list;
      if(p.has("--quiet")){ list.forEach(i=>out.line(i.id.slice(0,12))); return out; }
      const filt=p.one("--filter");
      if(filt==="dangling=true") list=list.filter(i=>i.repo==="<none>");
      if(p.rest[0]) list=list.filter(i=>i.repo===p.rest[0]||i.repo+":"+i.tag===p.rest[0]);
      table(out,["REPOSITORY","TAG","IMAGE ID","CREATED","SIZE"],
        list.map(i=>[i.repo,i.tag,i.id.slice(0,12),fmtAgo(i.created),fmtSize(imgSize(i))]));
      return out;
    }
    case "rmi": {
      const p=parseArgs(rest.map(x=>x==="-f"?"--force":x),new Set([]),false);
      p.rest.forEach(ref=>{
        const img=findImage(st,ref);
        if(!img){ out.err("Error response from daemon: No such image: "+ref); return; }
        const used=st.containers.find(c=>c.imageId===img.id);
        if(used && !p.has("--force")){ out.err("Error response from daemon: conflict: unable to remove repository reference \""+ref+"\" (must force) - container "+used.id.slice(0,12)+" is using its referenced image "+img.id.slice(0,12)); return; }
        st.images=st.images.filter(x=>x!==img);
        out.line("Untagged: "+img.repo+":"+img.tag);
        out.line("Deleted: sha256:"+img.id);
      });
      return out;
    }
    case "history": {
      const img=findImage(st,rest.filter(x=>!x.startsWith("-"))[0]);
      if(!img){ out.err("Error response from daemon: No such image"); return out; }
      table(out,["IMAGE","CREATED","CREATED BY","SIZE"],
        img.layers.slice().reverse().map((l,i)=>[i===0?img.id.slice(0,12):"<missing>", fmtAgo(img.created),
          (l.cmd.length>52?l.cmd.slice(0,51)+"…":l.cmd), fmtSize(l.size)]));
      return out;
    }
    case "build": dockerBuild(st,rest,out); return out;

    case "run": { const c=createContainer(st,rest,out,true); if(c && c.__shell) {} return out; }
    case "create": { const c=createContainer(st,rest,out,false); if(c) out.line(c.id); return out; }
    case "start": {
      const p=parseArgs(rest,new Set([]),false);
      p.rest.forEach(r=>{ const c=findContainer(st,r); if(!c){out.err("Error response from daemon: No such container: "+r);return;}
        startContainer(st,c,mkOut(),false); out.line(c.name); });
      return out;
    }
    case "stop": {
      const p=parseArgs(rest,new Set(["--time","-t"]),false);
      p.rest.forEach(r=>{ const c=findContainer(st,r); if(!c){out.err("Error response from daemon: No such container: "+r);return;}
        stopContainer(st,c); out.line(c.name); });
      return out;
    }
    case "kill": { rest.filter(x=>!x.startsWith("-")).forEach(r=>{ const c=findContainer(st,r); if(!c){out.err("Error response from daemon: No such container: "+r);return;} c.status="exited"; c.exitCode=137; c.stopped=Date.now(); out.line(c.name); }); return out; }
    case "restart": { rest.filter(x=>!x.startsWith("-")).forEach(r=>{ const c=findContainer(st,r); if(!c){out.err("Error response from daemon: No such container: "+r);return;} stopContainer(st,c); c.logs=[]; startContainer(st,c,mkOut(),false); c.restarts++; out.line(c.name); }); return out; }
    case "pause": { rest.forEach(r=>{const c=findContainer(st,r); if(c){c.status="paused"; out.line(c.name);}}); return out; }
    case "unpause": { rest.forEach(r=>{const c=findContainer(st,r); if(c){c.status="running"; out.line(c.name);}}); return out; }
    case "rm": {
      const p=parseArgs(rest.map(x=>x==="-f"?"--force":x),new Set([]),false);
      p.rest.forEach(r=>{
        const c=findContainer(st,r);
        if(!c){ out.err("Error response from daemon: No such container: "+r); return; }
        if(c.status==="running" && !p.has("--force")){ out.err("Error response from daemon: cannot remove container \"/"+c.name+"\": container is running: stop the container before removing or force remove"); return; }
        removeContainer(st,c,p.has("--volumes")); out.line(r);
      });
      return out;
    }
    case "ps": {
      const p=parseArgs(rest,new Set(["--filter","--format","--last"]),false);
      let list=st.containers.slice().reverse();
      if(!p.has("--all")) list=list.filter(c=>c.status==="running"||c.status==="paused");
      p.all("--filter").forEach(f=>{
        if(typeof f!=="string") return;
        const [k,v]=f.split("=");
        if(k==="status") list=list.filter(c=>c.status===v);
        if(k==="name") list=list.filter(c=>c.name.includes(v));
        if(k==="ancestor") list=list.filter(c=>c.image===v||c.image.startsWith(v));
        if(k==="label") list=list.filter(c=>{const [lk,lv]=v.split("="); return lv?c.labels[lk]===lv:lk in c.labels;});
      });
      if(p.has("--quiet")){ list.forEach(c=>out.line(c.id.slice(0,12))); return out; }
      table(out,["CONTAINER ID","IMAGE","COMMAND","CREATED","STATUS","PORTS","NAMES"],
        list.map(c=>[c.id.slice(0,12),c.image,cmdText(c),fmtAgo(c.created),statusText(c),portsText(c),c.name]));
      return out;
    }
    case "logs": {
      const p=parseArgs(rest.map(x=>x==="-f"?"--follow":x),new Set(["--tail","--since","--until"]),false);
      const c=findContainer(st,p.rest[0]);
      if(!c){ out.err("Error response from daemon: No such container: "+(p.rest[0]||"")); return out; }
      let L=c.logs.slice();
      const tail=p.one("--tail"); if(tail && tail!=="all") L=L.slice(-Math.max(0,+tail));
      if(!L.length) out.dim("(лог пуст)");
      L.forEach(l=>out.line(l));
      if(p.has("--follow")) out.dim("(-f в эмуляторе показывает уже накопленный лог и возвращает приглашение)");
      return out;
    }
    case "exec": {
      const p=parseArgs(rest,new Set(["--env","--workdir","--user","-e","-w","-u"]),true);
      const c=findContainer(st,p.rest[0]);
      if(!c){ out.err("Error response from daemon: No such container: "+(p.rest[0]||"")); return out; }
      if(c.status!=="running"){ out.err("Error response from daemon: container "+c.id.slice(0,12)+" is not running"); return out; }
      const inner=p.rest.slice(1);
      if(!inner.length){ out.err("\"docker exec\" requires at least 2 arguments."); return out; }
      if(["sh","bash","/bin/sh","/bin/bash","ash"].includes(inner[0]) && inner.length===1){
        if(p.has("--interactive")&&p.has("--tty")){
          st.shellIn=c.id;
          out.dim("Вы внутри контейнера "+c.name+". Команды: ls, cat, env, hostname, whoami, curl, ping. Выход — exit");
          return out;
        }
        out.dim("(без -it оболочка запускается и сразу завершается — добавьте -it)");
        return out;
      }
      const saveWd=c.workdir;
      if(p.one("--workdir")) c.workdir=p.one("--workdir");
      const r=shellExec(st,c,inner.map(x=>/\s/.test(x)?'"'+x+'"':x).join(" "));
      c.workdir=saveWd;
      r.out.L.forEach(l=>out.raw(l.t,l.cls));
      return out;
    }
    case "inspect": {
      const p=parseArgs(rest.map(x=>x==="-f"?"--format":x),new Set(["--format","--type"]),false);
      const refs=p.rest;
      if(!refs.length){ out.err("\"docker inspect\" requires at least 1 argument."); return out; }
      const res=refs.map(r=>{ const f=findAny(st,r); return f?inspectJson(st,f.obj,f.kind):null; });
      if(res.some(x=>x===null)){ out.err("Error: No such object: "+refs[res.indexOf(null)]); return out; }
      const fmt=p.one("--format");
      if(fmt){
        res.forEach(o=>{
          const path=fmt.replace(/[{}.]+/g," ").trim().split(/\s+/).filter(Boolean);
          let v=o; path.forEach(k=>{ v = v==null?v : v[k]; });
          out.line(typeof v==="object"?JSON.stringify(v):String(v));
        });
        return out;
      }
      JSON.stringify(res,null,4).split("\n").forEach(l=>out.line(l));
      return out;
    }
    case "port": {
      const c=findContainer(st,rest[0]);
      if(!c){ out.err("Error response from daemon: No such container: "+rest[0]); return out; }
      if(!c.ports.length){ out.dim("(нет опубликованных портов)"); return out; }
      c.ports.forEach(p=>out.line(p.cont+"/"+p.proto+" -> 0.0.0.0:"+p.host));
      return out;
    }
    case "top": {
      const c=findContainer(st,rest[0]);
      if(!c){ out.err("Error response from daemon: No such container: "+rest[0]); return out; }
      table(out,["UID","PID","PPID","CMD"],[[c.user,"1","0",c.cmd.join(" ")]]);
      return out;
    }
    case "stats": {
      const list=st.containers.filter(c=>c.status==="running");
      if(!list.length){ out.dim("(нет запущенных контейнеров)"); return out; }
      table(out,["CONTAINER ID","NAME","CPU %","MEM USAGE / LIMIT","MEM %","NET I/O"],
        list.map(c=>{
          const lim=c.memory?parseMem(c.memory):512*MB;
          const use=Math.round(lim*(0.08+Math.random()*0.25));
          return [c.id.slice(0,12),c.name,(Math.random()*4).toFixed(2)+"%",fmtSize(use)+" / "+fmtSize(lim),
                  (use/lim*100).toFixed(2)+"%",fmtSize(Math.random()*3*MB)+" / "+fmtSize(Math.random()*MB)];
        }));
      return out;
    }
    case "cp": {
      const [src,dst]=rest.filter(x=>!x.startsWith("-"));
      if(!src||!dst){ out.err("\"docker cp\" requires 2 arguments."); return out; }
      const parse=s=>{ const i=s.indexOf(":"); if(i>0 && !s.startsWith("/") && !s.startsWith(".")) return {c:findContainer(st,s.slice(0,i)), p:s.slice(i+1)}; return {c:null,p:s}; };
      const S=parse(src), D=parse(dst);
      if(S.c&&!D.c){ const v=cRead(st,S.c,S.p); if(v===undefined){out.err("Error: No such container:path");return out;} st.files[normPath(D.p,st.cwd)]=v; out.dim("Successfully copied to "+D.p); return out; }
      if(!S.c&&D.c){ const v=st.files[normPath(S.p,st.cwd)]; if(v===undefined){out.err("Error: no such file "+S.p);return out;} cWrite(st,D.c,D.p,v); out.dim("Successfully copied to "+D.c.name+":"+D.p); return out; }
      out.err("Error: unsupported copy"); return out;
    }

    case "network": {
      const sub=rest[0], r2=rest.slice(1);
      if(sub==="ls"||sub==="list"){ table(out,["NETWORK ID","NAME","DRIVER","SCOPE"], st.networks.map(n=>[n.id.slice(0,12),n.name,n.driver,"local"])); return out; }
      if(sub==="create"){
        const p=parseArgs(r2.map(x=>x==="-d"?"--driver":x),new Set(["--driver","--subnet","--gateway","--label","--opt"]),false);
        const name=p.rest[0];
        if(!name){ out.err("\"docker network create\" requires exactly 1 argument."); return out; }
        if(netByName(st,name)&&st.networks.find(n=>n.name===name)){ out.err("Error response from daemon: network with name "+name+" already exists"); return out; }
        const n={id:hex(12),name,driver:p.one("--driver")||"bridge",subnet:p.one("--subnet")||("172."+(st.netSeq++)+".0.0/16"),next:2,internal:p.has("--internal")};
        st.networks.push(n); out.line(n.id); return out;
      }
      if(sub==="rm"||sub==="remove"){
        r2.filter(x=>!x.startsWith("-")).forEach(nm=>{
          const n=netByName(st,nm);
          if(!n){ out.err("Error response from daemon: network "+nm+" not found"); return; }
          if(n.builtin){ out.err("Error response from daemon: "+n.name+" is a pre-defined network and cannot be removed"); return; }
          const used=st.containers.find(c=>c.networks[n.name]);
          if(used){ out.err("Error response from daemon: error while removing network: network "+n.name+" id "+n.id+" has active endpoints"); return; }
          st.networks=st.networks.filter(x=>x!==n); out.line(nm);
        });
        return out;
      }
      if(sub==="connect"||sub==="disconnect"){
        const p=parseArgs(r2,new Set(["--alias","--ip"]),false);
        const n=netByName(st,p.rest[0]), c=findContainer(st,p.rest[1]);
        if(!n){ out.err("Error response from daemon: network "+p.rest[0]+" not found"); return out; }
        if(!c){ out.err("Error response from daemon: No such container: "+p.rest[1]); return out; }
        if(sub==="connect") attach(st,c,n,[c.name].concat(p.all("--alias").filter(x=>typeof x==="string")));
        else delete c.networks[n.name];
        return out;
      }
      if(sub==="inspect"){ const n=netByName(st,r2[0]); if(!n){out.err("Error: No such network: "+r2[0]);return out;} JSON.stringify([inspectJson(st,n,"network")],null,4).split("\n").forEach(l=>out.line(l)); return out; }
      if(sub==="prune"){
        const unused=st.networks.filter(n=>!n.builtin && !st.containers.some(c=>c.networks[n.name]));
        if(unused.length) out.line("Deleted Networks:");
        unused.forEach(n=>{ out.line(n.name); st.networks=st.networks.filter(x=>x!==n); });
        return out;
      }
      out.err("docker network: unknown command \""+(sub||"")+"\""); return out;
    }
    case "volume": {
      const sub=rest[0], r2=rest.slice(1);
      if(sub==="ls"||sub==="list"){ table(out,["DRIVER","VOLUME NAME"], st.volumes.map(v=>[v.driver,v.name])); return out; }
      if(sub==="create"){ const p=parseArgs(r2.map(x=>x==="-d"?"--driver":x),new Set(["--driver","--label","--opt"]),false);
        const name=p.rest[0]||("vol_"+hex(6)); ensureVolume(st,name); out.line(name); return out; }
      if(sub==="rm"||sub==="remove"){
        r2.filter(x=>!x.startsWith("-")).forEach(nm=>{
          const v=st.volumes.find(x=>x.name===nm);
          if(!v){ out.err("Error response from daemon: get "+nm+": no such volume"); return; }
          const used=st.containers.find(c=>c.mounts.some(m=>m.source===nm));
          if(used){ out.err("Error response from daemon: remove "+nm+": volume is in use - ["+used.id+"]"); return; }
          st.volumes=st.volumes.filter(x=>x!==v); delete st.volStore[nm]; out.line(nm);
        });
        return out;
      }
      if(sub==="inspect"){ const v=st.volumes.find(x=>x.name===r2[0]); if(!v){out.err("Error: No such volume: "+r2[0]);return out;} JSON.stringify([inspectJson(st,v,"volume")],null,4).split("\n").forEach(l=>out.line(l)); return out; }
      if(sub==="prune"){
        const unused=st.volumes.filter(v=>!st.containers.some(c=>c.mounts.some(m=>m.source===v.name)));
        if(unused.length) out.line("Deleted Volumes:");
        unused.forEach(v=>{ out.line(v.name); delete st.volStore[v.name]; });
        st.volumes=st.volumes.filter(v=>!unused.includes(v));
        out.line("Total reclaimed space: "+fmtSize(unused.length*4*MB));
        return out;
      }
      out.err("docker volume: unknown command \""+(sub||"")+"\""); return out;
    }
    case "system": {
      const sub=rest[0], p=parseArgs(rest.slice(1).map(x=>x==="-f"?"--force":x),new Set(["--filter"]),false);
      if(sub==="df"){
        table(out,["TYPE","TOTAL","ACTIVE","SIZE","RECLAIMABLE"],[
          ["Images",String(st.images.length),String(new Set(st.containers.map(c=>c.imageId)).size),fmtSize(st.images.reduce((a,i)=>a+imgSize(i),0)),"—"],
          ["Containers",String(st.containers.length),String(st.containers.filter(c=>c.status==="running").length),fmtSize(st.containers.length*32*KB),"—"],
          ["Local Volumes",String(st.volumes.length),String(st.volumes.filter(v=>st.containers.some(c=>c.mounts.some(m=>m.source===v.name))).length),fmtSize(st.volumes.length*4*MB),"—"]]);
        return out;
      }
      if(sub==="prune"){
        let freed=0;
        const dead=st.containers.filter(c=>c.status!=="running"&&c.status!=="paused");
        if(dead.length){ out.line("Deleted Containers:"); dead.forEach(c=>{out.line(c.id); removeContainer(st,c); freed+=32*KB;}); }
        const nets=st.networks.filter(n=>!n.builtin && !st.containers.some(c=>c.networks[n.name]));
        if(nets.length){ out.line("Deleted Networks:"); nets.forEach(n=>{out.line(n.name); st.networks=st.networks.filter(x=>x!==n);}); }
        const used=new Set(st.containers.map(c=>c.imageId));
        const imgs=st.images.filter(i=>!used.has(i.id) && (p.has("--all")||i.repo==="<none>"));
        if(imgs.length){ out.line("Deleted Images:"); imgs.forEach(i=>{out.line("deleted: sha256:"+i.id); freed+=imgSize(i);}); st.images=st.images.filter(i=>!imgs.includes(i)); }
        out.line("Total reclaimed space: "+fmtSize(freed));
        return out;
      }
      out.err("docker system: unknown command"); return out;
    }
    case "compose": {
      const sub=rest[0], r2=rest.slice(1);
      if(sub==="up") { composeUp(st,r2,out); return out; }
      if(sub==="down"){ composeDown(st,r2,out); return out; }
      if(sub==="ps"){
        const proj=(st.cwd.split("/").pop()||"work").toLowerCase();
        const list=st.containers.filter(c=>c.composeProject===proj);
        if(!list.length){ out.dim("(нет контейнеров проекта)"); return out; }
        table(out,["NAME","IMAGE","COMMAND","SERVICE","STATUS","PORTS"],
          list.map(c=>[c.name,c.image,cmdText(c),c.composeService,statusText(c),portsText(c)]));
        return out;
      }
      if(sub==="logs"){
        const proj=(st.cwd.split("/").pop()||"work").toLowerCase();
        const only=r2.filter(x=>!x.startsWith("-"))[0];
        st.containers.filter(c=>c.composeProject===proj && (!only||c.composeService===only))
          .forEach(c=>c.logs.forEach(l=>out.line(c.composeService+"-1  | "+l)));
        return out;
      }
      if(sub==="build"){ const f=composeFile(st,null); if(!f){out.err("no configuration file provided");return out;}
        const doc=parseYaml(f.text); Object.entries(doc.services||{}).forEach(([svc,s])=>{
          if(!s.build) return; const ctx=typeof s.build==="string"?s.build:(s.build.context||".");
          out.line("Building "+svc); const bo=mkOut(); dockerBuild(st,[ctx,"--tag",s.image||((st.cwd.split("/").pop())+"-"+svc)],bo);
          bo.L.forEach(l=>out.raw("  "+l.t,l.cls==="err"?"err":"dim"));
        }); return out; }
      if(sub==="stop"||sub==="start"||sub==="restart"){
        const proj=(st.cwd.split("/").pop()||"work").toLowerCase();
        st.containers.filter(c=>c.composeProject===proj).forEach(c=>{
          if(sub!=="start") stopContainer(st,c);
          if(sub!=="stop") startContainer(st,c,mkOut(),false);
          out.line("Container "+c.name+"  "+(sub==="stop"?"Stopped":"Started"));
        });
        return out;
      }
      out.err("docker compose: unknown command \""+(sub||"")+"\""); return out;
    }
    default:
      out.err("docker: '"+cmd+"' is not a docker command.");
      out.dim("See 'docker --help' — или наберите help для списка команд эмулятора.");
      return out;
  }
}
function parseMem(s){
  const m=String(s).match(/^(\d+(?:\.\d+)?)\s*([kmg])?b?$/i);
  if(!m) return 512*MB;
  const n=parseFloat(m[1]), u=(m[2]||"").toLowerCase();
  return n*(u==="g"?GB:u==="m"?MB:u==="k"?KB:1);
}
function usage(out){
  out.line("Команды эмулятора Docker:");
  out.dim("  образы     pull · build · images · rmi · tag · push · history · inspect");
  out.dim("  контейнеры run · create · start · stop · restart · kill · rm · ps · logs · exec · top · port · cp · stats");
  out.dim("  сети       network ls|create|rm|connect|disconnect|inspect|prune");
  out.dim("  тома       volume ls|create|rm|inspect|prune");
  out.dim("  compose    compose up|down|ps|logs|build");
  out.dim("  система    system df · system prune · version · info");
  out.dim("  оболочка   ls · cat · pwd · echo · curl · rm · mkdir · history");
  out.dim("  тренажёр   reset — вернуть задание к началу, clear — очистить экран");
}

/* автодополнение */
const COMPLETIONS = ["docker run","docker ps","docker ps -a","docker images","docker pull ","docker build -t ",
 "docker exec -it ","docker logs ","docker stop ","docker start ","docker rm ","docker rmi ","docker inspect ",
 "docker network ls","docker network create ","docker network connect ","docker volume ls","docker volume create ",
 "docker volume inspect ","docker compose up -d","docker compose down","docker compose ps","docker compose logs",
 "docker history ","docker stats","docker system prune","docker system df","docker port ","docker cp ","docker tag ",
 "docker push ","docker top ","docker restart ","docker version","docker info","curl http://localhost:","cat ","ls","help","reset","clear"];
/* ============================================================
   Визуализация состояния движка
   ============================================================ */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const clip = (s,n) => { s=String(s); return s.length>n ? s.slice(0,n-1)+"…" : s; };

function vizMap(st){
  const W=440, PAD=12;
  const running = st.containers;
  if(!running.length && st.networks.filter(n=>!n.builtin).length===0 && !st.volumes.length)
    return '<div class="viz-empty">Схема пуста.<br>Запустите контейнер — например<br><b>docker run -d -p 8080:80 nginx:alpine</b></div>';

  const used = st.networks.filter(n=> n.builtin ? st.containers.some(c=>c.networks[n.name]) : true);
  const nets = used.length?used:[st.networks[0]];
  const CW=124, CH=58, CGAP=8, NPADX=10, NPADY=26, NGAP=10;
  let y=52, parts=[], boxes={};
  const perRow = Math.floor((W-2*PAD-2*NPADX+CGAP)/(CW+CGAP)) || 1;

  nets.forEach(net=>{
    const members = st.containers.filter(c=>c.networks[net.name]);
    const rows = Math.max(1, Math.ceil(members.length/perRow));
    const nh = NPADY + rows*CH + (rows-1)*CGAP + 10;
    const nx = PAD, nw = W-2*PAD;
    const dashed = net.builtin?'stroke-dasharray="3 3"':'';
    parts.push('<rect x="'+nx+'" y="'+y+'" width="'+nw+'" height="'+nh+'" rx="3" fill="var(--surface-3)" stroke="var(--accent-line)" stroke-width="1" '+dashed+'/>');
    parts.push('<text x="'+(nx+10)+'" y="'+(y+15)+'" font-family="var(--font-mono)" font-size="9.5" font-weight="700" fill="var(--accent)">'+esc(net.name)+'</text>');
    parts.push('<text x="'+(nx+nw-10)+'" y="'+(y+15)+'" text-anchor="end" font-family="var(--font-mono)" font-size="8.5" fill="var(--ink-3)">'+esc(net.driver+(net.subnet?" · "+net.subnet:""))+'</text>');
    if(!members.length){
      parts.push('<text x="'+(nx+nw/2)+'" y="'+(y+NPADY+16)+'" text-anchor="middle" font-family="var(--font-mono)" font-size="9" fill="var(--ink-3)">нет контейнеров</text>');
    }
    members.forEach((c,i)=>{
      const r=Math.floor(i/perRow), col=i%perRow;
      const cx=nx+NPADX+col*(CW+CGAP), cy=y+NPADY+r*(CH+CGAP);
      boxes[c.id]={x:cx,y:cy,w:CW,h:CH};
      const st_ = c.status;
      const col_ = st_==="running"?"var(--ok)":(st_==="created"?"var(--warn)":"var(--ink-3)");
      parts.push('<rect x="'+cx+'" y="'+cy+'" width="'+CW+'" height="'+CH+'" rx="2" fill="var(--surface)" stroke="var(--line)"/>');
      parts.push('<rect x="'+cx+'" y="'+cy+'" width="3" height="'+CH+'" fill="'+col_+'"/>');
      parts.push('<text x="'+(cx+9)+'" y="'+(cy+15)+'" font-family="var(--font-mono)" font-size="9.5" font-weight="700" fill="var(--ink)">'+esc(clip(c.name,15))+'</text>');
      parts.push('<circle cx="'+(cx+CW-9)+'" cy="'+(cy+11)+'" r="3" fill="'+col_+'"/>');
      parts.push('<text x="'+(cx+9)+'" y="'+(cy+28)+'" font-family="var(--font-mono)" font-size="8.5" fill="var(--ink-2)">'+esc(clip(c.image,20))+'</text>');
      const ip=c.networks[net.name].ip||"—";
      parts.push('<text x="'+(cx+9)+'" y="'+(cy+40)+'" font-family="var(--font-mono)" font-size="8" fill="var(--ink-3)">'+esc(ip)+'</text>');
      const pt=c.ports.map(p=>":"+p.host+"→"+p.cont).join(" ");
      if(pt) parts.push('<text x="'+(cx+9)+'" y="'+(cy+51)+'" font-family="var(--font-mono)" font-size="8" font-weight="700" fill="var(--signal)">'+esc(clip(pt,17))+'</text>');
      else if(c.mounts.length) parts.push('<text x="'+(cx+9)+'" y="'+(cy+51)+'" font-family="var(--font-mono)" font-size="8" fill="var(--ink-3)">'+c.mounts.length+' mount</text>');
    });
    y+=nh+NGAP;
  });

  const vols=st.volumes;
  let volY=y;
  if(vols.length){
    const rowsH=Math.ceil(vols.length/2)*30+22;
    parts.push('<rect x="'+PAD+'" y="'+y+'" width="'+(W-2*PAD)+'" height="'+rowsH+'" rx="3" fill="none" stroke="var(--line)" stroke-dasharray="2 3"/>');
    parts.push('<text x="'+(PAD+10)+'" y="'+(y+15)+'" font-family="var(--font-mono)" font-size="9.5" font-weight="700" fill="var(--ink-3)">ТОМА</text>');
    vols.forEach((v,i)=>{
      const vx=PAD+10+(i%2)*((W-2*PAD-20)/2), vy=y+24+Math.floor(i/2)*30;
      const inUse=st.containers.filter(c=>c.mounts.some(m=>m.source===v.name));
      parts.push('<ellipse cx="'+(vx+9)+'" cy="'+(vy+5)+'" rx="8" ry="3" fill="var(--surface-2)" stroke="var(--line)"/>');
      parts.push('<path d="M'+(vx+1)+' '+(vy+5)+'v11a8 3 0 0 0 16 0V'+(vy+5)+'" fill="var(--surface-2)" stroke="var(--line)"/>');
      parts.push('<text x="'+(vx+24)+'" y="'+(vy+9)+'" font-family="var(--font-mono)" font-size="8.5" font-weight="700" fill="var(--ink)">'+esc(clip(v.name,20))+'</text>');
      parts.push('<text x="'+(vx+24)+'" y="'+(vy+20)+'" font-family="var(--font-mono)" font-size="8" fill="'+(inUse.length?"var(--ok)":"var(--ink-3)")+'">'+esc(inUse.length?clip(inUse.map(c=>c.name).join(","),22):"не используется")+'</text>');
    });
    volY=y+rowsH; y=volY+NGAP;
  }

  const pub=[];
  st.containers.filter(c=>c.status==="running").forEach(c=>c.ports.forEach(p=>pub.push({h:p.host,c:c.name,p:p.cont})));
  let head='<rect x="'+(PAD-5)+'" y="14" width="'+(W-2*PAD+10)+'" height="'+(y-24)+'" rx="4" fill="none" stroke="var(--line)" stroke-dasharray="5 4"/>'+
    '<text x="'+(PAD+3)+'" y="30" font-family="var(--font-mono)" font-size="9.5" font-weight="700" letter-spacing="1" fill="var(--ink-3)">ХОСТ · localhost</text>';
  if(pub.length){
    let px=W-PAD-4;
    pub.slice(0,4).reverse().forEach(p=>{
      const label=":"+p.h;
      const wpx=label.length*5.6+12;
      px-=wpx+5;
      head+='<rect x="'+px+'" y="9" width="'+wpx+'" height="15" rx="2" fill="var(--signal)"/>'+
            '<text x="'+(px+wpx/2)+'" y="20" text-anchor="middle" font-family="var(--font-mono)" font-size="8.5" font-weight="700" fill="var(--surface)">'+esc(label)+'</text>';
    });
  }
  const H=y+4;
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Схема состояния Docker">'+
    '<defs><pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0v16" fill="none" stroke="var(--grid)" stroke-width=".4" opacity=".5"/></pattern></defs>'+
    '<rect width="'+W+'" height="'+H+'" fill="url(#g)"/>'+head+parts.join("")+'</svg>';
}

function vizLayers(st){
  if(!st.images.length) return '<div class="viz-empty">Локальных образов нет.<br>Скачайте: <b>docker pull alpine:3.19</b><br>или соберите: <b>docker build -t app .</b></div>';
  const imgs = st.images.slice().reverse().slice(0,3);
  let html='<div style="padding:12px 14px">';
  imgs.forEach(img=>{
    const total=imgSize(img);
    const max=Math.max(...img.layers.map(l=>l.size),1);
    html+='<div style="margin-bottom:16px">';
    html+='<div style="display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-mono);font-size:11px;margin-bottom:7px">'+
      '<b style="color:var(--accent)">'+esc(img.repo+":"+img.tag)+'</b>'+
      '<span style="color:var(--ink-3)">'+img.layers.length+' сл. · '+fmtSize(total)+'</span></div>';
    img.layers.slice().reverse().forEach(l=>{
      const pct=Math.max(2, Math.round(l.size/max*100));
      const zero=l.size===0;
      html+='<div style="display:grid;grid-template-columns:1fr 54px;gap:8px;align-items:center;margin-bottom:3px">'+
        '<div style="position:relative;background:var(--surface-3);border:1px solid var(--line-soft);border-radius:2px;height:20px;overflow:hidden">'+
          '<div style="position:absolute;inset:0 auto 0 0;width:'+pct+'%;background:'+(zero?"var(--surface-2)":(l.base?"var(--accent-line)":"var(--accent-soft)"))+'"></div>'+
          '<div style="position:relative;font-family:var(--font-mono);font-size:8.5px;line-height:20px;padding:0 6px;white-space:nowrap;overflow:hidden;color:var(--ink-2)">'+
            esc(clip(l.cmd.replace("/bin/sh -c #(nop) ","").replace("/bin/sh -c ","RUN "),46))+'</div>'+
        '</div>'+

<h2>Чем ядро «врёт» процессу</h2>
<p>Изоляция собирается из трёх механизмов ядра Linux, и Docker их только оркеструет:</p>
<ul>
<li><b>namespaces</b> — что процесс <em>видит</em>. Отдельные пространства имён для PID (внутри контейнера ваш процесс — номер 1), сети (свой сетевой стек и свои интерфейсы), точек монтирования, имени хоста, пользователей и IPC.</li>
<li><b>cgroups</b> (control groups) — сколько процесс <em>может взять</em>. Лимиты и учёт CPU, памяти, дискового и сетевого ввода-вывода.</li>
<li><b>union-файловая система</b> (обычно overlay2) — как собирается корневая ФС: несколько слоёв только для чтения плюс один тонкий слой для записи сверху.</li>
</ul>
<div class="callout"><b>Следствие</b><p>Контейнер использует ядро хоста. Поэтому Linux-образ не может запуститься на «голой» Windows или macOS — там Docker Desktop поднимает маленькую Linux-виртуалку, внутри которой уже работают контейнеры. И по той же причине контейнер с ARM-образом не запустится на x86 без эмуляции.</p></div>

<h2>Образ и контейнер — разные вещи</h2>
<p>Это первое, что нужно уложить в голове:</p>
<div class="tbl-wrap"><table class="t">
<tr><th></th><th>Образ (image)</th><th>Контейнер (container)</th></tr>
<tr><td><b>Что это</b></td><td>Неизменяемый шаблон: набор слоёв файловой системы + метаданные (какую команду запускать, какие переменные окружения, какой порт)</td><td>Запущенный (или остановленный) экземпляр образа: те же слои плюс тонкий записываемый слой сверху</td></tr>
<tr><td><b>Аналогия</b></td><td>Класс, инсталлятор, шаблон</td><td>Объект, установленная программа, экземпляр</td></tr>
<tr><td><b>Сколько</b></td><td>Один образ</td><td>Сколько угодно контейнеров из него</td></tr>
<tr><td><b>Команда</b></td><td><code>docker images</code></td><td><code>docker ps -a</code></td></tr>
</table></div>

<h2>Что происходит при docker run</h2>
<p>Клиент <code>docker</code> — это тонкая программа, которая ничего сама не запускает. Она отправляет HTTP-запрос демону <code>dockerd</code> через unix-сокет <code>/var/run/docker.sock</code>. Дальше цепочка такая:</p>
<pre><code>docker run -d -p 8080:80 nginx:alpine
   │
   ├─ 1. клиент → REST API демона dockerd
   ├─ 2. образа nginx:alpine нет локально → docker тянет слои из registry (Docker Hub)
   ├─ 3. dockerd просит containerd подготовить корневую ФС (overlay2) и создать контейнер
   ├─ 4. containerd вызывает runc — тот создаёт namespaces + cgroups и запускает процесс
   ├─ 5. сетевой драйвер выдаёт контейнеру IP в сети bridge и ставит правило проброса :8080 → :80
   └─ 6. клиент печатает длинный ID контейнера и возвращает вам приглашение (флаг -d)</code></pre>

<h2>Реестр образов</h2>
<p><b>Registry</b> — хранилище образов. По умолчанию это Docker Hub. Полное имя образа выглядит так: <code>registry/namespace/repository:tag</code>. Когда вы пишете просто <code>nginx:alpine</code>, docker разворачивает это в <code>docker.io/library/nginx:alpine</code>. Официальные образы живут в неймспейсе <code>library</code>, ваши личные — в <code>&lt;ваш-логин&gt;/&lt;имя&gt;</code>.</p>

<h2>Минимальный набор команд</h2>
<div class="tbl-wrap"><table class="t">
<tr><th>Команда</th><th>Что делает</th></tr>
<tr><td><code>docker version</code></td><td>Версии клиента и сервера — быстрая проверка, что демон жив</td></tr>
<tr><td><code>docker pull образ</code></td><td>Скачать образ в локальный кэш</td></tr>
<tr><td><code>docker images</code></td><td>Список локальных образов</td></tr>
<tr><td><code>docker run образ [команда]</code></td><td>Создать контейнер из образа и запустить</td></tr>
<tr><td><code>docker ps</code> / <code>docker ps -a</code></td><td>Запущенные контейнеры / вообще все, включая завершившиеся</td></tr>
<tr><td><code>docker rm имя</code></td><td>Удалить контейнер</td></tr>
</table></div>
<div class="callout trap"><b>Частая ошибка новичка</b><p><code>docker ps</code> показывает <em>только запущенные</em> контейнеры. Если вы запустили что-то и оно «пропало» — почти наверняка процесс завершился, и контейнер виден только в <code>docker ps -a</code>. Это не поломка, это нормальная жизнь контейнера: он живёт ровно столько, сколько живёт его главный процесс.</p></div>

<h2>Как слои складываются</h2>
<p>Когда вы запускаете контейнер, драйвер overlay2 монтирует все слои образа один поверх другого и добавляет сверху тонкий <b>записываемый слой контейнера</b>. Приложение видит единое дерево файлов и не знает, что оно склеено из кусков.</p>

<h2>Copy-on-write</h2>
<p>Если процесс внутри контейнера читает файл — он читается прямо из нижнего слоя, никакого копирования. Если процесс <em>пишет</em> в файл — overlay2 сначала копирует файл наверх, в записываемый слой, и меняет уже копию. Отсюда два практических следствия:</p>
<ul>
<li>Запуск ста контейнеров из одного образа почти не стоит места на диске.</li>
<li>Запись больших файлов внутрь контейнера медленнее обычной и всё равно теряется при <code>docker rm</code>. Для данных нужны тома — им посвящён отдельный модуль.</li>
</ul>

<h2>Тег и digest</h2>
<p>Тег — это <em>подвижная</em> метка. Сегодня <code>node:20-alpine</code> указывает на один набор слоёв, через неделю мейнтейнеры пересоберут образ, и тот же тег будет указывать на другой. Digest — это <code>sha256</code> от манифеста, он неизменен по определению.</p>
<pre><code><span class="c"># тег — читаемо, но не воспроизводимо</span>
FROM node:20-alpine

<span class="c"># digest — некрасиво, но железобетонно</span>
FROM node:20-alpine@sha256:8f1b4a0c...</code></pre>
<div class="callout trap"><b>Ловушка тега latest</b><p><code>latest</code> — это не «самая свежая версия», а просто тег по умолчанию, который подставляется, когда вы не указали никакого. Никто не обязан его обновлять, и он может годами указывать на старьё. В продакшене всегда фиксируйте версию явно: <code>postgres:16.2-alpine</code>, а не <code>postgres:latest</code>.</p></div>

<h2>Команды для работы с образами</h2>
<div class="tbl-wrap"><table class="t">
<tr><th>Команда</th><th>Назначение</th></tr>
<tr><td><code>docker pull образ</code></td><td>Скачать. Слои, которые уже есть локально, не качаются повторно</td></tr>
<tr><td><code>docker images</code></td><td>Что есть локально. Колонка SIZE — <em>логический</em> размер, у образов с общими слоями суммы складывать нельзя</td></tr>
<tr><td><code>docker history образ</code></td><td>Слои с командами, которые их создали, и размерами — главный инструмент диагностики «почему образ такой жирный»</td></tr>

<tr><td><code>docker tag src dst</code></td><td>Добавить ещё одно имя тому же образу. Новых слоёв не создаёт — это просто указатель</td></tr>
<tr><td><code>docker rmi образ</code></td><td>Удалить тег. Слои исчезнут, только когда пропадёт последняя ссылка на них</td></tr>
<tr><td><code>docker image prune -a</code></td><td>Вычистить образы, на которые не ссылается ни один контейнер</td></tr>
</table></div>

<h2>Почему alpine такой популярный</h2>
<p>Базовый образ определяет «пол» размера. Разница между <code>node:20</code> (около гигабайта) и <code>node:20-alpine</code> (около 135 МБ) — это Debian со всем инструментарием против Alpine с musl libc и busybox. Alpine экономит место и уменьшает поверхность атаки, но иногда ломает нативные модули, собранные под glibc. Компромисс — <code>-slim</code>: Debian, но без документации, компиляторов и лишних пакетов.</p>
<div class="callout"><b>Как выбирать базовый образ</b><ul><li>Стандартный выбор — <code>-alpine</code> или <code>-slim</code>.</li><li>Есть нативные зависимости с glibc — берите <code>-slim</code>.</li><li>Собираете статический бинарник (Go, Rust) — финальный образ может быть <code>scratch</code> или distroless, буквально несколько мегабайт.</li></ul></div>

<h2>PID 1 и главный процесс</h2>
<p>Внутри контейнера главный процесс получает номер 1. Контейнер живёт ровно столько, сколько живёт этот процесс. Есть три следствия, которые постоянно кусают на практике:</p>
<ul>
<li><b>Процесс должен работать в переднем плане.</b> Демонизирующиеся программы (<code>nginx</code> без <code>daemon off;</code>, <code>httpd -k start</code>) завершаются сразу после форка, и контейнер падает.</li>
<li><b>Сигналы приходят PID 1.</b> <code>docker stop</code> отправляет SIGTERM и ждёт 10 секунд, потом SIGKILL. Если ваш процесс не обрабатывает SIGTERM, каждая остановка будет длиться 10 секунд и заканчиваться жёстким убийством.</li>
<li><b>PID 1 не пожинает зомби-процессы.</b> Если внутри порождаются дочерние процессы, добавьте <code>--init</code> или явный init-процесс (tini).</li>
</ul>

<h2>Три флага, которые нужно понимать</h2>
<div class="tbl-wrap"><table class="t">
<tr><th>Флаг</th><th>Что делает</th><th>Когда нужен</th></tr>
<tr><td><code>-d</code> / <code>--detach</code></td><td>Запустить в фоне, сразу вернуть приглашение и напечатать ID</td><td>Всё, что должно работать долго: серверы, БД</td></tr>
<tr><td><code>-it</code></td><td><code>-i</code> держит открытым stdin, <code>-t</code> выделяет псевдотерминал</td><td>Интерактивная оболочка: <code>docker run -it alpine sh</code></td></tr>
<tr><td><code>--rm</code></td><td>Удалить контейнер автоматически при завершении</td><td>Разовые задачи, чтобы не копить мусор</td></tr>
<tr><td><code>--name</code></td><td>Задать читаемое имя вместо случайного <em>brave_turing</em></td><td>Всегда, когда к контейнеру потом обращаются</td></tr>
</table></div>
<div class="callout"><b>Почему <code>docker run alpine</code> тут же выходит</b><p>У alpine команда по умолчанию — <code>/bin/sh</code>. Без <code>-it</code> у оболочки нет ни терминала, ни ввода: она читает EOF и завершается с кодом 0. Добавьте <code>-it</code> — и получите приглашение внутри контейнера.</p></div>

<h2>Заглянуть внутрь работающего контейнера</h2>
<pre><code><span class="c"># логи главного процесса (stdout + stderr)</span>

docker logs --tail 50 -f <span class="s">web</span>

<span class="c"># выполнить команду внутри уже работающего контейнера</span>
docker exec <span class="s">web</span> ls /usr/share/nginx/html
docker exec -it <span class="s">web</span> sh

<span class="c"># процессы, порты, потребление ресурсов</span>
docker top <span class="s">web</span>
docker port <span class="s">web</span>
docker stats</code></pre>
<div class="callout trap"><b>run ≠ exec</b><p><code>docker run</code> создаёт <em>новый</em> контейнер, <code>docker exec</code> запускает процесс в <em>уже работающем</em>. Если вы «зашли в контейнер» через <code>docker run -it образ sh</code>, вы попали в свежий контейнер, а не в тот, который вас интересовал, — и не увидите там ни его данных, ни его состояния.</p></div>

<h2>Куда идут логи</h2>
<p>Docker собирает <em>stdout</em> и <em>stderr</em> процесса PID 1 и складывает их в файл на хосте (драйвер <code>json-file</code> по умолчанию). Поэтому в контейнерах не пишут логи в файлы — приложение должно писать в стандартный вывод, а сбором занимается платформа. Если приложение упорно пишет в файл, обычный приём — сделать симлинк файла на <code>/dev/stdout</code>, именно так поступает официальный образ nginx.</p>
`,

n:4, id:"dockerfile", title:"Dockerfile", sub:"Инструкции и форма записи",
lede:"Как описать сборку образа: FROM, COPY, RUN, WORKDIR, ENV, EXPOSE и вечный вопрос CMD против ENTRYPOINT.",
theory:`
<p>Dockerfile — это рецепт сборки. Каждая инструкция выполняется поверх результата предыдущей и (почти всегда) порождает новый слой. Собирается всё командой <code>docker build</code>.</p>

<pre><code><span class="k">FROM</span> node:20-alpine
<span class="k">WORKDIR</span> /app
<span class="k">COPY</span> package*.json ./
<span class="k">RUN</span> npm ci --omit=dev
<span class="k">COPY</span> . .
<span class="k">ENV</span> NODE_ENV=production
<span class="k">EXPOSE</span> 3000
<span class="k">USER</span> node
<span class="k">CMD</span> [<span class="s">"node"</span>, <span class="s">"server.js"</span>]</code></pre>

<h2>Инструкции по одной</h2>
<div class="tbl-wrap"><table class="t">
<tr><th>Инструкция</th><th>Что делает</th><th>Что стоит знать</th></tr>
<tr><td><code>FROM</code></td><td>Базовый образ</td><td>Обязательно первая (кроме ARG). <code>FROM scratch</code> — пустой образ</td></tr>
<tr><td><code>WORKDIR</code></td><td>Рабочий каталог для последующих инструкций и для запуска</td><td>Создаёт каталог, если его нет. Всегда лучше, чем <code>RUN cd</code> — тот не сохраняется между слоями</td></tr>
<tr><td><code>COPY</code></td><td>Копирует файлы из контекста сборки в образ</td><td>Предпочтительна. Пути — относительно контекста, выйти за него нельзя</td></tr>
<tr><td><code>ADD</code></td><td>То же плюс распаковка архивов и загрузка по URL</td><td>Магия часто вредна — берите COPY, если не нужна распаковка tar</td></tr>
<tr><td><code>RUN</code></td><td>Выполняет команду во время <em>сборки</em></td><td>Каждый RUN — новый слой. Объединяйте связанные шаги через <code>&amp;&amp;</code></td></tr>
<tr><td><code>ENV</code></td><td>Переменная окружения в образе и во всех контейнерах из него</td><td>Видна и при сборке, и в рантайме. Секреты сюда класть нельзя</td></tr>
<tr><td><code>ARG</code></td><td>Переменная только на время сборки</td><td>Задаётся через <code>--build-arg</code>. В готовом образе её нет, но она видна в истории слоёв</td></tr>
<tr><td><code>EXPOSE</code></td><td>Документирует порт</td><td><b>Ничего не публикует.</b> Порт наружу открывает только <code>-p</code> при запуске</td></tr>
<tr><td><code>USER</code></td><td>От какого пользователя работать дальше</td><td>Пользователь должен существовать. По умолчанию всё идёт от root</td></tr>
<tr><td><code>VOLUME</code></td><td>Объявляет точку монтирования</td><td>При запуске без <code>-v</code> создаётся анонимный том — и незаметно копится</td></tr>
<tr><td><code>CMD</code> / <code>ENTRYPOINT</code></td><td>Что запускать</td><td>См. ниже — здесь ошибаются чаще всего</td></tr>
</table></div>

<h2>CMD против ENTRYPOINT</h2>
<p>Обе инструкции задают команду запуска, но по-разному реагируют на аргументы <code>docker run</code>:</p>
<ul>
<li><b>CMD</b> — значение по умолчанию, которое <em>полностью заменяется</em> аргументами после имени образа.</li>
<li><b>ENTRYPOINT</b> — фиксированная часть команды; аргументы <code>docker run</code> <em>дописываются к ней</em>. Заменить её можно только флагом <code>--entrypoint</code>.</li>
</ul>
<div class="tbl-wrap"><table class="t">
<tr><th>В Dockerfile</th><th><code>docker run img</code></th><th><code>docker run img --version</code></th></tr>
<tr><td><code>CMD ["curl","site"]</code></td><td>curl site</td><td>--version <em>(запустится как команда — почти наверняка ошибка)</em></td></tr>
<tr><td><code>ENTRYPOINT ["curl"]</code></td><td>curl</td><td>curl --version</td></tr>
<tr><td><code>ENTRYPOINT ["curl"]</code> + <code>CMD ["site"]</code></td><td>curl site</td><td>curl --version</td></tr>
</table></div>
<div class="callout"><b>Практическое правило</b><p>Образ — это «утилита» с фиксированным поведением (например, <code>ffmpeg</code>) → <code>ENTRYPOINT</code> с исполняемым файлом и <code>CMD</code> с аргументами по умолчанию. Образ — это «среда», где хочется иногда запустить что-то другое (например, приложение, куда полезно зайти оболочкой) → достаточно одного <code>CMD</code>.</p></div>

<h2>Shell-форма и exec-форма</h2>
<p>Любую из этих инструкций можно писать двумя способами, и разница важна:</p>
<pre><code><span class="c"># exec-форма (JSON-массив) — процесс запускается напрямую, PID 1 = ваша программа</span>
CMD [<span class="s">"node"</span>, <span class="s">"server.js"</span>]

<span class="c"># shell-форма — на самом деле выполняется /bin/sh -c "node server.js"</span>
CMD node server.js</code></pre>
<div class="callout trap"><b>Почему shell-форма опасна</b><p>В shell-форме PID 1 — это <code>/bin/sh</code>, а ваше приложение — его дочерний процесс. Сигнал SIGTERM от <code>docker stop</code> приходит оболочке, которая его не пересылает. Приложение не узнает об остановке и будет убито через 10 секунд по SIGKILL: незакрытые соединения, недописанные файлы. <b>Для CMD и ENTRYPOINT используйте exec-форму.</b> Shell-форма уместна только в RUN, где нужны пайпы и подстановки.</p></div>

<h2>Контекст сборки</h2>
<p>Последний аргумент <code>docker build</code> — это <em>контекст</em>: каталог, который целиком отправляется демону перед сборкой. <code>COPY</code> может брать файлы только оттуда. Отсюда два правила: не собирайте из домашнего каталога (уедут гигабайты) и всегда пишите <code>.dockerignore</code>.</p>
<pre><code><span class="c"># docker build -t app:1.0 .   — контекст «текущий каталог», Dockerfile в нём</span>
<span class="c"># docker build -t app:1.0 -f docker/Dockerfile .  — Dockerfile лежит отдельно</span></code></pre>
`,

  a:1, why:"Каждая инструкция RUN — отдельный процесс поверх нового слоя. Рабочий каталог задают инструкцией <code>WORKDIR</code>, она сохраняется в метаданных."},
 {q:"Что такое контекст сборки?",
  opts:["Кэш слоёв на диске","Каталог, который целиком передаётся демону и из которого COPY берёт файлы","Набор переменных окружения при сборке","Список базовых образов"],

],

theory:`
<p>Каждая инструкция Dockerfile порождает слой. Перед тем как выполнить инструкцию, BuildKit проверяет: есть ли в кэше слой, полученный <em>из того же родителя</em> той же самой инструкцией? Если да — слой берётся готовым, в выводе появляется <code>CACHED</code>. Если нет — слой пересобирается, и <b>все последующие инструкции тоже пересобираются</b>, потому что у них изменился родитель.</p>

<div class="callout"><b>Главное правило</b><p>Кэш ломается <em>сверху вниз</em>. Одна изменившаяся строка обесценивает всё, что ниже. Значит, редко меняющееся должно стоять вверху, часто меняющееся — внизу.</p></div>

<h2>Классическая ошибка и её цена</h2>
<figure class="fig">

   <rect x="0" y="106" width="290" height="24" fill="var(--ok-soft)" stroke="var(--ok)"/><text x="8" y="122" fill="var(--ink)">RUN npm ci</text><text x="282" y="122" text-anchor="end" fill="var(--ok)">CACHED</text>

  <text x="0" y="258" fill="var(--ink-3)">Инвалидация RUN — текстом самой команды: docker не знает, что делает apt-get, и не проверяет результат.</text>
 </g>
</svg>
<figcaption>Слева правка одной строки исходника стоит полной переустановки зависимостей. Справа зависимости отделены от кода и остаются в кэше.</figcaption>
</figure>

<h2>Как считается ключ кэша</h2>
<ul>
<li>Для <code>RUN</code> — по <em>тексту команды</em>. Docker не выполняет её, чтобы сравнить результат. Поэтому <code>RUN apt-get update</code> может отдать вам кэш недельной давности с устаревшими индексами пакетов.</li>
<li>Для <code>COPY</code> и <code>ADD</code> — по содержимому копируемых файлов (контрольная сумма), правам и путям. Изменение времени модификации без изменения содержимого кэш не ломает.</li>
<li>Для метаданных (<code>ENV</code>, <code>WORKDIR</code>, <code>LABEL</code>) — по тексту инструкции.</li>
</ul>
<div class="callout warn"><b>Ловушка apt-get update</b><p>Никогда не разделяйте <code>update</code> и <code>install</code> на два RUN. Если <code>install</code> изменится, а <code>update</code> возьмётся из кэша, вы получите установку по устаревшим индексам и загадочные ошибки «package not found». Правильно — одной командой:</p><pre style="margin:.6em 0 0"><code>RUN apt-get update &amp;&amp; apt-get install -y --no-install-recommends \\
      curl ca-certificates \\
 &amp;&amp; rm -rf /var/lib/apt/lists/*</code></pre></div>

<h2>.dockerignore</h2>
<p>Файл рядом с Dockerfile, по синтаксису похож на <code>.gitignore</code>. Он решает сразу три задачи: ускоряет отправку контекста демону, не даёт секретам и мусору попасть в образ и защищает кэш от ложных срабатываний — без него любая правка в <code>.git/</code> ломает <code>COPY . .</code>.</p>
<pre><code>.git
node_modules
dist
*.log
.env
.env.*
**/__pycache__
Dockerfile
docker-compose.yml
README.md</code></pre>
<div class="callout trap"><b>node_modules обязательно в игнор</b><p>Если локальный <code>node_modules</code> уедет в контекст, он, во-первых, перезапишет то, что установил <code>npm ci</code> внутри образа, а во-вторых, притащит бинарники, собранные под вашу ОС. На Linux-контейнере они не запустятся.</p></div>

<h2>Ещё несколько приёмов</h2>
<ul>
<li><b>Объединяйте связанные RUN.</b> Файл, удалённый в следующем слое, всё равно остаётся в предыдущем и весит. Удалять кэш пакетного менеджера нужно в той же инструкции, где он создан.</li>
<li><b>Указывайте <code>--no-install-recommends</code></b> для apt и <code>--no-cache</code> для apk — не тащите рекомендованные пакеты и индексы.</li>
<li><b>Кэш-маунты BuildKit</b> сохраняют каталог между сборками, не попадая в образ:<br><code>RUN --mount=type=cache,target=/root/.npm npm ci</code></li>
<li><b>В CI кэша нет по умолчанию.</b> Используйте <code>--cache-from</code> вместе с реестром или встроенный кэш раннера, иначе каждая сборка будет с нуля.</li>
</ul>

n:6, id:"multistage", title:"Multi-stage и размер", sub:"Сборочная и рантайм-стадии",
lede:"Как получить образ на 12 МБ вместо 900, разделив сборку и запуск, и чем помогают distroless и scratch.",
theory:`
<p>Для сборки приложения нужен компилятор, менеджер пакетов, заголовочные файлы. Для <em>запуска</em> — только результат. Multi-stage сборка позволяет держать и то и другое в одном Dockerfile, но отдавать наружу лишь финальную стадию.</p>

<h2>Как это выглядит</h2>
<pre><code><span class="c"># ---- стадия 1: собираем ----</span>
<span class="k">FROM</span> golang:1.22-alpine <span class="k">AS</span> builder
<span class="k">WORKDIR</span> /src
<span class="k">COPY</span> go.mod go.sum ./
<span class="k">RUN</span> go mod download
<span class="k">COPY</span> . .
<span class="k">RUN</span> CGO_ENABLED=0 go build -o /out/app ./cmd/server

<span class="c"># ---- стадия 2: только запускаем ----</span>
<span class="k">FROM</span> alpine:3.19
<span class="k">RUN</span> apk add --no-cache ca-certificates
<span class="k">COPY</span> --from=builder /out/app /usr/local/bin/app
<span class="k">USER</span> 10001
<span class="k">ENTRYPOINT</span> [<span class="s">"/usr/local/bin/app"</span>]</code></pre>
<p>В финальный образ попадают только слои второй стадии. Компилятор Go, исходники, кэш модулей — всё остаётся в стадии <code>builder</code> и наружу не выходит.</p>

<h2>Что ещё умеет multi-stage</h2>
<ul>
<li><b>Именованные стадии</b> — <code>AS builder</code>, потом <code>COPY --from=builder</code>. Можно ссылаться и по номеру (<code>--from=0</code>), но имя читается лучше.</li>
<li><b>Сборка до нужной стадии</b> — <code>docker build --target builder .</code> соберёт только сборочную стадию. Удобно для CI: одна стадия <code>test</code>, другая <code>prod</code>.</li>
<li><b>Копирование из чужого образа</b> — <code>COPY --from=nginx:alpine /etc/nginx/nginx.conf /tmp/</code>. Стадия не обязана быть вашей.</li>
<li><b>Параллельность</b> — независимые стадии BuildKit собирает одновременно.</li>
</ul>

<h2>Насколько маленьким может быть финальный образ</h2>
<div class="tbl-wrap"><table class="t">
<tr><th>База</th><th>Размер</th><th>Что внутри</th><th>Когда брать</th></tr>
<tr><td><code>node:20</code></td><td>~1 ГБ</td><td>Debian + компиляторы + git</td><td>Только как сборочная стадия</td></tr>
<tr><td><code>node:20-slim</code></td><td>~220 МБ</td><td>Debian без лишнего</td><td>Нужны нативные модули под glibc</td></tr>
<tr><td><code>node:20-alpine</code></td><td>~135 МБ</td><td>Alpine + musl</td><td>Обычный выбор по умолчанию</td></tr>
<tr><td><code>distroless</code></td><td>2–25 МБ</td><td>Рантайм и сертификаты, без оболочки</td><td>Продакшен, где важна безопасность</td></tr>
<tr><td><code>scratch</code></td><td>0</td><td>Ничего</td><td>Статический бинарник (Go, Rust)</td></tr>
</table></div>
<div class="callout warn"><b>У distroless и scratch нет оболочки</b><p>В такой контейнер нельзя зайти через <code>docker exec -it ... sh</code> — там нет <code>sh</code>. Это и есть плюс с точки зрения безопасности и минус с точки зрения отладки. Приёмы: держать отладочный тег на базе alpine, использовать <code>docker debug</code> или временный sidecar-контейнер с тем же namespace.</p></div>

<h2>Чек-лист «образ распух»</h2>
<ol>
<li><code>docker history образ</code> — найти самые тяжёлые слои.</li>
<li>Тяжёлый базовый образ? Перейти на <code>-alpine</code>/<code>-slim</code> или вынести сборку в отдельную стадию.</li>
<li>Тяжёлый слой <code>COPY</code>? Проверить <code>.dockerignore</code> — скорее всего, туда уехало лишнее.</li>
<li>Тяжёлый <code>RUN</code>? Не забыт ли <code>--no-install-recommends</code>, удалён ли кэш пакетного менеджера в той же инструкции.</li>
<li>Остались ли dev-зависимости? Для npm — <code>npm ci --omit=dev</code>, для Python — не ставить <code>requirements-dev.txt</code>.</li>
</ol>

lede:"Где живут данные контейнера, чем именованный том отличается от bind mount и как не потерять базу при пересоздании контейнера.",
theory:`
<p>Записываемый слой контейнера умирает вместе с контейнером. Любые данные, которые должны пережить <code>docker rm</code>, обязаны лежать <em>вне</em> контейнера. Docker предлагает три механизма.</p>

<figure class="fig">
<svg viewBox="0 0 620 214" role="img" aria-label="Три способа монтирования данных в контейнер">
 <g font-family="var(--font-mono)" font-size="9.5">
  <rect x="196" y="18" width="228" height="76" rx="3" fill="var(--surface-3)" stroke="var(--accent)"/>
  <text x="310" y="38" text-anchor="middle" font-weight="700" fill="var(--accent)">КОНТЕЙНЕР</text>

  <text x="310" y="59" text-anchor="middle" fill="var(--ink-3)">rw-слой — исчезнет при docker rm</text>
  <text x="310" y="82" text-anchor="middle" fill="var(--ink-2)">/var/lib/postgresql/data · /site · /tmp</text>

  <g stroke="var(--accent-line)" fill="none" stroke-width="1.1">
   <path d="M240 94v34"/><path d="M310 94v34"/><path d="M380 94v34"/>
  </g>
  <g fill="var(--accent-line)"><path d="M240 130l-4-7h8z"/><path d="M310 130l-4-7h8z"/><path d="M380 130l-4-7h8z"/></g>

  <rect x="10" y="130" width="190" height="66" rx="3" fill="var(--accent-soft)" stroke="var(--accent-line)"/>
  <text x="20" y="148" font-weight="700" fill="var(--ink)">volume — именованный том</text>
  <text x="20" y="163" fill="var(--ink-2)">-v pgdata:/var/lib/.../data</text>
  <text x="20" y="177" fill="var(--ink-3)">хранится в /var/lib/docker/volumes</text>
  <text x="20" y="190" fill="var(--ink-3)">для БД, очередей, состояния</text>

  <rect x="212" y="130" width="196" height="66" rx="3" fill="var(--surface-3)" stroke="var(--line)"/>
  <text x="222" y="148" font-weight="700" fill="var(--ink)">bind — каталог хоста</text>
  <text x="222" y="163" fill="var(--ink-2)">-v $(pwd)/site:/site</text>
  <text x="222" y="177" fill="var(--ink-3)">путь задаёте вы · права хоста</text>
  <text x="222" y="190" fill="var(--ink-3)">для исходников в разработке</text>

  <rect x="420" y="130" width="190" height="66" rx="3" fill="var(--surface-3)" stroke="var(--line)" stroke-dasharray="3 3"/>
  <text x="430" y="148" font-weight="700" fill="var(--ink)">tmpfs — только в памяти</text>
  <text x="430" y="163" fill="var(--ink-2)">--tmpfs /tmp</text>
  <text x="430" y="177" fill="var(--ink-3)">на диск не попадает</text>
  <text x="430" y="190" fill="var(--ink-3)">для секретов и временных файлов</text>
 </g>

<figcaption>Именованный том, привязка каталога хоста и файловая система в памяти. Выбор зависит от того, кто владеет данными — Docker, вы или никто.</figcaption>
</figure>

<h2>Именованный том (volume)</h2>
<p>Хранилищем управляет Docker: каталог внутри <code>/var/lib/docker/volumes/&lt;имя&gt;/_data</code>. Вы работаете с ним по имени и не думаете о путях на хосте.</p>
<pre><code>docker volume create pgdata
docker run -d --name db \\
  -e POSTGRES_PASSWORD=secret \\
  -v pgdata:/var/lib/postgresql/data \\
  postgres:16-alpine

<span class="c"># контейнер можно снести и пересоздать — данные останутся в томе</span>
docker rm -f db
docker run -d --name db -e POSTGRES_PASSWORD=secret -v pgdata:/var/lib/postgresql/data postgres:16-alpine</code></pre>
<p>Это способ по умолчанию для всего, что имеет состояние: баз данных, очередей, загруженных пользователями файлов.</p>

<h2>Bind mount</h2>
<p>Каталог хоста подставляется в контейнер напрямую. Изменения видны мгновенно в обе стороны — отсюда главный сценарий: разработка с горячей перезагрузкой.</p>
<pre><code>docker run -d --name web -p 8080:80 \\
  -v <span class="s">"$(pwd)/site"</span>:/usr/share/nginx/html:ro \\
  nginx:alpine</code></pre>
<div class="callout warn"><b>Два подводных камня bind mount</b><ul><li><b>Затенение.</b> Монтирование в непустой каталог <em>скрывает</em> его содержимое образа. Смонтировали пустой каталог в <code>/app</code> — приложение исчезло.</li><li><b>Права.</b> UID внутри контейнера и на хосте не совпадают, отсюда «permission denied» на смонтированных файлах. Лечится флагом <code>--user</code> или подгонкой прав.</li></ul></div>

<h2>tmpfs</h2>
<p><code>--tmpfs /tmp</code> монтирует файловую систему в оперативной памяти. Ничего не записывается на диск, всё исчезает при остановке. Подходит для временных файлов и для смонтированных секретов.</p>

<h2>Флаги и опции</h2>
<div class="tbl-wrap"><table class="t">
<tr><th>Запись</th><th>Смысл</th></tr>
<tr><td><code>-v имя:/путь</code></td><td>Именованный том</td></tr>
<tr><td><code>-v /абс/путь:/путь</code></td><td>Bind mount (источник начинается со <code>/</code> или <code>.</code>)</td></tr>
<tr><td><code>-v /путь</code></td><td>Анонимный том — Docker создаст том со случайным именем</td></tr>
<tr><td><code>:ro</code> в конце</td><td>Только чтение — хороший тон для конфигов и статики</td></tr>
<tr><td><code>--mount type=bind,source=...,target=...</code></td><td>Многословный, но явный синтаксис; ошибается в путях реже</td></tr>
</table></div>
<div class="callout trap"><b>Анонимные тома копятся незаметно</b><p>Если в Dockerfile образа есть <code>VOLUME /data</code>, то каждый запуск <em>без</em> <code>-v</code> создаёт новый анонимный том. Через месяц <code>docker volume ls</code> покажет сотню томов с шестнадцатеричными именами и десятки гигабайт. Лечится флагом <code>--rm</code> (удаляет анонимные тома вместе с контейнером) и периодическим <code>docker volume prune</code>.</p></div>

<h2>Резервная копия тома</h2>
<pre><code><span class="c"># выгрузить том в архив на хосте</span>
docker run --rm -v pgdata:/data -v <span class="s">"$(pwd)"</span>:/backup alpine \\
  tar czf /backup/pgdata.tar.gz -C /data .

<span class="c"># восстановить в новый том</span>
docker run --rm -v pgdata_new:/data -v <span class="s">"$(pwd)"</span>:/backup alpine \\
  tar xzf /backup/pgdata.tar.gz -C /data</code></pre>
`,

n:8, id:"network", title:"Сети", sub:"bridge, DNS, публикация портов",
lede:"Как контейнеры находят друг друга по имени, чем сеть по умолчанию хуже пользовательской и что на самом деле делает -p.",
theory:`
<p>Каждый контейнер получает собственный сетевой namespace: свой сетевой интерфейс, свою таблицу маршрутов, свои порты. Как этот namespace подключён к внешнему миру, определяет <b>сетевой драйвер</b>.</p>

<h2>Драйверы</h2>
<div class="tbl-wrap"><table class="t">
<tr><th>Драйвер</th><th>Что даёт</th><th>Когда нужен</th></tr>
<tr><td><code>bridge</code></td><td>Виртуальный коммутатор на хосте; контейнеры получают приватные IP и выходят наружу через NAT</td><td>По умолчанию для всего на одном хосте</td></tr>
<tr><td><code>host</code></td><td>Контейнер использует сетевой стек хоста напрямую; изоляции сети нет, <code>-p</code> не нужен и не работает</td><td>Когда критична задержка или нужен весь диапазон портов</td></tr>
<tr><td><code>none</code></td><td>Только loopback, никакого внешнего доступа</td><td>Полностью изолированные задачи</td></tr>
<tr><td><code>overlay</code></td><td>Сеть поверх нескольких хостов</td><td>Swarm, кластерные сценарии</td></tr>
</table></div>

<h2>Главное различие: bridge по умолчанию и пользовательский bridge</h2>
<p>Сеть <code>bridge</code>, которая существует сразу после установки, — это <em>legacy</em>. В ней нет встроенного DNS: контейнеры видят друг друга только по IP-адресам, которые меняются при каждом перезапуске. Как только вы создаёте <b>свою</b> сеть, включается встроенный DNS-резолвер Docker на <code>127.0.0.11</code>, и контейнеры находят друг друга по именам.</p>

<figure class="fig">
<svg viewBox="0 0 620 254" role="img" aria-label="Сравнение сети bridge по умолчанию и пользовательской сети">
 <g font-family="var(--font-mono)" font-size="9.5">
  <text x="0" y="12" font-weight="700" fill="var(--signal)">bridge по умолчанию</text>
  <rect x="0" y="20" width="286" height="106" rx="3" fill="var(--surface-3)" stroke="var(--line)" stroke-dasharray="3 3"/>
  <rect x="16" y="44" width="110" height="42" rx="2" fill="var(--surface)" stroke="var(--line)"/><text x="71" y="62" text-anchor="middle" fill="var(--ink)">web</text><text x="71" y="76" text-anchor="middle" fill="var(--ink-3)">172.17.0.2</text>
  <rect x="160" y="44" width="110" height="42" rx="2" fill="var(--surface)" stroke="var(--line)"/><text x="215" y="62" text-anchor="middle" fill="var(--ink)">db</text><text x="215" y="76" text-anchor="middle" fill="var(--ink-3)">172.17.0.3</text>
  <path d="M126 65h34" stroke="var(--err)" stroke-width="1.2"/>
  <path d="M136 58l14 14M150 58l-14 14" stroke="var(--err)" stroke-width="1.4"/>
  <text x="143" y="104" text-anchor="middle" fill="var(--err)">curl http://db — не резолвится</text>
  <text x="143" y="118" text-anchor="middle" fill="var(--ink-3)">только по IP, а он меняется</text>

  <text x="334" y="12" font-weight="700" fill="var(--accent)">пользовательская сеть app-net</text>
  <rect x="334" y="20" width="286" height="106" rx="3" fill="var(--accent-soft)" stroke="var(--accent)"/>
  <rect x="350" y="44" width="110" height="42" rx="2" fill="var(--surface)" stroke="var(--accent-line)"/><text x="405" y="62" text-anchor="middle" fill="var(--ink)">web</text><text x="405" y="76" text-anchor="middle" fill="var(--ink-3)">172.18.0.2</text>
  <rect x="494" y="44" width="110" height="42" rx="2" fill="var(--surface)" stroke="var(--accent-line)"/><text x="549" y="62" text-anchor="middle" fill="var(--ink)">db</text><text x="549" y="76" text-anchor="middle" fill="var(--ink-3)">172.18.0.3</text>
  <path d="M460 65h34" stroke="var(--ok)" stroke-width="1.2"/><path d="M494 65l-7-4v8z" fill="var(--ok)"/>
  <text x="477" y="104" text-anchor="middle" fill="var(--ok)">curl http://db — работает</text>
  <text x="477" y="118" text-anchor="middle" fill="var(--ink-3)">встроенный DNS 127.0.0.11</text>

  <path d="M0 146h620" stroke="var(--line)"/>
  <text x="0" y="168" font-weight="700" fill="var(--ink-3)">ПУБЛИКАЦИЯ ПОРТА</text>
  <rect x="0" y="178" width="150" height="34" rx="2" fill="var(--surface-3)" stroke="var(--line)"/><text x="75" y="199" text-anchor="middle" fill="var(--ink-2)">браузер :8080</text>
  <path d="M154 195h60" stroke="var(--signal)" stroke-width="1.2"/><path d="M214 195l-7-4v8z" fill="var(--signal)"/>
  <rect x="218" y="178" width="170" height="34" rx="2" fill="var(--surface-3)" stroke="var(--signal)"/><text x="303" y="199" text-anchor="middle" fill="var(--ink-2)">хост 0.0.0.0:8080 (NAT)</text>
  <path d="M392 195h60" stroke="var(--signal)" stroke-width="1.2"/><path d="M452 195l-7-4v8z" fill="var(--signal)"/>
  <rect x="456" y="178" width="164" height="34" rx="2" fill="var(--surface)" stroke="var(--accent-line)"/><text x="538" y="199" text-anchor="middle" fill="var(--ink)">контейнер :80</text>
  <text x="0" y="230" fill="var(--ink-3)">-p 8080:80 — слева порт хоста, справа порт контейнера.</text>
  <text x="0" y="244" fill="var(--ink-3)">Внутри сети контейнеры общаются напрямую — публикация им не нужна.</text>
 </g>
</svg>
<figcaption>Имя контейнера работает как DNS-имя только в пользовательской сети. Публикация портов нужна лишь для доступа снаружи хоста.</figcaption>
</figure>

<h2>Публикация портов</h2>
<pre><code>-p 8080:80          <span class="c"># хост:8080 → контейнер:80, на всех интерфейсах</span>
-p 127.0.0.1:8080:80 <span class="c"># только с локальной машины — важно для баз</span>
-p 80               <span class="c"># случайный свободный порт хоста → 80</span>
-P                  <span class="c"># опубликовать всё, что объявлено в EXPOSE</span></code></pre>
<div class="callout trap"><b>Порядок в -p путают постоянно</b><p>Слева <b>хост</b>, справа <b>контейнер</b>. <code>-p 5432:5432</code> для базы означает, что ваш postgres теперь доступен из интернета, если на хосте нет фаервола. Базам порт публиковать обычно вообще не надо — приложение достучится до них внутри сети по имени.</p></div>

<h2>Практические команды</h2>
<pre><code>docker network create app-net
docker run -d --name db  --network app-net -e POSTGRES_PASSWORD=secret postgres:16-alpine
docker run -d --name api --network app-net -p 8080:3000 myapi:1.0

<span class="c"># api обращается к базе так: postgres://db:5432 — по имени контейнера</span>

docker network inspect app-net     <span class="c"># кто подключён и с какими IP</span>
docker network connect app-net web <span class="c"># подключить существующий контейнер</span>
docker network disconnect app-net web</code></pre>

<h2>Как изолировать базу правильно</h2>
<p>Типовая схема на одном хосте: две сети. Публичная <code>frontend</code>, где живут обратный прокси и приложение, и внутренняя <code>backend</code>, где живут приложение и база. Прокси не видит базу вовсе, база не имеет опубликованных портов, а приложение подключено к обеим сетям. Для сети можно дополнительно указать <code>--internal</code> — тогда из неё вообще нет выхода наружу.</p>
<div class="callout"><b>Что запомнить про имена</b><ul><li>Имя контейнера = DNS-имя внутри пользовательской сети.</li><li><code>--network-alias</code> добавляет дополнительные имена; в compose имя сервиса и так становится алиасом.</li><li>Внутри сети обращаться нужно к <em>внутреннему</em> порту (80, 5432), а не к опубликованному.</li><li><code>localhost</code> внутри контейнера — это сам контейнер, а не хост. Для доступа к хосту есть <code>host.docker.internal</code>.</li></ul></div>
`,
