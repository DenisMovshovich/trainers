<title>Оболочка на ладони</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Rubik:ital,wght@0,400;0,500;0,600;1,400&family=Source+Code+Pro:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#EBE8EA; --surf:#FBFAFB; --surf2:#DFDAE0; --surf3:#F3F0F4;
  --line:#C6BFC9; --line2:#DED8E0;
  --ink:#171219; --ink2:#463C4A; --ink3:#75697B;
  --acc:#8A2B5E; --acc2:#681944; --acc-s:#F0DCE7; --acc-l:#C48AAA;
  --ok:#2A6E4A; --ok-s:#D8EADE; --warn:#8A5A12; --warn-s:#F2E7D2; --err:#A32A2A; --err-s:#F5DBDB;
  --term:#1A141D; --term-ink:#E4DCE6; --term-dim:#7C6E82; --term-line:#2C2331;
  --t-cmd:#E9A9C6; --t-str:#D8B48A; --t-ok:#8FCFA8; --t-err:#E89A9A;
  --r:3px;
  --fd:"Bitter",Georgia,serif;
  --fs:"Rubik",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --fm:"Source Code Pro",ui-monospace,SFMono-Regular,Menlo,monospace;
  --dock:300px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141017; --surf:#1D1721; --surf2:#26202C; --surf3:#211B26;
  --line:#372E3D; --line2:#2A2330;
  --ink:#EBE4EE; --ink2:#B7ACBC; --ink3:#877C8D;
  --acc:#E58BB4; --acc2:#F0AECB; --acc-s:#33172A; --acc-l:#6E3E58;
  --ok:#5FBF8A; --ok-s:#122B1E; --warn:#D9A34A; --warn-s:#2E2411; --err:#E57979; --err-s:#331717;
  --term:#0C080E; --term-ink:#E4DCE6; --term-dim:#6E6274; --term-line:#231B28;
}}
:root[data-theme="dark"]{
  --paper:#141017; --surf:#1D1721; --surf2:#26202C; --surf3:#211B26;
  --line:#372E3D; --line2:#2A2330;
  --ink:#EBE4EE; --ink2:#B7ACBC; --ink3:#877C8D;
  --acc:#E58BB4; --acc2:#F0AECB; --acc-s:#33172A; --acc-l:#6E3E58;
  --ok:#5FBF8A; --ok-s:#122B1E; --warn:#D9A34A; --warn-s:#2E2411; --err:#E57979; --err-s:#331717;
  --term:#0C080E; --term-ink:#E4DCE6; --term-dim:#6E6274; --term-line:#231B28;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fs);font-size:15px;line-height:1.5;
  padding-bottom:var(--dock)}
body.docked-min{--dock:44px}
::selection{background:var(--acc-s);color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;color:inherit}

.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:15px;height:52px;padding:0 18px;
  background:var(--surf);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand b{font-family:var(--fd);font-weight:700;font-size:15.5px;white-space:nowrap}
.brand i{font-family:var(--fm);font-style:normal;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);display:block;margin-top:-3px}
.gap{flex:1}
.prog{display:flex;align-items:center;gap:10px}
.prog span{font-family:var(--fm);font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.ptr{width:120px;height:6px;background:var(--surf2);border:1px solid var(--line2);position:relative;overflow:hidden}
.pfl{position:absolute;inset:0 auto 0 0;width:0;background:var(--acc);transition:width .4s ease}
.gb{background:none;border:1px solid var(--line);color:var(--ink2);font-size:12px;padding:6px 11px;
  border-radius:var(--r);cursor:pointer;white-space:nowrap}
.gb:hover{border-color:var(--acc);color:var(--acc)}

.wrap{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:calc(100vh - 52px - var(--dock))}
.rail{border-right:1px solid var(--line);background:var(--surf);position:sticky;top:52px;align-self:start;
  max-height:calc(100vh - 52px - var(--dock));overflow-y:auto;padding:15px 0 30px}
.rail-h{font-family:var(--fm);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);padding:0 17px 9px}
.mb{display:grid;grid-template-columns:23px 1fr auto;gap:9px;width:100%;text-align:left;background:none;border:0;
  cursor:pointer;padding:8px 13px 8px 17px;border-left:2px solid transparent;color:var(--ink2);transition:.13s}
.mb:hover{background:var(--surf3);color:var(--ink)}
.mb[aria-current="true"]{background:var(--acc-s);border-left-color:var(--acc);color:var(--ink)}
.mb .n{font-family:var(--fm);font-size:10.5px;color:var(--ink3);padding-top:2px;font-variant-numeric:tabular-nums}
.mb[aria-current="true"] .n{color:var(--acc)}
.mb .t{display:block;font-weight:500;font-size:13.5px;line-height:1.28}
.mb .s{display:block;font-size:11px;color:var(--ink3);line-height:1.3;margin-top:1px}
.mb .d{display:flex;gap:3px;padding-top:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--ok)}
.rail-f{padding:13px 17px 0;margin-top:11px;border-top:1px solid var(--line2)}

.stage{padding:0 0 40px;min-width:0}
.head{padding:28px 32px 0;max-width:1120px}
.kick{font-family:var(--fm);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
h1{font-family:var(--fd);font-size:clamp(25px,3vw,34px);font-weight:700;margin:0 0 8px;line-height:1.15;text-wrap:balance}
.lede{font-size:16px;color:var(--ink2);max-width:64ch;margin:0}
.tabs{display:flex;padding:0 32px;margin-top:22px;border-bottom:1px solid var(--line);max-width:1120px}
.tab{background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;padding:11px 2px;margin-right:24px;
  font-size:13.5px;font-weight:500;color:var(--ink3);display:flex;align-items:center;gap:7px;transition:.14s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.tab .bg{font-family:var(--fm);font-size:10px;font-weight:600;padding:1px 5px;background:var(--surf2);color:var(--ink3);border-radius:2px}
.tab[aria-selected="true"] .bg{background:var(--acc-s);color:var(--acc)}
.tab .bg.ok{background:var(--ok-s);color:var(--ok)}
.pane{padding:26px 32px 0;max-width:1120px}
.pane[hidden]{display:none}

.prose{font-size:16px;line-height:1.66;max-width:70ch}
.prose p{margin:0 0 1.05em}
.prose h2{font-family:var(--fd);font-size:20px;font-weight:700;margin:2em 0 .65em;padding-top:.6em;border-top:1px solid var(--line);text-wrap:balance}
.prose h2:first-child{margin-top:0;border-top:0;padding-top:0}
.prose ul,.prose ol{margin:0 0 1.05em;padding-left:1.35em}
.prose li{margin-bottom:.4em} .prose li::marker{color:var(--acc)}
.prose strong{font-weight:600}
code{font-family:var(--fm);font-size:.86em;background:var(--surf2);padding:.1em .34em;border-radius:2px;
  border:1px solid var(--line2);overflow-wrap:anywhere}
td code,th code{white-space:nowrap}
pre{font-family:var(--fm);font-size:12.5px;line-height:1.6;background:var(--term);color:var(--term-ink);
  padding:13px 15px;overflow-x:auto;margin:0 0 1.25em;border-radius:var(--r);border:1px solid var(--term-line)}
pre code{background:none;border:0;padding:0;color:inherit;white-space:pre;font-size:inherit}
.c{color:var(--term-dim)}
.note{font-size:14px;line-height:1.55;background:var(--surf);border:1px solid var(--line2);border-left:3px solid var(--acc);
  padding:13px 16px;margin:0 0 1.3em;max-width:70ch;border-radius:0 var(--r) var(--r) 0}
.note b.hd{display:block;font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:5px}
.note.warn{border-left-color:var(--warn)} .note.warn b.hd{color:var(--warn)}
.note.trap{border-left-color:var(--err)} .note.trap b.hd{color:var(--err)}
.note.ok{border-left-color:var(--ok)} .note.ok b.hd{color:var(--ok)}
.note p:last-child{margin:0} .note ul{margin:.4em 0 0;padding-left:1.2em} .note pre{margin-bottom:0}
.tw{overflow-x:auto;margin:0 0 1.5em;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:500px}
th{text-align:left;font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  padding:9px 13px;background:var(--surf3);border-bottom:1px solid var(--line)}
td{padding:9px 13px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.45}
tr:last-child td{border-bottom:0}
.fig{margin:0 0 1.6em} .fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-family:var(--fm);font-size:10.5px;color:var(--ink3);margin-top:8px;line-height:1.5}

.quiz{max-width:750px}
.qc{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:12px}
.qn{font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;display:flex;justify-content:space-between}
.qt{font-size:15.5px;font-weight:500;line-height:1.45;margin:0 0 13px}
.qt code{font-weight:400}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--surf3);border:1px solid var(--line2);
  border-radius:var(--r);padding:10px 13px;cursor:pointer;font-size:14px;line-height:1.45;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--acc-l);background:var(--surf)}
.opt:disabled{cursor:default}
.opt .mk{font-family:var(--fm);font-size:10.5px;color:var(--ink3);border:1px solid var(--line);width:19px;height:19px;
  display:grid;place-items:center;flex:0 0 auto;margin-top:1px;border-radius:2px}
.opt.right{border-color:var(--ok);background:var(--ok-s)} .opt.right .mk{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--err);background:var(--err-s)} .opt.wrong .mk{border-color:var(--err);color:var(--err)}
.why{margin-top:12px;font-size:13.5px;line-height:1.55;color:var(--ink2);border-left:2px solid var(--line);padding-left:12px}
.why b{color:var(--ink)} .why.g{border-left-color:var(--ok)} .why.b{border-left-color:var(--err)}
.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--line);background:var(--surf);
  border-radius:var(--r);padding:15px 18px;margin-bottom:18px}
.score .big{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--fd)}
.score p{margin:0;font-size:13px;color:var(--ink2)}

.picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;font-size:12.5px;
  font-weight:500;cursor:pointer;color:var(--ink2);display:flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--acc-l);color:var(--ink)}
.chip[aria-current="true"]{background:var(--acc-s);border-color:var(--acc);color:var(--ink)}
.chip .tk{width:13px;height:13px;flex:0 0 auto}
.chip .tk circle{fill:none;stroke:var(--line);stroke-width:1.6}
.chip.done .tk circle{fill:var(--ok);stroke:var(--ok)}
.chip.done .tk path{stroke:var(--surf);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tasklay{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(270px,.65fr);gap:18px;align-items:start}
.tasklay>*{min-width:0}
.brief{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.brief h3{font-family:var(--fd);margin:0 0 9px;font-size:17px;font-weight:700}
.brief p{margin:0 0 .8em;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.brief ul,.brief ol{margin:0 0 .8em;padding-left:1.25em;font-size:14.5px;line-height:1.55;color:var(--ink2)}
.brief li{margin-bottom:.3em} .brief li::marker{color:var(--acc)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line2)}
.mini{background:var(--surf3);border:1px solid var(--line);color:var(--ink2);border-radius:var(--r);padding:6px 11px;font-size:12px;cursor:pointer}
.mini:hover{border-color:var(--acc);color:var(--acc)}
.hintbox{font-size:13.5px;line-height:1.55;color:var(--ink2);background:var(--surf3);border:1px dashed var(--line);
  border-radius:var(--r);padding:12px 14px;margin-top:12px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line2);
  font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.card-h .ct{margin-left:auto;font-variant-numeric:tabular-nums}
.card-b{padding:13px 14px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.checks li{display:grid;grid-template-columns:17px 1fr;gap:10px;font-size:13px;line-height:1.42;color:var(--ink2)}
.checks li.on{color:var(--ink)}
.checks .bx{width:15px;height:15px;border:1.5px solid var(--line);border-radius:2px;margin-top:1px;display:grid;place-items:center}
.checks li.on .bx{background:var(--ok);border-color:var(--ok)}
.checks .bx svg{opacity:0} .checks li.on .bx svg{opacity:1}
.done{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--ok-s);border-top:1px solid var(--ok);
  color:var(--ok);font-size:13px;font-weight:500}
.done[hidden]{display:none}

.navf{display:flex;justify-content:space-between;gap:14px;padding:24px 32px 0;max-width:1120px;margin-top:30px;border-top:1px solid var(--line)}
.navf button{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:10px 15px;cursor:pointer;
  font-size:13.5px;font-weight:500;text-align:left}
.navf button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.navf button:disabled{opacity:.35;cursor:default}
.navf .sub{display:block;font-size:11px;font-weight:400;color:var(--ink3);font-family:var(--fm)}

/* ---------- закреплённый терминал ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;height:var(--dock);z-index:70;background:var(--term);
  border-top:1px solid var(--line);display:grid;grid-template-rows:36px minmax(0,1fr);transition:height .18s ease}
.dock-h{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--term-line)}
.dock-h .t{font-family:var(--fm);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--term-dim)}
.dock-h .lab{font-family:var(--fm);font-size:10.5px;color:var(--t-cmd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-h .sp{flex:1}
.dock-h button{background:none;border:1px solid var(--term-line);color:var(--term-dim);font-size:11px;
  padding:3px 9px;border-radius:var(--r);cursor:pointer;font-family:var(--fm)}
.dock-h button:hover{border-color:var(--t-cmd);color:var(--t-cmd)}
.dock-b{display:grid;grid-template-columns:minmax(0,1fr) 210px;min-height:0}
body.docked-min .dock-b{display:none}
.termcol{display:flex;flex-direction:column;min-width:0;min-height:0}
.tape{flex:1;overflow:auto;padding:10px 14px;font-family:var(--fm);font-size:12.5px;line-height:1.55;
  color:var(--term-ink);white-space:pre-wrap;word-break:break-word;min-height:0}
.tape .cmd{color:var(--t-cmd)} .tape .cmd .p{color:var(--term-dim)}
.tape .err{color:var(--t-err)} .tape .dim{color:var(--term-dim)}
.inrow{display:flex;align-items:flex-start;gap:8px;border-top:1px solid var(--term-line);padding:8px 14px}
.inrow .p{font-family:var(--fm);font-size:12.5px;color:var(--t-cmd);flex:0 0 auto;padding-top:2px}
.inrow textarea{flex:1;background:none;border:0;outline:none;color:var(--term-ink);font-family:var(--fm);font-size:12.5px;
  padding:0;min-width:0;resize:none;height:20px;max-height:110px;line-height:1.55;overflow-y:auto}
.inrow textarea::placeholder{color:var(--term-dim)}
.fsp{border-left:1px solid var(--term-line);overflow:auto;padding:9px 11px;font-family:var(--fm);font-size:11px;
  color:var(--term-dim);line-height:1.6;min-height:0}
.fsp .h{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--term-dim);margin-bottom:5px}
.fsp .d{color:var(--t-cmd)} .fsp .f{color:var(--term-ink)} .fsp .x{color:var(--t-ok)}

@media (max-width:1080px){ .tasklay{grid-template-columns:minmax(0,1fr)} }
@media (max-width:880px){
  :root{--dock:250px}
  .wrap{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:9px 11px;gap:7px}
  .rail-h,.rail-f{display:none}
  .mb{grid-template-columns:auto;width:auto;flex:0 0 auto;border-left:0;background:var(--surf3);border-radius:var(--r);padding:7px 11px}
  .mb .s,.mb .d{display:none} .mb .t{white-space:nowrap;font-size:12.5px}
  .head,.tabs,.pane,.navf{padding-left:15px;padding-right:15px}
  .top{gap:11px;padding:0 12px} .brand i{display:none} .ptr{display:none}
  .dock-b{grid-template-columns:minmax(0,1fr)} .fsp{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header class="top">
  <span class="brand">
    <svg width="23" height="23" viewBox="0 0 23 23" aria-hidden="true">
      <rect x="1.5" y="3.5" width="20" height="16" rx="2" fill="none" stroke="var(--acc)" stroke-width="1.4"/>
      <path d="M5.5 9l3 2.5-3 2.5M10.5 14.5h6" stroke="var(--acc-l)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span><b>Оболочка на ладони</b><i>тренажёр по bash</i></span>
  </span>
  <div class="gap"></div>
  <div class="prog">
    <span id="pl">0 / 0</span>
    <div class="ptr" role="progressbar" aria-label="Прогресс" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pb"><div class="pfl" id="pf"></div></div>
  </div>
  <button class="gb" id="reset">Сброс</button>
</header>

<div class="wrap">
  <nav class="rail" id="rail" aria-label="Модули">
    <div class="rail-h">Программа</div>
    <div id="modList"></div>
    <div class="rail-f"><button class="gb" id="cheat" style="width:100%">Шпаргалка</button></div>
  </nav>
  <main class="stage">
    <div class="head">
      <div class="kick" id="kick">—</div>
      <h1 id="mtitle">—</h1>
      <p class="lede" id="mlede">—</p>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-th" aria-selected="true">Теория</button>
      <button class="tab" role="tab" id="t-qz" aria-selected="false">Тест <span class="bg" id="bqz">0/0</span></button>
      <button class="tab" role="tab" id="t-lb" aria-selected="false">Практика <span class="bg" id="blb">0/0</span></button>
    </div>
    <section class="pane" id="p-th"><article class="prose" id="theory"></article></section>
    <section class="pane" id="p-qz" hidden><div class="quiz" id="quiz"></div></section>
    <section class="pane" id="p-lb" hidden>
      <div class="picker" id="picker"></div>
      <div class="tasklay">
        <div class="brief" id="brief"></div>
        <aside>
          <div class="card">
            <div class="card-h">Задание <span class="ct" id="cct"></span></div>
            <div class="card-b"><ul class="checks" id="clist"></ul></div>
            <div class="done" id="cdone" hidden>
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Задание выполнено
            </div>
          </div>
        </aside>
      </div>

<script>
"use strict";
/* ============================================================
   Виртуальная файловая система
   ============================================================ */
const HOME = "/home/user";

function newFS(){
  const fs = {};
  const D = p => fs[p] = {t:"d", m:"755"};
  const F = (p,c,m) => fs[p] = {t:"f", m:m||"644", c:c};
  ["/","/bin","/etc","/tmp","/var","/var/log","/home",HOME,
   HOME+"/docs",HOME+"/logs"].forEach(D);
  F("/etc/hostname","workstation\n");
  F("/etc/passwd","root:x:0:0:root:/root:/bin/bash\nuser:x:1000:1000:User:/home/user:/bin/bash\n");
  F(HOME+"/notes.txt","молоко\nхлеб\nсыр\nмолоко\n");

    "2026-08-02 INFO  повтор\n2026-08-03 ERROR таймаут базы\n2026-08-03 INFO  завершено\n");
  F(HOME+"/logs/access.log",
    "10.0.0.1 GET /users 200\n10.0.0.2 GET /posts 404\n10.0.0.1 POST /users 201\n"+
    "10.0.0.3 GET /users 500\n10.0.0.2 GET /users 200\n10.0.0.1 GET /posts 200\n");
  F(HOME+"/data.csv","имя,отдел,оклад\nАда,разработка,120\nГрейс,разработка,135\nАлан,аналитика,110\nБарбара,разработка,140\n");
  return fs;
}

function newShell(){
  const fs = newFS();
  return {
    fs, cwd: HOME, prevDir: HOME,
    env: {HOME:HOME, USER:"user", SHELL:"/bin/bash", PATH:"/usr/local/bin:/usr/bin:/bin", PWD:HOME, HOSTNAME:"workstation", LANG:"ru_RU.UTF-8"},
    vars: {}, funcs: {}, status: 0, opts:{e:false,u:false,x:false,pipefail:false},
    args: [], name:"bash", log: [], exited:false, depth:0, steps:0
  };
}

/* ---------------- пути ---------------- */
function normPath(p, cwd){
  if(!p) return cwd;
  if(p[0] !== "/") p = (cwd === "/" ? "" : cwd) + "/" + p;
  const out = [];
  p.split("/").forEach(s=>{
    if(!s || s === ".") return;
    if(s === ".."){ out.pop(); return; }
    out.push(s);
  });
  return "/" + out.join("/");
}
const exists = (s,p) => Object.prototype.hasOwnProperty.call(s.fs, p);
const isDir  = (s,p) => exists(s,p) && s.fs[p].t === "d";
const isFile = (s,p) => exists(s,p) && s.fs[p].t === "f";
function children(s, dir){
  const pre = dir === "/" ? "/" : dir + "/";
  const names = new Set();
  Object.keys(s.fs).forEach(k=>{
    if(k === dir || !k.startsWith(pre)) return;
    const rest = k.slice(pre.length);
    if(!rest) return;
    names.add(rest.split("/")[0]);
  });
  return [...names].sort((a,b)=>a.localeCompare(b,"ru"));
}
function mkdirp(s, p){
  const parts = p.split("/").filter(Boolean);
  let cur = "";
  parts.forEach(x=>{ cur += "/" + x; if(!exists(s,cur)) s.fs[cur] = {t:"d", m:"755"}; });
}
function rmPath(s, p){
  delete s.fs[p];
  const pre = p + "/";
  Object.keys(s.fs).forEach(k=>{ if(k.startsWith(pre)) delete s.fs[k]; });
}
function copyPath(s, from, to){
  if(isFile(s,from)){ s.fs[to] = {t:"f", m:s.fs[from].m, c:s.fs[from].c}; return; }
  s.fs[to] = {t:"d", m:s.fs[from].m};
  const pre = from + "/";
  Object.keys(s.fs).filter(k=>k.startsWith(pre)).forEach(k=>{
    s.fs[to + k.slice(from.length)] = JSON.parse(JSON.stringify(s.fs[k]));
  });
}
function movePath(s, from, to){ copyPath(s, from, to); rmPath(s, from); }
const readFile = (s,p) => isFile(s,p) ? s.fs[p].c : null;
function writeFile(s, p, c){
  const dir = p.slice(0, p.lastIndexOf("/")) || "/";
  if(!isDir(s,dir)) return false;
  if(isDir(s,p)) return false;
  s.fs[p] = {t:"f", m: exists(s,p) ? s.fs[p].m : "644", c: c};
  return true;
}
const lines = t => { if(t==null||t==="") return []; const a=t.split("\n"); if(a[a.length-1]==="") a.pop(); return a; };
const unlines = a => a.length ? a.join("\n") + "\n" : "";
/* ============================================================
   Лексер: слово = строка + маска кавычек той же длины
   n — вне кавычек, d — в двойных, s — в одинарных или после \
   ============================================================ */
class ShErr extends Error {}

const OPS3 = ["2>>","<<<"];
const OPS2 = ["&&","||",">>","2>","&>","<<",";;"];
const OPS1 = [";","|","(",")","<",">","\n"];

function balanced(src, i, open, close){
  let d = 0;
  for(let j = i; j < src.length; j++){
    const c = src[j];
    if(c === "\\"){ j++; continue; }
    if(c === "'" ){ const e = src.indexOf("'", j+1); if(e < 0) throw new ShErr("незакрытая одинарная кавычка"); j = e; continue; }
    if(c === '"' ){ let k = j+1; while(k < src.length && src[k] !== '"'){ if(src[k]==="\\") k++; k++; } j = k; continue; }
    if(src.startsWith(open, j)){ d++; j += open.length - 1; continue; }
    if(src.startsWith(close, j)){ d--; if(d === 0) return j + close.length; j += close.length - 1; continue; }
  }
  throw new ShErr("не закрыто: " + open);
}

function tokenize(src){
  const toks = [];
  let i = 0, s = "", q = "", started = false;
  let hadQ = false;
  const flush = ()=>{ if(started){ toks.push({t:"w", s, q, qq: hadQ}); s = ""; q = ""; started = false; hadQ = false; } };
  const add = (txt, mark)=>{ started = true; s += txt; q += mark.repeat(txt.length); };

  while(i < src.length){
    const c = src[i];

    if(c === "#" && !started && (i === 0 || /\s/.test(src[i-1]))){
      while(i < src.length && src[i] !== "\n") i++;
      continue;
    }
    if(c === "\\"){
      if(src[i+1] === "\n"){ i += 2; continue; }
      add(src[i+1] === undefined ? "\\" : src[i+1], "s"); i += 2; continue;
    }
    if(c === "'"){
      const e = src.indexOf("'", i+1);
      if(e < 0) throw new ShErr("незакрытая одинарная кавычка");
      add(src.slice(i+1, e), "s"); started = true; hadQ = true; i = e + 1; continue;
    }
    if(c === '"'){
      let j = i + 1;
      started = true; hadQ = true;
      while(j < src.length && src[j] !== '"'){
        if(src[j] === "\\" && '"\\$`'.includes(src[j+1])){ add(src[j+1], "s"); j += 2; continue; }
        if(src[j] === "$" && src[j+1] === "("){ const e = balanced(src, j+1, "(", ")"); add(src.slice(j, e), "d"); j = e; continue; }
        add(src[j], "d"); j++;
      }
      if(j >= src.length) throw new ShErr("незакрытая двойная кавычка");
      i = j + 1; continue;
    }
    if(c === "$" && src[i+1] === "("){
      if(src[i+2] === "("){ const e = balanced(src, i+2, "(", ")"); add(src.slice(i, e+1), "n"); i = e + 1; continue; }
      const e = balanced(src, i+1, "(", ")"); add(src.slice(i, e), "n"); i = e; continue;
    }
    if(c === "`"){
      const e = src.indexOf("`", i+1);
      if(e < 0) throw new ShErr("незакрытая обратная кавычка");
      add("$(" + src.slice(i+1, e) + ")", "n"); i = e + 1; continue;
    }
    if(c === "$" && src[i+1] === "{"){
      const e = balanced(src, i+1, "{", "}"); add(src.slice(i, e), "n"); i = e; continue;
    }
    if(c === " " || c === "\t"){ flush(); i++; continue; }

    if(c === "2" && src.startsWith("2>&1", i)){ flush(); toks.push({t:"o", v:"2>&1"}); i += 4; continue; }
    if(src.startsWith(">&2", i)){ flush(); toks.push({t:"o", v:">&2"}); i += 3; continue; }
    const three = OPS3.find(o=>src.startsWith(o, i));
    if(three){ flush(); toks.push({t:"o", v:three}); i += three.length; continue; }
    const two = OPS2.find(o=>src.startsWith(o, i));
    if(two){ flush(); toks.push({t:"o", v:two}); i += two.length; continue; }
    if(OPS1.includes(c)){
      flush(); toks.push({t:"o", v:c}); i++; continue;
    }
    add(c, "n"); i++;
  }
  flush();
  return toks;
}

/* ============================================================
   Парсер
   ============================================================ */
const RESERVED = ["if","then","elif","else","fi","for","while","until","do","done","case","esac","in","function","{","}","!"];

function parse(src){
  const toks = tokenize(src);
  let p = 0;
  const peek = () => toks[p];
  const isOp = v => toks[p] && toks[p].t === "o" && toks[p].v === v;
  const isWord = v => toks[p] && toks[p].t === "w" && toks[p].q.indexOf("s") < 0 && toks[p].q.indexOf("d") < 0 && toks[p].s === v;
  const eatSep = () => { let n = 0; while(isOp(";") || isOp("\n")){ p++; n++; } return n; };
  const expectWord = v => { if(!isWord(v)) throw new ShErr("ожидалось «" + v + "»"); p++; };

  function parseList(stop){
    const items = [];
    eatSep();
    while(p < toks.length){
      if(stop && stop.some(w=>isWord(w))) break;
      if(isOp(")") || isOp(";;")) break;
      const a = parseAndOr();
      if(!a) break;
      items.push(a);
      if(!eatSep()) break;
    }
    return {k:"list", items};
  }
  function parseAndOr(){
    let left = parsePipeline();
    if(!left) return null;
    while(isOp("&&") || isOp("||")){
      const op = toks[p].v; p++;
      while(isOp("\n")) p++;
      const right = parsePipeline();
      if(!right) throw new ShErr("нет команды после " + op);
      left = {k:"andor", op, left, right};
    }
    return left;
  }
  function parsePipeline(){
    let neg = false;
    if(isWord("!")){ neg = true; p++; }
    const cmds = [parseCommand()];
    if(!cmds[0]) return null;
    while(isOp("|")){
      p++;
      while(isOp("\n")) p++;
      const c = parseCommand();
      if(!c) throw new ShErr("нет команды после |");
      cmds.push(c);
    }
    return cmds.length === 1 && !neg ? cmds[0] : {k:"pipe", cmds, neg};
  }
  function parseRedirs(node){
    for(;;){
      const t = peek();
      if(!t || t.t !== "o") break;
      const v = t.v;
      if(v === "2>&1"){ node.redirs.push({op:"2>&1"}); p++; continue; }
      if(v === ">&2"){ node.redirs.push({op:">&2"}); p++; continue; }
      if([">",">>","<","2>","2>>","&>","<<","<<<"].includes(v)){
        p++;
        const w = peek();
        if(!w || w.t !== "w") throw new ShErr("нет цели перенаправления после " + v);
        p++;
        node.redirs.push({op:v, target:w});
        continue;
      }
      break;
    }
  }
  function parseCommand(){
    while(isOp("\n")) p++;
    const t = peek();
    if(!t) return null;

    if(t.t === "w" && t.q.indexOf("s") < 0){
      const w = t.s;
      if(w === "if") return parseIf();
      if(w === "for") return parseFor();
      if(w === "while" || w === "until") return parseWhile(w);
      if(w === "case") return parseCase();
      if(w === "function"){ p++; return parseFuncBody(toks[p++].s); }
      if(w === "{"){ p++; const b = parseList(["}"]); expectWord("}"); const n = {k:"group", body:b, redirs:[]}; parseRedirs(n); return n; }
      if(RESERVED.includes(w) && w !== "!") return null;
      if(toks[p+1] && toks[p+1].t === "o" && toks[p+1].v === "(" && toks[p+2] && toks[p+2].t === "o" && toks[p+2].v === ")"){
        p += 3; return parseFuncBody(w);
      }
    }
    if(t.t === "o" && t.v === "("){
      p++; const b = parseList(); if(!isOp(")")) throw new ShErr("нет закрывающей скобки"); p++;
      const n = {k:"subshell", body:b, redirs:[]}; parseRedirs(n); return n;
    }
    if(t.t !== "w") return null;

    const node = {k:"cmd", words:[], assigns:[], redirs:[]};
    let leading = true;
    for(;;){
      const c = peek();
      if(!c) break;
      if(c.t === "o"){
        if([">",">>","<","2>","2>>","&>","2>&1",">&2","<<","<<<"].includes(c.v)){ parseRedirs(node); continue; }
        break;
      }
      const m = c.q[0] !== "s" && /^[A-Za-z_][A-Za-z0-9_]*=/.test(c.s);
      if(leading && m){ node.assigns.push(c); p++; continue; }
      leading = false;
      node.words.push(c); p++;
    }
    if(!node.words.length && !node.assigns.length && !node.redirs.length) return null;
    return node;
  }
  function parseFuncBody(name){
    while(isOp("\n")) p++;
    if(!isWord("{")) throw new ShErr("тело функции должно начинаться с {");
    p++;
    const body = parseList(["}"]);
    expectWord("}");
    return {k:"func", name, body};
  }
  function parseIf(){
    p++;
    const cond = parseList(["then"]);
    expectWord("then");
    const then = parseList(["elif","else","fi"]);
    const node = {k:"if", cond, then, elifs:[], else:null, redirs:[]};
    while(isWord("elif")){
      p++;
      const c = parseList(["then"]);
      expectWord("then");
      const b = parseList(["elif","else","fi"]);
      node.elifs.push({cond:c, body:b});
    }
    if(isWord("else")){ p++; node.else = parseList(["fi"]); }
    expectWord("fi");
    parseRedirs(node);
    return node;
  }
  function parseFor(){
    p++;
    const nameTok = peek();
    if(!nameTok || nameTok.t !== "w") throw new ShErr("после for нужно имя переменной");
    const name = nameTok.s; p++;
    let items = null;
    if(isWord("in")){
      p++; items = [];
      while(peek() && peek().t === "w" && !isWord("do")){ items.push(toks[p]); p++; }
    }
    eatSep();
    expectWord("do");
    const body = parseList(["done"]);
    expectWord("done");
    const node = {k:"for", name, items, body, redirs:[]};
    parseRedirs(node);
    return node;
  }
  function parseWhile(kind){
    p++;
    const cond = parseList(["do"]);
    expectWord("do");
    const body = parseList(["done"]);
    expectWord("done");
    const node = {k:"while", until: kind === "until", cond, body, redirs:[]};
    parseRedirs(node);
    return node;
  }
  function parseCase(){
    p++;
    const subj = peek(); if(!subj || subj.t !== "w") throw new ShErr("после case нужно слово");
    p++;
    eatSep(); expectWord("in"); eatSep();
    const clauses = [];
    while(!isWord("esac")){
      if(p >= toks.length) throw new ShErr("не закрыт case");
      const pats = [];
      if(isOp("(")) p++;
      for(;;){
        const w = peek();
        if(!w || w.t !== "w") throw new ShErr("ожидался образец в case");
        pats.push(w); p++;
        if(peek() && peek().t === "o" && peek().v === "|"){ p++; continue; }
        break;
      }
      if(!isOp(")")) throw new ShErr("ожидалась ) после образца");
      p++;
      const body = parseList(["esac"]);
      if(isOp(";;")) p++;
      eatSep();
      clauses.push({pats, body});
    }
    expectWord("esac");
    const node = {k:"case", subj, clauses, redirs:[]};
    parseRedirs(node);
    return node;
  }

  const prog = parseList();
  if(p < toks.length){
    const t = toks[p];
    throw new ShErr("не разобрано у «" + (t.t === "w" ? t.s : t.v) + "»");
  }
  return prog;
}
/* ============================================================
   Раскрытия и выполнение
   ============================================================ */
const MAXSTEPS = 20000;
function tick(sh){ if(++sh.steps > MAXSTEPS) throw new ShErr("слишком долгое выполнение — похоже на бесконечный цикл"); }

/* ---------- heredoc: вырезаем тела до разбора ---------- */
function extractHeredocs(src){
  const ls = src.split("\n");
  const out = [];
  for(let i = 0; i < ls.length; i++){
    let line = ls[i];
    const m = line.match(/(?<!<)<<(?!<)-?\s*(['"]?)([A-Za-z_][A-Za-z0-9_]*)\1/);
    if(!m){ out.push(line); continue; }
    const quoted = !!m[1], delim = m[2];
    const body = [];
    let j = i + 1;
    while(j < ls.length && ls[j].trim() !== delim){ body.push(ls[j]); j++; }
    i = j;
    const text = body.length ? body.join("\n") + "\n" : "";
    const lit = quoted
      ? "'" + text.replace(/'/g, "'\\''") + "'"
      : '"' + text.replace(/([\\"])/g, "\\$1") + '"';
    out.push(line.replace(m[0], "<<< " + lit));
  }
  return out.join("\n");
}

/* ---------- раскрытие фигурных скобок ---------- */
function braceExpand(s, q){
  const i = s.indexOf("{");
  if(i < 0 || q[i] !== "n") return [{s, q}];
  let d = 0, j = i, close = -1, commas = [];
  for(; j < s.length; j++){
    if(q[j] !== "n") continue;
    if(s[j] === "{") d++;
    else if(s[j] === "}"){ d--; if(d === 0){ close = j; break; } }
    else if(s[j] === "," && d === 1) commas.push(j);
  }
  if(close < 0) return [{s, q}];
  const inner = s.slice(i+1, close), innerQ = q.slice(i+1, close);
  const pre = {s: s.slice(0,i), q: q.slice(0,i)}, post = {s: s.slice(close+1), q: q.slice(close+1)};
  let parts = [];
  const range = inner.match(/^(-?\d+)\.\.(-?\d+)$/);
  if(range && !commas.length){
    let a = +range[1], b = +range[2];
    const step = a <= b ? 1 : -1;
    for(let v = a; step > 0 ? v <= b : v >= b; v += step) parts.push({s:String(v), q:"n".repeat(String(v).length)});
  } else if(commas.length){
    let prev = 0;
    const cuts = commas.map(c=>c-(i+1)).concat([inner.length]);
    cuts.forEach(c=>{ parts.push({s: inner.slice(prev,c), q: innerQ.slice(prev,c)}); prev = c + 1; });
  } else return [{s, q}];
  const out = [];
  parts.forEach(pt=>{
    braceExpand(post.s, post.q).forEach(ps=>{
      out.push({s: pre.s + pt.s + ps.s, q: pre.q + pt.q + ps.q});
    });
  });
  return out;
}

/* ---------- арифметика ---------- */
function arith(sh, expr){
  const val = n => { const v = getVar(sh, n); const x = parseInt(v, 10); return Number.isNaN(x) ? 0 : x; };
  let s = expr.replace(/\$([A-Za-z_]\w*)/g, (_,n)=>val(n))
              .replace(/\b([A-Za-z_]\w*)\b/g, (_,n)=>val(n));
  let i = 0;
  const skip = ()=>{ while(s[i] === " ") i++; };
  function expr0(){ let v = expr1(); skip();
    while(s.startsWith("&&",i) || s.startsWith("||",i)){ const op = s.substr(i,2); i += 2; const r = expr1();
      v = op === "&&" ? ((v && r) ? 1 : 0) : ((v || r) ? 1 : 0); skip(); } return v; }
  function expr1(){ let v = expr2(); skip();
    while(/^(==|!=|<=|>=|<|>)/.test(s.slice(i))){ const op = s.slice(i).match(/^(==|!=|<=|>=|<|>)/)[1]; i += op.length;
      const r = expr2(); v = ({"==":v===r,"!=":v!==r,"<=":v<=r,">=":v>=r,"<":v<r,">":v>r})[op] ? 1 : 0; skip(); } return v; }
  function expr2(){ let v = expr3(); skip();
    while(s[i] === "+" || s[i] === "-"){ const op = s[i++]; const r = expr3(); v = op === "+" ? v + r : v - r; skip(); } return v; }
  function expr3(){ let v = expr4(); skip();
    while(s[i] === "*" || s[i] === "/" || s[i] === "%"){ const op = s[i++]; const r = expr4();
      if((op === "/" || op === "%") && r === 0) throw new ShErr("деление на ноль");
      v = op === "*" ? v*r : op === "/" ? Math.trunc(v/r) : v % r; skip(); } return v; }
  function expr4(){ skip();
    if(s[i] === "-"){ i++; return -expr4(); }
    if(s[i] === "+"){ i++; return expr4(); }
    if(s[i] === "!"){ i++; return expr4() ? 0 : 1; }
    if(s[i] === "("){ i++; const v = expr0(); skip(); if(s[i] === ")") i++; return v; }
    const m = s.slice(i).match(/^\d+/);
    if(m){ i += m[0].length; return parseInt(m[0], 10); }
    throw new ShErr("не понял арифметику: " + expr);
  }
  const r = expr0();
  return r;
}

/* ---------- переменные ---------- */
function getVar(sh, name){
  if(name === "?") return String(sh.status);
  if(name === "#") return String(sh.args.length);
  if(name === "0") return sh.name;
  if(name === "@" || name === "*") return sh.args.join(" ");
  if(name === "$") return "4242";
  if(/^\d+$/.test(name)) return sh.args[+name - 1] !== undefined ? sh.args[+name - 1] : "";
  if(Object.prototype.hasOwnProperty.call(sh.vars, name)) return sh.vars[name];
  if(Object.prototype.hasOwnProperty.call(sh.env, name)) return sh.env[name];
  return undefined;
}
function setVar(sh, name, val){
  if(Object.prototype.hasOwnProperty.call(sh.env, name)) sh.env[name] = val;
  else sh.vars[name] = val;
}
function patToRe(p, anchor){
  let r = "";
  for(let i = 0; i < p.length; i++){
    const c = p[i];
    if(c === "*") r += "[\\s\\S]*";
    else if(c === "?") r += "[\\s\\S]";
    else if(c === "["){ const e = p.indexOf("]", i+1); if(e < 0){ r += "\\["; continue; }
      let cls = p.slice(i+1, e); if(cls[0] === "!") cls = "^" + cls.slice(1); r += "[" + cls + "]"; i = e; }
    else r += c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }
  return anchor ? new RegExp("^" + r + "$") : new RegExp(r);
}

/* ---------- главное раскрытие ---------- */
function expandOne(sh, s, q, opts){
  opts = opts || {};
  let rs = "", rq = "";
  const push = (txt, mark) => { rs += txt; rq += mark.repeat(txt.length); };

  for(let i = 0; i < s.length; i++){
    const c = s[i], qc = q[i];
    if(qc === "s"){ push(c, "s"); continue; }
    if(c === "~" && qc === "n" && i === 0 && (s[1] === undefined || s[1] === "/")){ push(sh.env.HOME, "s"); continue; }
    if(c !== "$"){ push(c, qc); continue; }

    /* $((...)) */
    if(s.startsWith("$((", i)){
      const e = matchClose(s, i+1, "(", ")");
      const v = String(arith(sh, s.slice(i+3, e-2)));
      push(v, qc === "d" ? "Q" : "E"); i = e - 1; continue;
    }
    /* $(...) */
    if(s[i+1] === "("){
      const e = matchClose(s, i+1, "(", ")");
      const inner = s.slice(i+2, e-1);
      const sub = runCapture(sh, inner);
      push(sub.replace(/\n+$/, ""), qc === "d" ? "Q" : "E");
      i = e - 1; continue;
    }
    /* ${...} */
    if(s[i+1] === "{"){
      const e = matchClose(s, i+1, "{", "}");
      const body = s.slice(i+2, e-1);
      push(paramExp(sh, body), qc === "d" ? "Q" : "E");
      i = e - 1; continue;
    }
    /* $NAME или $1 или $? */
    const m = s.slice(i+1).match(/^([A-Za-z_]\w*|\d+|[?#@*$])/);
    if(!m){ push("$", qc); continue; }
    const name = m[1];
    if(name === "@"){
      push(sh.args.join("\u0000"), qc === "d" ? "Q" : "E");
      i += 1; continue;
    }
    let v = getVar(sh, name);
    if(v === undefined){
      if(sh.opts.u) throw new ShErr(name + ": переменная не задана");
      v = "";
    }
    push(v, qc === "d" ? "Q" : "E");
    i += name.length;
  }
  return {s: rs, q: rq};
}
function matchClose(s, i, open, close){
  let d = 0;
  for(let j = i; j < s.length; j++){
    if(s[j] === open) d++;
    else if(s[j] === close){ d--; if(d === 0) return j + 1; }
  }
  throw new ShErr("не закрыто: " + open);
}
function paramExp(sh, body){
  let m;
  if((m = body.match(/^#([A-Za-z_]\w*|[@*])$/))){
    if(m[1] === "@" || m[1] === "*") return String(sh.args.length);
    return String((getVar(sh, m[1]) || "").length);
  }
  if((m = body.match(/^([A-Za-z_]\w*|\d+|[?#@*])(:?[-=?+])([\s\S]*)$/))){
    const cur = getVar(sh, m[1]);
    const unset = cur === undefined || (m[2][0] === ":" && cur === "");
    const word = expandToString(sh, m[3]);
    const op = m[2].replace(":", "");
    if(op === "-") return unset ? word : cur;
    if(op === "=") { if(unset){ setVar(sh, m[1], word); return word; } return cur; }
    if(op === "+") return unset ? "" : word;
    if(op === "?") { if(unset) throw new ShErr(m[1] + ": " + (word || "переменная не задана")); return cur; }
  }
  if((m = body.match(/^([A-Za-z_]\w*)(##|#|%%|%)([\s\S]*)$/))){
    let v = getVar(sh, m[1]) || "";
    const pat = expandToString(sh, m[3]);
    const greedy = m[2].length === 2;
    if(m[2][0] === "#"){
      for(let n = greedy ? v.length : 0; greedy ? n >= 0 : n <= v.length; greedy ? n-- : n++)
        if(patToRe(pat, true).test(v.slice(0, n))) return v.slice(n);
      return v;
    } else {
      for(let n = greedy ? 0 : v.length; greedy ? n <= v.length : n >= 0; greedy ? n++ : n--)
        if(patToRe(pat, true).test(v.slice(n))) return v.slice(0, n);
      return v;
    }
  }
  if((m = body.match(/^([A-Za-z_]\w*)\/(\/?)([^\/]*)\/?([\s\S]*)$/))){
    const v = getVar(sh, m[1]) || "";
    const re = patToRe(expandToString(sh, m[3]), false);
    const rep = expandToString(sh, m[4]);
    return m[2] === "/" ? v.replace(new RegExp(re.source, "g"), rep) : v.replace(re, rep);
  }
  const v = getVar(sh, body);
  if(v === undefined && sh.opts.u) throw new ShErr(body + ": переменная не задана");
  return v === undefined ? "" : v;
}
function expandToString(sh, raw){
  const r = expandOne(sh, raw, "n".repeat(raw.length), {});
  return r.s;
}

function globExpand(sh, s, q){
  let hasGlob = false;
  for(let i = 0; i < s.length; i++) if("*?[".includes(s[i]) && (q[i] === "n" || q[i] === "E")) { hasGlob = true; break; }
  if(!hasGlob) return null;
  const abs = s[0] === "/";
  const parts = s.split("/");
  let bases = [abs ? "" : ""];
  let cur = abs ? [""] : [""];
  let results = abs ? [""] : [""];
  const startDir = abs ? "/" : sh.cwd;
  let acc = [abs ? "/" : sh.cwd];
  const segs = parts.filter((x,i)=>!(i === 0 && x === ""));
  segs.forEach(seg=>{
    const next = [];
    acc.forEach(dir=>{
      if(!isDir(sh, dir)) return;
      if(!"*?[".split("").some(ch=>seg.includes(ch))){
        const p = normPath(dir + "/" + seg, sh.cwd);
        if(exists(sh, p)) next.push(p);
        return;
      }
      const re = patToRe(seg, true);
      children(sh, dir).forEach(n=>{
        if(n.startsWith(".") && !seg.startsWith(".")) return;
        if(re.test(n)) next.push(normPath(dir + "/" + n, sh.cwd));
      });
    });
    acc = next;
  });
  if(!acc.length) return null;
  const prefix = abs ? "" : (sh.cwd === "/" ? "/" : sh.cwd + "/");
  return acc.map(p => abs ? p : p.slice(prefix.length)).sort((a,b)=>a.localeCompare(b));
}

function expandWord(sh, tok, opts){
  opts = opts || {};
  const out = [];
  braceExpand(tok.s, tok.q).forEach(b=>{
    const e = expandOne(sh, b.s, b.q, opts);
    let fields;
    if(opts.noSplit) fields = [e];
    else {
      fields = [];
      let cs = "", cq = "", any = false;
      for(let i = 0; i < e.s.length; i++){
        if(e.s[i] === "\u0000"){ fields.push({s:cs,q:cq}); cs=""; cq=""; continue; }
        const isSplit = e.q[i] === "E" && /[ \t\n]/.test(e.s[i]);
        if(isSplit){ if(cs !== ""){ fields.push({s:cs,q:cq}); cs=""; cq=""; } any = true; continue; }
        cs += e.s[i]; cq += e.q[i];
      }
      if(cs !== "") fields.push({s:cs, q:cq});
      if(!fields.length && !any && !(e.s === "" && !tok.qq)) fields = [{s:"", q:""}];
    }
    fields.forEach(f=>{
      if(!opts.noGlob){
        const g = globExpand(sh, f.s, f.q);
        if(g){ g.forEach(x=>out.push(x)); return; }
      }
      out.push(f.s);
    });
  });
  return out.filter((x,i)=> x !== "" || out.length === 1 || true);
}
/* ============================================================
   Выполнение дерева
   ============================================================ */
function mkSink(){ const a = []; return {a, write(s){ if(s) a.push(s); }, text(){ return a.join(""); }}; }
function mkIn(text){ return {text: text || "", pos: 0,
  line(){ if(this.pos >= this.text.length) return null;
    const i = this.text.indexOf("\n", this.pos);
    if(i < 0){ const r = this.text.slice(this.pos); this.pos = this.text.length; return r; }
    const r = this.text.slice(this.pos, i); this.pos = i + 1; return r; },
  rest(){ const r = this.text.slice(this.pos); this.pos = this.text.length; return r; } }; }

class ExitSignal { constructor(code){ this.code = code; } }
class ReturnSignal { constructor(code){ this.code = code; } }

function runProgram(sh, src){
  const out = mkSink(), err = mkSink();
  out.tty = true; err.tty = true;
  let code = 0;
  try{
    const ast = parse(extractHeredocs(src));
    code = runNode(sh, ast, {in: mkIn(""), out, err});
  }catch(e){
    if(e instanceof ExitSignal){ code = e.code; sh.exited = true; }
    else if(e instanceof ReturnSignal){ code = e.code; }
    else if(e instanceof ShErr){ err.write("bash: " + e.message + "\n"); code = 2; }
    else { err.write("bash: внутренняя ошибка: " + e.message + "\n"); code = 2; }
  }
  sh.status = code;
  return {out: out.text(), err: err.text(), code};
}
function runCapture(sh, src){
  const out = mkSink(), err = mkSink();
  const saved = sh.status;
  try{ runNode(sh, parse(extractHeredocs(src)), {in: mkIn(""), out, err}); }
  catch(e){ if(e instanceof ExitSignal || e instanceof ReturnSignal){} else if(e instanceof ShErr) err.write(e.message); else throw e; }
  return out.text();
}

function runNode(sh, n, io){
  tick(sh);
  if(!n) return 0;
  switch(n.k){
    case "list": {
      let c = 0;
      for(const it of n.items){
        c = runNode(sh, it, io);
        sh.status = c;
        if(sh.opts.e && c !== 0 && !it.__inCond) throw new ExitSignal(c);
      }
      return c;
    }
    case "andor": {
      const l = runNode(sh, n.left, io);
      sh.status = l;
      if(n.op === "&&") return l === 0 ? (sh.status = runNode(sh, n.right, io)) : l;
      return l !== 0 ? (sh.status = runNode(sh, n.right, io)) : l;
    }
    case "pipe": {
      let cur = io.in;
      let code = 0, codes = [];
      for(let i = 0; i < n.cmds.length; i++){
        const isLast = i === n.cmds.length - 1;
        const o = isLast ? io.out : mkSink();
        /* каждое звено выполняется в подоболочке: присваивания и cd не видны снаружи */
        const savedVars = Object.assign({}, sh.vars);
        const savedEnv = Object.assign({}, sh.env);
        const savedCwd = sh.cwd;
        code = runNode(sh, n.cmds[i], {in: cur, out: o, err: io.err});
        sh.vars = savedVars; sh.env = savedEnv; sh.cwd = savedCwd;
        codes.push(code);
        if(!isLast) cur = mkIn(o.text());
      }
      let r = codes[codes.length-1];
      if(sh.opts.pipefail){ const f = codes.filter(c=>c!==0); if(f.length) r = f[f.length-1]; }
      return n.neg ? (r === 0 ? 1 : 0) : r;
    }
    case "if": return withRedirs(sh, n, io, io2=>{
      if(runCond(sh, n.cond, io2) === 0) return runNode(sh, n.then, io2);
      for(const e of n.elifs) if(runCond(sh, e.cond, io2) === 0) return runNode(sh, e.body, io2);
      return n.else ? runNode(sh, n.else, io2) : 0;
    });
    case "while": return withRedirs(sh, n, io, io2=>{
      let c = 0, guard = 0;
      for(;;){
        tick(sh);
        if(++guard > 5000) throw new ShErr("цикл не завершается");
        const t = runCond(sh, n.cond, io2);
        const ok = n.until ? t !== 0 : t === 0;
        if(!ok) break;
        c = runNode(sh, n.body, io2);
      }
      return c;
    });
    case "for": return withRedirs(sh, n, io, io2=>{
      const items = n.items === null
        ? sh.args.slice()
        : n.items.reduce((a,w)=>a.concat(expandWord(sh, w)), []);
      let c = 0;
      for(const v of items){ tick(sh); setVar(sh, n.name, v); c = runNode(sh, n.body, io2); }
      return c;
    });
    case "case": {
      const subj = expandWord(sh, n.subj, {noSplit:true, noGlob:true})[0] || "";
      for(const cl of n.clauses){
        for(const pt of cl.pats){
          const pat = expandWord(sh, pt, {noSplit:true, noGlob:true})[0] || "";
          if(pat === "*" || patToRe(pat, true).test(subj)) return runNode(sh, cl.body, io);
        }
      }
      return 0;
    }
    case "func": sh.funcs[n.name] = n.body; return 0;
    case "group": case "subshell": return withRedirs(sh, n, io, io2 => runNode(sh, n.body, io2));
    case "cmd": return withRedirs(sh, n, io, io2 => runSimple(sh, n, io2));
  }
  return 0;
}
function runCond(sh, node, io){
  const mark = x => { if(x && x.items) x.items.forEach(i=>{ i.__inCond = true; if(i.items) mark(i); }); };
  mark(node);
  return runNode(sh, node, {in: io.in, out: io.out, err: io.err});
}

function withRedirs(sh, n, io, fn){
  if(!n.redirs || !n.redirs.length) return fn(io);
  let out = io.out, err = io.err, inp = io.in;
  const writes = [];
  for(const r of n.redirs){
    if(r.op === "2>&1"){ err = out; continue; }
    if(r.op === ">&2"){ out = err; continue; }
    const t = expandWord(sh, r.target, {noSplit:true});
    const target = t[0] !== undefined ? t[0] : "";
    if(r.op === "<"){
      const p = normPath(target, sh.cwd);
      if(!isFile(sh, p)){ io.err.write("bash: " + target + ": Нет такого файла\n"); return 1; }
      inp = mkIn(readFile(sh, p)); continue;
    }
    if(r.op === "<<<"){ inp = mkIn(target.endsWith("\n") ? target : target + "\n"); continue; }
    const sink = mkSink();
    const p = normPath(target, sh.cwd);
    if(r.op === ">" || r.op === ">>"){ out = sink; writes.push({p, sink, append: r.op === ">>"}); }
    else if(r.op === "2>" || r.op === "2>>"){ err = sink; writes.push({p, sink, append: r.op === "2>>"}); }
    else if(r.op === "&>"){ out = sink; err = sink; writes.push({p, sink, append:false}); }
  }
  const code = fn({in: inp, out, err});
  for(const w of writes){
    if(w.p === "/dev/null") continue;
    const prev = w.append && isFile(sh, w.p) ? readFile(sh, w.p) : "";
    if(!writeFile(sh, w.p, prev + w.sink.text()))
      io.err.write("bash: " + w.p + ": Не удалось записать\n");
  }
  return code;
}

function runSimple(sh, n, io){
  const assigns = n.assigns.map(a=>{
    const i = a.s.indexOf("=");
    const name = a.s.slice(0, i);
    const val = expandWord(sh, {s: a.s.slice(i+1), q: a.q.slice(i+1)}, {noSplit:true, noGlob:true})[0];
    return {name, val: val === undefined ? "" : val};
  });
  if(!n.words.length){ assigns.forEach(a=>setVar(sh, a.name, a.val)); return 0; }

  const head = n.words[0];
  const headName = expandWord(sh, head, {noSplit:true, noGlob:true})[0] || "";
  const noGlob = headName === "[[" || headName === "test" || headName === "[";
  let argv = [];
  n.words.forEach((w,idx)=>{
    if(idx === 0){ argv.push(headName); return; }
    expandWord(sh, w, {noGlob: headName === "[["}).forEach(x=>argv.push(x));
  });
  const cmd = argv[0], args = argv.slice(1);

  const restore = [];
  assigns.forEach(a=>{ restore.push([a.name, getVar(sh, a.name)]); setVar(sh, a.name, a.val); });
  const undo = ()=> restore.forEach(([k,v])=>{ if(v === undefined){ delete sh.vars[k]; } else setVar(sh, k, v); });

  try{
    if(sh.opts.x) io.err.write("+ " + argv.join(" ") + "\n");
    if(sh.funcs[cmd]){
      const savedArgs = sh.args, savedName = sh.name;
      sh.args = args; sh.name = cmd;
      let code = 0;
      try{ code = runNode(sh, sh.funcs[cmd], io); }
      catch(e){ if(e instanceof ReturnSignal) code = e.code; else throw e; }
      sh.args = savedArgs; sh.name = savedName;
      return code;
    }
    if(BUILTIN[cmd]) return BUILTIN[cmd](sh, args, io);
    if(CMD[cmd]) return CMD[cmd](sh, args, io);
    if(cmd.includes("/")){
      const p = normPath(cmd, sh.cwd);
      if(!exists(sh, p)){ io.err.write("bash: " + cmd + ": Нет такого файла или каталога\n"); return 127; }
      if(isDir(sh, p)){ io.err.write("bash: " + cmd + ": Это каталог\n"); return 126; }
      if(!"1357".includes(sh.fs[p].m[0])){
        io.err.write("bash: " + cmd + ": Отказано в доступе\n"); return 126;
      }
      if(sh.depth > 20){ io.err.write("bash: слишком глубокая вложенность вызовов\n"); return 1; }
      const savedArgs = sh.args, savedName = sh.name, savedCwd = sh.cwd;
      sh.args = args; sh.name = cmd; sh.depth++;
      const r = runProgram(sh, readFile(sh, p));
      sh.depth--; sh.args = savedArgs; sh.name = savedName; sh.cwd = savedCwd;
      io.out.write(r.out); io.err.write(r.err);
      return r.code;
    }
    io.err.write("bash: " + cmd + ": команда не найдена\n");
    return 127;
  } finally {
    if(n.words.length) undo();
  }
}
/* ============================================================
   Встроенные команды и утилиты
   ============================================================ */
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function flags(args){
  const f = {}, rest = [];
  let stop = false;
  args.forEach(a=>{
    if(!stop && a === "--"){ stop = true; return; }
    if(!stop && a.length > 1 && a[0] === "-" && !/^-\d+$/.test(a)){
      if(a[1] === "-"){ const [k,v] = a.slice(2).split("="); f[k] = v === undefined ? true : v; return; }
      a.slice(1).split("").forEach(ch=>f[ch] = true);
      return;
    }
    rest.push(a);
  });
  return {f, rest};
}
function resolveIn(sh, io, args){
  if(args.length) return args.map(a=>{
    const p = normPath(a, sh.cwd);
    if(!exists(sh,p)) return {name:a, err:"Нет такого файла или каталога"};
    if(isDir(sh,p)) return {name:a, err:"Это каталог"};
    return {name:a, text:readFile(sh,p)};
  });
  return [{name:"-", text: io.in.rest()}];
}
function eachInput(sh, io, args, fn){
  let code = 0;
  const many = args.length > 1;
  resolveIn(sh, io, args).forEach(f=>{
    if(f.err){ io.err.write(f.name + ": " + f.err + "\n"); code = 1; return; }
    fn(f.text, f.name, many);
  });
  return code;
}

const BUILTIN = {
 ":"(){ return 0; },
 "true"(){ return 0; },
 "false"(){ return 1; },
 pwd(sh, a, io){ io.out.write(sh.cwd + "\n"); return 0; },
 cd(sh, a, io){
   let t = a[0];
   if(!t) t = sh.env.HOME;
   else if(t === "-"){ t = sh.prevDir; io.out.write(t + "\n"); }
   const p = normPath(t, sh.cwd);
   if(!exists(sh,p)){ io.err.write("cd: " + a[0] + ": Нет такого файла или каталога\n"); return 1; }
   if(!isDir(sh,p)){ io.err.write("cd: " + a[0] + ": Это не каталог\n"); return 1; }
   sh.prevDir = sh.cwd; sh.cwd = p; sh.env.PWD = p; return 0;
 },
 echo(sh, a, io){
   let nl = true, esc = false, i = 0;
   while(a[i] === "-n" || a[i] === "-e" || a[i] === "-E"){ if(a[i]==="-n") nl = false; if(a[i]==="-e") esc = true; if(a[i]==="-E") esc = false; i++; }
   let s = a.slice(i).join(" ");
   if(esc) s = s.replace(/\\n/g,"\n").replace(/\\t/g,"\t").replace(/\\\\/g,"\\");
   io.out.write(s + (nl ? "\n" : ""));
   return 0;
 },
 printf(sh, a, io){
   const fmt = (a[0] || "").replace(/\\n/g,"\n").replace(/\\t/g,"\t");
   let rest = a.slice(1);
   const specs = (fmt.match(/%[-0-9.]*[sdif%]/g) || []).filter(x=>x !== "%%");
   const once = out => {
     let i = 0;
     io.out.write(fmt.replace(/%[-0-9.]*[sdif%]/g, m=>{
       if(m === "%%") return "%";
       const v = out[i++];

function testEval(sh, a){
  if(!a.length) return 1;
  if(a.length === 1) return a[0] === "" ? 1 : 0;
  if(a[0] === "!") return testEval(sh, a.slice(1)) === 0 ? 1 : 0;
  const orI = a.indexOf("-o"); if(orI > 0) return (testEval(sh,a.slice(0,orI)) === 0 || testEval(sh,a.slice(orI+1)) === 0) ? 0 : 1;
  const andI = a.indexOf("-a"); if(andI > 0) return (testEval(sh,a.slice(0,andI)) === 0 && testEval(sh,a.slice(andI+1)) === 0) ? 0 : 1;
  if(a.length === 2){
    if(!/^-(e|f|d|s|r|w|x|z|n)$/.test(a[0])) throw new ShErr("[: " + a[0] + ": ожидался унарный оператор");
    const p = normPath(a[1], sh.cwd);
    switch(a[0]){
      case "-e": return exists(sh,p) ? 0 : 1;
      case "-f": return isFile(sh,p) ? 0 : 1;
      case "-d": return isDir(sh,p) ? 0 : 1;
      case "-s": return isFile(sh,p) && readFile(sh,p).length > 0 ? 0 : 1;
      case "-r": return exists(sh,p) ? 0 : 1;
      case "-w": return exists(sh,p) && sh.fs[p].m[0] >= "6" ? 0 : 1;
      case "-x": return exists(sh,p) && "1357".includes(sh.fs[p].m[0]) ? 0 : 1;
      case "-z": return a[1] === "" ? 0 : 1;
      case "-n": return a[1] !== "" ? 0 : 1;
    }
    return 1;
  }
  if(a.length >= 3){
    const [x, op, y] = a;
    const ni = v => { const n = parseInt(v,10); return Number.isNaN(n) ? 0 : n; };
    switch(op){
      case "=": case "==": return x === y ? 0 : 1;
      case "!=": return x !== y ? 0 : 1;
      case "=~": return new RegExp(y).test(x) ? 0 : 1;
      case "-eq": return ni(x) === ni(y) ? 0 : 1;
      case "-ne": return ni(x) !== ni(y) ? 0 : 1;
      case "-lt": return ni(x) <  ni(y) ? 0 : 1;
      case "-le": return ni(x) <= ni(y) ? 0 : 1;
      case "-gt": return ni(x) >  ni(y) ? 0 : 1;
      case "-ge": return ni(x) >= ni(y) ? 0 : 1;
    }
  }
  return 1;
}

<p><b>Оболочка</b> (shell) — программа, которая читает то, что вы набрали, разбирает это по правилам языка и запускает нужные программы. Bash — самая распространённая из них. Важно с самого начала: оболочка не «понимает» команды, она <em>разбирает текст</em> и передаёт разобранное дальше.</p>

<h2>Строение команды</h2>
<pre><code>ls -l -a /home/user
│  │     │
│  │     └─ аргумент: над чем работаем
│  └─────── опции (флаги): как именно работать

<ul>
<li><b>Короткие опции</b> — одна буква после дефиса: <code>-l</code>. Их можно склеивать: <code>-la</code> это то же, что <code>-l -a</code>.</li>
<li><b>Длинные опции</b> — два дефиса и слово: <code>--all</code>. Читаются лучше, в скриптах предпочтительнее.</li>
<li><b>Аргументы</b> идут без дефиса. Обычно это файлы и каталоги.</li>
<li><b>Разделитель <code>--</code></b> означает «дальше опций нет». Спасает, когда имя файла начинается с дефиса.</li>
</ul>
<div class="note"><b class="hd">Пробел — это разделитель, а не украшение</b><p>Оболочка режет строку на слова по пробелам. Поэтому <code>rm файл с пробелами.txt</code> попытается удалить <b>три</b> файла: «файл», «с» и «пробелами.txt». Этой ловушке посвящён отдельный модуль, но помнить о ней стоит с первой минуты.</p></div>

<p>Узнать, чем является имя, помогает <code>type</code>: <code>type cd</code> скажет «встроенная», <code>type ls</code> покажет путь к программе.</p>
<div class="note warn"><b class="hd">Почему <code>cd</code> обязана быть встроенной</b><p>Внешняя программа выполняется в отдельном процессе и меняет <em>свой</em> текущий каталог. Когда она завершается, оболочка остаётся там же, где была. Чтобы сменить каталог у самой оболочки, команда должна выполняться внутри неё.</p></div>

{
n:2, id:"nav", title:"Файловая система", sub:"Пути и перемещение",
lede:"Одно дерево от корня, два способа адресовать точку в нём и три команды, которые нужны постоянно.",
theory:`
<p>В Unix нет дисков C: и D:. Есть <b>одно дерево</b>, растущее из корня <code>/</code>. Всё остальное — ветки этого дерева, включая подключённые диски и устройства.</p>

<figure class="fig">
<svg viewBox="0 0 620 200" role="img" aria-label="Дерево файловой системы">
 <g font-family="var(--fm)" font-size="10.5">
  <rect x="270" y="6" width="80" height="26" rx="3" fill="var(--acc-s)" stroke="var(--acc)"/>
  <text x="310" y="24" text-anchor="middle" fill="var(--ink)">/</text>
  <path d="M310 34v14M90 48h440M90 48v12M230 48v12M390 48v12M530 48v12" stroke="var(--line)" fill="none"/>
  ${["/bin","/etc","/home","/var"].map((n,i)=>{
    const x=[40,180,340,480][i];
    return '<rect x="'+x+'" y="60" width="100" height="26" rx="3" fill="var(--surf3)" stroke="var(--line)"/>'+
           '<text x="'+(x+50)+'" y="78" text-anchor="middle" fill="var(--ink2)">'+n+'</text>';
  }).join("")}
  <path d="M390 88v12" stroke="var(--line)"/>
  <rect x="340" y="100" width="100" height="26" rx="3" fill="var(--surf3)" stroke="var(--line)"/>
  <text x="390" y="118" text-anchor="middle" fill="var(--ink2)">/home/user</text>
  <path d="M390 128v12M310 140h160M310 140v10M470 140v10" stroke="var(--line)" fill="none"/>
  <rect x="250" y="150" width="120" height="26" rx="3" fill="var(--surf)" stroke="var(--acc-l)"/>
  <text x="310" y="168" text-anchor="middle" font-size="10" fill="var(--ink)">docs/</text>
  <rect x="410" y="150" width="120" height="26" rx="3" fill="var(--surf)" stroke="var(--acc-l)"/>
  <text x="470" y="168" text-anchor="middle" font-size="10" fill="var(--ink)">notes.txt</text>
  <text x="0" y="196" font-size="9.5" fill="var(--ink3)">Домашний каталог обозначается ~. Для пользователя user это /home/user.</text>
 </g>
</svg>
<figcaption>Одно дерево, один корень. Путь — это маршрут по этому дереву.</figcaption>
</figure>

<h2>Два вида путей</h2>
<div class="tw"><table>
<tr><th></th><th>Абсолютный</th><th>Относительный</th></tr>
<tr><td>Начинается с</td><td><code>/</code></td><td>имени, <code>.</code> или <code>..</code></td></tr>
<tr><td>Отсчитывается от</td><td>корня</td><td>текущего каталога</td></tr>
<tr><td>Пример</td><td><code>/home/user/docs/report.md</code></td><td><code>docs/report.md</code></td></tr>
<tr><td>Когда лучше</td><td>в скриптах и настройках — не зависит от того, откуда запустили</td><td>в интерактивной работе — короче</td></tr>
</table></div>
<div class="tw"><table>
<tr><th>Обозначение</th><th>Значит</th></tr>
<tr><td><code>.</code></td><td>текущий каталог</td></tr>
<tr><td><code>..</code></td><td>родительский каталог</td></tr>
<tr><td><code>~</code></td><td>домашний каталог текущего пользователя</td></tr>
<tr><td><code>-</code> (в <code>cd</code>)</td><td>предыдущий каталог, где вы были</td></tr>
</table></div>

<h2>Три команды</h2>
<pre><code>pwd                 <span class="c"># где я сейчас</span>
cd /etc             <span class="c"># перейти по абсолютному пути</span>
cd docs             <span class="c"># перейти по относительному</span>
cd ..               <span class="c"># на уровень выше</span>
cd                  <span class="c"># домой (без аргументов)</span>
cd -                <span class="c"># вернуться туда, где был</span>
ls                  <span class="c"># что здесь</span>
ls -l               <span class="c"># подробно: права, размер, дата</span>
ls -a               <span class="c"># включая скрытые (имена с точки)</span>
ls -la /var/log     <span class="c"># подробно о другом каталоге</span></code></pre>

<h2>Как читать <code>ls -l</code></h2>
<pre><code>-rw-r--r-- 1 user user   42 авг 19 12:00 notes.txt
│└┬┘└┬┘└┬┘   │     │      │
│ │  │  │    │     │      └─ размер в байтах
│ │  │  │    │     └──────── группа
│ │  │  │    └────────────── владелец
│ │  │  └─────────────────── права для остальных
│ │  └────────────────────── права для группы
│ └───────────────────────── права для владельца
└─────────────────────────── тип: - файл, d каталог, l ссылка</code></pre>
<p>Права читаются тройками: <code>r</code> — чтение, <code>w</code> — запись, <code>x</code> — выполнение. Прочерк означает, что права нет. Числовая запись: <code>r</code>=4, <code>w</code>=2, <code>x</code>=1, поэтому <code>644</code> — это <code>rw-r--r--</code>, а <code>755</code> — <code>rwxr-xr-x</code>.</p>
<div class="note warn"><b class="hd">Право x на каталоге означает другое</b><p>Для файла <code>x</code> — «можно запустить». Для каталога — «можно войти внутрь и обращаться к содержимому». Каталог без <code>x</code> нельзя открыть, даже если <code>r</code> есть: список имён вы увидите, а прочитать файлы — нет.</p></div>

<h2>Скрытые файлы</h2>
<p>Файл считается скрытым, если его имя начинается с точки: <code>.bashrc</code>, <code>.git</code>. Это не защита, а соглашение — просто <code>ls</code> их не показывает без <code>-a</code>. Настройки почти всегда живут в таких файлах.</p>
`,

{
n:3, id:"files", title:"Работа с файлами", sub:"Создать, скопировать, удалить",
lede:"Шесть команд, которыми делается почти всё, и одна, которая не спрашивает подтверждения.",
theory:`
<div class="tw"><table>
<tr><th>Команда</th><th>Что делает</th><th>Полезная опция</th></tr>
<tr><td><code>touch</code></td><td>Создаёт пустой файл или обновляет время изменения</td><td>—</td></tr>
<tr><td><code>mkdir</code></td><td>Создаёт каталог</td><td><code>-p</code> — создать всю цепочку и не ругаться, если уже есть</td></tr>
<tr><td><code>cp</code></td><td>Копирует</td><td><code>-r</code> — вместе с содержимым каталога</td></tr>
<tr><td><code>mv</code></td><td>Перемещает <b>и переименовывает</b> — это одно и то же действие</td><td><code>-i</code> — спросить перед перезаписью</td></tr>
<tr><td><code>rm</code></td><td>Удаляет</td><td><code>-r</code> — рекурсивно, <code>-f</code> — молча</td></tr>
<tr><td><code>rmdir</code></td><td>Удаляет <em>пустой</em> каталог</td><td>—</td></tr>
</table></div>

<h2>Просмотр содержимого</h2>
<pre><code>cat notes.txt          <span class="c"># целиком</span>
cat -n notes.txt       <span class="c"># с номерами строк</span>
head -n 5 app.log      <span class="c"># первые 5 строк</span>
tail -n 20 app.log     <span class="c"># последние 20</span>
wc -l app.log          <span class="c"># сколько строк</span></code></pre>
<p><code>head</code> и <code>tail</code> незаменимы, когда файл большой: не нужно выводить мегабайты, чтобы понять, что внутри.</p>

<h2>Копирование и перемещение</h2>
<pre><code>cp a.txt b.txt              <span class="c"># копия под другим именем</span>
cp a.txt docs/              <span class="c"># копия в каталог, имя то же</span>
cp -r docs backup           <span class="c"># каталог целиком</span>
mv a.txt b.txt              <span class="c"># переименование</span>
mv a.txt docs/              <span class="c"># перемещение</span></code></pre>
<div class="note warn"><b class="hd">Косая черта в конце имеет значение</b><p><code>cp a.txt docs</code>: если <code>docs</code> — существующий каталог, файл ляжет внутрь; если такого каталога нет, вы получите <b>файл</b> с именем <code>docs</code>. Написав <code>docs/</code>, вы явно требуете каталог и получите внятную ошибку вместо неожиданного файла.</p></div>

<h2>rm не спрашивает</h2>
<div class="note trap"><b class="hd">Корзины нет</b><p>Удалённое командой <code>rm</code> не отправляется никуда — оно просто перестаёт существовать. Особенно опасны две привычки:</p>
<ul>
<li><code>rm -rf</code> «на автомате». Флаг <code>-f</code> гасит все вопросы и предупреждения, включая «а такого файла нет» — то есть скрывает от вас опечатку в пути.</li>
<li>Переменная в пути без проверки: <code>rm -rf "$DIR"/*</code> при пустой <code>DIR</code> превращается в <code>rm -rf /*</code>.</li>
</ul>
<p>Привычка, которая спасает: сначала <code>ls</code> с тем же путём. Увидели ожидаемый список — заменили <code>ls</code> на <code>rm</code>.</p></div>

<h2>Создание файлов с содержимым</h2>
<pre><code>echo "первая строка" &gt; f.txt          <span class="c"># создать (перезаписав!)</span>
echo "вторая" &gt;&gt; f.txt                <span class="c"># дописать</span>

cat &gt; f.txt &lt;&lt;'EOF'                    <span class="c"># сразу несколько строк</span>
первая строка
вторая строка
EOF</code></pre>
<p>Последняя конструкция называется <b>heredoc</b>: всё до строки-ограничителя уходит на вход команде. Если ограничитель взят в кавычки (<code>&lt;&lt;'EOF'</code>), текст передаётся дословно; без кавычек внутри раскрываются переменные.</p>

<h2>Имена файлов</h2>
<ul>
<li>Регистр важен: <code>Notes.txt</code> и <code>notes.txt</code> — разные файлы.</li>
<li>Расширение — часть имени, а не тип. Система определяет тип по содержимому: посмотрите <code>file</code>.</li>
<li>Пробелы допустимы, но требуют кавычек в каждой команде. Дефис или подчёркивание — спокойнее.</li>
<li>Имя, начинающееся с дефиса, ломает разбор опций. Спасает <code>--</code> или <code>./-имя</code>.</li>
</ul>
`,

lede:"У каждой программы три потока. Понимание, какой куда идёт, отличает работающий скрипт от загадочно молчащего.",
theory:`
<p>Программа не «печатает на экран». Она пишет в <b>потоки</b>, а куда те ведут — решает оболочка. Потоков три, и у каждого свой номер.</p>

<figure class="fig">
<svg viewBox="0 0 620 194" role="img" aria-label="Три стандартных потока">
 <g font-family="var(--fm)" font-size="10">
  <rect x="220" y="52" width="180" height="60" rx="4" fill="var(--acc-s)" stroke="var(--acc)"/>

  <path d="M404 70l50-26" stroke="var(--s2)" stroke-width="1.3"/><path d="M456 43l-8 1 4 7z" fill="var(--s2)"/>

  <rect x="460" y="106" width="152" height="32" rx="3" fill="var(--s4s)" stroke="var(--s4)"/>
  <text x="536" y="120" text-anchor="middle" font-size="9.5" fill="var(--ink)">stderr · 2</text>
  <text x="536" y="133" text-anchor="middle" font-size="8.5" fill="var(--ink3)">ошибки и диагностика</text>
  <path d="M404 94l50 26" stroke="var(--s4)" stroke-width="1.3"/><path d="M456 121l-4-7-4 7z" fill="var(--s4)"/>

  <text x="0" y="164" font-size="9.5" fill="var(--ink3)">Оба выходных потока по умолчанию идут на экран и потому кажутся одним.</text>
  <text x="0" y="180" font-size="9.5" fill="var(--ink3)">Перенаправление сразу показывает разницу между ними.</text>
 </g>
</svg>
<figcaption>Разделение результата и диагностики — то, что позволяет складывать данные в файл, продолжая видеть ошибки.</figcaption>
</figure>

<h2>Перенаправления</h2>
<div class="tw"><table>
<tr><th>Запись</th><th>Что делает</th></tr>
<tr><td><code>&gt; файл</code></td><td>stdout в файл, <b>перезаписав</b> его</td></tr>
<tr><td><code>&gt;&gt; файл</code></td><td>stdout в файл, дописав в конец</td></tr>
<tr><td><code>2&gt; файл</code></td><td>только stderr в файл</td></tr>
<tr><td><code>2&gt;&amp;1</code></td><td>отправить stderr туда же, куда сейчас идёт stdout</td></tr>
<tr><td><code>&amp;&gt; файл</code></td><td>оба потока в один файл</td></tr>
<tr><td><code>&lt; файл</code></td><td>взять stdin из файла</td></tr>
<tr><td><code>&lt;&lt;&lt; строка</code></td><td>подать строку на stdin</td></tr>
<tr><td><code>&gt; /dev/null</code></td><td>выбросить вывод</td></tr>
</table></div>

<div class="note trap"><b class="hd">Порядок в <code>2>&1</code> решает всё</b><p><code>команда &gt; f.txt 2&gt;&amp;1</code> — сначала stdout идёт в файл, затем stderr отправляется «туда же, куда stdout», то есть тоже в файл. Оба в файле.</p><p><code>команда 2&gt;&amp;1 &gt; f.txt</code> — сначала stderr отправляется туда, куда stdout ведёт <em>сейчас</em>, то есть на экран; потом stdout уходит в файл. Ошибки остаются на экране.</p><p>Читайте перенаправления слева направо как последовательность переключений — тогда путаницы не будет.</p></div>

<h2>Зачем разделять потоки</h2>
<pre><code>./сборка.sh &gt; отчёт.log            <span class="c"># данные в файл, ошибки видны на экране</span>
./сборка.sh &amp;&gt; всё.log             <span class="c"># всё в файл, экран чистый</span>
./сборка.sh 2&gt; ошибки.log          <span class="c"># ошибки отдельно</span>
find / -name '*.conf' 2&gt;/dev/null  <span class="c"># спрятать «Отказано в доступе»</span></code></pre>
<p>Последний приём — самый частый: <code>find</code> по системным каталогам выдаёт горы отказов в доступе, и они мешают увидеть результат. Ошибки уходят в никуда, найденное остаётся.</p>

<div class="note warn"><b class="hd">Диагностику пишут в stderr не случайно</b><p>Если программа печатает «Обрабатываю файл…» в stdout, эта строка попадёт в конвейер и испортит данные следующей команде. Всё, что не является результатом, должно идти в stderr: <code>echo "готово" &gt;&amp;2</code>.</p></div>

<h2>tee — развилка</h2>
<pre><code>./скрипт.sh | tee отчёт.log        <span class="c"># и на экран, и в файл</span>
./скрипт.sh | tee -a отчёт.log     <span class="c"># дописать, а не перезаписать</span></code></pre>
<div class="note trap"><b class="hd">Файл обнуляется до запуска команды</b><p><code>sort f.txt &gt; f.txt</code> уничтожит файл: оболочка открывает и обнуляет цель перенаправления <b>раньше</b>, чем запустит <code>sort</code>. Пишите во временный файл, а потом переименовывайте.</p></div>
`,

<h2>Набор фильтров, которого хватает почти всегда</h2>
<div class="tw"><table>
<tr><th>Команда</th><th>Делает</th><th>Частые опции</th></tr>
<tr><td><code>grep</code></td><td>оставляет строки по образцу</td><td><code>-i</code> без регистра, <code>-v</code> наоборот, <code>-n</code> номера, <code>-c</code> счёт, <code>-r</code> по каталогу, <code>-l</code> только имена файлов</td></tr>
<tr><td><code>sort</code></td><td>сортирует</td><td><code>-n</code> числа, <code>-r</code> обратно, <code>-u</code> без повторов, <code>-k N</code> по полю</td></tr>
<tr><td><code>uniq</code></td><td>схлопывает <b>соседние</b> одинаковые</td><td><code>-c</code> посчитать, <code>-d</code> только повторы</td></tr>
<tr><td><code>wc</code></td><td>считает</td><td><code>-l</code> строки, <code>-w</code> слова, <code>-c</code> байты</td></tr>
<tr><td><code>cut</code></td><td>вырезает поля</td><td><code>-d</code> разделитель, <code>-f</code> номера полей</td></tr>
<tr><td><code>head</code> / <code>tail</code></td><td>начало / конец</td><td><code>-n N</code></td></tr>
<tr><td><code>tr</code></td><td>заменяет или удаляет символы</td><td><code>-d</code> удалить, <code>-s</code> схлопнуть</td></tr>
</table></div>

<div class="note trap"><b class="hd">uniq работает только с соседними строками</b><p>Это не ошибка, а следствие потоковой природы: <code>uniq</code> держит в памяти одну строку, а не весь файл. Поэтому его почти всегда ставят <b>после</b> <code>sort</code>. Связка <code>sort | uniq -c | sort -rn</code> — самый частый идиоматический конвейер: посчитать, что сколько раз встречается, и показать по убыванию.</p></div>

<h2>Разбор частого конвейера</h2>
<pre><code>cut -d' ' -f1 access.log | sort | uniq -c | sort -rn | head -n 3</code></pre>
<ol>
<li><code>cut -d' ' -f1</code> — взять первое поле (адрес), разделитель — пробел.</li>
<li><code>sort</code> — сложить одинаковые рядом.</li>
<li><code>uniq -c</code> — схлопнуть и посчитать.</li>
<li><code>sort -rn</code> — по числу, по убыванию.</li>
<li><code>head -n 3</code> — три самых частых.</li>
</ol>
<p>Ни одна из пяти программ не знает про журналы и адреса. Знание живёт в том, как вы их соединили, — в этом и состоит идея.</p>

<div class="note warn"><b class="hd">Код возврата конвейера</b><p>По умолчанию конвейер возвращает код <b>последней</b> команды. Поэтому <code>несуществующая | true</code> считается успехом. В скриптах это лечится строкой <code>set -o pipefail</code>, после которой конвейер возвращает код первой упавшей команды.</p></div>

<h2>Когда конвейер не нужен</h2>
<p>Классика лишнего звена: <code>cat файл | grep x</code>. Команда <code>grep</code> умеет читать файл сама: <code>grep x файл</code>. Конвейер здесь только добавляет процесс. Впрочем, при разборе длинной цепочки лишний <code>cat</code> в начале часто удобнее — он делает поток читаемым слева направо.</p>

theory:`
<p>Прежде чем запустить команду, оболочка проходит по строке несколько раз, выполняя <b>раскрытия</b>. Программа получает уже готовый список слов и не подозревает, что вы писали звёздочку.</p>

<figure class="fig">
<svg viewBox="0 0 620 224" role="img" aria-label="Порядок раскрытий в оболочке">
 <g font-family="var(--fm)" font-size="9.5">
  ${[["1","фигурные скобки","{a,b} → a b"],
     ["2","тильда","~ → /home/user"],
     ["3","переменные, $(…), $((…))","$X → значение"],
     ["4","разбиение на слова","по пробелам — только для нераскавыченного"],
     ["5","шаблоны имён файлов","*.txt → список файлов"],
     ["6","снятие кавычек","&quot;a b&quot; → a b"]].map((r,i)=>{
    const y = 6 + i*35;
    const hot = i===3||i===4;
    return '<rect x="0" y="'+y+'" width="620" height="30" rx="3" fill="'+(hot?"var(--acc-s)":"var(--surf3)")+'" stroke="'+(hot?"var(--acc)":"var(--line)")+'"/>'+
      '<text x="12" y="'+(y+19)+'" font-weight="700" fill="var(--ink)">'+r[0]+'</text>'+
      '<text x="34" y="'+(y+19)+'" fill="var(--ink)">'+r[1]+'</text>'+
      '<text x="300" y="'+(y+19)+'" font-size="9" fill="var(--ink2)">'+r[2]+'</text>';
  }).join("")}
  <text x="0" y="220" font-size="9.5" fill="var(--ink3)">Порядок фиксирован. Шаг 5 идёт после шага 3 — поэтому звёздочка внутри переменной тоже раскроется.</text>
 </g>
</svg>
<figcaption>Шесть шагов, всегда в этом порядке. Знание порядка объясняет большинство «почему оно так себя ведёт».</figcaption>
</figure>

<h2>Шаблоны имён файлов</h2>
<div class="tw"><table>
<tr><th>Шаблон</th><th>Совпадает с</th><th>Пример</th></tr>
<tr><td><code>*</code></td><td>любой последовательностью, включая пустую</td><td><code>*.txt</code></td></tr>
<tr><td><code>?</code></td><td>ровно одним символом</td><td><code>файл?.log</code></td></tr>
<tr><td><code>[abc]</code></td><td>одним символом из набора</td><td><code>[0-9]*.md</code></td></tr>
<tr><td><code>[!abc]</code></td><td>одним символом не из набора</td><td><code>[!.]*</code></td></tr>
</table></div>
<div class="note trap"><b class="hd">Это НЕ регулярные выражения</b><p>Символы выглядят похоже, а значат разное. В шаблоне <code>*</code> — «любые символы». В регулярном выражении <code>*</code> — «предыдущий элемент ноль или больше раз», а «любые символы» пишется <code>.*</code>. Отсюда классическая ошибка: <code>grep *.txt файл</code> вместо <code>grep '\\.txt' файл</code>. Шаблоны — для имён файлов, регулярные выражения — для содержимого.</p></div>

<h2>Когда совпадений нет</h2>
<p>Bash по умолчанию оставляет шаблон как есть. Команда <code>ls *.pdf</code> в каталоге без pdf получит буквальную строку <code>*.pdf</code> и сообщит, что такого файла нет. Это сбивает с толку, но объяснимо: раскрывать нечего, значит слово остаётся.</p>

<h2>Скобочное раскрытие</h2>
<pre><code>echo {a,b,c}          <span class="c"># a b c</span>
echo файл{1,2,3}.txt  <span class="c"># файл1.txt файл2.txt файл3.txt</span>
echo {1..5}           <span class="c"># 1 2 3 4 5</span>
mkdir -p src/{api,web}/{js,css}</code></pre>
<div class="note"><b class="hd">Скобки не смотрят на диск</b><p>Главное отличие от шаблонов: <code>{a,b}</code> раскрывается <b>всегда</b>, независимо от того, существуют ли такие файлы. Поэтому им удобно создавать структуру каталогов. А <code>*.txt</code> смотрит, что реально лежит на диске.</p></div>

<h2>Как посмотреть, что получится</h2>
<p>Универсальный приём: подставьте <code>echo</code> перед командой. Оболочка выполнит все раскрытия и просто напечатает результат.</p>
<pre><code>echo rm -rf старое_*   <span class="c"># сначала посмотреть</span>
rm -rf старое_*        <span class="c"># потом сделать</span></code></pre>
<p>Для разрушительных команд это единственная надёжная страховка: вы увидите ровно тот список, который получит программа.</p>
