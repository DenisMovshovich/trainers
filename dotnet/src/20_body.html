<header class="bar">
  <span class="mark">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="2.5" y="2.5" width="19" height="19" fill="none" stroke="var(--accent)" stroke-width="1.3"/>
      <path d="M2.5 8.5h19M8.5 2.5v19" stroke="var(--accent-line)" stroke-width="1"/>
      <path d="M12 12.5h6M12 16h6" stroke="var(--accent-line)" stroke-width="1"/>
      <circle cx="5.5" cy="5.5" r="1.4" fill="var(--signal)"/>
    </svg>
    <span>
      <b>.NET</b>
      <i>Acme.WebAutomation как образец</i>
    </span>
  </span>
  <div class="srch">
    <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9.4 9.4L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="q" type="text" placeholder="Поиск по конспекту: csproj, restore, filter, TFM…" aria-label="Поиск по конспекту" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <div class="gap"></div>
  <div class="pmeter">
    <span id="pl">0 / 0</span>
    <div class="ptrack" role="progressbar" aria-label="Пройдено самопроверок" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="pb"><div class="pfill" id="pf"></div></div>
  </div>
  <button class="gbtn" id="reset">Сброс</button>
</header>

<div class="shell">
  <nav class="toc" id="toc" aria-label="Разделы конспекта">
    <div class="toc-h">Разделы</div>
    <div id="secList"></div>
    <div class="toc-f">
      <button class="gbtn" id="cheat" style="width:100%">Шпаргалка команд</button>
    </div>
  </nav>

  <main class="doc" id="doc">
    <div class="sec-head">
      <div class="kicker" id="kicker">—</div>
      <h1 id="stitle">—</h1>
      <p class="lede" id="slede">—</p>
    </div>
    <div class="body" id="sbody"></div>
    <div class="body check" id="scheck"></div>
    <div class="body iv" id="siv"></div>
    <div class="foot" id="foot">
      <button id="prev"><span>◀ Назад<span class="sub" id="prevSub"></span></span></button>
      <button id="next" style="text-align:right"><span>Далее ▶<span class="sub" id="nextSub"></span></span></button>
    </div>
  </main>
</div>

<div class="results" id="results" hidden>
  <h2 id="rTitle">Результаты поиска</h2>
  <div id="rList"></div>
</div>
