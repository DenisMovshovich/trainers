<header class="topbar">
  <a class="brand" href="#" onclick="return false">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <rect x="1.5" y="9.5" width="23" height="13" fill="none" stroke="var(--accent)" stroke-width="1.4"/>
      <path d="M1.5 13.5h23M1.5 17.5h23M8 9.5v13M15 9.5v13" stroke="var(--accent-line)" stroke-width="1"/>
      <rect x="9.5" y="3.5" width="5" height="5" fill="none" stroke="var(--signal)" stroke-width="1.4"/>
      <path d="M12 8.5v1" stroke="var(--signal)" stroke-width="1.4"/>
    </svg>
    <span style="display:block">
      <b>Docker Yard</b>
      <span>интерактивный тренажёр</span>
    </span>
  </a>
  <div class="spacer"></div>
  <div class="progress-wrap">
    <span class="progress-label" id="progLabel">0 / 0</span>
    <div class="progress-track" role="progressbar" aria-label="Общий прогресс" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progBar">
      <div class="progress-fill" id="progFill"></div>
    </div>
  </div>
  <button class="ghost-btn" id="resetAll" title="Сбросить весь прогресс">Сброс</button>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Модули курса">
    <div class="rail-head">Программа</div>
    <div id="modList"></div>
    <div class="rail-foot">
      <button class="mini" id="showCheat" style="width:100%">Шпаргалка по командам</button>
    </div>
  </nav>

  <main class="stage" id="stage">
    <div class="stage-head">
      <div class="eyebrow" id="eyebrow">Модуль 01</div>
      <h1 class="mtitle" id="mtitle">—</h1>
      <p class="mlede" id="mlede">—</p>
    </div>

    <div class="tabs" role="tablist" aria-label="Разделы модуля">
      <button class="tab" role="tab" id="tab-theory" aria-selected="true" aria-controls="panel-theory">Теория</button>
      <button class="tab" role="tab" id="tab-quiz" aria-selected="false" aria-controls="panel-quiz">Тест <span class="badge" id="quizBadge">0/0</span></button>
      <button class="tab" role="tab" id="tab-lab" aria-selected="false" aria-controls="panel-lab">Практика <span class="badge" id="labBadge">0/0</span></button>
    </div>

    <section class="panel" id="panel-theory" role="tabpanel" aria-labelledby="tab-theory">
      <article class="theory" id="theoryBody"></article>
    </section>

    <section class="panel" id="panel-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden>
      <div class="quiz" id="quizBody"></div>
    </section>

    <section class="panel" id="panel-lab" role="tabpanel" aria-labelledby="tab-lab" hidden>
      <div class="lab-picker" id="labPicker"></div>
      <div class="lab-grid">
        <div>
          <div class="lab-brief" id="labBrief"></div>
          <div class="term">
            <div class="term-bar">
              <i class="lamp"></i><i class="lamp"></i><i class="lamp"></i>
              <span class="ttl">docker&nbsp;engine&nbsp;·&nbsp;эмулятор</span>
              <span class="right" id="termCwd">~/work</span>
            </div>
            <div class="term-out" id="termOut" tabindex="0" aria-live="polite" aria-label="Вывод терминала"></div>
            <form class="term-in" id="termForm">
              <span class="pfx" id="termPfx">$</span>
              <input id="termInput" autocomplete="off" autocapitalize="off" spellcheck="false"
                     placeholder="введите команду · Tab — автодополнение · ↑↓ — история" aria-label="Командная строка">
            </form>
          </div>
        </div>
        <aside class="side">
          <div class="card">
            <div class="card-head">Задание <span class="count" id="checkCount"></span></div>
            <div class="card-body"><ul class="checks" id="checkList"></ul></div>
            <div class="lab-done" id="labDone" hidden>
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Задание выполнено
            </div>
          </div>
          <div class="card">
            <div class="vizbar" role="tablist" aria-label="Визуализация">
              <button role="tab" aria-selected="true" data-viz="map">Схема</button>
              <button role="tab" aria-selected="false" data-viz="layers">Слои</button>
              <button role="tab" aria-selected="false" data-viz="state">Объекты</button>
              <button role="tab" aria-selected="false" data-viz="files">Файлы</button>
            </div>
            <div class="viz" id="vizBody"></div>
          </div>
        </aside>
      </div>
    </section>

    <div class="navfoot" id="navfoot">
      <button id="prevMod"><span>◀<span class="sub">Назад</span></span></button>
      <button id="nextMod" style="text-align:right"><span>Далее ▶<span class="sub" id="nextSub"></span></span></button>
    </div>
  </main>
</div>
