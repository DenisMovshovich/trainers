<title>Гроссбух</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Libre+Franklin:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EEEBE6; --surf:#F6F4F1; --surf2:#E4E0D9; --surf3:#EAE7E1;
  --ink:#1D1915; --ink2:#4A443C; --ink3:#7C746A;
  --line:#CFC8BE; --line2:#B9B0A3;
  --acc:#8C2F39; --acc-l:#B4636B; --acc-s:#F0E0E1; --acc-d:#6E2029;
  --key:#3F5A6B; --key-s:#E0E8ED;
  --ok:#4A6B45; --ok-s:#E2EBDF;
  --warn:#9A6A1E; --warn-s:#F4E9D4;
  --trap:#8C2F39; --trap-s:#F5E2E3;
  --fd:'Spectral',Georgia,'Times New Roman',serif;
  --fs:'Libre Franklin','Helvetica Neue',Arial,sans-serif;
  --fm:'DM Mono','SF Mono',Menlo,Consolas,monospace;
  --sh:0 1px 0 rgba(29,25,21,.05), 0 2px 10px rgba(29,25,21,.06);
  --dockh:250px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#15120F; --surf:#1D1915; --surf2:#292420; --surf3:#221E1A;
  --ink:#EDE7DE; --ink2:#B8AEA1; --ink3:#8A8073;
  --line:#3A332C; --line2:#4E453B;
  --acc:#D4737C; --acc-l:#8C2F39; --acc-s:#33201F; --acc-d:#E59CA3;
  --key:#8AAABE; --key-s:#1E272D;
  --ok:#8FB584; --ok-s:#1D2519;
  --warn:#D2A254; --warn-s:#2A2114;
  --trap:#D4737C; --trap-s:#301B1C;
  --sh:0 1px 0 rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --paper:#15120F; --surf:#1D1915; --surf2:#292420; --surf3:#221E1A;
  --ink:#EDE7DE; --ink2:#B8AEA1; --ink3:#8A8073;
  --line:#3A332C; --line2:#4E453B;
  --acc:#D4737C; --acc-l:#8C2F39; --acc-s:#33201F; --acc-d:#E59CA3;
  --key:#8AAABE; --key-s:#1E272D;
  --ok:#8FB584; --ok-s:#1D2519;
  --warn:#D2A254; --warn-s:#2A2114;
  --trap:#D4737C; --trap-s:#301B1C;
  --sh:0 1px 0 rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--fs); font-size:15px; line-height:1.62;
  overflow-x:hidden;
}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px; border-radius:2px}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }

/* ── шапка ────────────────────────────────────────────── */
.top{
  position:sticky; top:0; z-index:40; background:var(--surf);
  border-bottom:1px solid var(--line2); box-shadow:var(--sh);
}
.tbar{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  padding:12px 20px 10px; max-width:1500px; margin:0 auto;
}
.brand{display:flex; align-items:baseline; gap:10px; min-width:0}
.mark{
  font-family:var(--fd); font-weight:700; font-size:25px; letter-spacing:-.015em;
  color:var(--acc); line-height:1;
}
.tag{font-size:11.5px; color:var(--ink3); letter-spacing:.09em; text-transform:uppercase; font-weight:600}
.tspace{flex:1 1 auto; min-width:0}
.meter{display:flex; align-items:center; gap:9px; font-size:11.5px; color:var(--ink3); white-space:nowrap}
.bar{width:96px; height:5px; background:var(--surf2); border:1px solid var(--line); border-radius:3px; overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--acc); transition:width .4s ease}
.tbtn{
  font:inherit; font-size:12px; font-weight:600; color:var(--ink2);
  background:var(--surf3); border:1px solid var(--line); border-radius:3px;
  padding:5px 10px; cursor:pointer;
}
.tbtn:hover{border-color:var(--acc); color:var(--acc)}

.nav{
  display:flex; gap:0; overflow-x:auto; padding:0 20px; max-width:1500px; margin:0 auto;
  scrollbar-width:thin; border-top:1px solid var(--line);
}
.nav::-webkit-scrollbar{height:5px}
.nav::-webkit-scrollbar-thumb{background:var(--line2); border-radius:3px}
.nav button{
  font:inherit; font-size:12.5px; font-weight:500; color:var(--ink2);
  background:none; border:none; border-bottom:2px solid transparent;
  padding:9px 12px; cursor:pointer; white-space:nowrap; display:flex; gap:7px; align-items:center;
}
.nav button:hover{color:var(--acc); background:var(--surf3)}
.nav button[aria-current="true"]{color:var(--acc); border-bottom-color:var(--acc); font-weight:600}
.nav .num{
  font-family:var(--fm); font-size:10.5px; color:var(--ink3);
  border:1px solid var(--line); border-radius:2px; padding:0 4px; min-width:19px; text-align:center;
}
.nav button[aria-current="true"] .num{border-color:var(--acc); color:var(--acc)}
.nav .dot{width:6px; height:6px; border-radius:50%; background:var(--ok); display:none}
.nav button.done .dot{display:block}

/* ── раскладка ────────────────────────────────────────── */
.wrap{max-width:1500px; margin:0 auto; padding:0 20px 24px; display:grid; grid-template-columns:minmax(0,1fr) 268px; gap:26px; align-items:start}
@media (max-width:1080px){ .wrap{grid-template-columns:minmax(0,1fr)} .rail{display:none} }
.col{min-width:0; padding-top:22px}

.lede{border-left:3px solid var(--acc); padding:2px 0 2px 15px; margin:0 0 22px}
.lede h1{font-family:var(--fd); font-size:31px; font-weight:700; letter-spacing:-.015em; margin:0 0 3px; line-height:1.15; text-wrap:balance}
.lede .sub{font-size:12px; color:var(--acc); letter-spacing:.09em; text-transform:uppercase; font-weight:600; margin:0 0 7px}
.lede p{margin:0; color:var(--ink2); font-size:15px; max-width:64ch}

.tabs{display:flex; gap:5px; border-bottom:1px solid var(--line); margin:0 0 20px; overflow-x:auto}
.tabs button{
  font:inherit; font-size:13px; font-weight:600; color:var(--ink3);
  background:none; border:none; border-bottom:2px solid transparent; padding:7px 13px;
  cursor:pointer; white-space:nowrap;
}
.tabs button:hover{color:var(--acc)}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--acc)}
.tabs .cnt{font-family:var(--fm); font-size:10.5px; color:var(--ink3); margin-left:5px}

/* ── теория ───────────────────────────────────────────── */
.theory{max-width:70ch}
.theory h2{
  font-family:var(--fd); font-size:20px; font-weight:600; letter-spacing:-.01em;
  margin:28px 0 9px; padding-bottom:5px; border-bottom:1px solid var(--line); text-wrap:balance;
}
.theory h3{font-family:var(--fd); font-size:17px; font-weight:600; margin:20px 0 6px}
.theory p{margin:0 0 12px; color:var(--ink2)}
.theory b{color:var(--ink); font-weight:600}
.theory ol,.theory ul{margin:0 0 12px; padding-left:22px; color:var(--ink2)}
.theory li{margin:0 0 5px}
code{
  font-family:var(--fm); font-size:.885em; background:var(--surf3);
  border:1px solid var(--line); border-radius:3px; padding:.06em .3em;
  overflow-wrap:anywhere; color:var(--ink);
}
pre{
  background:var(--surf); border:1px solid var(--line); border-left:3px solid var(--line2);
  border-radius:3px; padding:11px 13px; margin:0 0 14px; overflow-x:auto;
}
pre code{background:none; border:none; padding:0; font-size:12.6px; line-height:1.65; white-space:pre}
pre .k{color:var(--acc); font-weight:500}
pre .c{color:var(--ink3); font-style:italic}

.note{border:1px solid var(--line); border-left:3px solid var(--line2); border-radius:3px; padding:11px 14px; margin:0 0 15px; background:var(--surf); font-size:14.3px}
.note p{margin:0 0 8px; color:var(--ink2)}
.note p:last-child{margin:0}
.note .hd{display:block; font-size:13px; font-weight:700; color:var(--ink); margin:0 0 5px; letter-spacing:.005em}
.note.ok{border-left-color:var(--ok); background:var(--ok-s)}
.note.ok .hd{color:var(--ok)}
.note.warn{border-left-color:var(--warn); background:var(--warn-s)}
.note.warn .hd{color:var(--warn)}
.note.trap{border-left-color:var(--trap); background:var(--trap-s)}
.note.trap .hd{color:var(--trap)}
.note pre{background:var(--surf); margin:0 0 8px}

.tw{overflow-x:auto; margin:0 0 15px; border:1px solid var(--line); border-radius:3px}
.tw table{border-collapse:collapse; width:100%; font-size:13.4px; min-width:440px}
.tw th{
  text-align:left; font-weight:600; font-size:11px; letter-spacing:.07em; text-transform:uppercase;
  color:var(--ink3); background:var(--surf2); padding:7px 11px; border-bottom:1px solid var(--line2); white-space:nowrap;
}
.tw td{padding:7px 11px; border-bottom:1px solid var(--line); color:var(--ink2); vertical-align:top}
.tw tr:last-child td{border-bottom:none}
.tw tr:nth-child(even) td{background:var(--surf3)}
.tw td code{white-space:nowrap}

.fig{margin:0 0 18px; padding:0}
.fig svg{display:block; width:100%; height:auto; background:var(--surf); border:1px solid var(--line); border-radius:3px; padding:11px}
.fig figcaption{font-size:12.3px; color:var(--ink3); margin-top:7px; font-style:italic; line-height:1.5}

/* ── тесты ────────────────────────────────────────────── */
.quiz{max-width:70ch}
.qc{border:1px solid var(--line); border-radius:3px; background:var(--surf); margin:0 0 13px; overflow:hidden}
.qc.right{border-color:var(--ok)}
.qc.wrong{border-color:var(--trap)}
.qq{display:flex; gap:11px; padding:12px 14px; align-items:baseline; border-bottom:1px solid var(--line)}
.qn{font-family:var(--fm); font-size:11.5px; color:var(--ink3); flex:0 0 auto; padding-top:2px}
.qt{font-size:15px; font-weight:500; color:var(--ink); line-height:1.5}
.qo{display:flex; flex-direction:column; padding:9px 14px; gap:4px}
.qo button{
  font:inherit; font-size:14px; text-align:left; color:var(--ink2);
  background:var(--surf3); border:1px solid var(--line); border-radius:3px;
  padding:8px 11px; cursor:pointer; display:flex; gap:9px; align-items:baseline; line-height:1.45;
}
.qo button:hover:not(:disabled){border-color:var(--acc); color:var(--ink)}
.qo button:disabled{cursor:default}
.qo .ltr{font-family:var(--fm); font-size:11px; color:var(--ink3); flex:0 0 auto}
.qo button.pick{border-color:var(--acc); background:var(--acc-s)}
.qo button.good{border-color:var(--ok); background:var(--ok-s); color:var(--ink)}
.qo button.good .ltr{color:var(--ok)}
.qo button.bad{border-color:var(--trap); background:var(--trap-s)}
.qo button.bad .ltr{color:var(--trap)}
.qw{padding:0 14px 12px; font-size:13.6px; color:var(--ink2); line-height:1.55}
.qw b{color:var(--ink)}
.qw .lbl{font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--acc); display:block; margin-bottom:3px}
.qsum{display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--ink3); margin:0 0 16px}
.qsum b{font-family:var(--fm); color:var(--ink); font-size:15px}

/* ── задания ──────────────────────────────────────────── */
.labs{display:flex; flex-direction:column; gap:15px}
.lab{border:1px solid var(--line); border-radius:3px; background:var(--surf); overflow:hidden}
.lab.done{border-color:var(--ok)}
.labh{display:flex; gap:11px; align-items:center; padding:11px 14px; background:var(--surf2); border-bottom:1px solid var(--line); flex-wrap:wrap}
.labh .id{font-family:var(--fm); font-size:11px; color:#fff; background:var(--acc); border-radius:2px; padding:2px 6px}
.lab.done .labh .id{background:var(--ok)}
.labh .nm{font-weight:600; font-size:14.5px; flex:1 1 auto; min-width:0}
.labh .st{font-family:var(--fm); font-size:11.5px; color:var(--ink3); white-space:nowrap}
.labb{padding:13px 15px; font-size:14.3px; color:var(--ink2)}
.labb h3{font-family:var(--fd); font-size:16.5px; font-weight:600; color:var(--ink); margin:0 0 8px}
.labb ul,.labb ol{margin:0 0 10px; padding-left:21px}
.labb li{margin:0 0 5px}
.labb p{margin:0 0 10px}
.labb p:last-child{margin:0}
.chk{list-style:none; margin:11px 0 0; padding:11px 0 0; border-top:1px solid var(--line)}
.chk li{display:flex; gap:9px; align-items:baseline; font-size:13.4px; color:var(--ink3); margin:0 0 5px}
.chk li.hit{color:var(--ink2)}
.chk .bx{
  font-family:var(--fm); font-size:11px; flex:0 0 auto; width:15px; height:15px; line-height:13px; text-align:center;
  border:1px solid var(--line2); border-radius:2px; color:transparent;
}
.chk li.hit .bx{border-color:var(--ok); background:var(--ok); color:#fff}
.labact{display:flex; gap:9px; flex-wrap:wrap; align-items:center; padding:0 15px 13px}
.btn{
  font:inherit; font-size:12.5px; font-weight:600; color:var(--ink2);
  background:var(--surf3); border:1px solid var(--line2); border-radius:3px;
  padding:6px 12px; cursor:pointer;
}
.btn:hover{border-color:var(--acc); color:var(--acc)}
.btn.pri{background:var(--acc); border-color:var(--acc); color:#fff}
.btn.pri:hover{background:var(--acc-d); border-color:var(--acc-d); color:#fff}
.hintbox{font-size:13.2px; color:var(--ink2); background:var(--warn-s); border:1px solid var(--warn); border-radius:3px; padding:8px 12px; margin:0 15px 13px}
.lab-done{display:flex; gap:9px; align-items:center; font-size:13.3px; color:var(--ok); font-weight:600; padding:0 15px 13px}
.lab-done[hidden]{display:none}

/* ── правая колонка: обозреватель схемы ───────────────── */
.rail{position:sticky; top:96px; padding-top:22px; padding-bottom:8px}
.rh{font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--ink3); margin:0 0 8px}
.sch{border:1px solid var(--line); border-radius:3px; background:var(--surf); overflow:hidden auto; margin:0 0 14px; max-height:calc(100vh - 306px - var(--dockh)); min-height:150px}
.sch details{border-bottom:1px solid var(--line)}
.sch details:last-child{border-bottom:none}
.sch summary{
  cursor:pointer; padding:7px 11px; font-family:var(--fm); font-size:12px; color:var(--ink);
  background:var(--surf2); display:flex; align-items:center; gap:7px; list-style:none;
}
.sch summary::-webkit-details-marker{display:none}
.sch summary::before{content:"▸"; color:var(--ink3); font-size:9px; transition:transform .15s}
.sch details[open] summary::before{transform:rotate(90deg)}
.sch summary .n{color:var(--ink3); font-size:10.5px; margin-left:auto}
.sch dl{margin:0; padding:6px 11px 8px; font-family:var(--fm); font-size:11.5px}
.sch .row{display:flex; gap:7px; align-items:baseline; padding:1.5px 0; color:var(--ink2)}
.sch .cn{color:var(--ink)}
.sch .ct{color:var(--ink3); font-size:10.5px; margin-left:auto; white-space:nowrap}
.sch .kb{font-size:9px; letter-spacing:.05em; border-radius:2px; padding:0 3px; border:1px solid currentColor}
.sch .pk{color:var(--acc)} .sch .fk{color:var(--key)} .sch .nn{color:var(--ink3)}
.rail .hint{font-size:11.8px; color:var(--ink3); line-height:1.5; margin:0 0 12px}

/* ── консоль запроса ──────────────────────────────────── */
.dock{
  position:sticky; bottom:0; z-index:30; background:var(--surf);
  border-top:1px solid var(--line2); box-shadow:0 -2px 14px rgba(29,25,21,.09);
}
:root[data-theme="dark"] .dock, :root:not([data-theme="light"]) .dock{box-shadow:0 -2px 14px rgba(0,0,0,.4)}
.dockin{max-width:1500px; margin:0 auto; padding:0 20px 12px}
.dockbar{display:flex; align-items:center; gap:11px; padding:7px 0; flex-wrap:wrap}
.dockbar .ttl{font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--ink3)}
.dockbar .sp{flex:1 1 auto}
.dockbar .st{font-family:var(--fm); font-size:11.5px; color:var(--ink3)}
.ed{display:grid; grid-template-columns:minmax(0,1fr); gap:9px}
@media (min-width:900px){ .ed{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)} }
.edwrap{position:relative; border:1px solid var(--line2); border-radius:3px; background:var(--paper); overflow:hidden}
.edwrap:focus-within{border-color:var(--acc)}
#sql{
  display:block; width:100%; min-height:104px; max-height:200px; resize:vertical;
  font-family:var(--fm); font-size:13px; line-height:1.6; color:var(--ink);
  background:none; border:none; padding:9px 11px; outline:none; tab-size:2;
}
#sql::placeholder{color:var(--ink3)}
.out{border:1px solid var(--line); border-radius:3px; background:var(--paper); min-height:104px; max-height:200px; overflow:auto}
.out .empty{padding:12px; font-size:12.5px; color:var(--ink3); font-family:var(--fm)}
.out .err{padding:10px 12px; font-family:var(--fm); font-size:12.3px; color:var(--trap); background:var(--trap-s); border-bottom:1px solid var(--line)}
.out .msg{padding:10px 12px; font-family:var(--fm); font-size:12.3px; color:var(--ok)}
.out table{border-collapse:collapse; width:100%; font-family:var(--fm); font-size:12.2px}
.out th{
  position:sticky; top:0; text-align:left; font-weight:500; font-size:10.5px; letter-spacing:.05em;
  color:var(--ink3); background:var(--surf2); padding:5px 9px; border-bottom:1px solid var(--line2); white-space:nowrap;
}
.out td{padding:4px 9px; border-bottom:1px solid var(--line); color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums}
.out td.num{text-align:right}
.out td.nul{color:var(--ink3); font-style:italic}
.out tr:nth-child(even) td{background:var(--surf3)}
.out .note{border:none; border-top:1px solid var(--line); border-radius:0; margin:0; padding:5px 9px; font-family:var(--fm); font-size:11px; color:var(--ink3); background:var(--surf)}
.chips{display:flex; gap:5px; flex-wrap:wrap; padding:7px 0 0}
.chips button{
  font:inherit; font-family:var(--fm); font-size:11px; color:var(--ink2);
  background:var(--surf3); border:1px solid var(--line); border-radius:2px; padding:3px 7px; cursor:pointer;
}
.chips button:hover{border-color:var(--acc); color:var(--acc)}

.foot{max-width:1500px; margin:0 auto; padding:26px 20px 34px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink3); line-height:1.6}
.foot b{color:var(--ink2)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
</style>
